-stay offer","de":"Langzeitangebot"},"source":"https://www.iloha.fr/offres-speciales/long-sejour/ (lu le 27/10/2026)","reponse":{"fr":"Oui, l’offre long séjour récompense les séjours prolongés : 15 % de remise sur l’hébergement pour 7 à 13 nuits, 20 % dès 14 nuits, avec Wi-Fi gratuit et illimité. Elle est valable pour les séjours du 01/11/26 au 17/12/26 et du 01/02/27 au 31/10/27, exclusivement sur le site officiel, selon disponibilité, sur toutes les catégories d’hébergement hors chambre Standard (hors restauration et soins Cas’Akea ; non cumulable). Annulation avec remboursement des arrhes jusqu’à 21 jours avant l’arrivée.","en":"Yes, the long-stay offer rewards longer holidays: 15% off accommodation for 7 to 13 nights, 20% from 14 nights, with free unlimited Wi-Fi. Valid for stays from 01/11/26 to 17/12/26 and 01/02/27 to 31/10/27, only on the official website, subject to availability, on all accommodation types except the Standard room (excluding dining and Cas’Akea treatments; not combinable). Deposit refunded for cancellations up to 21 days before arrival.","de":"Ja, das Langzeitangebot belohnt längere Aufenthalte: 15 % Rabatt auf die Unterkunft bei 7 bis 13 Nächten, 20 % ab 14 Nächten, inklusive kostenlosem unbegrenztem WLAN. Gültig für Aufenthalte vom 01.11.26 bis 17.12.26 und vom 01.02.27 bis 31.10.27, ausschließlich auf der offiziellen Website, nach Verfügbarkeit, für alle Unterkunftskategorien außer dem Standardzimmer (ohne Restaurant und Cas’Akea-Anwendungen; nicht kombinierbar). Anzahlung wird bei Stornierung bis 21 Tage vor Anreise erstattet."}},{"id":"court_sejour","exemples":{"fr":["offre court séjour","on vient 4 nuits, c'est possible d'avoir une remise ?","remise 3 nuits","10 % de remise","offre week-end","réduction pour un séjour de 3 nuits","court séjour promo","séjour de 5 nuits réduction","10% hébergement","offre 3 à 6 nuits"],"en":["short stay offer","discount for 4 nights","10% off","weekend deal"],"de":["kurzaufenthalt angebot","rabatt für 4 nächte","10 % rabatt","wochenendangebot"]},"mots_ancres":["court sejour:5","courts sejours:5","3 nuits:4","4 nuits:4","short stay:5","kurzaufenthalt*:5","3 a 6 nuits:5"],"suggestions":["offres","long_sejour","reserver"],"actions":[{"type":"lien","url":"https://www.iloha.fr/offres-speciales/court-sejour/","label":{"fr":"Offre court séjour","en":"Short-stay offer","de":"Kurzaufenthaltsangebot"}},"tel:reception"],"topic":{"fr":"Offre court séjour","en":"Short-stay offer","de":"Kurzaufenthaltsangebot"},"source":"https://www.iloha.fr/offres-speciales/court-sejour/ (lu le 27/10/2026)","reponse":{"fr":"L’offre court séjour, c’est 10 % de remise sur l’hébergement pour 3 à 6 nuits, avec Wi-Fi gratuit et illimité. Elle est actuellement programmée du 18/05/27 au 01/07/27 (exclusivement sur le site officiel, selon disponibilité, hors chambre Standard). Pour un séjour de 3 à 6 nuits à d’autres dates, la réception vous indique ce qui est possible ; en attendant, réserver sur le site officiel vous garantit les meilleurs tarifs.","en":"The short-stay offer gives 10% off accommodation for 3 to 6 nights, with free unlimited Wi-Fi. It is currently scheduled from 18/05/27 to 01/07/27 (official website only, subject to availability, excluding the Standard room). For a 3 to 6 night stay on other dates, reception can tell you what is possible; in the meantime, booking on the official website guarantees the best rates.","de":"Beim Kurzaufenthaltsangebot erhalten Sie 10 % Rabatt auf die Unterkunft bei 3 bis 6 Nächten, inklusive kostenlosem unbegrenztem WLAN. Es ist derzeit für den Zeitraum 18.05.27 bis 01.07.27 vorgesehen (nur auf der offiziellen Website, nach Verfügbarkeit, ohne Standardzimmer). Für 3 bis 6 Nächte zu anderen Terminen sagt Ihnen die Rezeption, was möglich ist; die Buchung über die offizielle Website garantiert Ihnen in jedem Fall die besten Preise."}},{"id":"noces","exemples":{"fr":["offre voyage de noces","on est jeunes mariés, vous avez quelque chose pour nous ?","lune de miel à la réunion","vous faites des offres pour les mariés","nous venons de nous marier","séjour lune de miel","tarif voyage de noces","réduction jeunes mariés","on se marie en novembre vous avez une offre ?","certificat de mariage"],"en":["honeymoon","honeymoon offer","we just got married any offer?","newlyweds discount","we are on our honeymoon"],"de":["flitterwochen angebot","hochzeitsreise","wir haben gerade geheiratet gibt es ein angebot","angebot für frischvermählte","flitterwochen"]},"mots_ancres":["noces:5","lune de miel:5","jeunes maries:5","honeymoon:5","newlywed*:5","honeymoon:9","flitterwochen:5","hochzeitsreise:5","frischvermahlte:5","certificat mariage:5","honeymoon:6","lune de miel:6","flitterwochen:6"],"suggestions":["romantique","coffrets_bienetre","offres"],"actions":[{"type":"lien","url":"https://www.iloha.fr/offres-speciales/offre-voyage-de-noce/","label":{"fr":"Offre voyage de noces","en":"Honeymoon offer","de":"Hochzeitsreise-Angebot"}},"reserver"],"topic":{"fr":"Offre voyage de noces","en":"Honeymoon offer","de":"Hochzeitsreise-Angebot"},"source":"https://www.iloha.fr/offres-speciales/offre-voyage-de-noce/ ; https://offrir.iloha.fr/rituel-des-jeunes-maries-1h20-1 (lus le 27/10/2026)","reponse":{"fr":"Pour un voyage de noces, l’hôtel propose : 25 % de remise sur l’hébergement pour 5 nuits minimum en bungalow Tropique, 15 % de remise sur les soins à la Cas’Akea et une attention particulière en chambre. Conditions : certificat de mariage de moins d’un an présenté à l’arrivée ; séjours du 01/11/26 au 17/12/26 et du 01/02/27 au 31/10/27, selon disponibilité. La boutique cadeaux propose aussi le « Rituel des jeunes mariés » (soin en duo de 1h20, 220 €) à offrir ou à s’offrir.","en":"For a honeymoon the hotel offers: 25% off accommodation for a minimum of 5 nights in a Tropique bungalow, 15% off Cas’Akea treatments and a special attention in the room. Conditions: marriage certificate under one year old shown on arrival; stays from 01/11/26 to 17/12/26 and 01/02/27 to 31/10/27, subject to availability. The gift shop also offers the “Newlyweds’ ritual” (1h20 treatment for two, €220) to give or to enjoy.","de":"Für die Hochzeitsreise bietet das Hotel: 25 % Rabatt auf die Unterkunft bei mindestens 5 Nächten im Bungalow Tropique, 15 % Rabatt auf Anwendungen im Cas’Akea und eine besondere Aufmerksamkeit im Zimmer. Bedingungen: Heiratsurkunde (jünger als ein Jahr) bei Anreise vorzeigen; Aufenthalte vom 01.11.26 bis 17.12.26 und vom 01.02.27 bis 31.10.27, nach Verfügbarkeit. Der Geschenkshop bietet außerdem das „Ritual der Frischvermählten“ (Anwendung für zwei, 1 Std. 20, 220 €)."},"prefere":true},{"id":"noel","exemples":{"fr":["vous faites quoi pour noel","les offres pour Noël","offre noël","offres de noël","noel à l'hôtel","menu de noel","menu de noël au restaurant ?","repas de noël le 25 décembre","vacances de noël des chambres","passer noël chez vous","un séjour pour Noël en famille","fêtes de fin d'année","offres de fin d'année","spécial fêtes de fin d'année","déjeuner du 25 décembre","vous fêtez noël à l'hôtel ?","animations de noël","le père noël passe pour les enfants ?","vous faites quoi pour les fêtes","noel 2026","vous avez un programme pour les fêtes","passer les fêtes à l'hôtel","noël au soleil à la réunion","c quoi vos offres pour noel","vous faites un repas de noel ?","24 décembre soirée","animations pour les fêtes","idée cadeau pour noël","bon cadeau noël","quelles sont les offres pour noel","offres pour noel","offre de noel","noel chez vous","programme de noel"],"en":["christmas offer","do you have a christmas dinner?","what do you do for christmas","christmas at the hotel","christmas menu","what do you do for the holidays?","festive season offers","christmas package","spend christmas at the hotel","christmas gift idea","christmas offers"],"de":["weihnachten angebot","weihnachtsessen im hotel","feiertage im hotel verbringen","was bieten sie zu weihnachten","weihnachtsmenü","weihnachten im hotel","weihnachtsangebote","festtage im hotel","was machen sie an weihnachten"]},"mots_ancres":["noel:6","christmas:6","xmas:6","weihnacht*:6","fetes de fin d'annee:6","fin d'annee:5","festtage:5","feiertage:5","festive:5","the holidays:8","holidays:6","for the holidays:8","pere noel:6","24 decembre:5","25 decembre:5","holiday season:4","fetes de fin:5","noel:5","christmas:5","weihnachten:5"],"suggestions":["coffrets_sejours","reveillon","newsletter"],"actions":[{"type":"lien","url":"https://offrir.iloha.fr/cadeaux-de-noel","label":{"fr":"Cadeaux de Noël","en":"Christmas gifts","de":"Weihnachtsgeschenke"}},"tel:reception",{"type":"lien","url":"https://www.iloha.fr/newsletter/","label":{"fr":"Newsletter","en":"Newsletter","de":"Newsletter"}}],"topic":{"fr":"Noël à l'hôtel","en":"Christmas at the hotel","de":"Weihnachten im Hotel"},"statut":"partiel","source":"https://offrir.iloha.fr/cadeaux-de-noel ; https://www.iloha.fr/offres-speciales/ (lus le 27/10/2026)","reponse":{"fr":"Pour Noël, voici ce que l’hôtel publie aujourd’hui : une rubrique « Coffrets Cadeaux de Noël » sur sa boutique (un moment gourmand, une pause détente ou une escapade à deux : séjour romantique, gourmand, détente, soins Cas’Akea et carte cadeau ; le bon arrive par mail ou par voie postale). Le programme des fêtes sur place (menu de Noël, animations) n’est pas encore publié sur le site, et aucune offre spéciale n’est annoncée pour les séjours du 18/12 au 31/01 : la réception (+262 (0)262 34 89 89) vous le communique dès qu’il est confirmé, et la newsletter en informe en premier. Chaque vendredi, la soirée créole du Kotémer (buffet 45 € par adulte, 18 € par enfant) reste un bon moment à partager.","en":"For Christmas, here is what the hotel publishes today: a “Christmas Gift Boxes” section on its shop (a gourmet moment, a relaxing break or a getaway for two: romantic, gourmet and relaxation stays, Cas’Akea treatments and gift card; the voucher arrives by e-mail or post). The festive programme on site (Christmas menu, entertainment) is not yet published on the website, and no special offer is announced for stays between 18/12 and 31/01: reception (+262 (0)262 34 89 89) will share it as soon as it is confirmed, and the newsletter informs subscribers first. Every Friday the Creole evening at Le Kotémer (buffet €45 per adult, €18 per child) is a lovely moment to share.","de":"Zu Weihnachten veröffentlicht das Hotel derzeit: eine Rubrik „Weihnachts-Geschenkboxen“ in seinem Shop (ein kulinarischer Moment, eine Auszeit zum Entspannen oder ein Kurztrip zu zweit: romantischer, kulinarischer und Wellness-Aufenthalt, Cas’Akea-Anwendungen und Geschenkkarte; der Gutschein kommt per E-Mail oder Post). Das Festprogramm vor Ort (Weihnachtsmenü, Animation) ist auf der Website noch nicht veröffentlicht, und für Aufenthalte vom 18.12. bis 31.01. ist kein Sonderangebot angekündigt: die Rezeption (+262 (0)262 34 89 89) teilt es Ihnen mit, sobald es feststeht; der Newsletter informiert zuerst. Jeden Freitag ist der kreolische Abend im Kotémer (Buffet 45 € pro Erwachsenem, 18 € pro Kind) ein schöner gemeinsamer Moment."},"bonus":1.15},{"id":"reveillon","exemples":{"fr":["réveillon","réveillon du nouvel an","soirée de la saint sylvestre ?","le 31 décembre vous faites un dîner ?","nouvel an","nouvel an 2027","jour de l'an","réveillon 31 décembre","réveillon de noël","saint sylvestre","soirée du 31","dîner de gala 31 décembre","fêter le nouvel an à l'hôtel","menu du réveillon","passer le réveillon chez vous","menu saint-sylvestre prix","soirée du nouvel an avec dj"],"en":["new year's eve party?","new year","new year's eve dinner","nye gala","christmas eve dinner","how do you celebrate new year","new years eve at the hotel"],"de":["silvester feier?","silvesterparty","neujahr im hotel","silvesterdinner","silvester menü","heiligabend essen","neujahrsfeier"]},"mots_ancres":["reveillon:6","sylvestre:6","nouvel an:6","jour de l'an:6","31 decembre:6","new year:6","new years eve:6","nye:5","silvester:6","neujahr*:6","heiligabend:6","christmas eve:6"],"suggestions":["noel","newsletter","reserver"],"actions":["tel:resto","mail:resto",{"type":"lien","url":"https://www.iloha.fr/newsletter/","label":{"fr":"Newsletter","en":"Newsletter","de":"Newsletter"}}],"topic":{"fr":"Réveillon et Nouvel An","en":"New Year's Eve","de":"Silvester und Neujahr"},"statut":"non_publie","source":"https://www.iloha.fr/ (aucune page réveillon / Saint-Sylvestre, lu le 27/10/2026)","reponse":{"fr":"Le programme du réveillon de la Saint-Sylvestre et du Nouvel An (soirée, menu, tarifs) n’est pas encore publié sur le site de l’hôtel, et je préfère ne rien avancer d’inexact. L’équipe restauration vous le communique dès qu’il est confirmé : vous pouvez la contacter directement, vous inscrire à la newsletter pour être informé en premier, ou réserver votre hébergement en direct sur le site officiel (meilleurs tarifs garantis). En attendant, chaque vendredi la soirée créole (buffet et musiques traditionnelles) et chaque samedi le dîner-concert animent le Kotémer.","en":"The New Year’s Eve programme (party, menu, prices) is not yet published on the hotel’s website, and I would rather not say anything inaccurate. The restaurant team will share it as soon as it is confirmed: you can contact them directly, subscribe to the newsletter to be informed first, or book your accommodation direct on the official website (best rates guaranteed). Meanwhile, every Friday the Creole evening (buffet and traditional music) and every Saturday the dinner-concert liven up Le Kotémer.","de":"Das Programm für Silvester und Neujahr (Abend, Menü, Preise) ist auf der Website des Hotels noch nicht veröffentlicht, und ich möchte nichts Ungenaues sagen. Das Restaurantteam teilt es Ihnen mit, sobald es feststeht: Sie können es direkt kontaktieren, den Newsletter abonnieren, um zuerst informiert zu werden, oder Ihre Unterkunft direkt auf der offiziellen Website buchen (beste Preise garantiert). Bis dahin sorgen jeden Freitag der kreolische Abend (Buffet und traditionelle Musik) und jeden Samstag das Dinner-Konzert für Stimmung im Kotémer."}},{"id":"fetes_calendrier","exemples":{"fr":["saint valentin","vous faites quelque chose pour la saint valentin ?","brunch fête des mères","brunch du 14 juillet","brunch fête des pères","vous faites quelque chose pour pâques ?","calendrier des fêtes de l'hôtel","les fêtes de l'année","dates des brunchs","événements de l'année","un brunch pour pâques","14 février à l'hôtel","fête des mères à l'hôtel","vous fêtez les jours fériés ?"],"en":["valentine's day","mother's day brunch","do you do something for easter","bastille day brunch","annual events calendar"],"de":["valentinstag","muttertag brunch","ostern im hotel","veranstaltungskalender","feiertage brunch"]},"mots_ancres":["valentin:6","paques:6","easter:6","ostern:6","fete des meres:6","fete des peres:6","mothers day:6","muttertag:6","vatertag:6","14 juillet:6","fete nationale:6","valentinstag:6","calendrier des fetes:6","jours feries:4"],"suggestions":["brunch","newsletter","evenements_en_cours"],"actions":[{"type":"lien","url":"https://www.iloha.fr/actualites/","label":{"fr":"Actualités","en":"News","de":"Neuigkeiten"}},{"type":"lien","url":"https://www.iloha.fr/newsletter/","label":{"fr":"Newsletter","en":"Newsletter","de":"Newsletter"}},"tel:reception"],"topic":{"fr":"Fêtes et brunchs de l'année","en":"Holidays and brunches","de":"Feste und Brunchs im Jahr"},"source":"https://www.iloha.fr/actualites/ ; https://www.iloha.fr/newsletter/ (lus le 27/10/2026)","reponse":{"fr":"L’hôtel marque les temps forts de l’année par des événements à thème. Cette année, ses actualités mentionnent : le brunch de la fête des mères (31 mai 2026), celui de la fête des pères (21 juin 2026), le brunch de la fête nationale (14 juillet 2026) et la semaine des 30 ans de l’hôtel (du 7 au 12 septembre 2026). Les dates des prochains rendez-vous (Noël, Nouvel An, Saint-Valentin, Pâques…) ne sont pas encore publiées : la newsletter et les réseaux sociaux de l’hôtel les annoncent en premier, et la réception vous renseigne au +262 (0)262 34 89 89.","en":"The hotel marks the highlights of the year with themed events. This year, its news mentions: the Mother’s Day brunch (31 May 2026), the Father’s Day brunch (21 June 2026), the Bastille Day brunch (14 July 2026) and the hotel’s 30th anniversary week (7 to 12 September 2026). The dates of the next events (Christmas, New Year, Valentine’s Day, Easter…) are not yet published: the newsletter and the hotel’s social networks announce them first, and reception will be glad to help on +262 (0)262 34 89 89.","de":"Das Hotel setzt die Höhepunkte des Jahres mit Themenveranstaltungen in Szene. In diesem Jahr nennen die Neuigkeiten: den Brunch zum Muttertag (31. Mai 2026), zum Vatertag (21. Juni 2026), zum Nationalfeiertag (14. Juli 2026) und die Jubiläumswoche zum 30-jährigen Bestehen (7. bis 12. September 2026). Die Termine der nächsten Veranstaltungen (Weihnachten, Neujahr, Valentinstag, Ostern …) sind noch nicht veröffentlicht: Newsletter und soziale Netzwerke des Hotels kündigen sie zuerst an, die Rezeption hilft unter +262 (0)262 34 89 89 gern weiter."}},{"id":"evenements_en_cours","exemples":{"fr":["y a des animations en ce moment ?","quoi de neuf à l'hôtel ?","vous faites des soirées ?","la soirée du samedi c'est quoi","y a de la musique le soir ?","prochain événement à l'hôtel","des événements ce mois-ci ?","actualités de l'hôtel","il se passe quoi en ce moment chez vous","c'est animé le soir ?","un concert ce week-end ?","live band","animations du week-end","c'est calme ou animé","les nouveautés","ya une soirée ce soir","qu'est-ce qui se passe à l'hôtel en ce moment"],"en":["live music at the hotel?","what's on at the hotel?","any entertainment this weekend","hotel news","upcoming events","is there a show tonight","what is happening at the hotel"],"de":["livemusik am wochenende?","was ist im hotel los","veranstaltungen im hotel","neuigkeiten","gibt es heute abend musik"]},"mots_ancres":["actualites:5","nouveautes:5","quoi de neuf:6","live band:6","musique le soir:5","what's on:5","whats on:5","upcoming events:6","livemusik:5","neuigkeiten:5","prochain evenement:5"],"suggestions":["buffet","newsletter","fetes_calendrier"],"actions":[{"type":"lien","url":"https://www.iloha.fr/actualites/","label":{"fr":"Actualités","en":"News","de":"Neuigkeiten"}},"tel:resto","mail:resto"],"topic":{"fr":"Animations et actualités","en":"Entertainment and news","de":"Animation und Neuigkeiten"},"source":"https://www.iloha.fr/actualites/ ; https://www.iloha.fr/offres-speciales/les-vacances-se-vivent-a-iloha/ (lus le 27/10/2026)","reponse":{"fr":"Chaque semaine, la vie de l’hôtel s’anime au Kotémer : le vendredi, soirée créole (buffet de spécialités réunionnaises avec musiques et danses traditionnelles) ; le samedi, dîner-concert avec live band ; et des brunchs lors d’événements spécifiques. Dernier grand rendez-vous : la semaine des 30 ans de l’hôtel, du 7 au 12 septembre 2026 (dîners de chefs, concerts, ateliers). Les prochains événements ne sont pas encore publiés : la newsletter et les réseaux sociaux de l’hôtel les annoncent en premier. Réservation : +262 (0)262 34 89 89 ou restaurant@iloha.fr.","en":"Every week the hotel comes alive at Le Kotémer: on Fridays, a Creole evening (buffet of Reunionese specialities with traditional music and dance); on Saturdays, a dinner-concert with a live band; and brunches on special occasions. The latest big event was the hotel’s 30th anniversary week, 7 to 12 September 2026 (chef dinners, concerts, workshops). The next events are not yet published: the newsletter and the hotel’s social networks announce them first. Reservations: +262 (0)262 34 89 89 or restaurant@iloha.fr.","de":"Jede Woche wird es im Kotémer lebendig: freitags kreolischer Abend (Buffet mit Spezialitäten der Insel, traditionelle Musik und Tanz), samstags Dinner-Konzert mit Live-Band und Brunchs zu besonderen Anlässen. Zuletzt gab es die Jubiläumswoche zum 30-jährigen Bestehen vom 7. bis 12. September 2026 (Chef-Dinner, Konzerte, Workshops). Die nächsten Veranstaltungen sind noch nicht veröffentlicht: Newsletter und soziale Netzwerke des Hotels kündigen sie zuerst an. Reservierung: +262 (0)262 34 89 89 oder restaurant@iloha.fr."}},{"id":"coffrets_sejours","exemples":{"fr":["coffret séjour","combien coûte un coffret séjour ?","je voudrais offrir un séjour à mes parents","offrir une nuit à l'hôtel","séjour gourmand en cadeau","offrir un week-end romantique","bon cadeau séjour","idée cadeau séjour pour un couple","séjour détente cadeau","cadeau noël séjour","coffrets cadeaux de noël","quels coffrets cadeaux avez-vous","bon cadeau valable combien de temps ?","offrir une nuit avec champagne","quel cadeau pour un couple","séjour sur mesure cadeau","cadeau de noël pour mes parents","j'aimerais offrir une nuit","cadeau pour un anniversaire de mariage"],"en":["gift voucher for a stay","stay gift box","buy a night as a gift","gift idea for a couple","christmas gift box","how much is a gift stay"],"de":["geschenkgutschein aufenthalt","übernachtung verschenken","geschenkidee für ein paar","weihnachtsgeschenk hotel","aufenthalt als geschenk"]},"mots_ancres":["coffret*:5","offrir un sejour:6","offrir une nuit:6","bon cadeau:5","cadeau sejour:6","cadeau noel:6","gift box:5","gift stay:5","geschenkbox:5","weihnachtsgeschenk:6"],"suggestions":["cadeau","coffrets_bienetre","romantique"],"actions":[{"type":"lien","url":"https://offrir.iloha.fr/","label":{"fr":"Boutique cadeaux","en":"Gift shop","de":"Geschenkshop"}}],"topic":{"fr":"Coffrets séjour à offrir","en":"Stay gift boxes","de":"Aufenthalts-Geschenkboxen"},"source":"https://offrir.iloha.fr/ (lu le 27/10/2026)","reponse":{"fr":"Sur la boutique cadeaux de l’hôtel, plusieurs idées de séjour pour 2 personnes (1 nuit en chambre double, petit-déjeuner inclus) :\n• Séjour romantique : champagne en chambre — 288 € en Tropique, 298 € en Kitchenette ou Guétali ;\n• Séjour gourmand : crédit restauration de 100 € — 248 € en Standard, 298 € Tropique, 308 € Kitchenette ou Guétali ;\n• Séjour détente : 2 soins Akéa — 328 € en Standard, 378 € Tropique, 388 € Kitchenette ou Guétali ;\n• Séjour sur mesure : nuit et petit-déjeuner — 148 € en Standard, 198 € Tropique, 208 € Kitchenette ou Guétali.\nS’y ajoutent la carte cadeau (de 50 à 250 €, valable 12 mois) et les soins bien-être. Le bon est reçu par mail ou par voie postale ; le bénéficiaire réserve ensuite directement auprès de l’hôtel (périodes non valables et conditions détaillées sur chaque coffret).","en":"On the hotel’s gift shop there are several stay ideas for 2 people (1 night in a double room, breakfast included):\n• Romantic stay: champagne in the room — €288 in Tropique, €298 in Kitchenette or Guétali;\n• Gourmet stay: €100 dining credit — €248 in Standard, €298 Tropique, €308 Kitchenette or Guétali;\n• Relaxation stay: 2 Akéa treatments — €328 in Standard, €378 Tropique, €388 Kitchenette or Guétali;\n• Tailor-made stay: night and breakfast — €148 in Standard, €198 Tropique, €208 Kitchenette or Guétali.\nThere is also the gift card (€50 to €250, valid 12 months) and wellness treatments. The voucher is received by e-mail or post; the recipient then books directly with the hotel (non-valid periods and detailed conditions are shown on each box).","de":"Im Geschenkshop des Hotels gibt es mehrere Aufenthaltsideen für 2 Personen (1 Nacht im Doppelzimmer, Frühstück inklusive):\n• Romantischer Aufenthalt: Champagner im Zimmer — 288 € im Tropique, 298 € im Kitchenette oder Guétali;\n• Kulinarischer Aufenthalt: 100 € Restaurantguthaben — 248 € im Standard, 298 € Tropique, 308 € Kitchenette oder Guétali;\n• Wellness-Aufenthalt: 2 Akéa-Anwendungen — 328 € im Standard, 378 € Tropique, 388 € Kitchenette oder Guétali;\n• Individueller Aufenthalt: Übernachtung mit Frühstück — 148 € im Standard, 198 € Tropique, 208 € Kitchenette oder Guétali.\nDazu kommen die Geschenkkarte (50 bis 250 €, 12 Monate gültig) und Wellness-Anwendungen. Den Gutschein erhalten Sie per E-Mail oder Post; die beschenkte Person bucht anschließend direkt beim Hotel (nicht gültige Zeiträume und Bedingungen stehen bei jeder Box)."}},{"id":"coffrets_bienetre","exemples":{"fr":["coffret cadeau spa","coffret bien-être","offrir un massage","prix d'un soin en cadeau","massage en cadeau","offrir un soin akea","carte cadeau spa","cadeau détente pour ma femme","offrir un massage en duo","un soin pour la fête des mères","cadeau massage noël","combien coûte un soin en bon cadeau","rituel des jeunes mariés"],"en":["spa gift box","can I buy a spa gift box?","gift a massage","wellness gift voucher","spa gift card"],"de":["massage verschenken","wellness geschenk","spa gutschein","geschenk massage","wellnessgutschein"]},"mots_ancres":["coffret bien-etre:6","coffret spa:6","massage cadeau:6","cadeau massage:6","cadeau soin:6","offrir un massage:6","offrir un soin:6","spa gift:6","gift massage:6","massage verschenken:6","wellness geschenk:6","wellnessgutschein:6","spa gutschein:6"],"suggestions":["cadeau","spa","coffrets_sejours"],"actions":[{"type":"lien","url":"https://offrir.iloha.fr/","label":{"fr":"Boutique cadeaux","en":"Gift shop","de":"Geschenkshop"}},"tel:spa"],"topic":{"fr":"Soins et bien-être à offrir","en":"Wellness gifts","de":"Wellness-Geschenke"},"source":"https://offrir.iloha.fr/ (lu le 27/10/2026)","reponse":{"fr":"Pour offrir un moment de détente, la boutique cadeaux de l’hôtel propose des soins Akéa de 50 minutes à partir de 90 €, le « Rituel des jeunes mariés » en duo (1h20, 220 €), le séjour détente (nuit, petit-déjeuner et 2 soins Akéa, 328 € en chambre Standard) et la carte cadeau (de 50 à 250 €, valable 12 mois). La Cas’Akea est réservée aux personnes majeures. Le bénéficiaire réserve ensuite directement auprès de l’hôtel (spa : +262 (0)262 44 44 40, akea@iloha.fr).","en":"To give a moment of relaxation, the hotel’s gift shop offers 50-minute Akéa treatments from €90, the “Newlyweds’ ritual” for two (1h20, €220), the relaxation stay (night, breakfast and 2 Akéa treatments, €328 in a Standard room) and the gift card (€50 to €250, valid 12 months). Cas’Akea is for adults only. The recipient then books directly with the hotel (spa: +262 (0)262 44 44 40, akea@iloha.fr).","de":"Für einen Moment der Entspannung bietet der Geschenkshop des Hotels 50-minütige Akéa-Anwendungen ab 90 €, das „Ritual der Frischvermählten“ für zwei (1 Std. 20, 220 €), den Wellness-Aufenthalt (Nacht, Frühstück und 2 Akéa-Anwendungen, 328 € im Standardzimmer) und die Geschenkkarte (50 bis 250 €, 12 Monate gültig). Das Cas’Akea ist Erwachsenen vorbehalten. Die beschenkte Person reserviert anschließend direkt beim Hotel (Spa: +262 (0)262 44 44 40, akea@iloha.fr)."}},{"id":"romantique","exemples":{"fr":["séjour romantique","idée week-end romantique","séjour romantique prix","champagne en chambre","dîner aux chandelles","bain à deux","massage en duo","escapade en amoureux","week-end en amoureux","je veux demander ma copine en mariage","une surprise romantique pour ma femme","séjour pour la saint valentin","nuit romantique à l'hôtel","on cherche un endroit romantique","hôtel romantique à saint leu","offre romantique","en amoureux"],"en":["romantic getaway","romantic stay","romantic dinner","champagne in the room","couples massage","romantic weekend","propose to my girlfriend at the hotel"],"de":["romantisches wochenende","romantischer aufenthalt","champagner im zimmer","paarmassage","romantisches abendessen","für verliebte"]},"mots_ancres":["romantique:6","romantic:6","romantisch*:6","amoureux:5","chandelles:6","demander en mariage:6","demande en mariage:6","heiratsantrag:6","paarmassage:5","verliebte:5"],"suggestions":["couple","noces","spa"],"actions":["tel:reception",{"type":"lien","url":"https://offrir.iloha.fr/sejour-romantique-17","label":{"fr":"Séjour romantique","en":"Romantic stay","de":"Romantischer Aufenthalt"}}],"topic":{"fr":"Séjour romantique","en":"Romantic getaway","de":"Romantischer Aufenthalt"},"source":"https://www.iloha.fr/hebergement/ ; https://offrir.iloha.fr/sejour-romantique-17 ; fiche couple (lus le 27/10/2026)","reponse":{"fr":"Pour une escapade à deux, Iloha a de quoi séduire : un « lieu de bien-être et de quiétude » face à la baie de Saint-Leu, un jardin tropical de 3 hectares, les chambres Guétali de l’étage avec vue panoramique sur la mer, les bungalows Tropique (terrasse sur le jardin), la Cas’Akea avec salle de massage en duo et bain double, et la soirée créole du vendredi ou le dîner-concert du samedi au Kotémer. Côté formules : le coffret « Séjour romantique » (1 nuit, petit-déjeuner pour 2 et champagne en chambre, dès 288 € en Tropique, à offrir ou à s’offrir) et, pour les jeunes mariés, l’offre voyage de noces. Pour une surprise ou une demande en mariage, parlez-en à la réception : elle vous conseille avec plaisir.","en":"For a getaway for two, Iloha has plenty of charm: a “place of wellbeing and tranquillity” facing Saint-Leu bay, a 3-hectare tropical garden, upstairs Guétali rooms with a panoramic sea view, Tropique bungalows (garden terrace), Cas’Akea with a couple’s massage room and double bath, and the Friday Creole evening or Saturday dinner-concert at Le Kotémer. Packages: the “Romantic stay” box (1 night, breakfast for 2 and champagne in the room, from €288 in Tropique, to give or enjoy) and, for newlyweds, the honeymoon offer. For a surprise or a proposal, talk to reception: they will be glad to advise.","de":"Für eine Auszeit zu zweit hat das Iloha viel zu bieten: ein „Ort des Wohlbefindens und der Ruhe“ mit Blick auf die Bucht von Saint-Leu, ein tropischer Garten von 3 Hektar, die Guétali-Zimmer im Obergeschoss mit Panorama-Meerblick, die Bungalows Tropique (Gartenterrasse), das Cas’Akea mit Massageraum für Paare und Doppelbadewanne sowie der kreolische Abend am Freitag oder das Dinner-Konzert am Samstag im Kotémer. Angebote: das Paket „Romantischer Aufenthalt“ (1 Nacht, Frühstück für 2 und Champagner im Zimmer, ab 288 € im Tropique, zum Verschenken oder Selbstgenießen) und für Frischvermählte das Hochzeitsreise-Angebot. Für eine Überraschung oder einen Heiratsantrag sprechen Sie mit der Rezeption: sie berät Sie gern."}},{"id":"occasion","exemples":{"fr":["c'est mon anniversaire bientôt, vous faites quoi ?","fêter un anniversaire","on fête nos 10 ans de mariage","une surprise pour mon mari","organiser mon anniversaire à l'hôtel","fêter un anniversaire de mariage","pour une occasion spéciale","un gâteau d'anniversaire au restaurant","anniversaire de ma femme","surprise pour un anniversaire","on veut marquer le coup","un dîner d'anniversaire","fêter les 50 ans de ma mère","repas de famille à l'hôtel","fêter un événement familial"],"en":["it's my birthday soon","celebrate a birthday","wedding anniversary","surprise for my husband","special occasion","birthday dinner"],"de":["geburtstag feiern","hochzeitstag","überraschung für meinen mann","besonderer anlass","geburtstagsessen"]},"mots_ancres":["anniversaire mariage:6","birthday:5","geburtstag:5","hochzeitstag:6","wedding anniversary:6","occasion speciale:6","special occasion:6","besonderer anlass:6","evjf:5"],"suggestions":["romantique","event","coffrets_sejours"],"actions":["tel:reception","mail:resto"],"topic":{"fr":"Anniversaire et occasions spéciales","en":"Birthdays and special occasions","de":"Geburtstag und besondere Anlässe"},"source":"https://www.iloha.fr/ ; https://offrir.iloha.fr/ ; fiche event (lus le 27/10/2026)","reponse":{"fr":"Pour fêter une occasion (anniversaire, anniversaire de mariage, surprise…), l’hôtel propose plusieurs pistes : un séjour (coffret « Séjour romantique » avec champagne en chambre, « Séjour gourmand » avec 100 € de crédit restauration), un soin ou un massage en duo à la Cas’Akea, une journée détente en semaine, ou une table au Kotémer. Pour un repas de groupe ou une réception privée, il est possible d’organiser un événement sur demande auprès de l’équipe restauration (date, nombre de participants, prestations souhaitées). Dites-nous l’occasion et la date : la réception vous aide à préparer une attention adaptée.","en":"To celebrate an occasion (birthday, wedding anniversary, surprise…), the hotel suggests several ideas: a stay (“Romantic stay” box with champagne in the room, “Gourmet stay” with €100 dining credit), a treatment or couple’s massage at Cas’Akea, a weekday relaxation day, or a table at Le Kotémer. For a group meal or private reception, an event can be organised on request with the restaurant team (date, number of guests, desired services). Tell us the occasion and the date: reception will help you prepare a suitable attention.","de":"Um einen Anlass zu feiern (Geburtstag, Hochzeitstag, Überraschung …), schlägt das Hotel mehrere Ideen vor: einen Aufenthalt (Paket „Romantischer Aufenthalt“ mit Champagner im Zimmer, „Kulinarischer Aufenthalt“ mit 100 € Restaurantguthaben), eine Anwendung oder Paarmassage im Cas’Akea, einen Entspannungstag unter der Woche oder einen Tisch im Kotémer. Für ein Gruppenessen oder einen privaten Empfang kann auf Anfrage beim Restaurantteam eine Veranstaltung organisiert werden (Datum, Teilnehmerzahl, gewünschte Leistungen). Nennen Sie uns Anlass und Datum: die Rezeption hilft bei einer passenden Aufmerksamkeit."}},{"id":"seminaire","exemples":{"fr":["organiser un séminaire d'entreprise","vous avez une salle de réunion ?","faire un team building","un groupe de 20 personnes","séminaire à l'hôtel","salle de séminaire","tarif groupe","réunion d'entreprise","journée d'étude","offre entreprise","séjour pour mon équipe","séminaire résidentiel","salle de conférence","tarifs séminaires"],"en":["business meeting room","seminar at the hotel","team building","group booking","corporate event"],"de":["tagung im hotel","seminarraum","gruppenbuchung","firmenveranstaltung","teambuilding"]},"mots_ancres":["seminaire*:6","team building:6","teambuilding:6","salle de reunion:6","salle de conference:6","meeting room:6","tagung*:6","seminarraum:6","gruppenbuchung:5","firmenveranstaltung:5","afterwork:5"],"suggestions":["event","hebergements","restaurants"],"actions":["mail:resto","tel:reception"],"topic":{"fr":"Séminaires et groupes","en":"Seminars and groups","de":"Seminare und Gruppen"},"statut":"non_publie","source":"https://www.iloha.fr/ (aucune page séminaire, lu le 27/10/2026) ; fiche event","reponse":{"fr":"Les offres séminaires, salles de réunion et forfaits groupes ne sont pas détaillés sur le site de l’hôtel : je ne peux donc pas vous donner de capacité ni de tarif. Ce que l’hôtel indique : il est possible d’organiser un événement sur demande auprès de l’équipe restauration. Pour un séminaire, un team building ou un groupe, indiquez la date, le nombre de participants et les prestations souhaitées (hébergement, repas, détente) : l’équipe étudie la faisabilité et vous répond. Côté détente pour vos équipes : jardin tropical de 3 hectares, deux piscines et la Cas’Akea.","en":"Seminar offers, meeting rooms and group packages are not detailed on the hotel’s website, so I cannot give you capacities or rates. What the hotel states: an event can be organised on request with the restaurant team. For a seminar, team-building or group, tell them the date, number of participants and services wanted (accommodation, meals, relaxation): the team will study feasibility and reply. To help your teams unwind: a 3-hectare tropical garden, two pools and Cas’Akea.","de":"Seminarangebote, Tagungsräume und Gruppenpakete sind auf der Website des Hotels nicht im Detail beschrieben, daher kann ich Ihnen keine Kapazitäten oder Preise nennen. Das Hotel gibt an: Auf Anfrage beim Restaurantteam kann eine Veranstaltung organisiert werden. Für ein Seminar, Teambuilding oder eine Gruppe nennen Sie Datum, Teilnehmerzahl und gewünschte Leistungen (Unterkunft, Verpflegung, Entspannung): das Team prüft die Machbarkeit und antwortet Ihnen. Zum Entspannen Ihrer Teams: tropischer Garten von 3 Hektar, zwei Pools und das Cas’Akea."}},{"id":"conseil_chambre","exemples":{"fr":["quelle chambre me conseillez-vous ?","quelle chambre choisir","c'est quoi la meilleure chambre ?","que me conseillez-vous comme logement ?","bungalow ou chambre standard ?","quelle catégorie de chambre me conseillez-vous","je voyage seul quelle chambre ?","on est 6 amis, vous conseillez quoi ?","quelle chambre pour un couple","différence entre tropique et kitchenette","quelle différence entre les chambres","laquelle choisir","je sais pas quelle chambre prendre","conseillez-moi un hébergement","la meilleure chambre pour la vue","quelle chambre pour des enfants","quel logement pour 2 adultes et 2 enfants","quelle chambre est la plus calme","chambre pour 2 adultes et 2 enfants","chambre avec vue mer pour un couple","quelle chambre pour un séjour d'une semaine","je veux une chambre avec vue mer","une chambre au calme","je sais pas quoi choisir"],"en":["which room do you recommend?","best room for a family of four","which room should I choose","what is the best room","room advice for a couple","bungalow or standard room"],"de":["welches zimmer empfehlen sie?","zimmer für familie mit zwei kindern","welches zimmer soll ich wählen","das beste zimmer","bungalow oder zimmer","zimmer für ein paar"]},"mots_ancres":["quelle chambre:5","meilleure chambre:6","best room:6","bestes zimmer:6","which room:5","welches zimmer:5","bungalow ou chambre:6","voyage seul:8","seul:5","solo:5","travelling alone:8","allein:5","conseillez-moi un hebergement:6","quel logement:5"],"suggestions":["hebergements","famille","vue"],"actions":[{"type":"lien","url":"https://www.iloha.fr/hebergement/","label":{"fr":"Hébergements","en":"Accommodation","de":"Unterkünfte"}},"tel:reception"],"topic":{"fr":"Quelle chambre choisir","en":"Which room to choose","de":"Welches Zimmer wählen"},"source":"https://www.iloha.fr/hebergement/ + fiches hébergements/famille/vue (lus le 27/10/2026)","reponse":{"fr":"Mon petit guide selon votre séjour :\n• En couple : un bungalow Tropique (34 m², terrasse sur le jardin) ou une chambre Guétali à l’étage, avec vue panoramique sur la mer ;\n• En famille : le bungalow Famille (55 m², 3 chambres, kitchenette, terrasse avec table de 6 places), jusqu’à 4 adultes, 2 enfants et 2 bébés ;\n• Pour cuisiner ou rester plus longtemps : le bungalow Kitchenette (32 m², de plain-pied) ou la chambre Guétali (kitchenette sur la terrasse) ;\n• Pour être tout près des restaurants et de la piscine principale : la chambre Standard ;\n• Pour la vue mer : la chambre Guétali à l’étage.\nDites-moi vos dates, qui voyage et ce qui compte pour vous : la réception affine le conseil et vérifie la disponibilité.","en":"My short guide depending on your stay:\n• As a couple: a Tropique bungalow (34 m², garden terrace) or an upstairs Guétali room with panoramic sea view;\n• As a family: the Family bungalow (55 m², 3 bedrooms, kitchenette, terrace with a table for 6), up to 4 adults, 2 children and 2 babies;\n• To cook or stay longer: the Kitchenette bungalow (32 m², ground level) or the Guétali room (kitchenette on the terrace);\n• To be right next to the restaurants and main pool: the Standard room;\n• For the sea view: the upstairs Guétali room.\nTell me your dates, who is travelling and what matters to you: reception will refine the advice and check availability.","de":"Mein kurzer Leitfaden je nach Aufenthalt:\n• Als Paar: ein Bungalow Tropique (34 m², Gartenterrasse) oder ein Guétali-Zimmer im Obergeschoss mit Panorama-Meerblick;\n• Als Familie: der Familienbungalow (55 m², 3 Schlafzimmer, Küchenzeile, Terrasse mit Tisch für 6), bis zu 4 Erwachsene, 2 Kinder und 2 Babys;\n• Zum Kochen oder für längere Aufenthalte: der Bungalow Kitchenette (32 m², ebenerdig) oder das Guétali-Zimmer (Küchenzeile auf der Terrasse);\n• Ganz nah an Restaurants und Hauptpool: das Standardzimmer;\n• Für den Meerblick: das Guétali-Zimmer im Obergeschoss.\nNennen Sie mir Ihre Daten, wer reist und was Ihnen wichtig ist: die Rezeption verfeinert die Beratung und prüft die Verfügbarkeit."}},{"id":"points_forts","exemples":{"fr":["c'est quoi le mieux chez vous ?","pourquoi choisir Iloha ?","quels sont vos points forts","qu'est-ce qui vous distingue des autres hôtels","pourquoi venir chez vous plutôt qu'ailleurs","ce qu'il ne faut pas rater chez vous","vos atouts","présentez-moi l'hôtel","qu'est-ce qui rend votre hôtel spécial","le plus de l'hôtel","c'est quoi l'esprit de l'hôtel","vous avez un label écologique ?","pourquoi réserver chez vous","dites-moi tout sur l'hôtel","les petits plus de votre hôtel","c'est quoi qui vous différencie","c'est pour qui votre hôtel ?","vous êtes écolo ?","engagé pour l'environnement","parlez-moi de l'hôtel","à qui s'adresse l'hôtel","on part entre amis, que me conseillez-vous ?"],"en":["what makes Iloha special?","why should I choose your hotel?","tell me about the hotel","your strengths","what's the best thing about your hotel","is it eco-friendly","why stay with you","who is your hotel for"],"de":["was macht euer hotel besonders?","warum sollte ich ihr hotel wählen","erzählen sie mir vom hotel","ihre stärken","ist das hotel umweltfreundlich","was zeichnet sie aus","für wen ist ihr hotel geeignet","was empfehlen sie mir?"]},"mots_ancres":["points forts:6","atouts:6","distingue:6","pourquoi choisir:6","pourquoi venir:6","why choose:6","why should i:6","warum sollte:6","starken:6","plus de l'hotel:6","ecolabel:5","ecologique:5","umweltfreundlich:5","presentez-moi:5","tell me about:5","recommend something:8","empfehlen sie mir:8","aider a choisir:8","help me choose:8","erzahlen sie mir:5","kotemer:-4","kotmer:-4"],"suggestions":["hebergements","activites","romantique"],"actions":[{"type":"lien","url":"https://www.iloha.fr/hotel/","label":{"fr":"L'hôtel","en":"The hotel","de":"Das Hotel"}},"tel:reception"],"topic":{"fr":"Les atouts d'Iloha","en":"Iloha's highlights","de":"Die Stärken des Iloha"},"source":"https://www.iloha.fr/hotel/ ; https://www.iloha.fr/actualites/iloha-souffle-ses-30-bougies/ (lus le 27/10/2026)","reponse":{"fr":"Les atouts qu’Iloha met en avant : un hôtel 3 étoiles face à la baie de Saint-Leu, un jardin tropical de 3 hectares, 82 hébergements en 5 catégories (de la chambre Standard au bungalow Famille), deux piscines, des restaurants et un bar, l’espace bien-être Cas’Akea, la soirée créole du vendredi, un accueil chaleureux — et 30 ans de savoir-faire, avec l’Ecolabel Européen obtenu en 2015. Si vous me dites ce que vous cherchez (détente, famille, romantisme, gastronomie), je vous indique ce qui vous correspond le mieux.","en":"Iloha’s highlights: a 3-star hotel facing Saint-Leu bay, a 3-hectare tropical garden, 82 accommodations in 5 categories (from the Standard room to the Family bungalow), two pools, restaurants and a bar, the Cas’Akea wellness area, the Friday Creole evening, a warm welcome — and 30 years of know-how, with the European Ecolabel obtained in 2015. If you tell me what you are looking for (relaxation, family, romance, dining), I will point you to what suits you best.","de":"Die Stärken, die das Iloha hervorhebt: ein 3-Sterne-Hotel mit Blick auf die Bucht von Saint-Leu, ein tropischer Garten von 3 Hektar, 82 Unterkünfte in 5 Kategorien (vom Standardzimmer bis zum Familienbungalow), zwei Pools, Restaurants und eine Bar, der Wellnessbereich Cas’Akea, der kreolische Abend am Freitag, ein herzlicher Empfang — und 30 Jahre Erfahrung, mit dem europäischen Umweltzeichen seit 2015. Sagen Sie mir, was Sie suchen (Entspannung, Familie, Romantik, Genuss), und ich zeige Ihnen, was am besten passt."}},{"id":"histoire","exemples":{"fr":["depuis quand l'hôtel existe ?","c'est quoi l'histoire de l'hôtel","l'hôtel a quel âge ?","histoire d'iloha","quand l'hôtel a été créé","combien de temps que l'hôtel existe","qui a fondé l'hôtel","l'hôtel a été rénové quand","rénovation des chambres","en quelle année l'hôtel a ouvert","les chambres sont rénovées ?","les logements sont récents ?"],"en":["history of the hotel","how old is the hotel","when did the hotel open","has the hotel been renovated","hotel founded"],"de":["geschichte des hotels","wie alt ist das hotel","wann wurde das hotel eröffnet","wurde das hotel renoviert"]},"mots_ancres":["histoire:5","depuis quand:6","1996:6","renove*:5","renovation*:5","history:5","how old:6","founded:5","renovated:5","geschichte:5","wie alt:6","renoviert:5"],"suggestions":["anniv30","points_forts","etoiles"],"actions":[{"type":"lien","url":"https://www.iloha.fr/actualites/iloha-souffle-ses-30-bougies/","label":{"fr":"Les 30 ans d'Iloha","en":"Iloha's 30 years","de":"30 Jahre Iloha"}}],"topic":{"fr":"Histoire de l'hôtel","en":"Hotel history","de":"Geschichte des Hotels"},"source":"https://www.iloha.fr/actualites/iloha-souffle-ses-30-bougies/ (lu le 27/10/2026)","reponse":{"fr":"L’histoire d’Iloha commence en 1996 : sur un ancien complexe sportif, Iloha Village hôtel ouvre avec 44 hébergements sur 3 hectares. En 2011, l’hôtel devient Iloha Seaview Hotel et s’agrandit : restaurant La Trattoria, espace massage La Cas’Akea, espace Guétali, nouvelle piscine — soit 82 hébergements. En 2015, Iloha obtient l’Ecolabel Européen ; en 2021, rénovation des piscines et agrandissement du Kotémer ; depuis 2023, rénovation de l’ensemble des hébergements. Aujourd’hui, 82 collaborateurs font vivre la maison. L’hôtel a fêté ses 30 ans du 7 au 12 septembre 2026.","en":"Iloha’s story began in 1996: on a former sports complex, Iloha Village hotel opened with 44 accommodations on 3 hectares. In 2011 it became Iloha Seaview Hotel and grew: La Trattoria restaurant, the La Cas’Akea massage area, the Guétali area, a new pool — making 82 accommodations. In 2015 Iloha received the European Ecolabel; in 2021 the pools were renovated and Le Kotémer extended; since 2023 all accommodations have been renovated. Today 82 team members run the hotel. It celebrated its 30th anniversary from 7 to 12 September 2026.","de":"Die Geschichte des Iloha beginnt 1996: auf einem ehemaligen Sportkomplex eröffnet das Iloha Village Hotel mit 44 Unterkünften auf 3 Hektar. 2011 wird es zum Iloha Seaview Hotel und wächst: Restaurant La Trattoria, Massagebereich La Cas’Akea, Guétali-Bereich, neuer Pool — insgesamt 82 Unterkünfte. 2015 erhält das Iloha das europäische Umweltzeichen; 2021 werden die Pools renoviert und das Kotémer erweitert; seit 2023 werden alle Unterkünfte renoviert. Heute sorgen 82 Mitarbeitende für das Haus. Vom 7. bis 12. September 2026 feierte das Hotel sein 30-jähriges Bestehen."}},{"id":"semaine_ouest","exemples":{"fr":["que faire autour de l'hôtel ?","des idées de sorties à saint leu","un programme pour une semaine","itinéraire 7 jours dans l'ouest","que faire quand il pleut ?","on va pas s'ennuyer ?","que visiter dans l'ouest","des idées d'excursions","quoi faire pendant mon séjour","programme de la semaine","que voir à la réunion","que faire à saint leu","idées de balades","jour de pluie que faire","premier voyage à la réunion des conseils","itinéraire pour une semaine","quelles sorties me conseillez-vous","quoi faire le week-end autour de l'hôtel","quoi faire à la réunion en famille","plage de l'hermitage"],"en":["things to do nearby","one week itinerary west reunion","what to do when it rains","what should we visit","day trips","things to do in saint leu"],"de":["was kann man in der umgebung machen?","wochenprogramm","was tun bei regen","ausflugsideen","was kann man in saint leu unternehmen"]},"mots_ancres":["que faire:5","quoi faire:5","itineraire:5","excursion*:5","que voir:5","things to do:5","what to do:5","itinerary:5","day trips:5","ausflug*:5","was tun:4"],"suggestions":["activites","baleines","daypass"],"actions":[{"type":"lien","url":"https://www.iloha.fr/actualites/que-faire-pendant-les-grandes-vacances/","label":{"fr":"Que faire dans l'Ouest","en":"Things to do in the West","de":"Was man im Westen tun kann"}},"tel:reception"],"topic":{"fr":"Que faire dans l'Ouest / programme","en":"Things to do in the West / itinerary","de":"Ausflüge im Westen / Programm"},"source":"https://www.iloha.fr/actualites/que-faire-pendant-les-grandes-vacances/ (lu le 27/10/2026)","reponse":{"fr":"Depuis Saint-Leu, le programme ne manque pas. Une semaine type proposée par l’hôtel : Saint-Leu et Kélonia (centre dédié aux tortues marines, 9h-18h, 9 €) ; le lagon de l’Hermitage ; une activité nautique ; le marché de Saint-Leu (samedi 5h-12h45) et les spécialités locales ; le Piton Maïdo ; le parapente à Saint-Leu ou une pause détente à la Cas’Akea ; balades et plages. Autres idées : plage de Boucan Canot, marché de Saint-Paul (vendredi 6h-15h, samedi 6h-12h), randonnées (Chemin Pavé, Chemin des Anglais, Bassin Vital), Aquarium de La Réunion à Saint-Gilles. Un jour de pluie ? Une journée détente, un soin ou un moment gourmand à l’hôtel. La réception vous conseille et réserve vos activités.","en":"From Saint-Leu there is plenty to do. A sample week suggested by the hotel: Saint-Leu and Kélonia (marine turtle centre, 9 am-6 pm, €9); the Hermitage lagoon; a water activity; Saint-Leu market (Saturday 5 am-12.45 pm) and local specialities; Piton Maïdo; paragliding in Saint-Leu or a relaxing break at Cas’Akea; walks and beaches. Other ideas: Boucan Canot beach, Saint-Paul market (Friday 6 am-3 pm, Saturday 6 am-12 pm), hikes (Chemin Pavé, Chemin des Anglais, Bassin Vital), Reunion Aquarium in Saint-Gilles. A rainy day? A relaxation day, a treatment or a gourmet moment at the hotel. Reception will advise and book your activities.","de":"Von Saint-Leu aus gibt es viel zu erleben. Eine vom Hotel vorgeschlagene Beispielwoche: Saint-Leu und Kélonia (Zentrum für Meeresschildkröten, 9–18 Uhr, 9 €); die Lagune der Hermitage; eine Wasseraktivität; der Markt von Saint-Leu (samstags 5–12.45 Uhr) und lokale Spezialitäten; der Piton Maïdo; Gleitschirmfliegen in Saint-Leu oder eine Auszeit im Cas’Akea; Spaziergänge und Strände. Weitere Ideen: Strand Boucan Canot, Markt von Saint-Paul (freitags 6–15 Uhr, samstags 6–12 Uhr), Wanderungen (Chemin Pavé, Chemin des Anglais, Bassin Vital), Aquarium von La Réunion in Saint-Gilles. Regentag? Ein Entspannungstag, eine Anwendung oder ein kulinarischer Moment im Hotel. Die Rezeption berät und bucht Aktivitäten."}},{"id":"spa_massages","exemples":{"fr":["le coquillage c'est quoi","candle touch","baby soon c'est quoi","absolue douceur des pieds","secret de spa huile","serviettes chaudes parfumees","masage bamboo","massaj","les soins du spa et leurs prix","menu du spa"],"en":[],"de":[]},"mots_ancres":["bamboo:6","bambou:6","coquillage*:6","candle touch:7","terre ciel:7","serenity:6","zen equilibre:6","baby soon:7","mineral:4","semi precieuses:6","secret de spa:6","kerzenmassage:6","muschelmassage:6","bambusmassage:6","massages:4","massage:3","massagen:3"],"suggestions":["spa_combines","spa_esthetique","spa_regles"],"actions":["tel:spa","mail:spa",{"type":"lien","url":"https://www.iloha.fr/bien-etre/","label":{"fr":"Carte des soins","en":"Treatment menu","de":"Behandlungskarte"}}],"service":"Spa Cas’Akea","source":"https://www.iloha.fr/bien-etre/","topic":{"fr":"Spa : massages et tarifs","en":"Spa: massages and prices","de":"Spa: Massagen und Preise"},"reponse":{"fr":"Voici la carte des massages de la Cas’Akéa publiée sur le site (tous avec le rituel des serviettes chaudes parfumées) :\n• 50 min – 90 € : Akéa (modelage du corps entier, huile au choix ou « Secret de Spa »), Le Coquillage by Akéa (coquillages chauffés, nourris d’eau de mer de l’océan Indien), Bamboo (massage rythmé par le bambou), Baby Soon (modelage cocooning pour futures mamans, huile neutre), Minéral aux pierres semi-précieuses (pierres de Madagascar et galets de marbre de Bali), Terre Ciel (visage et crâne, bras et mains, pieds et mi-jambes), Candle Touch (bougie parfumée à la cire végétale qui devient huile chaude), Absolue Douceur des Pieds ;\n• 30 min – 55 € : Serenity (haut du corps : dos, épaules, bras, mains, visage et crâne) et Zen Équilibre (visage et crâne).\nSur réservation, tous les jours de 9h à 19h :","en":"Here is the Cas’Akéa massage menu published on the website (all include the scented hot-towel ritual):\n• 50 min – €90: Akéa (full-body massage, oil of your choice or “Secret de Spa”), Le Coquillage by Akéa (heated shells nourished with Indian Ocean seawater), Bamboo (massage with bamboo), Baby Soon (cocooning massage for expectant mothers, neutral oil), Mineral with semi-precious stones (stones from Madagascar and polished marble pebbles from Bali), Terre Ciel (face and scalp, arms and hands, feet and lower legs), Candle Touch (scented candle with vegetable wax that becomes warm massage oil), Absolue Douceur des Pieds (foot treatment);\n• 30 min – €55: Serenity (upper body: back, shoulders, arms, hands, face and scalp) and Zen Équilibre (face and scalp).\nBy reservation, every day from 9am to 7pm:","de":"Die auf der Website veröffentlichte Massagekarte der Cas’Akéa (alle mit dem Ritual der warmen, duftenden Handtücher):\n• 50 Min. – 90 €: Akéa (Ganzkörpermassage, Öl nach Wahl oder „Secret de Spa“), Le Coquillage by Akéa (erwärmte Muscheln, mit Meerwasser des Indischen Ozeans genährt), Bamboo (Massage mit Bambus), Baby Soon (Wohlfühlmassage für werdende Mütter, neutrales Öl), Mineral mit Halbedelsteinen (Steine aus Madagaskar und polierte Marmorkiesel aus Bali), Terre Ciel (Gesicht und Kopfhaut, Arme und Hände, Füße und Unterschenkel), Candle Touch (Duftkerze mit Pflanzenwachs, das zu warmem Massageöl wird), Absolue Douceur des Pieds (Fußbehandlung);\n• 30 Min. – 55 €: Serenity (Oberkörper: Rücken, Schultern, Arme, Hände, Gesicht und Kopfhaut) und Zen Équilibre (Gesicht und Kopfhaut).\nNach Reservierung, täglich von 9 bis 19 Uhr:"},"statut":"valide","bonus":1},{"id":"spa_combines","exemples":{"fr":["esprit de spa","relax coco","bain au lait de coco","bain de fleurs","bain de fleurs en couple","rituel jeunes mariés spa","soin pour les jeunes mariés","spa en amoureux tarif","soin duo prix","carte de 5 soins","carte 10 soins","carte abonnement spa","carte d'abonnement","combien coute la carte de 10 soins","forfait 3 soins","un soin par mois","y a-t-il des forfaits au spa","des cartes de soins ?","le forfait trois soins est inclus dans la carte ?","durée de validité de la carte de soins","carte de soins valable combien de temps","forfait spa pas cher","coupe de champagne spa","champagne dans le bain","cocktail de fruits frais spa","combiné de soins","combinés spa","soin relax coco c'est pour les enceintes ?","cado spa jeunes mariés","abo spa","vous avez des forfaits de soins ?"],"en":["spa for two","flower bath","coconut milk bath","honeymoon spa ritual","spa subscription card","10 treatment card","how much is the 5 treatment card","spa packages","package of 3 treatments","how long is the spa card valid","champagne bath for couples"],"de":["Blumenbad","Kokosmilchbad","Spa für Frischvermählte","Abokarte Spa","Karte mit 10 Anwendungen","Spa Paket 3 Anwendungen","wie lange ist die Spakarte gültig","Spa-Pakete"]},"mots_ancres":["esprit de spa:8","relax coco:8","bain de fleurs:7","lait de coco:6","carte de 5:8","carte de 10:8","cartes d abonnement:8","carte d abonnement:8","forfait 3 soins:9","abonnement spa:7","spa abo:6","abokarte:7","blumenbad:7","kokosmilchbad:7","frischvermahlte*:4"],"suggestions":["spa_massages","noces","cadeau"],"actions":["tel:spa","mail:spa"],"service":"Spa Cas’Akea","source":"https://www.iloha.fr/bien-etre/","topic":{"fr":"Spa : combinés, forfaits et cartes d’abonnement","en":"Spa: combined treatments, packages and cards","de":"Spa: Kombinationen, Pakete und Abokarten"},"reponse":{"fr":"À la Cas’Akéa, les soins se combinent et se partagent :\n• Esprit de Spa (« le bonheur se partage à deux ») : modelage du corps entier et bain de fleurs, 50 min – 180 € pour 2 personnes ;\n• Relax Coco : massage relaxant personnalisé (45 min) suivi d’un bain au lait de coco, 1h20 – 130 € (non recommandé aux femmes enceintes) ;\n• Rituel des Jeunes mariés : un soin de 50 min au choix, cocktail de fruits frais ou coupe de champagne à partager dans un bain de fleurs, 1h20 – 220 € pour le couple (cadeau AKEA aux jeunes mariés) ;\n• Forfait 3 soins (1 soin par mois) : 225 € ;\n• Cartes d’abonnement nominatives valables 1 an, à choisir parmi les soins de 50 min : carte de 5 soins 400 €, carte de 10 soins 760 € (le forfait 3 soins n’y est pas inclus).\nPour réserver :","en":"At the Cas’Akéa, treatments can be combined and shared:\n• Esprit de Spa (“happiness is shared by two”): full-body massage and flower bath, 50 min – €180 for 2 people;\n• Relax Coco: personalised relaxing massage (45 min) followed by a coconut-milk bath, 1h20 – €130 (not recommended for pregnant women);\n• Newlyweds’ Ritual: a 50-min treatment of your choice, fresh-fruit cocktail or glass of champagne to share in a flower bath, 1h20 – €220 for the couple (an AKEA gift for newlyweds);\n• Package of 3 treatments (1 per month): €225;\n• Named subscription cards valid for 1 year, to choose among the 50-min treatments: 5-treatment card €400, 10-treatment card €760 (the 3-treatment package is not included).\nTo book:","de":"In der Cas’Akéa lassen sich Anwendungen kombinieren und teilen:\n• Esprit de Spa („Glück teilt man zu zweit“): Ganzkörpermassage und Blumenbad, 50 Min. – 180 € für 2 Personen;\n• Relax Coco: individuelle Entspannungsmassage (45 Min.) mit anschließendem Kokosmilchbad, 1 Std. 20 – 130 € (für Schwangere nicht empfohlen);\n• Ritual für Frischvermählte: eine Anwendung nach Wahl (50 Min.), Fruchtcocktail oder Glas Champagner im Blumenbad, 1 Std. 20 – 220 € für das Paar (ein AKEA-Geschenk für Frischvermählte);\n• Paket mit 3 Anwendungen (1 pro Monat): 225 €;\n• Namentliche Abokarten, 1 Jahr gültig, wählbar unter den 50-Min.-Anwendungen: Karte mit 5 Anwendungen 400 €, mit 10 Anwendungen 760 € (das 3er-Paket ist nicht enthalten).\nReservierung:"},"statut":"valide","bonus":1},{"id":"spa_esthetique","exemples":{"fr":["manucure possible ?","vous faites des manucures","prix manucure","pedicure au spa","pédicure semi permanent","vernis semi-permanent","pose de vernis","soin des mains","soin des pieds","beauté des pieds","caresse des mains","soin du visage","soin visage bio","facial","soin visage prix","sublissime","visage de velours","soins esthétiques","esthetique spa","gommage","gommage au sucre","soin avec des produits bio","un soin bio ?","soin visage 1h20","combien coute un soin du visage","vous faites les ongles ?","ongles","vernis classique ou semi permanent","prix pédicure","pédicure et manicure","soin pour le teint","teint lumineux","prix soin visage","soin du visage 110","esthéticienne","épilation ?","maquillage ?"],"en":["do you do manicures","pedicure price","facial treatment","organic facial","gel nails","semi-permanent polish","hand treatment","foot treatment","beauty treatments at the spa","how much is a facial"],"de":["Maniküre möglich","Pediküre Preis","Gesichtsbehandlung","Bio Gesichtsbehandlung","Nägel lackieren","Schönheitsbehandlungen","Handpflege","Fußpflege","was kostet eine Gesichtsbehandlung"]},"mots_ancres":["manucure:7","pedicure:7","maniküre:7","pediküre:7","manicure:7","pedicure:5","vernis:6","semi permanent:7","caresse des mains:8","beaute des pieds:8","sublissime:8","visage de velours:8","soin du visage:6","soin visage:6","facial:5","gesichtsbehandlung:6","ongles:5","gommage:5","esthetique*:3"],"suggestions":["spa_massages","spa_combines","spa_regles"],"actions":["tel:spa","mail:spa"],"service":"Spa Cas’Akea","source":"https://www.iloha.fr/bien-etre/","topic":{"fr":"Spa : soins esthétiques (mains, pieds, visage)","en":"Spa: beauty treatments (hands, feet, face)","de":"Spa: Schönheitsanwendungen (Hände, Füße, Gesicht)"},"reponse":{"fr":"Les soins esthétiques de la Cas’Akéa :\n• Akéa Caresse des Mains (50 min) : gommage aux cristaux de sucre roux « péi », modelage hydratant, manucure avec vernis classique 55 € ou semi-permanent 70 € ;\n• Akéa Beauté des Pieds (1h20) : bain de pieds, gommage, modelage relaxant, pédicure avec vernis classique 75 € ou semi-permanent 90 € ;\n• Sublissime Bio Akéa Visage (1h20) : soin du visage bio personnalisé avec modelage, 110 € ;\n• Bio Akéa Visage de Velours (50 min) : soin complet pour un teint lumineux avec actifs bio hydratants, 90 €.\nSur réservation :","en":"The Cas’Akéa beauty treatments:\n• Akéa Caresse des Mains (50 min): brown-sugar crystal scrub (local “péi”), moisturising massage, manicure with classic polish €55 or semi-permanent €70;\n• Akéa Beauté des Pieds (1h20): foot bath, scrub, relaxing massage, pedicure with classic polish €75 or semi-permanent €90;\n• Sublissime Bio Akéa Visage (1h20): personalised organic facial with massage, €110;\n• Bio Akéa Visage de Velours (50 min): complete treatment for a radiant complexion with organic moisturising actives, €90.\nBy reservation:","de":"Die Schönheitsanwendungen der Cas’Akéa:\n• Akéa Caresse des Mains (50 Min.): Peeling mit braunen Zuckerkristallen („péi“), feuchtigkeitsspendende Massage, Maniküre mit klassischem Lack 55 € oder Semi-Permanent 70 €;\n• Akéa Beauté des Pieds (1 Std. 20): Fußbad, Peeling, Entspannungsmassage, Pediküre mit klassischem Lack 75 € oder Semi-Permanent 90 €;\n• Sublissime Bio Akéa Visage (1 Std. 20): individuelle Bio-Gesichtsbehandlung mit Massage, 110 €;\n• Bio Akéa Visage de Velours (50 Min.): Komplettbehandlung für einen strahlenden Teint mit feuchtigkeitsspendenden Bio-Wirkstoffen, 90 €.\nNach Reservierung:"},"statut":"valide","bonus":1},{"id":"spa_regles","exemples":{"fr":["annuler un soin au spa","frais d'annulation spa","annulation spa 24h","annulation de dernière minute spa","combien de frais si j'annule le spa","retard rdv spa","arriver en retard au spa","le retard est décompté ?","arriver avant le soin","je dois arriver combien de temps avant","enceinte spa","kiné","ostéo","soin remboursé ?","transférer un soin à quelqu'un","soin cessible","soin remboursable","offrir mon soin à un ami","spa interdit aux mineurs","spa ado","mon fils de 15 ans peut aller au spa","enfant au spa","age minimum spa","spa réservé aux adultes ?","le spa est ouvert aux extérieurs","spa non résident","réserver soin avec la chambre","conditions du spa","règles du spa","politique d'annulation spa","puis-je annuler 3h avant mon soin"],"en":["cancel a spa treatment","spa cancellation fee","can I give my treatment to someone else","is the spa adults only","minimum age for the spa","can children go to the spa","spa terms and conditions"],"de":["Spa Termin stornieren","Stornogebühr Spa","Spa ab welchem Alter","Kinder im Spa","Spa nur für Erwachsene","Spa Bedingungen"]},"mots_ancres":["annuler soin:7","annulation soin:7","annulation spa:8","annuler massage:7","annulation massage:7","retard massage:7","retard spa:7","non cessible:7","therapeutique*:7","medicalise*:7","contre indication*:6","mineur*:3","cancel spa:7","cancel massage:7","spa late:6"],"suggestions":["spa","spa_massages","spa_pmr"],"actions":["tel:spa","mail:spa"],"service":"Spa Cas’Akea","source":"https://www.iloha.fr/bien-etre/ ; https://www.iloha.fr/questions-frequentes/","topic":{"fr":"Spa : conditions, annulation, santé, majeurs","en":"Spa: terms, cancellation, health, adults only","de":"Spa: Bedingungen, Stornierung, Gesundheit, nur Erwachsene"},"reponse":{"fr":"Les informations pratiques publiées par la Cas’Akéa :\n• L’heure de réservation est l’heure de début du soin : mieux vaut arriver quelques minutes avant. Un retard est imputé sur la durée du soin, voire peut entraîner une annulation s’il est trop important, par respect du planning des autres clients ;\n• Annulation sans frais si vous prévenez le spa 24 h avant ; au-delà, 50 % du montant de la réservation sont facturés (dernière minute, moins de 4 h : 50 %) ;\n• À la réservation, merci de signaler tout problème de santé ou une grossesse ;\n• Un soin est personnel, non cessible et non remboursable ;\n• Les massages sont des modelages de bien-être et de beauté, non thérapeutiques et non médicalisés ;\n• La Cas’Akéa est réservée aux personnes majeures, ouverte aux non-résidents, tous les jours de 9h à 19h. Si vous séjournez à l’hôtel, il est conseillé de réserver vos soins en même temps que votre hébergement.\nContact :","en":"Practical information published by the Cas’Akéa:\n• Your booking time is the time your treatment starts: it is best to arrive a few minutes early. Lateness is deducted from the treatment time and may lead to cancellation if too long, out of respect for other guests’ schedules;\n• Free cancellation if you notify the spa 24 hours ahead; after that, 50% of the booking amount is charged (last-minute, under 4 hours: 50%);\n• When booking, please mention any health issue or pregnancy;\n• A treatment is personal, non-transferable and non-refundable;\n• Massages are wellness and beauty treatments, non-therapeutic and non-medical;\n• The Cas’Akéa is for adults only, open to non-residents, every day from 9am to 7pm. If you stay at the hotel, it is recommended to book treatments together with your accommodation.\nContact:","de":"Praktische Informationen der Cas’Akéa:\n• Die Reservierungszeit ist der Beginn der Anwendung: kommen Sie am besten einige Minuten früher. Verspätungen gehen von der Behandlungszeit ab und können bei großer Verspätung zur Absage führen, aus Rücksicht auf die anderen Gäste;\n• Kostenlose Stornierung, wenn Sie das Spa 24 Stunden vorher informieren; danach werden 50 % des Reservierungsbetrags berechnet (kurzfristig, unter 4 Stunden: 50 %);\n• Bitte teilen Sie bei der Reservierung gesundheitliche Probleme oder eine Schwangerschaft mit;\n• Eine Anwendung ist persönlich, nicht übertragbar und nicht erstattungsfähig;\n• Die Massagen sind Wellness- und Schönheitsanwendungen, nicht therapeutisch und nicht medizinisch;\n• Die Cas’Akéa ist nur für Erwachsene, auch für externe Gäste, täglich von 9 bis 19 Uhr geöffnet. Wenn Sie im Hotel wohnen, empfiehlt sich die Buchung der Anwendungen zusammen mit der Unterkunft.\nKontakt:"},"statut":"valide","bonus":1},{"id":"spa_univers","exemples":{"fr":["quelles senteurs au spa","ça sent quoi au spa","parfum du spa","ylang ylang","vétiver","huile de coco spa","produits akea","vous vendez les produits du spa","boutique du spa","acheter des produits akea","cosmétiques akéa","il y a une boutique à l'hôtel","cabine duo","bain double","baignoire duo","combien de cabines au spa","à quoi ressemble le spa","ambiance du spa","description du spa","le spa c'est comment","présentation cas akea","qu'est-ce que la cas akea","univers akea","marque akea","savon akea","bougie akea","produits naturels spa","parfum signature","senteurs de l'ocean indien","ramener des produits du spa"],"en":["what does the spa smell like","spa products to buy","do you sell Akea products","double bath spa","spa shop","what is the Cas Akea","spa atmosphere","ylang ylang vanilla vetiver"],"de":["Spa Produkte kaufen","Akea Produkte","Spa Boutique","Düfte im Spa","Doppelbad Spa","wie sieht das Spa aus","Ylang Ylang Vanille"]},"mots_ancres":["ylang*:7","vetiver:7","produits akea:8","collection akea:8","boutique:3","bain double:7","senteur*:5","akea produkte:7","doppelbad:7","cabine duo:6","salle de massage:6"],"suggestions":["spa","spa_massages","cadeau"],"actions":["tel:spa",{"type":"lien","url":"https://offrir.iloha.fr/","label":{"fr":"Coffrets cadeaux","en":"Gift boxes","de":"Geschenkboxen"}}],"service":"Spa Cas’Akea","source":"https://www.iloha.fr/bien-etre/ ; https://www.iloha.fr/actualites/le-grand-boucan/","topic":{"fr":"Spa : l’espace, les senteurs et les produits Akéa","en":"Spa: the space, scents and Akéa products","de":"Spa: Räume, Düfte und Akéa-Produkte"},"reponse":{"fr":"La Cas’Akéa est un univers feutré, raffiné et parfumé qui réunit les trésors naturels de l’océan Indien : senteurs de coco, ylang-ylang de Mayotte, vanille et vétiver de La Réunion. Elle comprend une salle de massage individuelle et duo avec bain double, un espace de soins esthétiques et une boutique. Vous y retrouvez la collection de produits Akéa aux senteurs de l’océan Indien, à offrir ou à ramener chez vous. Les soins existent aussi en coffret cadeau (réservé aux personnes majeures).","en":"The Cas’Akéa is a hushed, refined and fragrant world gathering the natural treasures of the Indian Ocean: coconut, ylang-ylang from Mayotte, vanilla and vetiver from La Réunion. It includes an individual and duo massage room with a double bath, a beauty-treatment area and a shop. You will find the Akéa product collection with Indian Ocean scents, to give or take home. Treatments are also available as gift boxes (adults only).","de":"Die Cas’Akéa ist eine gedämpfte, edle und duftende Welt, die die Naturschätze des Indischen Ozeans vereint: Kokos, Ylang-Ylang aus Mayotte, Vanille und Vetiver aus La Réunion. Sie umfasst einen Massageraum für Einzel- und Duo-Anwendungen mit Doppelbad, einen Bereich für Schönheitsanwendungen und eine Boutique. Dort finden Sie die Akéa-Produktkollektion mit Düften des Indischen Ozeans, zum Verschenken oder Mitnehmen. Die Anwendungen gibt es auch als Geschenkbox (nur für Erwachsene)."},"statut":"valide","bonus":1},{"id":"brunchs_2026","exemples":{"fr":["brunch de pâques","brunch paques","il y a un brunch pour pâques ?","brunch fête des mères","brunch fete des meres","brunch fête des pères","brunch du 14 juillet","brunch fête nationale","brunch saint valentin","brunch de la saint-valentin","combien coute le brunch","prix du brunch","tarif brunch enfant","brunch à quelle heure","brunch à partir de quelle heure","vous faites des brunchs ?","y a-t-il un brunch le dimanche","brunch dimanche","brunch tous les dimanches ?","quand est le prochain brunch","dates des brunchs","bar à champagne brunch","champagne à volonté","brunch avec champagne","menu du brunch","que mange-t-on au brunch","brunch 105 euros","brunch enfant 65","réserver un brunch","brunch fete des peres 2026","brunch 21 juin","brunch 31 mai","brunch 5 avril","brunch lundi de pâques","brunch 15 février","brunch de fête","brunch pour la fête des mamans","brunch papa","bruntch","brunch fete nationale 2026","brunch de la fête des mères"],"en":["do you have an easter brunch","mother’s day brunch","father’s day brunch","bastille day brunch","valentine’s day brunch","how much is the brunch","when is the next brunch","brunch price for children","what time does the brunch start","do you do brunch on sundays"],"de":["Osterbrunch","Muttertag Brunch","Vatertag Brunch","Brunch am 14. Juli","Valentinstag Brunch","was kostet der Brunch","wann ist der nächste Brunch","Brunch Kinderpreis","Sonntagsbrunch"]},"mots_ancres":["brunch*:7","bruntch:6","bar a champagne:6","osterbrunch:7","saint valentin:4"],"suggestions":["buffet","newsletter","reveillon"],"actions":["tel:resto","mail:resto",{"type":"lien","url":"https://www.iloha.fr/newsletter/","label":{"fr":"Newsletter","en":"Newsletter","de":"Newsletter"}}],"service":"Restauration","source":"https://www.iloha.fr/actualites/ (brunchs Pâques, Saint-Valentin, fête des mères, fête des pères, fête nationale 2026)","topic":{"fr":"Brunchs de fête au Kotémer","en":"Festive brunches at the Kotémer","de":"Festtagsbrunchs im Kotémer"},"reponse":{"fr":"Tout au long de l’année, le Kotémer propose des brunchs aux dates des grandes fêtes, à partir de 11h30, avec bar à champagne et buffet gourmand (foie gras, tataki de thon, cocktail d’ananas Victoria et crevettes, carry de langouste, brochette de légine et camarons, desserts maison…). Pour 2026, l’hôtel a publié :\n• Saint-Valentin : dimanche 15 février – 105 € par adulte, 65 € par enfant (moins de 12 ans) ;\n• Pâques : dimanche 5 et lundi 6 avril – 105 € / 65 € (enfant de 3 à 12 ans) ;\n• Fête des mères : dimanche 31 mai – 105 € / 65 € ;\n• Fête des pères : dimanche 21 juin – 105 € / 65 € ;\n• Fête nationale : mardi 14 juillet – 105 € par adulte, 65 € par enfant.\nPlaces limitées, sur réservation uniquement (téléphone 0262 34 89 89 ou restaurant@iloha.fr ; pour la Saint-Valentin : hotel@iloha.fr). Ce sont les brunchs 2026 publiés ; pour les prochains, la réception vous renseigne :","en":"Throughout the year, the Kotémer offers brunches on major holidays, from 11:30am, with a champagne bar and a generous buffet (foie gras, tuna tataki, Victoria pineapple and prawn cocktail, lobster curry, butterfish and shrimp skewers, homemade desserts…). For 2026 the hotel published:\n• Valentine’s Day: Sunday 15 February – €105 per adult, €65 per child (under 12);\n• Easter: Sunday 5 and Monday 6 April – €105 / €65 (child aged 3–12);\n• Mother’s Day: Sunday 31 May – €105 / €65;\n• Father’s Day: Sunday 21 June – €105 / €65;\n• Bastille Day: Tuesday 14 July – €105 per adult, €65 per child.\nLimited places, by reservation only (phone 0262 34 89 89 or restaurant@iloha.fr; for Valentine’s Day: hotel@iloha.fr). These are the published 2026 brunches; for the next ones, reception will advise:","de":"Das ganze Jahr über bietet das Kotémer Brunchs zu den großen Festtagen an, ab 11:30 Uhr, mit Champagnerbar und reichhaltigem Buffet (Foie gras, Thunfisch-Tataki, Ananas-Garnelen-Cocktail, Langusten-Curry, Fischspieße, hausgemachte Desserts …). Für 2026 hat das Hotel veröffentlicht:\n• Valentinstag: Sonntag, 15. Februar – 105 € pro Erwachsenem, 65 € pro Kind (unter 12 Jahren);\n• Ostern: Sonntag 5. und Montag 6. April – 105 € / 65 € (Kinder von 3 bis 12 Jahren);\n• Muttertag: Sonntag, 31. Mai – 105 € / 65 €;\n• Vatertag: Sonntag, 21. Juni – 105 € / 65 €;\n• Nationalfeiertag: Dienstag, 14. Juli – 105 € pro Erwachsenem, 65 € pro Kind.\nBegrenzte Plätze, nur mit Reservierung (Telefon 0262 34 89 89 oder restaurant@iloha.fr; Valentinstag: hotel@iloha.fr). Das sind die veröffentlichten Brunchs 2026; zu den nächsten berät die Rezeption:"},"statut":"valide","bonus":0.7},{"id":"fetes_2025_precedent","exemples":{"fr":["le réveillon de l'an dernier c'était quoi","programme des fêtes de l'année dernière","prix du réveillon de noël","combien coûte le réveillon","réveillon 24 décembre prix","réveillon de la saint sylvestre prix","menu du réveillon","brunch du 25 décembre","brunch du 1er janvier","brunch nouvel an","brunch de noël","soirée du 31 décembre","dj à minuit","groupe so ouate","nicolas payet","le père noël passe à l'hôtel","salon grand large","garderie pendant le réveillon","jeux pour enfants pendant la soirée de noël","tarif enfant réveillon","réveillon 140 euros","réveillon 220","saint sylvestre sous les étoiles","noël sous les tropiques","nouvel an à l'hôtel","fêter le nouvel an","repas du jour de l'an","réservation réveillon","réveillon par mail"],"en":["what was the christmas eve dinner last year","new year’s eve price","christmas eve dinner price","is there a new year’s eve party","santa claus for children","christmas day brunch price","new year brunch"],"de":["Silvesterabend Preis","Weihnachtsessen Preis","Weihnachtsmann für Kinder","Neujahrsbrunch","Silvester Programm vom letzten Jahr"]},"mots_ancres":["grand large:7","so ouate:7","nicolas payet:7","pere noel:5","sous les tropiques:6","sous les etoiles:6","saint sylvestre:5","jour de l an:5","1er janvier:5","brunch du 25:7"],"suggestions":["noel","reveillon","newsletter"],"actions":["tel:reception","mail:reception"],"service":"Restauration","source":"https://www.iloha.fr/actualites/la-magie-des-fetes/","topic":{"fr":"Les fêtes de fin d’année : programme de l’an dernier","en":"Year-end festivities: last year’s programme","de":"Jahresendfeiern: Programm des Vorjahres"},"reponse":{"fr":"Le programme 2026 des fêtes n’est pas encore publié (la réception vous le communiquera). À titre d’exemple, voici ce que l’hôtel avait proposé pour les fêtes 2025 :\n• Réveillon de Noël sous les Tropiques (24 décembre) : menu complet aux saveurs des fêtes, soirée en musique avec le groupe So Ouate, passage du père Noël pour les enfants des hôtes résidents, salon « Grand Large » avec jeux et activités sous surveillance – 140 € par adulte, 70 € par enfant (moins de 12 ans) ;\n• Brunch du 25 décembre : 95 € par adulte, 65 € par enfant ;\n• Réveillon de la Saint-Sylvestre sous les Étoiles (31 décembre) : musique avec le groupe Nicolas Payet et DJ à partir de minuit – 220 € par adulte, 70 € par enfant ;\n• Brunch du 1er janvier : 105 € par adulte, 65 € par enfant.\nRéservation indispensable par e-mail à hotel@iloha.fr. Ces éléments sont ceux de l’an dernier, à titre indicatif :","en":"The 2026 festive programme has not been published yet (reception will let you know). As an example, here is what the hotel offered for the 2025 festivities:\n• Christmas Eve “Under the Tropics” (24 December): full festive menu, live music by the group So Ouate, a visit from Santa for the children of resident guests, the “Grand Large” lounge with supervised games and activities – €140 per adult, €70 per child (under 12);\n• 25 December brunch: €95 per adult, €65 per child;\n• New Year’s Eve “Under the Stars” (31 December): music by the group Nicolas Payet and DJ from midnight – €220 per adult, €70 per child;\n• 1 January brunch: €105 per adult, €65 per child.\nReservation essential by e-mail at hotel@iloha.fr. These are last year’s details, for information only:","de":"Das Festprogramm 2026 ist noch nicht veröffentlicht (die Rezeption teilt es Ihnen mit). Als Beispiel das Angebot des Hotels für die Feiertage 2025:\n• Weihnachtsabend „unter den Tropen“ (24. Dezember): komplettes Festmenü, Livemusik der Gruppe So Ouate, Besuch des Weihnachtsmanns für die Kinder der Hausgäste, Salon „Grand Large“ mit beaufsichtigten Spielen und Aktivitäten – 140 € pro Erwachsenem, 70 € pro Kind (unter 12 Jahren);\n• Brunch am 25. Dezember: 95 € pro Erwachsenem, 65 € pro Kind;\n• Silvester „unter den Sternen“ (31. Dezember): Musik der Gruppe Nicolas Payet und DJ ab Mitternacht – 220 € pro Erwachsenem, 70 € pro Kind;\n• Brunch am 1. Januar: 105 € pro Erwachsenem, 65 € pro Kind.\nReservierung unbedingt per E-Mail an hotel@iloha.fr. Dies sind die Angaben des Vorjahres, nur zur Information:"},"statut":"valide","bonus":0.7},{"id":"carte_kotemer","exemples":{"fr":["la carte du kotémer","carte du restaurant","menu du restaurant","que propose le kotémer","qu'est-ce qu'on mange au restaurant de l'hôtel","plats du restaurant","entrées du kotémer","desserts du restaurant","vous avez du poisson ?","du poisson au menu ?","vous servez de la viande","du cari au menu","rougail saucisse","cari poulet","cari de langouste","langouste au restaurant","zourite grillé","légine","tataki de thon","foie gras au menu","moelleux au chocolat","baba au rhum","quel est le chef","qui est le chef","chef kevene marimoutou","chef de cuisine","kévène marimoutou","cuisine créole au restaurant","cuisine locale","produits locaux au restaurant","viande de bœuf simmental","poulet bio du tampon","œufs de la ferme mon repos","nouvelle carte","la carte a changé ?","menu du jour","plat du jour","plat du jour prix","formule du midi","formule déjeuner en semaine","formule midi 24","formule midi 29","le menu change chaque semaine ?","carte renouvelée","cuisine inventive et métissée"],"en":["what is on the restaurant menu","who is the chef","do you serve fish","do you have lobster","lunch set menu price","dish of the day price","is the menu local","what desserts do you have","creole curry on the menu"],"de":["Speisekarte des Restaurants","wer ist der Küchenchef","gibt es Fisch","Mittagsmenü Preis","Tagesgericht Preis","Langusten Curry","welche Desserts gibt es","kreolische Küche"]},"mots_ancres":["la carte:3","carte du kotemer:8","chef:5","kevene:7","marimoutou:7","cari*:4","rougail:5","langouste:5","zourite:6","legine:6","tataki:6","plat du jour:6","formule du midi:6","mittagsmenu:6","tagesgericht:6","kuchenchef:6","speisekarte:5","poisson:3","fisch:3","viande:3"],"suggestions":["restaurants","buffet","horaires"],"actions":["tel:resto","mail:resto",{"type":"lien","url":"https://www.iloha.fr/restauration/","label":{"fr":"Restauration","en":"Dining","de":"Restaurants"}}],"service":"Restauration","source":"https://www.iloha.fr/actualites/
