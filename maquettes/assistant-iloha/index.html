/* Styles communs. Les couleurs / polices viennent des variables de thème (build.js). Spéc UX : ../UX-WIDGET-SPEC.md */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;font-family:var(--font-body);color:var(--ink);background:#111;min-height:100%;line-height:1.55}
a{color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
/* ---- fond = vraie page d'accueil de l'hôtel (capture) ---- */
.site-bg{position:fixed;inset:0;background:var(--fond-ordi) center top/cover no-repeat}
.apercu{position:fixed;left:16px;bottom:16px;z-index:30;display:flex;align-items:center;gap:6px;background:rgba(20,20,20,.78);color:#fff;font:600 12px/1.2 var(--font-body);padding:7px 8px 7px 13px;border-radius:999px;backdrop-filter:blur(6px);box-shadow:0 6px 20px -8px rgba(0,0,0,.6)}
.apercu button{width:24px;height:24px;border:0;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;cursor:pointer;font-size:15px;line-height:1}
.apercu.hide{display:none}
/* ---- bulle (lanceur) : même endroit pour ouvrir ET fermer ---- */
#bubble{--nav:0px;position:fixed;right:max(20px,env(safe-area-inset-right));bottom:calc(max(20px,env(safe-area-inset-bottom)) + var(--nav));z-index:60;width:60px;height:60px;border-radius:50%;border:0;cursor:pointer;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 12px 30px -8px rgba(0,0,0,.55);transition:transform .2s,opacity .2s}
#bubble:hover{transform:scale(1.06)}
#bubble>span.ic-open,#bubble>span.ic-close{grid-area:1/1;display:grid;place-items:center;transition:transform .25s,opacity .2s}
#bubble svg{width:28px;height:28px}
#bubble .ic-close{opacity:0;transform:rotate(-90deg) scale(.6)}
#bubble.on .ic-open{opacity:0;transform:rotate(90deg) scale(.6)}
#bubble.on .ic-close{opacity:1;transform:none}
#bubble.on .dot{display:none}
#bubble .dot{position:absolute;top:5px;right:5px;width:12px;height:12px;border-radius:50%;background:#2fd36e;border:2px solid var(--accent)}
#bubble:not(.on)::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:ping 3s ease-out 2s 3}
@keyframes ping{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.6);opacity:0}}
#teaser{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:calc(max(20px,env(safe-area-inset-bottom)) + var(--nav,0px) + 74px);z-index:59;max-width:min(290px,calc(100vw - 40px));background:#fff;color:#1b1b1b;border-radius:18px 18px 4px 18px;padding:13px 38px 13px 15px;box-shadow:0 18px 44px -14px rgba(0,0,0,.45);animation:pop .45s cubic-bezier(.2,1.4,.4,1);transition:opacity .25s,transform .25s}
#teaser button.o{all:unset;cursor:pointer;display:block}
#teaser b{display:block;font:700 14.5px var(--font-body)}
#teaser span{font-size:13px;color:#555}
#teaser button.x{position:absolute;top:5px;right:5px;width:30px;height:30px;border:0;background:none;font-size:18px;cursor:pointer;color:#666;border-radius:50%}
#teaser.hide{opacity:0;pointer-events:none;transform:translateY(8px) scale(.95)}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.9)}to{opacity:1;transform:none}}
#veil{display:none}
/* ---- fenêtre ordi : panneau compact, la page reste utilisable ---- */
#chat{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:calc(max(20px,env(safe-area-inset-bottom)) + 74px);z-index:58;width:390px;max-width:calc(100vw - 40px);height:min(640px,calc(100vh - 120px));display:flex;flex-direction:column;background:var(--chat-bg);color:var(--chat-ink);border-radius:var(--r-chat);box-shadow:0 24px 70px -18px rgba(0,0,0,.6),0 0 0 1px var(--chat-line);overflow:hidden;transform-origin:calc(100% - 30px) calc(100% + 40px);animation:open .3s cubic-bezier(.2,1.1,.3,1)}
#chat[hidden]{display:none}
#chat.wide{width:min(600px,calc(100vw - 40px));height:calc(100vh - 120px)}
@keyframes open{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.grip{display:none}
.ch-head{display:flex;align-items:center;gap:10px;padding:12px 10px 12px 14px;background:var(--head-bg);color:var(--head-ink);position:relative;flex:none}
.ch-head .av{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.ch-head .av svg{width:22px;height:22px}
.ch-head .tt{flex:1;min-width:0}
.ch-head .nm{font:var(--h3-font);font-size:16px;line-height:1.15;overflow-wrap:anywhere}
.ch-head .st{font-size:12px;opacity:.9;display:flex;align-items:center;gap:6px;margin-top:2px}
.ch-head .st::before{content:"";width:8px;height:8px;border-radius:50%;background:#2fd36e;flex:none}
.ib{width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:var(--head-ink);cursor:pointer;display:grid;place-items:center;font-size:18px;flex:none;opacity:.85}
.ib:hover{background:color-mix(in srgb,var(--head-ink) 16%,transparent);opacity:1}
.ib svg{width:18px;height:18px}
.ib.close{width:40px;height:40px;background:color-mix(in srgb,var(--head-ink) 14%,transparent);opacity:1}
.ib.close svg{width:20px;height:20px}
.langs{display:flex;gap:2px;background:color-mix(in srgb,var(--head-ink) 12%,transparent);padding:3px;border-radius:999px}
.lg{border:0;background:none;color:var(--head-ink);font:700 11px var(--font-body);padding:6px 8px;border-radius:999px;cursor:pointer}
.lg[aria-pressed=true]{background:var(--head-ink);color:var(--head-bg)}
#log{flex:1;min-height:0;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain;background:var(--log-bg)}
#log>:first-child{margin-top:auto}
#chat.fresh .sugg-wrap{display:none}
.msg{display:flex;gap:8px;max-width:100%;animation:in .28s cubic-bezier(.2,1,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.user{justify-content:flex-end}
.msg.user .b{background:var(--user-bg);color:var(--user-ink);padding:9px 14px;border-radius:18px 18px 4px 18px;max-width:82%;overflow-wrap:anywhere;font-size:15px}
.msg.bot .av{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);flex:none;display:grid;place-items:center;margin-top:2px}
.msg.bot .av svg{width:16px;height:16px}
.msg.bot.cont .av{visibility:hidden}
.col{min-width:0;display:flex;flex-direction:column;gap:7px;align-items:flex-start;max-width:calc(100% - 36px)}
.card{background:var(--bot-bg);color:var(--bot-ink);padding:11px 14px;border-radius:4px 18px 18px 18px;font-size:15px;box-shadow:0 1px 0 var(--chat-line);overflow-wrap:anywhere}
.card p{margin:0 0 .55em}.card p:last-child{margin-bottom:0}
.card-t{font:var(--h3-font);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text);margin-bottom:5px}
.cartel{margin-top:9px;font-size:12.5px;padding:8px 10px;border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:0 8px 8px 0}
.flag{margin-top:9px;font-size:12px;opacity:.85;font-style:italic}
.intro{font-size:13px;opacity:.92;padding-left:2px}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin:2px 0 -2px 2px}
.typing{display:flex;gap:5px;padding:13px 15px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:.4;animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-4px);opacity:1}}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.act{display:inline-flex;align-items:center;gap:9px;padding:9px 13px;border-radius:12px;background:transparent;color:var(--chip-ink);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--chip-ink) 40%,transparent);text-decoration:none;font-size:13.5px;line-height:1.2;transition:transform .15s,background .15s;min-height:44px;max-width:100%}
.act:hover{transform:translateY(-1px);background:color-mix(in srgb,var(--chip-ink) 8%,transparent)}
.act.main{background:var(--act-bg);color:var(--act-ink);box-shadow:none}.act.main:hover{background:var(--act-hover)}
.act span{display:flex;flex-direction:column;min-width:0}.act small{font-size:12px;opacity:.9;overflow-wrap:anywhere}
.act.main.k-whatsapp{background:#0f7a3a;color:#fff}.act.main.k-whatsapp:hover{background:#0c6630}
.act.main.k-book{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid color-mix(in srgb,var(--accent) 65%,transparent);background:var(--chip-bg);color:var(--chip-ink);font:600 13.5px var(--font-body);padding:8px 13px;border-radius:999px;cursor:pointer;transition:background .15s,transform .15s,color .15s;min-height:40px;text-align:left}
.chip:hover{background:var(--accent);color:var(--accent-ink);transform:translateY(-1px)}
.chips.soft{flex-direction:column;gap:0;align-items:flex-start;padding:0 4px}
.chips.soft .chip{border:0;background:none;border-radius:6px;padding:5px 6px;min-height:34px;font-weight:600;font-size:13.5px;color:var(--accent-text);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent-text) 35%,transparent);text-underline-offset:3px}
.chips.soft .chip::before{content:"› ";text-decoration:none;display:inline-block}
.chips.soft .chip:hover{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent-text);transform:none}
.chips.choice .chip{border-radius:14px;padding:10px 14px;font-size:14.5px}
/* les anciennes relances se replient : seule la dernière réponse garde ses boutons (fil lisible) */
.msg.old .chips.soft,.msg.old .chips.ex{display:none}
.sugg-wrap{background:var(--log-bg);border-top:1px solid var(--chat-line);flex:none}
#sugg{display:flex;gap:7px;overflow-x:auto;padding:8px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch;mask-image:linear-gradient(90deg,#000 90%,transparent)}
#sugg::-webkit-scrollbar{display:none}
#sugg .chip{flex:none;white-space:nowrap;font-size:13px;padding:6px 12px;min-height:34px}
form#form{display:flex;align-items:center;gap:7px;padding:9px 10px;background:var(--chat-bg);border-top:1px solid var(--chat-line);flex:none}
form#form input{flex:1;min-width:0;border:1.5px solid var(--chat-line);background:var(--input-bg);color:var(--chat-ink);border-radius:999px;padding:11px 15px;font:16px var(--font-body)}
form#form input::placeholder{color:color-mix(in srgb,var(--chat-ink) 68%,transparent)}
form#form input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.send,.mic{width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;flex:none}
.send{background:var(--accent);color:var(--accent-ink)}.send:hover{filter:brightness(1.08)}
.mic{background:transparent;color:var(--chat-ink);box-shadow:inset 0 0 0 1.5px var(--chat-line)}
.mic.on{background:#d93a3a;color:#fff;animation:rec 1.2s infinite}
@keyframes rec{50%{box-shadow:0 0 0 8px rgba(217,58,58,.2)}}
.mention{padding:4px 12px 8px;text-align:center;font-size:10.5px;color:color-mix(in srgb,var(--chat-ink) 76%,transparent);background:var(--chat-bg);flex:none}
.mention b{font-weight:600}
/* ---- mobile : feuille par le bas (~86 %), le haut du site reste visible ---- */
@media (max-width:640px){
  .site-bg{background-image:var(--fond-mobile)}
  #bubble{--nav:64px;width:56px;height:56px;right:14px}
  #teaser{--nav:64px;right:14px}
  .apercu{left:50%;transform:translateX(-50%);bottom:auto;top:max(10px,env(safe-area-inset-top));white-space:nowrap;font-size:11px}
  #veil{display:block;position:fixed;inset:0;z-index:57;background:rgba(0,0,0,.38);animation:fade .25s}
  #veil[hidden]{display:none}
  @keyframes fade{from{opacity:0}}
  #chat,#chat.wide{left:0;right:0;bottom:0;top:auto;width:100%;max-width:none;height:86vh;height:86dvh;border-radius:20px 20px 0 0;animation:slide .3s cubic-bezier(.2,1,.3,1)}
  @keyframes slide{from{transform:translateY(100%)}to{transform:none}}
  /* à l'ouverture, la feuille ne prend que la place de l'accueil : on voit davantage le site */
  #chat.fresh:not(.kb){height:auto;max-height:86dvh}
  #chat.fresh:not(.kb) #log{flex:none}
  #bubble.on{display:none}
  .grip{display:block;position:absolute;top:6px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:color-mix(in srgb,var(--head-ink) 45%,transparent);z-index:2}
  .ch-head{padding:16px 8px 10px 14px;gap:6px}.ch-head .av{width:34px;height:34px}.ch-head .av svg{width:19px;height:19px}
  .ch-head .nm{font-size:15px}.ch-head .st{font-size:11.5px}
  #expand{display:none}
  .lg{padding:7px 7px;font-size:11px}
  form#form{padding-bottom:max(9px,env(safe-area-inset-bottom))}
  /* clavier ouvert : la fenêtre épouse la zone visible, on libère la place */
  #chat.kb{border-radius:0;transition:none;animation:none}
  #chat.kb .grip,#chat.kb .sugg-wrap,#chat.kb .mention{display:none}
  #chat.kb .ch-head{padding-top:10px}
  #chat.kb form#form{padding-bottom:8px}
}
@media (max-width:370px){#restart{display:none}.ch-head .av{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

• Chambre Standard (bâtiment central, tout près des restaurants et de la piscine principale) ;\n• Chambre Guétali (16 chambres dans une villa créole, kitchenette sur la terrasse ; vue mer à l’étage, accès direct à la piscine au rez-de-chaussée) ;\n• Bungalow Tropique (20 bungalows de 34 m², terrasse sur le jardin) ;\n• Bungalow Kitchenette (20 bungalows de 32 m², terrasse de plain-pied) ;\n• Bungalow Famille (55 m², 3 chambres).","en":"Iloha offers 82 rooms and bungalows in a 3-hectare tropical garden, in 5 categories:\n• Standard room (main building, right next to the restaurants and the main pool);\n• Guétali room (16 rooms in a Creole villa, kitchenette on the terrace; sea view upstairs, direct pool access on the ground floor);\n• Tropique bungalow (20 bungalows of 34 m², terrace onto the garden);\n• Kitchenette bungalow (20 bungalows of 32 m², ground-level terrace);\n• Family bungalow (55 m², 3 bedrooms).","de":"Das Iloha bietet 82 Unterkünfte in einem 3 Hektar großen tropischen Garten, in 5 Kategorien:\n• Standardzimmer (Haupthaus, direkt bei den Restaurants und dem Hauptpool);\n• Guétali-Zimmer (16 Zimmer in einer kreolischen Villa, Kochnische auf der Terrasse; Meerblick im Obergeschoss, direkter Poolzugang im Erdgeschoss);\n• Tropique-Bungalow (20 Bungalows mit 34 m², Terrasse zum Garten);\n• Bungalow mit Kochnische (20 Bungalows mit 32 m², ebenerdige Terrasse);\n• Familienbungalow (55 m², 3 Schlafzimmer)."}},{"statut":"valide","actions":["reserver","tel:reception"],"suggestions":["piscine","hebergements","activites"],"source":"https://www.iloha.fr/hebergement/ ; https://www.iloha.fr/hotel/","id":"famille","service":"Réservations","topic":{"fr":"Séjour en famille","en":"Family stay","de":"Familienaufenthalt"},"exemples":{"fr":["on peut venir avec des enfants","c'est bien pour les enfants","vous avez des chambres familiales","on est 5 avec trois enfants","y a de quoi occuper les enfants","vous acceptez les enfants","tarif enfant","à partir de quel âge les enfa ébé sur demande, kitchenette et terrasse avec table de 6 places.\nPour les loisirs : deux piscines, une table de ping-pong et des jeux de société.","en":"Yes, families are very welcome at Iloha! Several accommodations suit families (Family bungalow, Guétali room, Tropique bungalow, Kitchenette bungalow), with different capacities.\nThe Family Bungalow (55 m², garden view) has 3 bedrooms — two with double beds, one children’s room with two single beds — and sleeps up to 4 adults, 2 children and 2 babies; baby cot on request, kitchenette and a terrace with a 6-seat table.\nFor fun: two swimming pools, a ping-pong table and board games.","de":"Ja, Familien sind im Iloha herzlich willkommen! Mehrere Unterkünfte eignen sich (Familienbungalow, Guétali-Zimmer, Tropique-Bungalow, Bungalow mit Kochnische) mit unterschiedlicher Belegung.\nDer Familienbungalow (55 m², Gartenblick) hat 3 Schlafzimmer – zwei mit Doppelbett, ein Kinderzimmer mit zwei Einzelbetten – und bietet Platz für bis zu 4 Erwachsene, 2 Kinder und 2 Babys; Babybett auf Anfrage, Kochnische und Terrasse mit Tisch für 6 Personen.\nZur Freizeit: zwei Swimmingpools, eine Tischtennisplatte und Gesellschaftsspiele."},"prefere":true},{"statut":"valide","actions":["tel:reception"],"suggestions":["hebergements","checkin","restaurants"],"source":"https://www.iloha.fr/hebergement/ ; https://www.iloha.fr/hotel/","id":"cuisine_chambre","service":"Réception","topic":{"fr":"Cuisine dans la chambre","en":"Kitchenette","de":"Küchenzeile"},"exemples":{"fr":["kitchenette dans la chambre","je peux cuisiner","y a une cuisine dans la chambre","plaque de cuisson","cuisine équipée","barbecue autorisé","plancha dans le bungalow","raclette dans la chambre","pierrade","appareil électrique de cuisine","faire à manger dans la chambre","bungalow avec cuisine","autonomie repas","frigo et plaque","micro-ondes","vaisselle","Peut-on cuisiner dans la chambre ?","on peut faire un barbecue devant le bungalow","plancha sur la terrasse autorisée"] ":"La Cas’Akea est l’espace bien-être de l’hôtel : massages et soins esthétiques, en solo ou en duo, accessibles aux clients de l’hôtel comme aux personnes de l’extérieur, selon disponibilité et sur réservation. Elle est ouverte tous les jours de 9h à 19h et réservée aux personnes majeures.\nExemples relevés sur la page du spa : soin de 30 min à 55 €, Zen Équilibre (50 min) à 90 €. Si vous séjournez à l’hôtel, nous vous conseillons de réserver vos soins en même temps que votre hébergement.\nPour réserver, l’équipe de la Cas’Akea vous répond directement :","en":"La Cas’Akea is the hotel’s wellness area: massages and beauty treatments, solo or as a duo, open to hotel guests and visitors alike, subject to availability and by reservation. It is open every day from 9 am to 7 pm and for adults only.\nExamples listed on the spa page: a 30-minute treatment at €55, Zen Équilibre (50 min) at €90. If you are staying with us, we recommend booking your treatments together with your accommodation.\nTo book, the Cas’Akea team will answer you directly:","de":"Die Cas’Akea ist der Wellnessbereich des Hotels: Massagen und Schönheitsbehandlungen, einzeln oder zu zweit, für Hotelgäste und externe Besucher, je nach Verfügbarkeit und nach Reservierung. Täglich von 9 bis 19 Uhr geöffnet, nur für Erwachsene.\nBeispiele von der Spa-Seite: eine 30-Minuten-Behandlung für 55 €, Zen Équilibre (50 Min.) für 90 €. Wenn Sie bei uns wohnen, empfehlen wir, die Behandlungen gleich mit der Unterkunft zu buchen.\nZur Buchung antwortet Ihnen das Team der Cas’Akea direkt:"},"prefere":true},{"statut":"valide","actions":["tel:spa","mail:spa"],"suggestions":["accessibilite","checkin","hebergements"],"source":"https://www.iloha.fr/bien-etre/","id":"spa_pmr","service":"Spa Cas’Akea","topic":{"fr":"Spa et mobilité réduite","en":"Spa & reduced mobility","de":"Spa & eingeschränkte Mobilität"},"exemples":{"fr":["le spa est accessible aux personnes à mobilité réduite","soin en chambre","massage dans le bungalow"," a vous propose deux univers de restauration, un bar et un glacier :\n• Le Kotémer, restaurant principal au bord de la piscine, face à la baie de Saint-Leu — cuisine inventive et métissée, tous les jours sur réservation (petit-déjeuner 6h-10h, déjeuner 12h-14h, dîner 19h-21h) ;\n• La Trattoria, esprit brasserie et plats à partager, le vendredi et le samedi de 14h à 21h, sur réservation ;\n• Le Leu Bar et le glacier, tous les jours de 10h à 21h30.\nPour les régimes particuliers ou allergies, merci de le signaler à l’équipe en réservant. Pour réserver une table :","en":"Iloha offers two dining concepts, a bar and an ice cream parlour:\n• Le Kotémer, the main restaurant by the pool overlooking Saint-Leu Bay — inventive Creole-inspired cuisine, every day by reservation (breakfast 6-10 am, lunch 12-2 pm, dinner 7-9 pm);\n• La Trattoria, brasserie spirit with dishes to share, on Fridays and Saturdays from 2 pm to 9 pm, by reservation;\n• Leu Bar and the ice cream parlour, every day from 10 am to 9.30 pm.\nFor special diets or allergies, please tell the team when you book. To reserve a table:","de":"Das Iloha bietet zwei gastronomische Bereiche, eine Bar und eine Eisdiele:\n• Le Kotémer, das Hauptrestaurant am Pool mit Blick auf die Bucht von Saint-Leu – kreative, multikulturelle Küche, täglich nach Reservierung (Frühstück 6–10 Uhr, Mittagessen 12–14 Uhr, Abendessen 19–21 Uhr);\n• La Trattoria mit Brasserie-Atmosphäre und Gerichten zum Teilen, freitags und samstags von 14 bis 21 Uhr, nach Reservierung;\n• Leu Bar und Eisdiele, täglich von 10 bis 21:30 Uhr.\nBei besonderen Ernährungswünschen oder Allergien geben Sie dies bitte bei der Reservierung an. Zur Tischreservierung:"}},{"statut":"valide","actions":["tel:resto","mail:resto"],"suggestions":["buffet","petitdej","checkin"],"source":"https://www.iloha.fr/restauration/","id":"kotemer","service":"Restaurants","topic":{"fr":"Restaurant Le Kotémer","en":"Le Kotémer restaurant","de":"Restaurant Le Kotémer"},"exemples":{"fr":[" -Leu Bay on a shaded terrace, it welcomes you every day, by reservation. Chef Kevene Marimoutou creates inventive, fusion cuisine with traditional Creole recipes and fresh, local, seasonal produce.\nAccording to the current website page: lunch set menu of main course + dessert + coffee for €29, or the dish of the day alone for €24. To book or to check the current menu:","de":"Der Kotémer ist das Hauptrestaurant des Hotels: Auf einer schattigen Terrasse oberhalb der Bucht von Saint-Leu empfängt er Sie täglich nach Reservierung. Küchenchef Kevene Marimoutou kocht kreativ und multikulturell, mit traditionellen kreolischen Gerichten und frischen, regionalen, saisonalen Produkten.\nLaut aktueller Website: Mittagsmenü Hauptgericht + Dessert + Kaffee für 29 € oder das Tagesgericht allein für 24 €. Zur Reservierung oder Speisekarte:"}},{"statut":"valide","actions":["tel:resto","mail:resto"],"suggestions":["restaurants","buffet","checkin"],"source":"https://www.iloha.fr/restauration/","id":"trattoria","service":"Restaurants","topic":{"fr":"La Trattoria","en":"La Trattoria","de":"La Trattoria"},"exemples":{"fr":["la Trattoria","trattoria vendredi samedi","brasserie","plats à partager","terrasse panoramique","réserver la Trattoria","la Trattoria est ouverte quand","restaurant ouvert le week-end","où manger le samedi","manger le vendredi après-midi","trattoria c'est quand","Peut-on manger une pizza de La Trattoria dans la chambre ?","comment réserver une table à la trattoria","numéro de la trattoria"],"en":["La Trattoria","trattoria friday saturday","brasserie","sharing plates","panoramic terrace","book the Trattoria","when is the Trattoria open","restaurant open on weekends","where to eat on Saturday","how do i book a table at the trattoria"],"de":["La Trattoria","trattoria freitag samstag","brasserie","gerichte zum teilen","panoramaterrasse","trattoria reservieren","wann ist die trattoria geöffnet","restaurant am wochenende","wo samstags essen","wie reserviere ich einen tisch ream","tapas","snack","boisson","boissons","drink"],"reponse":{"fr":"Le Leu Bar est au cœur de l’hôtel, à côté de la piscine principale : cocktails à base de rhum de La Réunion et de jus de fruits frais, tapas maison, cafés, et un salon avec billard. Il est ouvert tous les jours, en service continu de 10h à 21h30.\nLe glacier propose des glaces artisanales aux saveurs locales (goyavier, tangor, mangue, letchi, pitaya, ananas Victoria) et aux classiques (chocolat, vanille, café, fraise), également de 10h à 21h30, tous les jours.","en":"Leu Bar is at the heart of the hotel, next to the main pool: cocktails made with Réunion rum and fresh fruit juices, homemade tapas, coffees, and a lounge area with a billiards table. It is open every day, continuously from 10 am to 9.30 pm.\nThe ice cream parlour serves artisan ice creams with local flavours (strawberry guava, tangor, mango, lychee, pitaya, Victoria pineapple) and the classics (chocolate, vanilla, coffee, strawberry), also from 10 am to 9.30 pm every day.","de":"Die Leu Bar liegt im Herzen des Hotels, direkt am Hauptpool: Cocktails auf Basis von Rum aus La Réunion und frischen Fruchtsäften, hausgemachte Tapas, Kaffeespezialitäten und ein Aufenthaltsbereich mit Billardtisch. Täglich durchgehend von 10 bis 21:30 Uhr geöffnet.\nDie Eisdiele bietet hausgemachtes Eis mit typischen Aromen der Insel (Guave, Tangor, Mango, Litschi, Pitaya, Victoria-Ananas) sowie Klassiker wie Schokolade, Vanille, Kaffee und Erdbeere – ebenfalls täglich von 10 bis 21:30 Uhr."}},{"statut":"valide","actions":["mail:resto","tel:reception"],"suggestions":["seminaire","occasion","restaurants"],"source":"https://www.iloha.fr/restauration/","id":"event","service":"Restaurants","topic":{"fr":"Séminaire ou mariage","en":"Seminar or wedding","de":"Seminar oder Hochzeit"},"exemples":{"fr":["on peut faire un mariage chez vous","organiser un séminaire","salle de réunion","je voudrais organiser un anniversaire","fêter un événement à l'hôtel","salle pour 50 ns au sein de l’hôtel (deux piscines, ping-pong, jeux de société, billard au Leu Bar, soirée créole le vendredi) mais aussi sur toute l’île.\nÀ proximité : Kélonia, l’observatoire des tortues marines ; le Musée du Sel et le site naturel de la Pointe au Sel ; le survol de l’île en hélicoptère ; et la Maison du Coco (tarif préférentiel à 10 €/ticket pour les clients de l’hôtel, sur présentation du flyer tamponné). Pour les autres idées et réservations d’activités, la réception vous conseille.","en":"Iloha offers many activities and entertainment at the hotel (two pools, ping-pong, board games, billiards at Leu Bar, Creole evening on Fridays) as well as all over the island.\nNearby: Kélonia, the sea turtle observatory; the Salt Museum and the natural site of Pointe au Sel; helicopter flights over the island; and La Maison du Coco (special rate of €10 per ticket for hotel guests, on presentation of the hotel-stamped flyer). For other ideas and activity bookings, reception will advise you.","de":"Das Iloha bietet zahlreiche Aktivitäten und Animationen im Hotel (zwei Pools, Tischtennis, Gesellschaftsspiele, Billard in der Leu Bar, kreolischer Abend am Freitag) sowie auf der ganzen Insel.\nIn der Nähe: Kélonia, das Observatorium für Meeresschildkröten; das Salzmuseum und das Naturgebiet Pointe au Sel; Hubschrauberflüge über die Insel; und La Maison du Coco (Vorzugspreis von 10 € pro Ticket für Hotelgäste gegen Vorlage des Hotel-Flyers mit Stempel). Für weitere Ideen und Buchungen berät Sie die Rezeption."}},{"statut":"valide","actions":[{"type":"lien","url":"https://www.iloha.fr/offres-speciales/","label":{"fr":"Offres spéciales","en":"Special offers","de":"Sonderangebote"}},"reserver"],"suggestions":["long_sejour","noces","noel"],"source":"https://www.iloha.fr/offres-speciales/ (lu le 27/10/2026)","id":"offres","service":"Réservations","topic":{"fr":"Offres spéciales","en":"Special offers","de":"Sonderangebote"},"exemples":{"fr":["vous avez des promos","offres spéciales", ktuelle angebote:5","beste angebote:5","bestes angebot:5","formules sejour:4","promos:4","promo:4"],"reponse":{"fr":"Voici les offres publiées par l’hôtel sur son site officiel (en réservant en direct : meilleurs tarifs garantis) :\n• Offre long séjour : 15 % de remise sur l’hébergement dès 7 nuits, 20 % dès 14 nuits (séjours du 01/11/26 au 17/12/26 et du 01/02/27 au 31/10/27) ;\n• Offre voyage de noces : 25 % sur l’hébergement (5 nuits minimum en bungalow Tropique) et 15 % sur les soins à la Cas’Akea (mêmes dates, certificat de mariage de moins d’un an) ;\n• Offre court séjour : 10 % pour 3 à 6 nuits, programmée du 18/05/27 au 01/07/27.\nElles sont soumises à disponibilité et réservées au site officiel (hors chambre Standard). Pour les séjours de fin d’année (du 18/12 au 31/01), aucune offre n’est publiée à ce jour : la réception vous renseigne. Pour faire plaisir : coffrets séjour, soins et carte cadeau sur la boutique dédiée.","en":"Here are the offers published by the hotel on its official website (book direct for best rates guaranteed):\n• Long-stay offer: 15% off accommodation from 7 nights, 20% from 14 nights (stays from 01/11/26 to 17/12/26 and 01/02/27 to 31/10/27);\n• Honeymoon offer: 25% off accommodation (minimum 5 nights in a Tropique bungalow) and 15% off Cas’Akea treatments (same dates, marriage certificate under one year old);\n• Short-stay offer: 10% for 3 to 6 nights, scheduled from 18/05/27 to 01/07/27.\nOffers are subject to availability and only on the official website (excluding the Standard room). For end-of-year stays (18/12 to 31/01) no offer is published at the moment: reception will be happy to advise. To treat someone: stay boxes, treatments and a gift card on the dedicated shop.","de":"Das sind die Angebote, die das Hotel auf seiner offiziellen Website veröffentlicht (bei Direktbuchung: beste Preise garantiert):\n• Langzeitangebot: 15 % Rabatt auf die Unterkunft ab 7 Nächten, 20 % ab 14 Nächten (Aufenthalte vom 01.11.26 bis 17.12.26 und -Leu an der Westküste von La Réunion."}},{"statut":"valide","actions":["reserver","tel:reception"],"suggestions":["hebergements","plage","adresse"],"source":"https://www.iloha.fr/hebergement/ ; https://www.iloha.fr/contact/","service":"Réception","id":"vue","topic":{"fr":"La vue","en":"The view","de":"Die Aussicht"},"exemples":{"fr":["la vue est belle","vue sur la mer","chambre avec vue","quelle vue","vue sur l'océan","vue panoramique","vue sur le jardin","vue montagne","coucher de soleil","belle vue ?","est-ce qu'on voit la mer de la chambre","vue dégagée","balcon avec vue","une vue sur la baie","chambre avec vue mer","chambre vue sur la mer","chambre avec vue sur l'océan","la vue est belle ?","chambre avec vue mer possible","quelle est la vue ?","on voit l'océan ?"],"en":["is the view nice","sea view","room with a view","ocean view","panoramic view","garden view","sunset view","can you see the sea from the room","room with sea view","ocean view room","Do the rooms have a sea view?"],"de":["ist die aussicht schön","meerblick","zimmer mit aussicht","panoramablick","gartenblick","sonnenuntergang","kann man das meer sehen","zimmer mit meerblick","haben sie zimmer mit meerblick","gibt es meerblick"]},"mots_ancres":["vue:5","view","blick","aussicht","panorama","coucher de soleil","meerblick:5"],"reponse":{"fr":"L’Iloha donne sur la baie de Saint-Leu : l’hôtel est à 300 m de l’océan, au cœur d’un jardin tropical, avec une vue panoramique sur la baie. Côté hébergements : les chambres Guétali ont la vue mer à l’étage, le Bungalow Famille une vue jardin, et les bungalows Tropique une terrasse sur le jardin. Pour la vue d’une catégorie précise à vos dates, la réception vous conseille avec plaisir.","en":"Iloha looks out over the bay of Saint-Leu: the hotel is 300 m from the ocean, in a tropical garden, with a panoramic view of the bay. As for the accommodations: the Guétali rooms have a sea view upstairs, the Family Bungalow a garden view, and the Tropique bungalows a terrace on the garden. For the view of a specific category on your dates, reception will gladly advise you.","de":"Das Iloha liegt mit Blick auf die Bucht von Saint-Leu: Das Hotel ist 300 m vom Ozean entfernt, in einem tropischen Garten, mit Panoramablick auf die Bucht. Zu den Unterkünften: Die Guétali-Zimmer haben im Obergeschoss Meerblick, der Familienbungalow Gartenblick und die Tropique-Bungalows eine Terrasse zum Garten. Für die Aussicht einer bestimmten Kategorie zu Ihren Reisedaten berät Sie die Rezeption gern."}},{"statut":"valide","actions":["tel:reception"],"suggestions":["baignade","requins","piscine"],"source":"https://www.iloha.fr/ ; https://www.iloha.fr/loisirs/ ; https://www.iloha.fr/contact/","service":"Réception","id":"plage","topic":{"fr":"Plage et mer","en":"Beach & sea","de":"Strand & Meer"},"exemples":{"fr":["c'est loin de la plage","y a une plage","la plage est à côté","on peut aller à la plage","plage privée","plage la plus proche","est-ce qu'il y a la mer","se baigner dans l'océan","accès à la mer","la mer est proche","baignade en mer","distance de la plage","plage à pied","plage de sable","lagon","snorkeling","palmes masque tuba","c'est dangereux de se baigner","baignade océan autorisée","surf","plongée","bord de mer","sable blanc","on peut se baigner","baignade possible","on peut se baigner dans la mer","l'hôtel est au bord de l'eau","l'hôtel est en bord de mer","y a une plage ?","plage a pied ou en voiture ?","Pour la plage, c'est loin ?","À quelle distance exacte de l'océan se situe l'hôtel : 300 m, 600 m ou 850 m ?","c'est loin de la plage ?","plage","l'hôtel est au bord de l'eau ?","la plage est à combien de la chambre","on peut aller à la plage à pied"],"en":["is it far from the beach","is there a beach","beach nearby","can we go to the beach","private beach","nearest beach","is there a sea","can we swim in the sea","swim in the ocean","access to the sea","distance to the beach","snorkelling","is it safe to swim in the sea","walk to the beach","surfing","diving","can we swim","can I swim in the sea","Where is the nearest beach and can I swim there safely?","how far is the beach"],"de":["ist es weit zum strand","gibt es einen strand","strand in der nähe","privatstrand","nächster strand","kann man im meer schwimmen","zugang zum meer","entfernung zum strand","schnorcheln","ist baden im meer sicher","zum strand laufen","tauchen","kann man baden","wie weit ist der strand"]},"mots_ancres":["plage:5","mer:5","ocean:5","beach","strand","sea","lagon","snorkeling","sable","surf","plongee","baigner:5","baignade:5","il y a la mer:9","la mer:5","est ce qu il y a la mer:9","plage a pied:5","distance plage:5","how far beach:5"],"reponse":{"fr":"Selon le site de l’hôtel, l’Iloha est à 300 m de l’océan, au cœur d’un jardin tropical, avec une vue panoramique sur la baie de Saint-Leu. Saint-Leu s’étire au bord d’un lagon, protégé par une barrière de corail et surveillé depuis un poste de maître nageur sauveteur selon le site de l’hôtel ; une plage se trouve à l’entrée sud de la ville. La réception vous indique volontiers le trajet. Pour les règles de baignade du moment, voir « Baignade en mer et lagon ». Sur place, vous profitez de deux piscines.","en":"According to the hotel’s website, Iloha is 300 m from the ocean, in the heart of a tropical garden, with a panoramic view over Saint-Leu bay. Saint-Leu stretches along a lagoon, protected by a coral barrier and supervised from a lifeguard post according to the hotel’s website; a beach lies at the southern entrance of the town. Reception will gladly give you directions. For current swimming rules, see “Swimming in the sea and lagoon”. On site you can enjoy two pools.","de":"Laut Website des Hotels liegt das Iloha 300 m vom Ozean entfernt, inmitten eines tropischen Gartens, mit Panoramablick auf die Bucht von Saint-Leu. Saint-Leu erstreckt sich entlang einer Lagune, laut Hotel-Website durch ein Korallenriff geschützt und von einem Rettungsschwimmerposten überwacht; am südlichen Ortseingang gibt es einen Strand. Die Rezeption erklärt Ihnen gern den Weg. Zu den aktuellen Baderegeln siehe „Baden im Meer und in der Lagune“. Vor Ort stehen Ihnen zwei Pools zur Verfügung."},"prefere":true},{"statut":"valide","actions":[{"type":"lien","label":{"fr":"Conditions générales de vente","en":"Terms and conditions","de":"Allgemeine Geschäftsbedingungen"},"url":"https://www.iloha.fr/cgv/"},"tel:reception"],"suggestions":["paiement","taxe_sejour","reserver"],"source":"https://www.iloha.fr/cgv/ (lu le 25/10/2026)","service":"Réception","id":"annulation","topic":{"fr":"Annulation / modification","en":"Cancellation / changes","de":"Stornierung / Änderung"},"exemples":{"fr":["on peut annuler","annulation gratuite","conditions d'annulation","je peux annuler ma réservation","politique d'annulation","remboursement si j'annule","annuler mon séjour","modifier ma réservation","changer les dates de ma réservation","je ne peux plus venir","rembourse-t-on les arrhes","que se passe-t-il si j'annule","puis-je être remboursé","frais d'annulation","annuler ma réservation","report de séjour","décaler mon séjour","modification de réservation","je dois annuler","annulation à cause de maladie","acompte ?","annulation gratuite ?","remboursé si j'annule","Peut-on modifier ses dates, une seule fois ?","quelle est la politique d'annulation ?","je peux me faire rembourser ?","Stornierungsbedingungen?","annulation"],"en":["can I cancel","free cancellation","cancellation policy","can I cancel my booking","refund if I cancel","change my reservation dates","can I change my booking","what if I cancel","cancellation fee","I need to cancel","am I refunded","postpone my stay"],"de":["kann ich stornieren","kostenlose stornierung","stornierungsbedingungen","buchung stornieren","erstattung bei stornierung","buchung ändern","reisedaten ändern","was passiert bei stornierung","stornogebühren","ich muss absagen","aufenthalt verschieben","Kann ich kostenlos stornieren?"]},"mots_ancres":["annulation:5","annuler:5","cancel:5","cancellation","stornieren","stornierung","rembourse","remboursement","modifier reservation","arrhes:6","rembourse:5","remboursable:7","refund:6","refundable:6","no show:6","non remboursable:7","conditions d annulation:9","cancellation policy:9","storno:6","stornierungsbedingungen:9","erstattung:5","modifier mes dates:6","changer mes dates:6","cancel:8","cancel my booking:9","free cancellation:9","annuler:6","stornieren:8"],"reponse":{"fr":"Selon les conditions générales de vente : l’annulation est gratuite jusqu’à 21 jours avant l’arrivée (arrhes remboursées) ; dans les 20 jours, les arrhes sont conservées ; moins de 48 h avant ou en cas de non-présentation, la totalité est prélevée. Une modification est possible une seule fois, au moins 15 jours avant l’arrivée, par écrit à hotel@iloha.fr, pour un nouveau séjour dans les 3 mois, à tarif identique ou supérieur. Il n’y a pas de droit de rétractation. Pour votre réservation précise, la réception vous confirme les conditions applicables.","en":"According to the general terms: cancellation is free up to 21 days before arrival (deposit refunded); within 20 days the deposit is kept; less than 48 h before or in case of no-show, the full amount is charged. A change is possible only once, at least 15 days before arrival, in writing to hotel@iloha.fr, for a new stay within 3 months at an identical or higher rate. There is no right of withdrawal. For your specific booking, reception will confirm the applicable conditions.","de":"Laut Allgemeinen Geschäftsbedingungen: Die Stornierung ist bis 21 Tage vor Anreise kostenlos (Anzahlung erstattet); innerhalb von 20 Tagen wird die Anzahlung einbehalten; weniger als 48 Std. vorher oder bei Nichterscheinen wird der Gesamtbetrag abgebucht. Eine Änderung ist nur einmal möglich, mindestens 15 Tage vor Anreise, schriftlich an hotel@iloha.fr, für einen neuen Aufenthalt innerhalb von 3 Monaten zu gleichem oder höherem Tarif. Ein Widerrufsrecht besteht nicht. ma:5","climate:5","quand venir:6","when to visit:6","reisezeit:6","periode:3","parapluie","saison des pluies:6","rainy season:6","regenzeit:6","temps:5","degres","pleut:8","pleuvoir:8","pluie:7","pluvieux:7","pull:5","vetements:3","mois:3","decembre:2","janvier:2","fevrier:2","eviter:3","rain:6","raining:7","regen:6","regnet:7","warm water:6","wassertemperatur:7","wie warm:6","temperature:6","quand partir:6","quand y aller:6","when to go:6","wann reisen:6","wann:2","quand venir:9","basse saison:9","haute saison:9","periode ideale:9","chaud en aout:8","ensoleille:7","semaine prochaine:5","combien en decembre:9","il fait combien:8","risque cyclone en fevrier:2","meilleure periode:6","quelle saison:6","quand partir:5","best time:6","beste reisezeit:6","reisezeit:5","jahreszeit:5"],"reponse":{"fr":"Je n’ai pas la météo en direct : pour la prévision du jour, le plus fiable est Météo-France Réunion. Côté climat, il y a deux saisons. L’été austral (novembre à avril) est chaud et humide (30-32 °C sur la côte, averses parfois fortes mais en général courtes) ; l’hiver austral (mai à octobre) est plus frais et sec (25-27 °C en journée, nuits fraîches). Beaucoup de voyageurs préfèrent mai à octobre (randonnée, baleines de juin à octobre) et les intersaisons (avril-mai, octobre-novembre) ; l’été offre l’eau chaude et une végétation luxuriante, avec le risque cyclonique (voir « Cyclone »). La pluie varie beaucoup selon la côte. L’ouest, « sous le vent », est la côte la plus sèche de l’île, mais je ne peux pas garantir les cumuls exacts : la réception vous renseigne.","en":"I don’t have live weather: for today’s forecast, Météo-France Réunion is the most reliable source. As for the climate, there are two seasons. The austral summer (November to April) is hot and humid (30-32 °C on the coast, sometimes heavy but usually short showers); the austral winter (May to October) is cooler and drier (25-27 °C by day, cool nights). Many travellers prefer May to October (hiking, whales from June to October) and the shoulder seasons (April-May, October-November); summer brings warm water and lush vegetation, with the cyclone risk (see “Cyclone”). Rainfall varies a lot from coast to coast. The west, “leeward”, is the island’s driest coast, but I cannot guarantee exact rainfall: reception will advise you.","de":"Ich habe keine Live-Wetterdaten: für die Tagesvorhersage ist Météo-France Réunion am zuverlässigsten. Zum Klima: Es gibt zwei Jahreszeiten. Der australe Sommer (November bis April) ist heiß und feucht (30-32 °C an der Küste, teils kräftige, meist kurze Schauer); der australe Winter (Mai bis Oktober) ist kühler und trockener (25-27 °C tagsüber, kühle Nächte). Viele Reisende bevorzugen Mai bis Oktober (Wandern, Wale von Juni bis Oktober) sowie die Zwischensaisons (April-Mai, Oktober-November); der Sommer bringt warmes Wasser und üppige Vegetation, aber auch das Zyklonrisiko (siehe „Zyklon“). Der Niederschlag unterscheidet sich stark je nach Küste. Der Westen, „im Lee“, ist die trockenste Küste der Insel, genaue Niederschlagsmengen kann ich aber nicht garantieren: Die Rezeption berät Sie."}},{"statut":"non_publie","actions":["tel:reception","mail:reception"],"suggestions":["piscine","activites","humain"],"source":"non publié par l’hôtel dans les sources lues","id":"fitness","topic":{"fr":"Salle de fitness","en":"Fitness room","de":"Fitnessraum"},"exemples":{"fr":["il y a une salle de sport","salle de fitness","musculation","gym","appareils de sport","je peux m'entraîner","courir autour de l'hôtel","yoga","cours de sport","salle de gym ouverte à quelle heure","tapis de course","jogging"],"en":["is there a gym","fitness room","weights","workout","can I exercise","running track","yoga classes","gym opening hours","treadmill","jogging"],"de":["gibt es einen fitnessraum","fitnessstudio","krafttraining","gym","kann ich trainieren","yoga kurse","laufband","joggen"]},"mots_ancres":["fitness:5","gym:5","salle de sport","musculation","technogym","yoga","jogging  special request, reception is happy to help:","de":"Ich kann weder Rabatte gewähren noch Preise ändern und möchte nichts versprechen. Das Hotel veröffentlicht: das Langzeitangebot (15 % ab 7 Nächten, 20 % ab 14 Nächten), das Hochzeitsreise-Angebot (25 %), das Kurzaufenthaltsangebot (10 % bei 3 bis 6 Nächten, vorgesehen vom 18.05.27 bis 01.07.27) und die besten Preise bei Buchung auf der offiziellen Website. Für einen besonderen Wunsch ist die Rezeption für Sie da:"},"prefere":true},{"statut":"valide","actions":["tel:reception","mail:reception"],"suggestions":["humain","hebergements","restaurants"],"source":"https://www.iloha.fr/hotel/ (Langues parlées à l’hôtel, relue le 27/10/2026)","service":"Réception","id":"langues","topic":{"fr":"Langues parlées","en":"Languages spoken","de":"Gesprochene Sprachen"},"exemples":{"fr":["vous parlez anglais","quelles langues parlez-vous","y a quelqu'un qui parle allemand","parlez-vous allemand","je parle seulement anglais","personnel anglophone","est-ce que le personnel parle français","do you speak english","sprechen sie deutsch","español","italiano","qui parle allemand à la réception ?","vous parlez anglais ?","quelles langues parle l'équipe","est-ce que le personnel parle allemand","vous parlez anglais à la réception","le personnel parle chinois"],"en":["do you speak english","what languages do you speak","does the staff speak german","do you speak french","english speaking staff","do you speak spanish","which languages are spoken at the hotel"],"de":["sprechen sie englisch","welche sprachen sprechen sie","spricht das personal deutsch","sprechen sie französisch","englischsprachiges personal","welche sprachen werden im hotel gesprochen"]},"mots_ancres":["langue:5","langues","parlez","parlez vous","speak","sprechen","english","anglais","allemand","german","deutsch","langues parlees:6","languages spoken:6","gesprochene sprachen:6","personnel parle:5","staff speak:5","spricht das personal:5","chinois:5","chinese:5"],"reponse":{"fr":"Langues parlées à l’hôtel : français et anglais, avec un accueil en langue des signes pour les personnes sourdes et malentendantes. Cet assistant vous répond en français, en anglais et en allemand, et la réception est ouverte 24h/24 :","en":"Languages spoken at the hotel: French and English, with a welcome in sign language for deaf and hard-of-hearing guests. This assistant replies in French, English and German, and reception is open 24/7:","de":"Im Hotel gesprochene Sprachen: Französisch und Englisch, mit Empfang in Gebärdensprache für gehörlose und schwerhörige Gäste. Dieser Assistent antwortet auf Französisch, Englisch und Deutsch, und die Rezeption ist rund um die Uhr geöffnet:"}},{"statut":"valide","actions":["tel:reception","mail:reception"],"suggestions":["humain","hebergements","restaurants"],"source":"v1 (assistant)","service":"Réception","id":"botinfo","topic":{"fr":"Qui répond ici ?","en":"Who is answering?","de":"Wer antwortet hier?"},"exemples":{"fr":["tu es un robot","vous êtes une vraie personne","qui êtes-vous","tu es une ia","c'est un bot","vous êtes humain","c'est qui qui répond","êtes-vous un robot","comment tu t'appelles","tu es chatgpt","es-tu une intelligence artificielle","qui me répond","vous êtes qui","t'es qui toi","tu es un robot ?"],"en":["are you a robot","are you a real person","who are you","are you an ai","is this a bot","are you human","who is answering","what's your name","are you chatgpt","who am I talking to"],"de":["bist du ein roboter","sind sie eine echte person","wer sind sie","bist du eine ki","ist das ein bot","sind sie ein mensch","wer antwortet","wie heißt du","wer spricht da"]},"mots_ancres":["robot:5","bot:5","chatgpt","intelligence artificielle","artificial intelligence","ki","qui es tu","qui etes vous","who are you","wer bist du"],"reponse":{"fr":"Je suis l’assistant automatique de l’Iloha : mes réponses viennent des informations publiées par l’hôtel, à valider par l’équipe. Pour parler à une personne, la réception répond 24h/24 :","en":"I am the Iloha automatic assistant: my answers come from the information published by the hotel, to be validated by the team. To speak to a person, reception answers 24/7:","de":"Ich bin der automatische Assistent des Iloha: Meine Antworten stammen aus den vom Hotel veröffentlichten Informationen und sind vom Team zu bestätigen. Um mit einer Person zu sprechen, antwortet die Rezeption rund um die Uhr:"}},{"id":"cyclone","exemples":{"fr":["y a des cyclones ?","que se passe-t-il si cyclone pendant mon séjour","remboursement si cyclone","saison cyclonique dates","on est confinés ?","tempête tropicale"],"en":["What happens if a cyclone hits during my stay?"],"de":["Was passiert bei einem Zyklon?"]},"mots_ancres":["cyclone*:9","cyclonique:9","zyklon*:9","tempete tropicale:8","alerte rouge:8","alerte orange:8","alerte violette:8","tropical storm:8","hurricane:8","taifun:7","vigilance:6","saison cyclonique:9","cyclone season:9","zyklonsaison:9","consignes:3","alerte:5","ferme en cas:5","risque cyclone:9"],"suggestions":["meteo","annulation","humain"],"actions":[{"type":"lien","label":{"fr":"Vigilance Météo-France Réunion","en":"Météo-France weather alerts","de":"Météo-France Wetterwarnungen"},"url":"https://vigilance.meteofrance.fr/fr/la-reunion"},"tel:reception"],"statut":"valide","topic":{"fr":"Cyclone et alertes","en":"Cyclones and alerts","de":"Zyklon und Warnstufen"},"reponse":{"fr":"La saison cyclonique court environ de novembre à avril ; un cyclone touche l’île en moyenne une à deux fois par an et dure en général une journée. Les alertes sont graduées : pré-alerte jaune, alerte orange (danger sous 24 h : on annule les sorties en mer et en montagne), alerte rouge (confinement, circulation interdite, annoncée environ 3 h avant), alerte violette (la plus forte). On suit les consignes de la préfecture et de l’équipe de l’hôtel ; le suivi officiel en temps réel se trouve sur Météo-France Vigilance. Pour une annulation ou un remboursement lié à un cyclone, je n’ai pas d’information : cela dépend des conditions de votre réservation, la réception vous répond.","en":"The cyclone season runs roughly from November to April; on average a cyclone hits the island once or twice a year and usually lasts about a day. Alerts are graded: yellow pre-alert, orange alert (danger within 24 h: cancel sea and mountain outings), red alert (lockdown, traffic banned, announced about 3 h ahead), purple (the strongest). Follow the prefecture’s and the hotel team’s instructions; official real-time tracking is on Météo-France Vigilance. For a cancellation or refund linked to a cyclone I have no information: it depends on your booking conditions, reception will answer.","de":"Die Zyklonsaison dauert etwa von November bis April; durchschnittlich zieht ein bis zwei Mal pro Jahr ein Zyklon über die Insel und dauert meist etwa einen Tag. Die Warnstufen: gelbe Vorwarnung, orange Alarm (Gefahr innerhalb von 24 h: Ausflüge aufs Meer und in die Berge absagen), roter Alarm (Ausgangssperre, Verkehr verboten, rund 3 h vorher angekündigt), violett (am stärksten). Man folgt den Anweisungen der Präfektur und des Hotelteams; die offizielle Echtzeit-Warnlage finden Sie bei Météo-France Vigilance. Zu Stornierung oder Erstattung wegen eines Zyklons habe ich keine Informationen: Das hängt von Ihren Buchungsbedingungen ab, die Rezeption antwortet Ihnen."},"source":"https://www.reunion.fr/organisez/conseils-de-voyage/questions-reponses/quelle-est-la-periode-des-cyclones-a-la-reunion/ ; https://www.reunion.gouv.fr/Actions-de-l-Etat/Crise/La-saison-cyclonique-a-La-Reunion ; https://vigilance.meteofrance.fr/fr/ (lu le 25/10/2026)","bonus":1,"prefere":true},{"id":"baignade","exemples":{"fr":["on peut nager dans la mer","il y a des vagues ?","Le lagon de Saint-Leu est-il surveillé et protégé ?","on peut nager dans la mer ?","où se baigner à la Réunion","snorkeling autorisé ?","y a des maîtres nageurs ?","on peut se baigner à Saint-Leu ?","plage de Saint-Leu surveillée ?","snorkeling avec les tortues","surf à Saint-Leu","les requins à Saint-Leu"],"en":["Is it safe to swim here?"],"de":["Wo darf man baden?","Gibt es eine Lagune?"]},"mots_ancres":["baigner:6","baignade:6","nager:6","nage:4","swim:6","baden:6","lagon:6","lagoon:6","lagune:6","snorkeling:5","snorkelling:5","schnorcheln:5","drapeau","drapeaux","maitre nageur:4","vagues:4","surf:3","palmes masque tuba:4","lagon:8","y a un lagon:9","mer dangereuse:9","dangereux de se baigner:9","baignade interdite:9","plage securisee:9","se baigner:6","dangereuse:5","schwimmen sicher:9","swimming safe:8"],"suggestions":["requins","plage","tortues"],"actions":[{"type":"lien","label":{"fr":"Préfecture : risque requin","en":"Prefecture: shark risk","de":"Präfektur: Haigefahr"},"url":"https://www.reunion.gouv.fr/Actualites/Communiques-de-presse/Activites-nautiques-en-mer-vigilance-face-au-risque-requins"},"tel:reception"],"statut":"valide","topic":{"fr":"Baignade en mer et lagon","en":"Swimming in the sea and lagoon","de":"Baden im Meer und in der Lagune"},"source":"https://www.saintleu.re/les-zones-de-baignade-a-saint-leu ; https://www.saintleu.re/actualite/baignade-et-activites-nautiques-a-nouveau-autorisees-a-saint-leu.php ; https://www.iloha.fr/loisirs/ (lu le 25/10/2026)","bonus":0.92,"reponse":{"fr":"À Saint-Leu, la baignade se fait dans le lagon et la zone de la plage du centre (labellisée Pavillon bleu selon la mairie). Selon le site de l’hôtel, le lagon est protégé par une barrière de corail et surveillé depuis un poste de maître nageur sauveteur. Hors lagon, la baignade est restreinte et le risque requin est réel. L’accès au littoral peut être suspendu par arrêté municipal et je n’ai pas trouvé d’arrêté en vigueur au 25/10/2026 : vérifiez drapeaux et consignes du jour, ou demandez à la réception ou à la mairie (02 62 34 80 03). Drapeaux : vert = surveillée, jaune ou orange = dangereuse mais surveillée, rouge = interdite.","en":"In Saint-Leu, swimming takes place in the lagoon and the central beach area (awarded Blue Flag status according to the town hall). According to the hotel’s website, the lagoon is protected by a coral barrier and supervised from a lifeguard post. Outside the lagoon, swimming is restricted and the shark risk is real. Shoreline access can be suspended by municipal order and I found no order in force on 25/10/2026: check the flags and the day’s instructions, or ask reception or the town hall (02 62 34 80 03). Flags: green = supervised, yellow or orange = dangerous but supervised, red = forbidden.","de":"In Saint-Leu badet man in der Lagune und im Bereich des zentralen Strandes (laut Rathaus mit der Blauen Flagge ausgezeichnet). Laut Website des Hotels ist die Lagune durch ein Korallenriff geschützt und von einem Rettungsschwimmerposten überwacht. Außerhalb der Lagune ist das Baden eingeschränkt und das Hairisiko real. Der Zugang zur Küste kann per Gemeindeverfügung ausgesetzt werden; am 25.10.2026 habe ich keine gültige Verfügung gefunden: Prüfen Sie Flaggen und Tageshinweise oder fragen Sie die Rezeption oder das Rathaus (02 62 34 80 03). Flaggen: grün = überwacht, gelb oder orange = gefährlich, aber überwacht, rot = verboten."},"prefere":true},{"id":"requins","exemples":{"fr":["y a des requins","y a des requins ?","risque requin quand je nage","requins dans le lagon ?","pourquoi la baignade est interdite","c'est vrai que la mer est interdite ?"],"en":["Are there sharks? Is it safe to swim?"],"de":["Gibt es Haie?"]},"mots_ancres":["requin:9","requins:9","shark:9","sharks:9","hai:9","haie:9","haifisch:9","squale:8","surf:5","surfer:6","dorsal:6","pr2p:6","risque requin:9","attaque:4","sur pour les enfants:6","ist schwimmen sicher:8"],"suggestions":["baignade","plage","humain"],"actions":[{"type":"lien","label":{"fr":"Préfecture : risque requin","en":"Prefecture: shark risk","de":"Präfektur: Haigefahr"},"url":"https://www.reunion.gouv.fr/Actualites/Communiques-de-presse/Activites-nautiques-en-mer-vigilance-face-au-risque-requins"},"tel:reception"],"statut":"valide","topic":{"fr":"Requins","en":"Sharks","de":"Haie"},"reponse":{"fr":"Le risque requin existe et il est pris très au sérieux : la préfecture parle d’un risque « réel et permanent » hors des lagons, bassins et zones sécurisées, d’où une baignade encadrée. On se baigne dans les lagons, bassins ou zones surveillées, pas seul, pas à l’aube ni au crépuscule, pas en eau trouble, et on respecte les drapeaux. Informations en temps réel : application DORSAL et carte pr2p.re. Je ne peux pas vous dire que c’est sans danger : fiez-vous à la préfecture et au poste de secours. À Saint-Leu, on se baigne dans le lagon (voir « Baignade en mer et lagon »).","en":"The shark risk exists and is taken very seriously: the prefecture calls it a “real and permanent” risk outside lagoons, pools and secured areas, which is why swimming is regulated. Swim in lagoons, basins or supervised zones, not alone, not at dawn or dusk, not in murky water, and respect the flags. Real-time information: the DORSAL app and the pr2p.re map. I can’t tell you it is risk-free: rely on the prefecture and the lifeguard post. In Saint-Leu, swimming is done in the lagoon (see “Swimming in the sea and lagoon”).","de":"Das Hairisiko besteht und wird sehr ernst genommen: Die Präfektur spricht von einem „realen und dauerhaften“ Risiko außerhalb von Lagunen, Becken und gesicherten Zonen; deshalb ist das Baden geregelt. Man badet in Lagunen, Becken oder überwachten Zonen, nicht allein, nicht in der Dämmerung, nicht in trübem Wasser, und beachtet die Flaggen. Echtzeit-Infos: App DORSAL und Karte pr2p.re. Ich kann nicht sagen, dass es ungefährlich ist: Verlassen Sie sich auf die Präfektur und den Rettungsposten. In Saint-Leu badet man in der Lagune (siehe „Baden im Meer und in der Lagune“)."},"source":"https://www.reunion.gouv.fr/Actualites/Communiques-de-presse/Activites-nautiques-en-mer-vigilance-face-au-risque-requins (préfecture, maj 06/08/2025) ; réglementation baignade (préfecture, maj 15/03/2023) (lu le 25/10/2026)","bonus":1.25},{"id":"baleines","exemples":{"fr":["on voit les baleines de l'hôtel ?","c'est la saison des baleines quand","on peut voir des baleines ?","sortie baleines depuis l'hôtel","peut-on nager avec les baleines ?","mois des baleines","on peut voir des baleines depuis l'hôtel en juillet"],"en":["Can we see whales?"],"de":["Kann man Wale sehen?","wale beobachten"]},"mots_ancres":["baleine*:9","baleines:9","whale*:9","whales:9","wal:6","wale:9","walbeobachtung:9","dauphin:6","dauphins:6","dolphin:6","delfin:6","observatoire:5","whale watching:9","cetaces:6","bateau:3","observation en bateau:8","voit depuis la plage:9","on les voit:6"],"suggestions":["tortues","activites","meteo"],"actions":["tel:reception"],"statut":"valide","topic":{"fr":"Baleines","en":"Whales","de":"Wale"},"reponse":{"fr":"Les baleines à bosse fréquentent les eaux de La Réunion environ de juin à octobre (hiver austral), et il y a des dauphins toute l’année selon les espèces. L’hôtel dispose d’un observatoire des baleines (juin à octobre, avec jumelles). Les sorties en mer se font avec des professionnels et sont réglementées pour protéger les animaux (approche à moins de 100 m interdite dans les aires marines protégées, arrêté préfectoral n°944 du 04/06/2025) ; la réception peut vous orienter.","en":"Humpback whales visit La Réunion’s waters roughly from June to October (austral winter), and there are dolphins all year round depending on the species. The hotel has a whale-watching lookout (June to October, with binoculars). Boat trips run with professionals and are regulated to protect the animals (approaching within 100 m is forbidden in marine protected areas, prefectoral order no. 944 of 04/06/2025); reception can point you to operators.","de":"Buckelwale besuchen die Gewässer von La Réunion etwa von Juni bis Oktober (australer Winter); Delfine gibt es je nach Art das ganze Jahr. Das Hotel hat eine Walbeobachtungsstation (Juni bis Oktober, mit Ferngläsern). Ausfahrten erfolgen mit Profis und sind zum Schutz der Tiere geregelt (Annäherung unter 100 m in Meeresschutzgebieten verboten, Präfekturverfügung Nr. 944 vom 04.06.2025); die Rezeption hilft bei der Auswahl."},"source":"https://www.reunion.fr/decouvrez/observation-des-dauphins-et-des-baleines/ ; https://palm.re/hotel/ ; https://www.iloha.fr/loisirs/ (lu le 25/10/2026)","prefere":true},{"id":"tortues","exemples":{"fr":["tortues où voir","on peut voir des tortues ?","horaires Kélonia","nager avec les tortues","jour de fermeture Kélonia"],"en":["Can we see turtles?"],"de":["Kann man Schildkröten sehen?"]},"mots_ancres":["tortue:8","tortues:8","kelonia:9","turtle:8","turtles:8","schildkroete:8","schildkroeten:8","schildkrote:8","schildkroten:8","tortue marine:9","centre de soins:8","soins tortues:9"],"suggestions":["baleines","activites","baignade"],"actions":[{"type":"lien","label":{"fr":"Kélonia : horaires et tarifs","en":"Kélonia: hours and prices","de":"Kélonia: Öffnungszeiten"},"url":"https://museesreunion.fr/kelonia/"},"tel:reception"],"statut":"valide","topic":{"fr":"Tortues et Kélonia","en":"Turtles and Kélonia","de":"Schildkröten und Kélonia"},"reponse":{"fr":"Kélonia, à Saint-Leu, est l’observatoire des tortues marines et centre de soins, tout près de l’hôtel : visite libre de 9 h à 18 h (billetterie fermée à 17 h), visites guidées à 10 h, 11 h 30, 14 h et 16 h sans réservation, dans la limite des places (horaires susceptibles de changer).","en":"Kélonia, in Saint-Leu, is the marine-turtle observatory and care centre, very close to the hotel: free visit from 9 am to 6 pm (ticket office closes at 5 pm), guided tours at 10 am, 11:30 am, 2 pm and 4 pm without booking, subject to availability (hours may change).","de":"Kélonia in Saint-Leu ist das Beobachtungszentrum für Meeresschildkröten und Pflegestation, ganz in der Nähe des Hotels: freier Besuch von 9 bis 18 Uhr (Kasse schließt um 17 Uhr), Führungen um 10, 11:30, 14 und 16 Uhr ohne Reservierung, solange Plätze frei sind (Zeiten können sich ändern)."},"source":"https://museesreunion.fr/kelonia/ (lu le 25/10/2026) ; https://www.iloha.fr/loisirs/"},{"id":"moustiques","exemples":{"fr":["y a des moustiques ?","chikungunya en ce moment ?","vaccin obligatoire ?","moustiquaire dans la chambre","dois-je me faire vacciner"],"en":["Is there dengue?"],"de":["Gibt es Dengue?"]},"mots_ancres":["moustique:9","moustiques:9","moustiquaire:7","dengue:9","chikungunya:9","chik:5","mosquito:9","mosquitoes:9","muecke:9","muecken:9","mucken:9","mucke:9","repulsif:6","repellent:6","epidemie:6","vaccin:3","paludisme:5","malaria:5","demoustication:6"],"suggestions":["urgence","eau","humain"],"actions":[{"type":"lien","label":{"fr":"ARS : recommandations voyageurs","en":"ARS: traveller advice","de":"ARS: Reisehinweise"},"url":"https://www.lareunion.ars.sante.fr/recommandations-la-population-et-aux-voyageurs"},"tel:reception"],"statut":"valide","topic":{"fr":"Moustiques et dengue","en":"Mosquitoes and dengue","de":"Mücken und Dengue"},"reponse":{"fr":"Il y a des moustiques (Aedes albopictus) qui peuvent transmettre la dengue et le chikungunya ; des cas sont recensés dans l’année. Protégez-vous : répulsif cutané (efficace 4 à 8 h ; produits spécifiques pour enfants et femmes enceintes), vêtements clairs et couvrants, moustiquaire ou diffuseur. Au 22/06/2026, l’ARS a ramené l’île au niveau 2 du plan ORSEC (circulation modérée) et déclaré la fin de l’épidémie de chikungunya ; pour la situation actuelle et les recommandations aux voyageurs, voir le site de l’ARS. Pour un avis médical (vaccin, grossesse, enfants), consultez un médecin.","en":"There are mosquitoes (Aedes albopictus) that can transmit dengue and chikungunya; cases are recorded during the year. Protect yourself: skin repellent (effective 4 to 8 h; specific products for children and pregnant women), light-coloured covering clothes, bed net or diffuser. On 22/06/2026 the ARS brought the island back to ORSEC level 2 (moderate circulation) and declared the end of the chikungunya epidemic; for the current situation and traveller advice, see the ARS website. For medical advice (vaccine, pregnancy, children), consult a doctor.","de":"Es gibt Mücken (Aedes albopictus), die Dengue und Chikungunya übertragen können; im Laufe des Jahres werden Fälle gemeldet. Schützen Sie sich: Hautrepellent (wirkt 4 bis 8 h; spezielle Produkte für Kinder und Schwangere), helle, bedeckende Kleidung, Moskitonetz oder Diffusor. Am 22.06.2026 stufte die ARS die Insel auf Stufe 2 des ORSEC-Plans zurück (moderate Zirkulation) und erklärte die Chikungunya-Epidemie für beendet; die aktuelle Lage und Reisehinweise finden Sie auf der Website der ARS. Für medizinischen Rat (Impfung, Schwangerschaft, Kinder) wenden Sie sich an einen Arzt."},"source":"https://www.lareunion.ars.sante.fr/recommandations-la-population-et-aux-voyageurs ; https://www.lareunion.ars.sante.fr/dengue-chiffres-et-zones-concernees (lu le 25/10/2026)","bonus":1.15},{"id":"eau","exemples":{"fr":["l'eau du robinet est potable ?","eau en bouteille nécessaire ?","qualité de l'eau"],"en":[],"de":["Ist das Leitungswasser trinkbar?"]},"mots_ancres":["robinet:8","potable:8","tap water:8","drinking water:7","leitungswasser:8","trinkwasser:8","eau en bouteille:7","boire l eau:7","biberon:3"],"suggestions":["meteo","humain"],"actions":[{"type":"lien","label":{"fr":"eaudurobinet.re (ARS)","en":"eaudurobinet.re (ARS)","de":"eaudurobinet.re (ARS)"},"url":"https://www.eaudurobinet.re"},"tel:reception"],"statut":"valide","topic":{"fr":"Eau du robinet","en":"Tap water","de":"Leitungswasser"},"reponse":{"fr":"La qualité de l’eau du robinet est suivie par l’ARS, qui publie un site dédié (eaudurobinet.re) pour consulter votre commune. Je n’ai pas le détail pour le secteur de l’hôtel : la réception vous le confirme.","en":"Tap-water quality is monitored by the ARS, which publishes a dedicated site (eaudurobinet.re) where you can check each municipality. I don’t have the detail for the hotel’s area: reception will confirm.","de":"Die Qualität des Leitungswassers wird von der ARS überwacht, die eine eigene Seite (eaudurobinet.re) zur Abfrage Ihrer Gemeinde betreibt. Zu den Details für die Umgebung des Hotels habe ich keine Angaben: Die Rezeption bestätigt es Ihnen."},"source":"https://www.lareunion.ars.sante.fr/qualite-de-leau-du-robinet-la-reunion ; https://www.eaudurobinet.re (lu le 25/10/2026)"},{"id":"decalage","exemples":{"fr":["quel décalage horaire ?","on paie en euros ?","quelles prises électriques","carte d'identité suffit ?","enfants papiers"],"en":["Which currency and plugs?"],"de":["Welche Steckdosen?"]},"mots_ancres":["decalage:9","decalage horaire:9","time difference:9","zeitverschiebung:9","fuseau:8","time zone:8","zeitzone:8","euros:6","euro:5","monnaie:6","currency:6","waehrung:6","prise:5","prises:6","adaptateur:7","adapter:6","plugs:7","steckdose:7","steckdosen:7","passeport:7","passport:7","reisepass:7","visa:5","papiers:6","carte d identite:7","formalites:6"],"suggestions":["acces","meteo","humain"],"actions":[{"type":"lien","label":{"fr":"Formalités d’entrée (reunion.fr)","en":"Entry formalities (reunion.fr)","de":"Einreiseformalitäten (reunion.fr)"},"url":"https://www.reunion.fr/organisez/conseils-de-voyage/questions-reponses/les-formalites-d-entree-a-la-reunion/"},"tel:reception"],"statut":"valide","topic":{"fr":"Décalage horaire, monnaie, papiers","en":"Time difference, currency, papers","de":"Zeitverschiebung, Währung, Papiere"},"reponse":{"fr":"Heure : UTC+4, sans changement d’heure ; soit 3 h de plus qu’à Paris pendant l’heure d’hiver et 2 h de plus pendant l’heure d’été. Monnaie : l’euro (La Réunion est un département français). Pour les papiers d’entrée, cela dépend de votre nationalité : voir les formalités sur reunion.fr. Prises électriques : je n’ai pas de source officielle, la réception vous le confirme.","en":"Time: UTC+4, with no daylight-saving change; that is 3 hours ahead of Paris during winter time and 2 hours ahead during summer time. Currency: the euro (La Réunion is a French département). Entry papers depend on your nationality: see the formalities on reunion.fr. Power sockets: I have no official source, reception will confirm.","de":"Uhrzeit: UTC+4, ohne Zeitumstellung; das sind 3 Stunden mehr als in Paris während der Winterzeit und 2 Stunden mehr während der Sommerzeit. Währung: der Euro (La Réunion ist ein französisches Département). Die Einreisepapiere hängen von Ihrer Staatsangehörigkeit ab: siehe Einreiseformalitäten auf reunion.fr. Steckdosen: Ich habe keine offizielle Quelle, die Rezeption bestätigt es Ihnen."},"source":"https://www.reunion.fr/organisez/informations-utiles-avant-de-voyager/decalage-horaire/ ; https://www.reunion.fr/organisez/conseils-de-voyage/questions-reponses/les-formalites-d-entree-a-la-reunion/ (lu le 25/10/2026)"},{"id":"distances","exemples":{"fr":["c'est loin de Saint-Denis ?","temps pour aller au volcan","combien de km","route des Tamarins ?"],"en":[],"de":["Wie weit ist es vom Flughafen?"]},"mots_ancres":["combien de km:8","combien de kilometres:8","how many km:8","wie viele km:8","temps de trajet:8","bouchons:6","tamarins:6","trafic:4","saint denis:4","volcan:3","maido:4"],"suggestions":["acces","voiture","activites"],"actions":["tel:reception"],"statut":"valide","topic":{"fr":"Distances et temps de trajet","en":"Distances and travel times","de":"Entfernungen und Fahrzeiten"},"reponse":{"fr":"Ordres de grandeur (calcul d’itinéraire, sans trafic) : aéroport Roland-Garros → Saint-Leu centre ≈ 58 km, 1 h ; → Grande Anse (Petite-Île) ≈ 98 km, 1 h 20. Pierrefonds (Saint-Pierre) → Saint-Leu ≈ 28 km, 30 min ; → Grande Anse ≈ 20 km, 25 min. Saint-Leu ↔ Saint-Pierre ≈ 32 km, 25 min ; Grande Anse ↔ Saint-Pierre ≈ 11 km, 15 min. Saint-Leu → Maïdo ≈ 38 km, 1 h ; Grande Anse → Pas de Bellecombe (volcan) ≈ 59 km, 1 h 30. Selon la circulation. Distance officielle de l’hôtel : environ 1 h de route et 65 km depuis l’aéroport Roland-Garros.","en":"Rough orders of magnitude (route calculation, no traffic): Roland-Garros airport → Saint-Leu centre ≈ 58 km, 1 h; → Grande Anse (Petite-Île) ≈ 98 km, 1 h 20. Pierrefonds (Saint-Pierre) → Saint-Leu ≈ 28 km, 30 min; → Grande Anse ≈ 20 km, 25 min. Saint-Leu ↔ Saint-Pierre ≈ 32 km, 25 min; Grande Anse ↔ Saint-Pierre ≈ 11 km, 15 min. Saint-Leu → Maïdo ≈ 38 km, 1 h; Grande Anse → Pas de Bellecombe (volcano) ≈ 59 km, 1 h 30. Depending on traffic. Official distance from the hotel: about 1 hour by road and 65 km from Roland-Garros airport.","de":"Grobe Richtwerte (Routenberechnung, ohne Verkehr): Flughafen Roland-Garros → Saint-Leu Zentrum ≈ 58 km, 1 Std.; → Grande Anse (Petite-Île) ≈ 98 km, 1 Std. 20. Pierrefonds (Saint-Pierre) → Saint-Leu ≈ 28 km, 30 Min.; → Grande Anse ≈ 20 km, 25 Min. Saint-Leu ↔ Saint-Pierre ≈ 32 km, 25 Min.; Grande Anse ↔ Saint-Pierre ≈ 11 km, 15 Min. Saint-Leu → Maïdo ≈ 38 km, 1 Std.; Grande Anse → Pas de Bellecombe (Vulkan) ≈ 59 km, 1 Std. 30. Je nach Verkehr. Offizielle Entfernung des Hotels: etwa 1 Std. Fahrt und 65 km vom Flughafen Roland-Garros."},"source":"calcul d’itinéraire OSRM / OpenStreetMap du 25/10/2026 (ordre de grandeur, sans trafic) ; distances officielles de l’hôtel : https://palm.re/hotel/ , https://www.iloha.fr/contact/"},{"id":"voiture","exemples":{"fr":["faut-il louer une voiture ?","permis étranger accepté ?","routes difficiles ?"],"en":["Do I need a rental car?"],"de":[]},"mots_ancres":["louer:7","location:6","louer une voiture:9","location scooter:9","scooter:7","rental car:8","mietwagen:8","conduit:6","conduire:6","permis:6","car jaune:7","bus:3","routes:4","carburant:5","drive:4","fahren:3","rent a car:8"],"suggestions":["parking","acces","distances"],"actions":[{"type":"lien","label":{"fr":"Transports en commun depuis l’aéroport","en":"Public transport from the airport","de":"Öffentlicher Verkehr ab Flughafen"},"url":"https://www.reunion.aeroport.fr/passagers/transports/transports-en-commun"},"tel:reception"],"statut":"valide","topic":{"fr":"Voiture et transports","en":"Car and transport","de":"Auto und Verkehr"},"reponse":{"fr":"Plusieurs options pour venir et explorer l’île : la voiture de location pour une totale liberté, le réseau de bus (Car Jaune ; la ligne T relie l’aéroport à Saint-Pierre par la côte ouest), ou des navettes et transferts privés sur demande auprès de la réception. À l’Iloha : deux parkings gratuits et sécurisés ; sur place, restaurants, bar, spa et deux piscines pour profiter sans bouger. On roule à droite avec le code de la route français ; les routes des Cirques et du Volcan sont sinueuses.","en":"Several options to get here and explore the island: a rental car for total freedom, the bus network (Car Jaune; line T links the airport to Saint-Pierre along the west coast), or shuttles and private transfers on request via reception. At Iloha: two free, secure car parks; on site, restaurants, a bar, a spa and two pools to enjoy without going anywhere. Traffic drives on the right under French road rules; the roads in the Cirques and to the volcano are winding.","de":"Mehrere Möglichkeiten für Anreise und Ausflüge: ein Mietwagen für maximale Freiheit, das Busnetz (Car Jaune; die Linie T verbindet den Flughafen mit Saint-Pierre über die Westküste) oder Shuttles und private Transfers auf Anfrage über die Rezeption. Im Iloha: zwei kostenlose, gesicherte Parkplätze; vor Ort Restaurants, Bar, Spa und zwei Pools zum Genießen. Es herrscht Rechtsverkehr nach französischen Verkehrsregeln; die Straßen in den Talkesseln und zum Vulkan sind kurvig."},"source":"https://www.reunion.aeroport.fr/passagers/transports/transports-en-commun ; https://www.iloha.fr/questions-frequentes/ ; https://www.iloha.fr/contact/"},{"id":"rando","exemples":{"fr":["on peut faire de la plongée ?","rando facile ?","randonnée volcan","sécurité en rando","randonnées dans le coin"],"en":["Can I go diving?"],"de":["Kann man tauchen?"]},"mots_ancres":["plongee:7","plonger:7","diving:7","dive:5","tauchen:7","randonnee:7","rando:7","randonner:7","hiking:7","hike:6","wandern:7","wanderung:7","wanderwege:7","sentier:5","sentiers:5","trail:5","trails:5","niveau requis rando:9","plongee:4"],"suggestions":["activites","meteo","urgence"],"actions":[{"type":"lien","label":{"fr":"Vigilance Météo-France Réunion","en":"Météo-France weather alerts","de":"Météo-France Wetterwarnungen"},"url":"https://vigilance.meteofrance.fr/fr/la-reunion"},"tel:reception"],"statut":"valide","topic":{"fr":"Plongée et randonnée","en":"Diving and hiking","de":"Tauchen und Wandern"},"reponse":{"fr":"La plongée est possible (la préfecture précise que plongée et pêche sous-marine restent autorisées, aux risques et périls de chacun) ; des clubs proposent baptêmes et plongées à Saint-Leu et Saint-Gilles. Pour la randonnée, partez tôt (ciel plus dégagé le matin), renseignez-vous sur la météo et ne marchez pas en pré-alerte ou alerte cyclonique. Je n’annonce ni tarif ni recommandation de prestataire : la réception ou la conciergerie vous oriente.","en":"Diving is possible (the prefecture states that diving and spearfishing remain authorised, at each person’s own risk); clubs offer introductory and regular dives in Saint-Leu and Saint-Gilles. For hiking, start early (clearer skies in the morning), check the weather and do not hike during a cyclone pre-alert or alert. I quote no prices and recommend no operator: reception or the concierge will guide you.","de":"Tauchen ist möglich (die Präfektur stellt klar, dass Tauchen und Speerfischen erlaubt bleiben, auf eigene Gefahr); Clubs bieten Schnupper- und reguläre Tauchgänge in Saint-Leu und Saint-Gilles an. Beim Wandern früh starten (morgens klarerer Himmel), das Wetter prüfen und bei Zyklon-Vorwarnung oder -Alarm nicht wandern. Ich nenne keine Preise und empfehle keinen Anbieter: Rezeption oder Concierge beraten Sie."},"source":"https://www.reunion.gouv.fr/Actualites/Communiques-de-presse/Activites-nautiques-en-mer-vigilance-face-au-risque-requins ; https://www.reunion.fr/organisez/informations-utiles-avant-de-voyager/climat/ (lu le 25/10/2026)"},{"id":"urgence","exemples":{"fr":["numéro d'urgence ?","pharmacie","secours en montagne","urgences enfant"],"en":[],"de":[]},"mots_ancres":["urgence:8","urgences:8","emergency:8","notfall:8","samu:9","pompiers:8","medecin:7","doctor:7","arzt:7","pharmacie:8","pharmacy:8","apotheke:8","hospital:8","krankenhaus:8","secours:7","112:6","15:2","police:4","malade:5","blesse:5"],"suggestions":["humain","moustiques"],"actions":["tel:reception"],"statut":"valide","topic":{"fr":"Urgences et santé","en":"Emergencies and health","de":"Notfälle und Gesundheit"},"reponse":{"fr":"Urgences : SAMU 15, pompiers 18, police/gendarmerie 17 (numéros rappelés par reunion.fr). En cas d’urgence en montagne, appelez le 112. Pour un médecin ou une pharmacie de garde, la réception vous aide, 24h/24.","en":"Emergencies: SAMU (medical) 15, fire brigade 18, police/gendarmerie 17 (numbers listed by reunion.fr). For an emergency in the mountains, call 112. For a doctor or an on-duty pharmacy, reception will help, around the clock.","de":"Notfälle: SAMU (Rettungsdienst) 15, Feuerwehr 18, Polizei/Gendarmerie 17 (von reunion.fr genannte Nummern). Bei einem Notfall in den Bergen wählen Sie 112. Für Arzt oder Notdienstapotheke hilft Ihnen die Rezeption rund um die Uhr."},"source":"https://www.reunion.fr/organisez/conseils-de-voyage/questions-reponses/quelle-est-la-periode-des-cyclones-a-la-reunion/ ; https://fournaise.info/infos-pratiques/ (non officiel, à valider) (lu le 25/10/2026)","bonus":1.1},{"id":"taxe_sejour","exemples":{"fr":["la taxe de séjour est incluse ?","taxe de séjour ?","combien la taxe de séjour ?","tourist tax how much?"],"en":[],"de":[]},"mots_ancres":["taxe:8","taxe de sejour:10","sejour:2","kurtaxe:9","tourist tax:9","city tax:8","tax:5","steuer:5"],"suggestions":["annulation","paiement","prix"],"actions":[{"type":"lien","label":{"fr":"Conditions générales de vente","en":"Terms and conditions","de":"Allgemeine Geschäftsbedingungen"},"url":"https://www.iloha.fr/cgv/"},"tel:reception"],"statut":"valide","topic":{"fr":"Taxe de séjour","en":"Tourist tax","de":"Kurtaxe"},"reponse":{"fr":"La taxe de séjour n’est pas incluse dans le prix : elle est de 1,10 € par adulte et par jour (hôtel 3 étoiles), à régler au départ. Les mineurs en sont exonérés.","en":"The tourist tax is not included in the price: it is €1.10 per adult per day (3-star hotel), payable at departure. Minors are exempt.","de":"Die Kurtaxe ist im Preis nicht enthalten: Sie beträgt 1,10 € pro Erwachsenem und Tag (3-Sterne-Hotel) und ist bei der Abreise zu zahlen. Minderjährige sind befreit."},"source":"https://www.iloha.fr/cgv/ (lu le 25/10/2026)","bonus":1.15},{"id":"long_sejour","exemples":{"fr":["offre long séjour","remise pour une semaine","y a-t-il des réductions pour une semaine de séjour","je viens 10 jours, vous avez une remise ?","remise pour 2 semaines","tarif dégressif longue durée","réduction séjour longue durée","je reste 15 nuits, une réduc ?","20 % de remise c'est quoi","plus je reste longtemps moins je paye ?","remise 7 nuits","long séjour prix","un mois à l'hôtel c'est possible avec une remise","remise à partir de combien de nuits"],"en":["do you offer a discount for a week stay?","long stay discount","discount for 10 nights","I'm staying two weeks any discount","long-stay offer"],"de":["gibt es einen rabatt bei längerem aufenthalt?","langzeitangebot","rabatt für eine woche","rabatt bei 14 nächten","ich bleibe zwei wochen gibt es rabatt"]},"mots_ancres":["long sejour:5","longue duree:5","longs sejours:5","degressif:5","14 nuits:4","7 nuits:4","15 nuits:4","long stay:5","longer stay:5","langzeit*:5"],"suggestions":["offres","court_sejour","annulation"],"actions":[{"type":"lien","url":"https://www.iloha.fr/offres-speciales/long-sejour/","label":{"fr":"Offre long séjour","en":"Long-stay offer","de":"Langzeitangebot"}},"reserver"],"topic":{"fr":"Offre long séjour","en":"Long
