timent central, près des restaurants et de la piscine principale ;\n• Guetali : 16 chambres de 37 m² dans une villa créole à étage, kitchenette équipée sur la terrasse, 2 lits doubles 160 x 200 cm, jusqu’à 2 adultes + 2 enfants ou 2 adultes + 1 enfant + 1 bébé ; 8 à l’étage avec vue panoramique sur la mer, 8 au rez-de-chaussée avec accès direct à la piscine (transats) ;\n• Bungalow Tropique : 20 bungalows de 34 m², vue jardin, 1 lit double 180 x 200 cm + 1 banquette-lit 90 x 190 cm, 2 adultes + 1 enfant + 1 bébé, lit bébé sur demande, terrasse, parquet et boiserie ;\n• Bungalow Kitchenette : 20 bungalows de 32 m², vue jardin, même couchage, kitchenette équipée, terrasse de plain-pied ; trois sont accessibles aux personnes à mobilité réduite ;\n• Bungalow Famille : 55 m², 3 chambres (2 lits doubles 160 x 200 cm + 2 lits simples 90 x 190 cm), jusqu’à 4 adultes + 2 enfants + 2 bébés, kitchenette, terrasse avec table de 6 places et salon extérieur.","en":"Iloha has 82 rooms in a 3-hectare tropical garden, in 5 categories (natural materials, carefully designed interiors). All have free Wi-Fi, mini-fridge, air conditioning, HD TV, Nespresso machine, safe, telephone, courtesy tray, walk-in shower and hairdryer.\n• Standard: 17 m², 1 or 2 adults, non-smoking, 1 double bed 160 x 190 cm, furnished terrace; ground floor and upper floor of the central building, near the restaurants and main pool;\n• Guetali: 16 rooms of 37 m² in a two-storey Creole villa, equipped kitchenette on the terrace, 2 double beds 160 x 200 cm, up to 2 adults + 2 children or 2 adults + 1 child + 1 baby; 8 upstairs with panoramic sea view, 8 on the ground floor with direct pool access (sun loungers);\n• Tropique bungalow: 20 bungalows of 34 m², garden view, 1 double bed 180 x 200 cm + 1 sofa-bed 90 x 190 cm, 2 adults + 1 child + 1 baby, baby cot on request, terrace, parquet and woodwork;\n• Kitchenette bungalow: 20 bungalows of 32 m², garden view, same bedding, equipped kitchenette, ground-level terrace; three are accessible to people with reduced mobility;\n• Family bungalow: 55 m², 3 bedrooms (2 double beds 160 x 200 cm + 2 single beds 90 x 190 cm), up to 4 adults + 2 children + 2 babies, kitchenette, terrace with a 6-seat table and outdoor lounge.","de":"Iloha hat 82 Zimmer in einem 3 Hektar großen tropischen Garten, in 5 Kategorien (natürliche Materialien, liebevoll gestaltet). Alle haben kostenloses WLAN, Minikühlschrank, Klimaanlage, HD-Fernseher, Nespresso-Maschine, Safe, Telefon, Begrüßungstablett, ebenerdige Dusche und Haartrockner.\n• Standard: 17 m², 1 oder 2 Erwachsene, rauchfrei, 1 Doppelbett 160 x 190 cm, möblierte Terrasse; Erd- und Obergeschoss des Hauptgebäudes, nahe den Restaurants und dem Hauptpool;\n• Guetali: 16 Zimmer à 37 m² in einer kreolischen Villa mit Obergeschoss, ausgestattete Küchenzeile auf der Terrasse, 2 Doppelbetten 160 x 200 cm, bis zu 2 Erwachsene + 2 Kinder oder 2 Erwachsene + 1 Kind + 1 Baby; 8 im Obergeschoss mit Panorama-Meerblick, 8 im Erdgeschoss mit direktem Poolzugang (Liegen);\n• Bungalow Tropique: 20 Bungalows à 34 m², Gartenblick, 1 Doppelbett 180 x 200 cm + 1 Schlafsofa 90 x 190 cm, 2 Erwachsene + 1 Kind + 1 Baby, Babybett auf Anfrage, Terrasse, Parkett und Holzvertäfelung;\n• Bungalow Kitchenette: 20 Bungalows à 32 m², Gartenblick, gleiche Betten, ausgestattete Küchenzeile, ebenerdige Terrasse; drei sind für Menschen mit eingeschränkter Mobilität zugänglich;\n• Bungalow Famille: 55 m², 3 Schlafzimmer (2 Doppelbetten 160 x 200 cm + 2 Einzelbetten 90 x 190 cm), bis zu 4 Erwachsene + 2 Kinder + 2 Babys, Küchenzeile, Terrasse mit 6-Personen-Tisch und Außensalon."},"statut":"valide","bonus":0.7},{"id":"restauration_horaires_tarifs","exemples":{"fr":["à quelle heure le petit déjeuner","petit déjeuner dès 6h","prix du petit déjeuner","petit dej combien","petit déjeuner enfant prix","petit déjeuner 19 euros","petit déjeuner jusqu'à quelle heure","horaires du restaurant","horaires du déjeuner","horaires du dîner","le restaurant ferme à quelle heure","heure du dernier service","dîner jusqu'à 21h","déjeuner 12h","soirée créole","soirée créole vendredi","prix de la soirée créole","soirée créole enfant","buffet à volonté 45 euros","buffet vendredi soir","spectacle créole","danses traditionnelles","trattoria horaires","trattoria vendredi samedi","la trattoria est ouverte le dimanche","trattoria service continu","restaurant à partager","leu bar","horaires du bar","le bar ouvre à quelle heure","bar ouvert jusqu'à quelle heure","cocktails au rhum","cocktail rhum réunionnais","tapas maison","café crème fouettée","chocolat chaud","cocktail amaretto","cognac au bar","rhum arrangé","rhums arrangés","le glacier horaires","glaces artisanales","quels parfums de glace","glace goyavier","glace pitaya","glace ananas victoria","glace letchi","glace tangor","coupe glacée","composer sa glace","glace maison","macaron maison","chantilly maison","tarif enfant petit déjeuner","enfant moins de 13 ans prix","menu enfant","la trattoria est ouverte quels jours"],"en":["breakfast time","breakfast price","children’s breakfast price","restaurant opening hours","Creole evening price","Creole evening Friday","Trattoria hours","bar opening hours","ice cream flavours","what ice cream flavours do you have","rum cocktails","whipped coffee"],"de":["Frühstückszeit","Frühstückspreis","Kinderfrühstück Preis","Öffnungszeiten Restaurant","Preis kreolischer Abend","kreolischer Abend Freitag","Trattoria Öffnungszeiten","Öffnungszeiten Bar","Eissorten","Rum Cocktails"]},"mots_ancres":["petit dej:5","fruehstueck:5","leu bar:9","eissorten:7","tangor:8","rhums arranges:8","amaretto:8","cognac:7","cafe creme:7","dernier service:7","moins de 13:6","unter 13:6","under 13:6"],"suggestions":["restaurants","buffet","bar"],"actions":["tel:resto","mail:resto",{"type":"lien","url":"https://www.iloha.fr/restauration/","label":{"fr":"Restauration","en":"Dining","de":"Gastronomie"}}],"service":"Restauration","source":"https://www.iloha.fr/restauration/","topic":{"fr":"Restauration : horaires, petit-déjeuner, Leu Bar, glacier, soirée créole","en":"Dining: hours, breakfast, Leu Bar, ice-cream parlour, Creole evening","de":"Gastronomie: Zeiten, Frühstück, Leu Bar, Eisdiele, kreolischer Abend"},"reponse":{"fr":"Tout est publié sur la page Restauration :\n• Kotémer (au bord de la piscine, terrasse ombragée, tous les jours, sur réservation) : petit-déjeuner 6h00-10h00 (19 € par adulte, 10 € par enfant de moins de 13 ans), déjeuner 12h-14h, dîner 19h-21h ; cuisine inventive et métissée du Chef Exécutif Kevene Marimoutou, produits frais, locaux et de saison ;\n• Soirée créole : chaque vendredi dès 19h au Kotémer, buffet à volonté de spécialités réunionnaises avec musiques et danses traditionnelles, 45 € par adulte et 18 € par enfant (moins de 13 ans) ;\n• La Trattoria (restaurant à partager, terrasse panoramique sur la baie de Saint-Leu) : vendredi et samedi, service continu de 14h à 21h, sur réservation ;\n• Leu Bar (à côté de la piscine principale) : service continu de 10h à 21h30, cocktails à base de rhum de La Réunion, jus de fruits frais, tapas maison, cafés (café crème fouettée, chocolat), cocktails au vieux rhum, cognac ou amaretto ; salon avec billard et exposition de rhums arrangés ;\n• Le glacier : service continu de 10h à 21h30, glaces artisanales maison (goyavier, tangor, mangue, letchis, pitaya, ananas Victoria ; chocolat, vanille, café, fraise), coupes originales ou assortiment à composer, avec chantilly maison, fruits frais ou macaron maison.\nRéservation : +262 (0)262 34 89 89 ou restaurant@iloha.fr.","en":"All published on the Dining page:\n• Kotémer (by the pool, shaded terrace, every day, by reservation): breakfast 6:00-10:00am (€19 per adult, €10 per child under 13), lunch 12-2pm, dinner 7-9pm; inventive blended cuisine by Executive Chef Kevene Marimoutou, fresh, local, seasonal produce;\n• Creole evening: every Friday from 7pm at the Kotémer, all-you-can-eat buffet of Réunion specialities with traditional music and dance, €45 per adult and €18 per child (under 13);\n• La Trattoria (sharing-style restaurant, panoramic terrace over Saint-Leu bay): Friday and Saturday, continuous service 2-9pm, by reservation;\n• Leu Bar (next to the main pool): continuous service 10am-9:30pm, cocktails made with Réunion rum, fresh fruit juices, homemade tapas, coffees (whipped café crème, chocolate), cocktails with aged rum, cognac or amaretto; lounge with billiards and a display of arranged rums;\n• The ice-cream parlour: continuous service 10am-9:30pm, homemade artisan ice creams (guava, tangor, mango, lychee, dragon fruit, Victoria pineapple; chocolate, vanilla, coffee, strawberry), original sundaes or a mix of flavours of your choice, with homemade whipped cream, fresh fruit or homemade macaron.\nBooking: +262 (0)262 34 89 89 or restaurant@iloha.fr.","de":"Alles auf der Seite Gastronomie veröffentlicht:\n• Kotémer (am Pool, schattige Terrasse, täglich, mit Reservierung): Frühstück 6:00-10:00 Uhr (19 € pro Erwachsenem, 10 € pro Kind unter 13 Jahren), Mittagessen 12-14 Uhr, Abendessen 19-21 Uhr; einfallsreiche Mischküche von Küchenchef Kevene Marimoutou, frische, regionale Saisonprodukte;\n• Kreolischer Abend: jeden Freitag ab 19 Uhr im Kotémer, Buffet à discrétion mit Spezialitäten von La Réunion, mit traditioneller Musik und Tanz, 45 € pro Erwachsenem und 18 € pro Kind (unter 13);\n• La Trattoria (Restaurant zum Teilen, Panoramaterrasse über der Bucht von Saint-Leu): Freitag und Samstag, durchgehend 14-21 Uhr, mit Reservierung;\n• Leu Bar (neben dem Hauptpool): durchgehend 10-21:30 Uhr, Cocktails mit Rum von La Réunion, frische Fruchtsäfte, hausgemachte Tapas, Kaffeespezialitäten (Café crème mit Schlagsahne, Schokolade), Cocktails mit altem Rum, Cognac oder Amaretto; Salon mit Billard und Ausstellung von Rumspezialitäten;\n• Die Eisdiele: durchgehend 10-21:30 Uhr, hausgemachtes handwerkliches Eis (Guave, Tangor, Mango, Litschi, Drachenfrucht, Ananas Victoria; Schokolade, Vanille, Kaffee, Erdbeere), originelle Eisbecher oder frei gewählte Sorten, mit hausgemachter Schlagsahne, frischen Früchten oder Macaron.\nReservierung: +262 (0)262 34 89 89 oder restaurant@iloha.fr."},"statut":"valide","bonus":0.7},{"id":"hotels_and_co_groupe","exemples":{"fr":["vous recrutez ?","offres d'emploi","travailler à l'hôtel","postuler chez iloha","candidature spontanée","envoyer mon cv","cv","stage à l'hôtel","je cherche un stage","je cherche un emploi","recrutement","rejoindre l'équipe","rejoignez-nous","hotels & co","hotels and co","le groupe de l'hôtel","à qui appartient l'hôtel","quel est le palm","palm hotel & spa","le palm 5 étoiles","l'autre hôtel du groupe","vous avez un autre hôtel ?","akea c'est quoi","marque akea","valeurs de l'hôtel","conditions de travail","semaine de 4 jours","intéressement","droit à la déconnexion","droit à l'erreur","combien de personnes travaillent à l'hôtel","employés depuis 25 ans","témoignages employés","équipe de l'hôtel","le Palm c'est le même groupe ?"],"en":["are you hiring","job offers","work at the hotel","send my CV","internship at the hotel","Hotels & Co","which group owns the hotel","what is the Palm","your other hotel","what is Akea"],"de":["stellen Sie ein","Stellenangebote","im Hotel arbeiten","Initiativbewerbung","Praktikum im Hotel","Hotels & Co","zu welcher Gruppe gehört das Hotel","was ist das Palm","Ihr anderes Hotel","was ist Akea"]},"mots_ancres":["hotels & co:9","hotels co:9","recrut*:8","emploi*:7","candidature*:8","postuler:8","stage:4","cv:4","bewerbung*:7","stellenangebot*:8","praktikum:6","hiring:7","job:3","jobs:3","palm:5","interessement:7","deconnexion:6","semaine de 4 jours:8","droit a l erreur:8","travailler a l hotel:8","working at:4"],"suggestions":["histoire","ecolabel_rse","etoiles"],"actions":[{"type":"lien","url":"https://www.iloha.fr/rejoignez-nous/","label":{"fr":"Rejoignez-nous","en":"Join us","de":"Karriere"}},"mail:reception"],"service":"Hôtel","source":"https://www.iloha.fr/rejoignez-nous/ ; https://www.iloha.fr/hotel/","topic":{"fr":"Hotels & Co, le groupe : Palm, Akéa et rejoindre l’équipe","en":"Hotels & Co group: Palm, Akéa and joining the team","de":"Hotels & Co: Palm, Akéa und Teamstellen"},"reponse":{"fr":"Hotels & Co est la marque d’un esprit hôtelier unique, inscrite dans une démarche de développement durable à La Réunion. Elle s’exprime à travers 2 hôtels, ILOHA Seaview Hotel (3*) et PALM Hotel & Spa (5*), ainsi que sa marque de spa et de bien-être AKEA. Valeurs : qualité de service, satisfaction des clients, respect de l’environnement, épanouissement professionnel. Pour rejoindre l’équipe : la page « Rejoignez-nous » présente les offres d’emploi et un formulaire de candidature spontanée. Parmi les pratiques citées : recrutement par appétences et collégial, intéressement sur résultats, semaine de 4 jours dans certains services, suppression des horaires de coupure, droit à la déconnexion, droit à l’erreur, priorité aux promotions internes. Des collaboratrices témoignent : l’une a débuté son stage à l’ouverture de l’hôtel il y a 25 ans, une autre travaille à Iloha depuis 21 ans et manage aujourd’hui plusieurs équipes.","en":"Hotels & Co is the brand of a unique hospitality spirit, committed to sustainable development in La Réunion. It is expressed through 2 hotels, ILOHA Seaview Hotel (3*) and PALM Hotel & Spa (5*), plus its spa and wellness brand AKEA. Values: quality of service, guest satisfaction, respect for the environment, professional fulfilment. To join the team: the “Rejoignez-nous” page lists job offers and an unsolicited-application form. Practices mentioned: collegial, aptitude-based recruitment, profit-sharing, 4-day week in some departments, no split shifts, right to disconnect, right to make mistakes, priority to internal promotion. Team members testify: one started an internship when the hotel opened 25 years ago, another has worked at Iloha for 21 years and now manages several teams.","de":"Hotels & Co ist die Marke eines einzigartigen Hotelgeists, der sich auf La Réunion der nachhaltigen Entwicklung verschrieben hat. Sie umfasst 2 Hotels, ILOHA Seaview Hotel (3*) und PALM Hotel & Spa (5*), sowie die Spa- und Wellnessmarke AKEA. Werte: Servicequalität, Gästezufriedenheit, Respekt vor der Umwelt, berufliche Entfaltung. Wer zum Team gehören möchte: Die Seite „Rejoignez-nous“ zeigt Stellenangebote und ein Formular für Initiativbewerbungen. Genannte Praktiken: kollegiale, neigungsorientierte Einstellung, Erfolgsbeteiligung, 4-Tage-Woche in einigen Bereichen, keine geteilten Dienste, Recht auf Nichterreichbarkeit, Recht auf Fehler, Vorrang für interne Beförderung. Mitarbeiterinnen berichten: Eine begann ihr Praktikum bei der Eröffnung des Hotels vor 25 Jahren, eine andere arbeitet seit 21 Jahren im Iloha und leitet heute mehrere Teams."},"statut":"valide","bonus":1}],"populaires":["checkin","hebergements","restaurants","spa","daypass","activites","humain"],"contacts":{"reception":{"nom":{"fr":"Réception","en":"Reception","de":"Rezeption"},"tel":"+262262348989","tel_aff":"+262 (0)262 34 89 89","mail":"restaurant@iloha.fr","horaires":{"fr":"24h/24","en":"24/7","de":"rund um die Uhr"},"whatsapp":"+262693828108"},"spa":{"nom":{"fr":"Spa Cas’Akea","en":"Cas’Akea spa","de":"Spa Cas’Akea"},"tel":"+262262444440","tel_aff":"+262 (0)262 44 44 40","mail":"akea@iloha.fr","horaires":{"fr":"tous les jours 9h-19h","en":"daily 9 am–7 pm","de":"täglich 9–19 Uhr"}},"resto":{"nom":{"fr":"Restaurants","en":"Restaurants","de":"Restaurants"},"tel":"+262262348989","tel_aff":"+262 (0)262 34 89 89","mail":"restaurant@iloha.fr"}},"liens":{"reserver":{"url":"https://www.iloha.fr/","label":{"fr":"Réserver sur iloha.fr","en":"Book on iloha.fr","de":"Auf iloha.fr buchen"}},"itineraire":{"query":"44 rue Georges Pompidou, Pointe des Châteaux, 97436 Saint-Leu, La Réunion"},"site":{"fr":"https://www.iloha.fr/","en":"https://www.iloha.fr/en/","de":"https://www.iloha.fr/de/"}},"cartes":{},"speciaux":{"inconnu":{   sugg.addEventListener('click', function (e) { var b = e.target.closest('button.chip'); if (b) showById(b.dataset.id, b.textContent); });
  form.addEventListener('submit', function (e) { e.preventDefault(); ask(input.value); });
  Array.prototype.forEach.call(document.querySelectorAll('.lg'), function (b) { b.addEventListener('click', function () { setLang(b.dataset.l); welcome(); }); });
  $('restart').addEventListener('click', function () { try { sessionStorage.removeItem(KEY); } catch (e) {} welcome(); });

  /* ouvrir / fermer : bulle = bascule, × visible, voile (mobile), Échap, retour Android */
  var veil = $('veil'), touch = window.matchMedia ? window.matchMedia('(pointer:coarse)').matches : false, pushed = false;
  function isOpen() { return !root.hidden; }
  function openChat() {
    if (isOpen()) return;
    root.hidden = false; root.classList.add('open'); bubble.classList.add('on'); bubble.setAttribute('aria-expanded', 'true'); bubble.setAttribute('aria-label', t('close'));
    teaser.classList.add('hide'); if (mq.matches) veil.hidden = false;
    if (!log.children.length) welcome(); scroll();
    try { history.pushState({ tk: 1 }, ''); pushed = true; } catch (e) {}
    // sur mobile, pas de clavier à l'ouverture : le visiteur lit d'abord l'accueil
    if (!touch) setTimeout(function () { input.focus({ preventScroll: true }); }, 80);
  }
  function closeChat(fromPop) {
    if (!isOpen()) return;
    input.blur(); root.classList.remove('open', 'kb'); root.style.height = root.style.top = root.style.bottom = ''; root.hidden = true; veil.hidden = true;
    bubble.classList.remove('on'); bubble.setAttribute('aria-expanded', 'false'); bubble.setAttribute('aria-label', t('open'));
    if (pushed && !fromPop) { pushed = false; try { history.back(); } catch (e) {} } else pushed = false;
    bubble.focus({ preventScroll: true });
  }
  bubble.addEventListener('click', function () { isOpen() ? closeChat() : openChat(); });
  $('closeBtn').addEventListener('click', function () { closeChat(); }); veil.addEventListener('click', function () { closeChat(); });
  window.addEventListener('popstate', function () { if (isOpen()) closeChat(true); });
  $('teaser-open').addEventListener('click', openChat); $('teaser-x').addEventListener('click', function (e) { e.stopPropagation(); teaser.classList.add('hide'); try { sessionStorage.setItem('tk-teaser', '1'); } catch (x) {} });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && isOpen()) closeChat(); });
  $('expand').addEventListener('click', function () { root.classList.toggle('wide'); $('expand').setAttribute('aria-pressed', root.classList.contains('wide') ? 'true' : 'false'); });
  var ap = $('apercu-x'); if (ap) ap.addEventListener('click', function () { $('apercu').classList.add('hide'); });
  // accroche : une fois par visite, après 4 s, seulement si la fenêtre est fermée
  var seen = false; try { seen = sessionStorage.getItem('tk-teaser') === '1'; } catch (e) {}
  if (!seen) setTimeout(function () { if (!isOpen() && window.innerHeight > 480) { teaser.classList.remove('hide'); try { sessionStorage.setItem('tk-teaser', '1'); } catch (e) {} } }, 4000);

  /* clavier mobile : la fenêtre épouse la zone réellement visible (iOS ne réduit pas 100dvh) */
  var vv = window.visualViewport, baseH = window.innerHeight;
  window.addEventListener('orientationchange', function () { setTimeout(function () { if (document.activeElement !== input) baseH = window.innerHeight; fit(); }, 400); });
  function fit() {
    if (!vv || !mq.matches || !isOpen()) return;
    // clavier = zone visible nettement plus petite que l'écran au chargement, saisie active (iOS : innerHeight fixe ; Android : innerHeight réduit)
    var kb = document.activeElement === input && (baseH - vv.height > 120 || window.innerHeight - vv.height > 120);
    if (kb) { root.classList.add('kb'); root.style.height = vv.height + 'px'; root.style.top = vv.offsetTop + 'px'; root.style.bottom = 'auto'; }
    else { root.classList.remove('kb'); root.style.height = root.style.top = root.style.bottom = ''; }
    scroll();
  }
  if (vv) { vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); } window.addEventListener('resize', fit);
  input.addEventListener('focus', function () { setTimeout(fit, 60); setTimeout(fit, 350); });
  input.addEventListener('blur', function () { setTimeout(function () { fit(); if (!root.classList.contains('kb')) baseH = Math.max(baseH, window.innerHeight); }, 150); });
  window.__chatFit = fit;

  /* saisie vocale facultative (Web Speech API) */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition, mic = $('mic');
  if (!SR) mic.hidden = true; else {
    var rec = null, on = false;
    mic.addEventListener('click', function () {
      if (on && rec) { rec.stop(); return; }
      try { rec = new SR(); rec.lang = { fr: 'fr-FR', en: 'en-GB', de: 'de-DE' }[lang]; rec.interimResults = true; rec.maxAlternatives = 1;
        rec.onstart = function () { on = true; mic.classList.add('on'); input.placeholder = t('micOn'); };
        rec.onresult = function (ev) { var s = ''; for (var i = 0; i < ev.results.length; i++) s += ev.results[i][0].transcript; input.value = s; if (ev.results[ev.results.length - 1].isFinal) { rec.stop(); ask(s); } };
        rec.onend = function () { on = false; mic.classList.remove('on'); input.placeholder = t('placeholder'); };
        rec.onerror = function () { on = false; mic.classList.remove('on'); input.placeholder = t('placeholder'); };
        rec.start(); } catch (e) { mic.hidden = true; }
    });
  }
  window.__chatTest = { ask: ask, open: openChat, close: closeChat, setLang: setLang, engine: ENG };
  var rl = restore(); if (rl) { lang = rl; } setLang(lang, true);
  if (/[?&]open=1/.test(location.search)) openChat();
})();
</script>
