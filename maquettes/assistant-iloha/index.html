la-nouvelle-carte-du-kotemer/ ; https://www.iloha.fr/restauration/","topic":{"fr":"La carte du Kotémer et le chef","en":"The Kotémer menu and the chef","de":"Die Karte des Kotémer und der Küchenchef"},"reponse":{"fr":"Le Kotémer a dévoilé une nouvelle carte créative, locale et de saison, mariant tradition réunionnaise et inspirations du monde :\n• Entrées : tataki de thon au galabé, gaspacho et mozzarella basilic, œuf mollet de la ferme Mon Repos revisité (sauce meurette au foie gras) ;\n• Mer : pêches locales à la plancha, légine rôtie au condiment vindaye, zourite grillé avec rougail bringelle et vierge de tomates ;\n• Viandes : suprême de volaille bio du Tampon, entrecôte de bœuf Simmental, filet de bœuf au foie gras poêlé ;\n• Caris emblématiques : rougail saucisse, cari poulet fermier, langouste ;\n• Desserts : moelleux au chocolat Guanaja, baba à la créole (banane, rhum), ananas rôti et espuma passion, création citron-poire-basilic.\nLe Kotémer est ouvert tous les jours de 12h à 14h et de 19h à 21h. Du lundi au vendredi, une formule du midi est proposée (plat du jour 24 €, ou plat du jour + dessert + café 29 €) et la carte est renouvelée chaque semaine. Le Chef Exécutif de l’hôtel est Kevene Marimoutou. Pour réserver :","en":"The Kotémer has unveiled a new creative, local and seasonal menu blending Réunion tradition with world inspirations:\n• Starters: tuna tataki with galabé, gazpacho and basil mozzarella, soft-boiled egg from Mon Repos farm revisited (meurette sauce with foie gras);\n• Seafood: local catch on the plancha, roast toothfish with vindaye condiment, grilled octopus with aubergine rougail and tomato vierge;\n• Meat: organic chicken breast from Le Tampon, Simmental beef rib steak, beef fillet with pan-fried foie gras;\n• Signature curries: sausage rougail, free-range chicken curry, lobster;\n• Desserts: Guanaja chocolate fondant, Creole baba (banana, rum), roasted pineapple with passion-fruit espuma, lemon-pear-basil creation.\nThe Kotémer is open every day 12–2pm and 7–9pm. Monday to Friday there is a lunch set menu (dish of the day €24, or dish of the day + dessert + coffee €29) and the menu is renewed every week. The hotel’s Executive Chef is Kevene Marimoutou. To book:","de":"Das Kotémer hat eine neue kreative, regionale Saisonkarte vorgestellt, die Réunion-Tradition mit internationalen Einflüssen verbindet:\n• Vorspeisen: Thunfisch-Tataki mit Galabé, Gazpacho und Mozzarella-Basilikum, weich gekochtes Ei vom Hof Mon Repos neu interpretiert (Meurette-Sauce mit Foie gras);\n• Meer: lokaler Fang von der Plancha, gebratener Schwarzer Seehecht mit Vindaye-Würze, gegrillter Oktopus mit Auberginen-Rougail und Tomaten-Vierge;\n• Fleisch: Bio-Hähnchenbrust aus Le Tampon, Simmental-Entrecôte, Rinderfilet mit gebratener Foie gras;\n• Typische Currys: Rougail Saucisse, Landhuhn-Curry, Languste;\n• Desserts: Schokoladenfondant Guanaja, Baba auf kreolische Art (Banane, Rum), gerösteter Ananas mit Passionsfrucht-Espuma, Kreation aus Zitrone, Birne und Basilikum.\nDas Kotémer ist täglich von 12 bis 14 Uhr und von 19 bis 21 Uhr geöffnet. Montag bis Freitag gibt es ein Mittagsmenü (Tagesgericht 24 €, oder Tagesgericht + Dessert + Kaffee 29 €); die Karte wird jede Woche erneuert. Küchenchef (Executive Chef) des Hotels ist Kevene Marimoutou. Reservierung:"},"statut":"valide","bonus":0.7},{"id":"grand_boucan","exemples":{"fr":["le grand boucan","grand boucan","c'est quoi le grand boucan","carnaval à la réunion","carnaval de saint-paul","carnaval saint gilles","défilé de chars","roi dodo","embrasement du roi dodo","feu d'artifice saint paul","quand a lieu le grand boucan","date du grand boucan","grand boucan 2026","grand boucan 2027","prochain grand boucan","comment aller au grand boucan","navette grand boucan","navettes la fêt","parking grand boucan","se garer au grand boucan","faut-il se déguiser","venir déguisé","séjour pendant le grand boucan","hôtel pour le grand boucan","fête à saint-paul","événements à la réunion","festival à saint paul","saint leu saint paul distance","loin du grand boucan ?","compagnie pôle sud","kar ouest navette","thème du grand boucan"],"en":["grand boucan","what is the grand boucan","carnival in reunion","when is the grand boucan","how to get to the grand boucan","shuttle for the grand boucan","parking for the grand boucan","do I need a costume"],"de":["Grand Boucan","was ist der Grand Boucan","Karneval auf La Réunion","wann ist der Grand Boucan","Shuttle zum Grand Boucan","Parken beim Grand Boucan","Kostüm Karneval"]},"mots_ancres":["grand boucan:9","boucan:6","carnaval:6","karneval:6","roi dodo:8","dodo:6","la fet:6","pole sud:6","karouest:5","kar ouest:5"],"suggestions":["activites","semaine_ouest","evenements_en_cours"],"actions":["tel:reception",{"type":"lien","url":"https://www.iloha.fr/actualites/le-grand-boucan/","label":{"fr":"Article","en":"Article","de":"Artikel"}}],"service":"Activités","source":"https://www.iloha.fr/actualites/le-grand-boucan/","topic":{"fr":"Le Grand Boucan (carnaval de Saint-Paul)","en":"The Grand Boucan (Saint-Paul carnival)","de":"Der Grand Boucan (Karneval in Saint-Paul)"},"reponse":{"fr":"Le Grand Boucan est l’un des événements les plus festifs de La Réunion : un carnaval local avec défilé de chars et de costumes, musique, danse, embrasement du Roi Dodo et feu d’artifice. Créé en 1997 et longtemps organisé à Saint-Gilles-les-Bains, il a lieu désormais sur le front de mer de Saint-Paul, organisé par la Compagnie Pôle Sud. Pour l’édition du 28 juin 2026 (thème « Illusions et monde surréel »), le programme (à confirmer) prévoyait : 14h départ du défilé depuis la médiathèque Leconte de Lisle, 19h30 spectacle de feu et embrasement du Roi Dodo, 20h30 concerts.\nSaint-Leu est à moins de 30 minutes de Saint-Paul : on profite de la fête, puis on retrouve le calme de l’hôtel. Conseils publiés : anticiper le trajet (front de mer généralement fermé à la circulation), navettes gratuites « Navettes La Fêt’ » du réseau Kar’Ouest lors de la dernière édition (de 12h à minuit ; reconduction à confirmer), parkings relais (Run Market Savanna, Parc Expobat au nord ; collège des Aigrettes, Intermark au sud), et venir déguisé fait partie de l’ambiance. Les dates des prochaines éditions ne sont pas encore publiées : la réception vous renseigne.","en":"The Grand Boucan is one of Réunion’s most festive events: a local carnival with a parade of floats and costumes, music, dance, the burning of the Dodo King and fireworks. Created in 1997 and long held in Saint-Gilles-les-Bains, it now takes place on the Saint-Paul seafront, organised by Compagnie Pôle Sud. For the 28 June 2026 edition (theme “Illusions and surreal world”), the programme (to be confirmed) planned: 2pm parade departure from the Leconte de Lisle media library, 7:30pm fire show and burning of the Dodo King, 8:30pm concerts.\nSaint-Leu is less than 30 minutes from Saint-Paul: enjoy the festival, then return to the hotel’s calm. Published tips: plan your trip ahead (seafront closed to traffic), free “Navettes La Fêt’” shuttles by the Kar’Ouest network at the last edition (noon to midnight), park-and-ride car parks (Run Market Savanna, Parc Expobat to the north; collège des Aigrettes, Intermark to the south), and dressing up is part of the fun. Dates of future editions are not yet published: reception can advise you.","de":"Der Grand Boucan ist eines der festlichsten Ereignisse auf La Réunion: ein lokaler Karneval mit Umzug von Wagen und Kostümen, Musik, Tanz, Verbrennung des Dodo-Königs und Feuerwerk. 1997 gegründet und lange in Saint-Gilles-les-Bains veranstaltet, findet er jetzt an der Strandpromenade von Saint-Paul statt, organisiert von der Compagnie Pôle Sud. Für die Ausgabe am 28. Juni 2026 (Thema „Illusionen und surreale Welt“) war (vorbehaltlich Bestätigung) geplant: 14 Uhr Umzugsstart an der Mediathek Leconte de Lisle, 19:30 Uhr Feuershow und Verbrennung des Dodo-Königs, 20:30 Uhr Konzerte.\nSaint-Leu liegt weniger als 30 Minuten von Saint-Paul entfernt: Sie genießen das Fest und finden danach die Ruhe des Hotels. Veröffentlichte Tipps: Anfahrt rechtzeitig planen (Promenade für den Verkehr gesperrt), kostenlose „Navettes La Fêt’“ des Netzes Kar’Ouest bei der letzten Ausgabe (12 Uhr bis Mitternacht), Park-and-Ride-Parkplätze (Run Market Savanna, Parc Expobat im Norden; Collège des Aigrettes, Intermark im Süden); Verkleiden gehört zur Stimmung. Die Termine künftiger Ausgaben sind noch nicht veröffentlicht: die Rezeption berät Sie."},"statut":"valide","bonus":0.7},{"id":"ouest_climat_plages","exemples":{"fr":["quel temps fait-il en hiver","température de la mer","quelle température la nuit","il fait combien dans les hauts","température dans les hauts","il fait froid en altitude ?","plage de l'hermitage","hermitage","snorkeling à l'hermitage","où faire du snorkeling","on peut voir des poissons ?","palmes masque tuba","plage pour les enfants","plage de boucan canot","piscine naturelle boucan canot","où voir le coucher de soleil","plongée à saint-gilles","plongée sous-marine","faire de la plongée","voir des dauphins","sortie dauphins","parapente à saint-leu","addict parapente","réserver un vol en parapente","conciergerie pour réserver une activité","randonnée facile","quelles randonnées","chemin pavé","chemin des anglais","bassin vital","boucle du bassin vital","piton maïdo","maïdo lever du soleil","cirque de mafate","marché de saint-paul","marché de saint-leu","horaires du marché de saint leu","marché du samedi","jour de marché","marché forain vendredi","où acheter des samoussas","que faire à la réunion en famille","que faire autour de l'hôtel","idées de sorties dans l'ouest"],"en":["hermitage beach","where to snorkel","water temperature","how cold is it in the mountains","paragliding in saint-leu","which hikes do you recommend","maido viewpoint","saint-leu market hours","saint-paul market","diving in saint-gilles","boucan canot beach"],"de":["Strand L’Hermitage","wo schnorcheln","Wassertemperatur","Gleitschirmfliegen Saint-Leu","welche Wanderungen","Maïdo Aussichtspunkt","Markt Saint-Leu Öffnungszeiten","Markt Saint-Paul","Tauchen Saint-Gilles","Boucan Canot Strand"]},"mots_ancres":["hermitage:7","boucan canot:8","snorkeling:6","schnorcheln:6","tauchen:5","parapente:5","gleitschirm*:5","addict:7","chemin pave:8","chemin des anglais:8","bassin vital:8","mafate:6","marche de saint:6","marche:3","markt:3","randonnee*:4","wanderung*:4","dauphin*:5","delfin*:5"],"suggestions":["semaine_ouest","activites","plage"],"actions":["tel:reception",{"type":"lien","url":"https://www.iloha.fr/actualites/que-faire-pendant-les-grandes-vacances/","label":{"fr":"Article","en":"Article","de":"Artikel"}}],"service":"Activités","source":"https://www.iloha.fr/actualites/que-faire-pendant-les-grandes-vacances/","topic":{"fr":"L’Ouest : climat, plages, snorkeling, randonnées","en":"The West: climate, beaches, snorkelling, hikes","de":"Der Westen: Klima, Strände, Schnorcheln, Wanderungen"},"reponse":{"fr":"Ce que l’hôtel publie sur l’Ouest de La Réunion :\n• Climat : sur le littoral, 22 à 24 °C (rarement moins de 20 °C la nuit), mer autour de 22 °C ; dans les hauts, 5 à 15 °C ;\n• Plage de l’Hermitage : lagon protégé aux eaux calmes, idéal en famille et pour le snorkeling (poissons tropicaux, coraux, parfois tortues ou raies) ;\n• Boucan Canot : plage animée, couchers de soleil et piscine naturelle aménagée dans les roches volcaniques, protégée des vagues, bordée de restaurants ;\n• Activités : snorkeling, plongée à Saint-Gilles-les-Bains, observation des dauphins et des baleines en hiver austral, parapente à Saint-Leu avec le partenaire Addict Parapente (la conciergerie aide à réserver) ;\n• Randonnées accessibles à tous les niveaux : Chemin Pavé, Chemin des Anglais, Boucle du Bassin Vital ; excursion au Piton Maïdo pour le panorama sur le cirque de Mafate (idéal au lever du jour) ;\n• Marchés : Saint-Paul (vendredi 6h-15h, samedi 6h-12h) et Saint-Leu (samedi 5h-12h45 selon cet article ; la page Loisirs indique le samedi matin à partir de 8h30, place de la République).\nPour organiser vos sorties, la conciergerie et la réception vous conseillent :","en":"What the hotel publishes about the West of La Réunion:\n• Climate: on the coast 22–24 °C (rarely below 20 °C at night), sea around 22 °C; in the highlands 5–15 °C;\n• Hermitage beach: sheltered lagoon with calm water, ideal for families and snorkelling (tropical fish, corals, sometimes turtles or rays);\n• Boucan Canot: lively beach, sunsets and a landscaped natural pool in volcanic rocks, protected from the waves, lined with restaurants;\n• Activities: snorkelling, diving in Saint-Gilles-les-Bains, dolphin and whale watching in the austral winter, paragliding in Saint-Leu with partner Addict Parapente (the concierge helps you book);\n• Hikes for all levels: Chemin Pavé, Chemin des Anglais, Boucle du Bassin Vital; trip to Piton Maïdo for the panorama over the Mafate cirque (best at sunrise);\n• Markets: Saint-Paul (Friday 6am–3pm, Saturday 6am–12pm) and Saint-Leu (Saturday 5am–12:45pm per this article; the Leisure page says Saturday morning from 8:30am, Place de la République).\nTo plan your outings, the concierge and reception will advise you:","de":"Was das Hotel über den Westen von La Réunion veröffentlicht:\n• Klima: an der Küste 22–24 °C (nachts selten unter 20 °C), Meer etwa 22 °C; im Hochland 5–15 °C;\n• Strand von L’Hermitage: geschützte Lagune mit ruhigem Wasser, ideal für Familien und zum Schnorcheln (tropische Fische, Korallen, manchmal Schildkröten oder Rochen);\n• Boucan Canot: lebhafter Strand, Sonnenuntergänge und ein angelegter Naturpool in Vulkangestein, wellengeschützt, von Restaurants gesäumt;\n• Aktivitäten: Schnorcheln, Tauchen in Saint-Gilles-les-Bains, Delfin- und Walbeobachtung im Südwinter, Gleitschirmfliegen in Saint-Leu mit dem Partner Addict Parapente (die Concierge hilft bei der Buchung);\n• Wanderungen für jedes Niveau: Chemin Pavé, Chemin des Anglais, Boucle du Bassin Vital; Ausflug zum Piton Maïdo mit Panorama über den Talkessel Mafate (am schönsten bei Sonnenaufgang);\n• Märkte: Saint-Paul (Freitag 6–15 Uhr, Samstag 6–12 Uhr) und Saint-Leu (Samstag 5–12:45 Uhr laut diesem Artikel; die Seite Freizeit nennt Samstagvormittag ab 8:30 Uhr, Place de la République).\nBei der Planung Ihrer Ausflüge beraten Concierge und Rezeption Sie:"},"statut":"valide","bonus":0.7},{"id":"kelonia_aquarium","exemples":{"fr":["prix de kélonia","tarif kélonia","combien coûte l'entrée de kélonia","adresse de kélonia","kélonia est ouvert tous les jours ?","kélonia tarif enfant","kelonia gratuit pour les enfants","tarif réduit kélonia","kélonia étudiant","aquarium de la réunion","aquarium saint gilles","prix aquarium","tarif aquarium","horaires de l'aquarium","aquarium ouvert quand","aquarium enfants","activité avec des enfants pluie","sortie en famille ce qu'il y a à voir","centre de soins des tortues","tortues blessées relâchées","que faire avec des enfants","visiter kelonia","ou voir les tortues","kelonia c'est loin ?","kélonia adresse saint-leu"],"en":["kelonia price","kelonia address","kelonia opening hours","aquarium prices","aquarium opening hours","things to do with kids","is kelonia free for children","turtle care centre"],"de":["Kélonia Preis","Kélonia Adresse","Aquarium Preise","Aquarium Öffnungszeiten","was kann man mit Kindern machen","Kélonia Kinder frei","Schildkröten Pflegestation"]},"mots_ancres":["kelonia:7","aquarium:7","tarif reduit:5","tortues:3","schildkroeten:3","schildkroten:3"],"suggestions":["tortues","activites","famille"],"actions":["tel:reception",{"type":"lien","url":"https://museesreunion.fr/kelonia/","label":{"fr":"Kélonia","en":"Kélonia","de":"Kélonia"}}],"service":"Activités","source":"https://www.iloha.fr/actualites/que-faire-pendant-les-grandes-vacances/ ; https://www.iloha.fr/loisirs/","topic":{"fr":"Kélonia et Aquarium : adresses et tarifs","en":"Kélonia and the Aquarium: addresses and prices","de":"Kélonia und Aquarium: Adressen und Preise"},"reponse":{"fr":"Deux sorties en famille publiées par l’hôtel :\n• Kélonia (46 rue Général de Gaulle, Saint-Leu) : observatoire et centre de protection des tortues marines (centre de soins qui accueille les tortues blessées ou malades puis les relâche en mer, aquarium et musée). Ouvert tous les jours de 9h à 18h ; tarif plein 9 €, tarif réduit 6 € (enfants de 4 à 12 ans, étudiants, personnes à mobilité réduite, groupes de 10 personnes et plus), gratuit pour les moins de 4 ans ;\n• Aquarium de La Réunion (166 rue du Général de Gaulle, Saint-Gilles-les-Bains) : ouvert tous les jours de 10h à 18h ; 9,90 € adulte, 6,90 € enfant de 4 à 12 ans, gratuit pour les moins de 4 ans.\nTarifs et horaires susceptibles d’évoluer : la réception vous confirme.","en":"Two family outings published by the hotel:\n• Kélonia (46 rue Général de Gaulle, Saint-Leu): sea-turtle observatory and protection centre (care centre for injured or sick turtles that are then released at sea, aquarium and museum). Open every day 9am–6pm; full price €9, reduced €6 (children aged 4–12, students, people with reduced mobility, groups of 10 or more), free under 4;\n• Aquarium de La Réunion (166 rue du Général de Gaulle, Saint-Gilles-les-Bains): open every day 10am–6pm; €9.90 adult, €6.90 child aged 4–12, free under 4.\nPrices and hours may change: reception can confirm.","de":"Zwei Familienausflüge laut Hotel:\n• Kélonia (46 rue Général de Gaulle, Saint-Leu): Beobachtungs- und Schutzzentrum für Meeresschildkröten (Pflegestation für verletzte oder kranke Schildkröten, die danach ins Meer entlassen werden, Aquarium und Museum). Täglich 9–18 Uhr geöffnet; Normalpreis 9 €, ermäßigt 6 € (Kinder von 4 bis 12 Jahren, Studierende, Menschen mit eingeschränkter Mobilität, Gruppen ab 10 Personen), unter 4 Jahren frei;\n• Aquarium de La Réunion (166 rue du Général de Gaulle, Saint-Gilles-les-Bains): täglich 10–18 Uhr geöffnet; 9,90 € Erwachsene, 6,90 € Kinder von 4 bis 12 Jahren, unter 4 Jahren frei.\nPreise und Zeiten können sich ändern: die Rezeption bestätigt sie gern."},"statut":"valide","bonus":0.7},{"id":"baleines_saison","exemples":{"fr":["quand voir les baleines","saison des baleines","baleines à bosse","voir des baleines depuis l'hôtel","observatoire des baleines","jumelles baleines","prêt de jumelles","où voir les baleines à saint-leu","baleines pointe au sel","cap la houssaye","globice","sortie en mer baleines","excursion baleines saint gilles","on voit des baleines en octobre ?","baleines en novembre","baleines en décembre","meilleure période pour les baleines","baleines juillet août septembre","peut-on voir des baleines gratuitement","observer les baleines gratuit","nager avec les baleines","règles pour observer les baleines","réglementation observation baleines","les baleineaux","breaching","baleine sauter","baleines d'où elles viennent","migration des baleines","baleines en juin","dauphins et baleines","whale watching"],"en":["when can I see whales","whale season","can I see whales from the hotel","where to see whales in saint-leu","whale watching trip","are whales visible in november","can you swim with whales","free whale watching"],"de":["wann kann man Wale sehen","Walsaison","Wale vom Hotel aus sehen","Walbeobachtung Ausflug","Buckelwale","Wale im November","mit Walen schwimmen","Wale kostenlos beobachten"]},"mots_ancres":["baleine*:8","whale*:7","wal:5","wale:6","buckelwal*:7","globice:8","cetaces:6","jumelles:6","fernglas:6","baleineau*:6","breaching:6","cap la houssaye:8","whale watching:8"],"suggestions":["tortues","activites","ouest_climat_plages"],"actions":["tel:reception",{"type":"lien","url":"https://www.iloha.fr/actualites/baleines-la-reunion/","label":{"fr":"Article baleines","en":"Whale article","de":"Artikel Wale"}}],"service":"Activités","source":"https://www.iloha.fr/actualites/baleines-la-reunion/ ; https://www.iloha.fr/loisirs/","topic":{"fr":"Saison des baleines","en":"Whale season","de":"Walsaison"},"reponse":{"fr":"La saison des baleines à bosse va généralement de juin à octobre, avec un pic d’observation entre juillet et septembre. Elles viennent des eaux froides de l’Antarctique pour se reproduire, mettre bas et élever leurs baleineaux. Saint-Leu et la côte Ouest comptent parmi les meilleurs endroits : depuis la côte, gratuitement et avec une paire de jumelles, à la Pointe au Sel, sur le front de mer de la baie de Saint-Leu (tôt le matin ou en fin d’après-midi) et au Cap La Houssaye ; ou en excursion en mer depuis Saint-Gilles-les-Bains (port de plaisance, Roches Noires) avec des opérateurs encadrés et respectueux de la réglementation. L’hôtel dispose lui-même d’un observatoire des baleines (de juin à octobre, avec des jumelles). Pour en savoir plus : Globice, association spécialisée dans l’étude des cétacés. Les bons gestes : respecter les distances, ne jamais poursuivre ni encercler une baleine, limiter le bruit, ne pas se mettre à l’eau avec elles hors activités autorisées.","en":"Humpback whale season generally runs from June to October, peaking between July and September. They travel from the cold Antarctic waters to breed, give birth and raise their calves. Saint-Leu and the west coast are among the best places: from the shore, for free with binoculars, at Pointe au Sel, on the Saint-Leu bay seafront (early morning or late afternoon) and at Cap La Houssaye; or on a boat trip from Saint-Gilles-les-Bains (marina, Roches Noires) with supervised operators who respect regulations. The hotel itself has a whale-watching spot (June to October, with binoculars). To learn more: Globice, an association specialised in cetacean research. Good practice: keep the required distances, never chase or encircle a whale, limit noise, do not swim with them outside authorised activities.","de":"Die Saison der Buckelwale dauert in der Regel von Juni bis Oktober, mit einem Höhepunkt zwischen Juli und September. Sie kommen aus den kalten antarktischen Gewässern, um sich zu paaren, zu gebären und ihre Kälber aufzuziehen. Saint-Leu und die Westküste gehören zu den besten Orten: von der Küste aus, kostenlos mit Fernglas, an der Pointe au Sel, an der Strandpromenade der Bucht von Saint-Leu (früh morgens oder am späten Nachmittag) und am Cap La Houssaye; oder bei einer Bootsausflug ab Saint-Gilles-les-Bains (Yachthafen, Roches Noires) mit begleiteten, regelkonformen Anbietern. Das Hotel selbst hat eine Walbeobachtungsstelle (Juni bis Oktober, mit Fernglas). Mehr erfahren: Globice, ein auf die Erforschung von Walen spezialisierter Verein. Gute Regeln: Abstände einhalten, Wale nie verfolgen oder einkreisen, Lärm begrenzen, nicht mit ihnen schwimmen außer bei genehmigten Aktivitäten."},"statut":"valide","bonus":0.7},{"id":"tombola_kere","exemples":{"fr":["la tombola","tombola kéré","c'est quoi la tombola","association kéré","kere madagascar","tombola solidaire","combien coûte un billet de tombola","prix du billet tombola","tirage de la tombola","date du tirage au sort","quels sont les lots de la tombola","lots à gagner","gagner une nuit à l'hôtel","gagner un séjour","tombola 12 septembre","don pour madagascar","aider madagascar","l'hôtel soutient une association ?","action solidaire","action caritative","soirée caritative","jean-marc collienne","gret madagascar","citernes androy","famine à madagascar","billet à 10 euros","combien de billets","la tombola est toujours ouverte ?","tomobla","affiche 30 ans iloha","tee shirt 30 ans","jeu de cartes iloha 30 ans","atelier frisé","lot pool lodge","règlement de la tombola","comment participer à la tombola","cagnotte kéré","quand est le tirage au sort","vous soutenez une association ?"],"en":["the raffle","charity raffle","raffle ticket price","raffle prizes","when is the raffle draw","does the hotel support a charity","Kere association","help Madagascar"],"de":["die Tombola","Lotterie Hotel","Preis Los","Preise der Lotterie","Ziehung Lotterie","unterstützt das Hotel einen Verein","Kéré Verein","Madagaskar helfen"]},"mots_ancres":["tombola:8","kere:8","gret:6","androy:6","collienne:7","atelier frise:7","caritative:5","solidaire:5","lotterie:6","raffle:6","madagascar:5","madagaskar:5"],"suggestions":["anniv30","evenements_en_cours","offres"],"actions":["tel:reception",{"type":"lien","url":"https://www.iloha.fr/offres-speciales/tombola-kere/","label":{"fr":"La tombola","en":"The raffle","de":"Die Lotterie"}}],"service":"Événements","source":"https://www.iloha.fr/offres-speciales/tombola-kere/","topic":{"fr":"Tombola solidaire Kéré (30 ans)","en":"Kéré charity raffle (30 years)","de":"Wohltätigkeitslotterie Kéré (30 Jahre)"},"reponse":{"fr":"Pour ses 30 ans, Iloha a organisé une grande tombola solidaire au profit de l’association Kéré (citernes de l’Androy, sud de Madagascar, aux côtés du Gret) : billet à 10 € (1 000 billets seulement), 25 lots offerts par Iloha et Le Palm, vente des billets et tirage au sort le samedi 12 septembre 2026. Parmi les lots : une nuit en Pool Lodge au Palm Hôtel & Spa 5*, une nuit en bungalow Tropique ou en chambre Guetali (petit-déjeuner inclus), une soirée créole, une journée détente, une formule Cas’Akéa détente, un coffret « Secret de spa », des affiches « 30 ans d’Iloha » de l’Atelier Frisé, des jeux de cartes et des tee-shirts. L’hôtel reverse aussi une partie de chaque réservation de chambre et des dîners de la semaine anniversaire. L’association Kéré a été fondée par le journaliste Jean-Marc Collienne après la famine de 2007 dans l’Androy.","en":"For its 30th anniversary, Iloha ran a big charity raffle for the Kéré association (water tanks in the Androy region of southern Madagascar, together with Gret): ticket €10 (only 1,000 tickets), 25 prizes offered by Iloha and Le Palm, ticket sales and draw on Saturday 12 September 2026. Prizes included a night in a Pool Lodge at Palm Hôtel & Spa 5*, a night in a Tropique bungalow or Guetali room (breakfast included), a Creole evening, a relaxation day, a Cas’Akéa relaxation package, a “Secret de spa” gift set, “30 ans d’Iloha” posters by Atelier Frisé, playing cards and T-shirts. The hotel also donated part of each room booking and of dinners during the anniversary week. Kéré was founded by journalist Jean-Marc Collienne after the 2007 famine in the Androy.","de":"Zum 30-jährigen Bestehen veranstaltete Iloha eine große Wohltätigkeitslotterie zugunsten des Vereins Kéré (Wassertanks in der Region Androy im Süden Madagaskars, gemeinsam mit Gret): Los 10 € (nur 1.000 Lose), 25 Preise von Iloha und Le Palm, Losverkauf und Ziehung am Samstag, 12. September 2026. Zu den Preisen gehörten eine Nacht in der Pool Lodge des Palm Hôtel & Spa 5*, eine Nacht im Bungalow Tropique oder Zimmer Guetali (inkl. Frühstück), ein kreolischer Abend, ein Entspannungstag, ein Cas’Akéa-Entspannungspaket, ein Set „Secret de spa“, Plakate „30 ans d’Iloha“ vom Atelier Frisé, Spielkarten und T-Shirts. Das Hotel spendete zudem einen Teil jeder Zimmerbuchung und der Abendessen der Jubiläumswoche. Kéré wurde vom Journalisten Jean-Marc Collienne nach der Hungersnot von 2007 in der Androy gegründet."},"statut":"valide","bonus":1},{"id":"ecolabel_rse","exemples":{"fr":["l'hôtel est écolo ?","hôtel écologique","éco-responsable","écolabel européen","ecolabel","label écologique","certification environnementale","quels labels avez-vous","vous avez des labels ?","démarche environnementale","développement durable","tourisme durable","RSE","gourde canne à sucre","gourdes en vente","tri des déchets","économie d'eau","économie d'énergie","traitement des eaux usées","afnor","audit écolabel","responsable qse","justine ocloo","tuteurs environnementaux","écogestes","la réunion pour tous","inclusion handicap équipe","circuits courts","produits locaux et circuits courts","vous faites quoi pour l'environnement","engagement écologique","premier hôtel écolabel réunion","depuis quand écolabel","ecolabel depuis 2015","hotel vert","hôtel respectueux de l'environnement","ecolable","éco label","tourisme responsable"],"en":["is the hotel eco-friendly","eco label","EU Ecolabel","sustainability","environmental certification","what do you do for the environment","responsible tourism","sugarcane water bottle"],"de":["ist das Hotel umweltfreundlich","Ecolabel","EU Ecolabel","Nachhaltigkeit","Umweltzertifizierung","nachhaltiger Tourismus","Trinkflasche Zuckerrohr","was tun Sie für die Umwelt"]},"mots_ancres":["ecolabel:9","eco label:8","ecoresponsable:7","eco responsable:7","afnor:8","ocloo:7","qse:7","rse:6","developpement durable:6","tourisme durable:6","gourde*:6","ecologique:5","ecolo:5","nachhaltig*:6","sustainab*:6","durable:3"],"suggestions":["etoiles","histoire","accessibilite"],"actions":["tel:reception",{"type":"lien","url":"https://www.iloha.fr/actualites/renouvellement-certification-ecolabel-europeen/","label":{"fr":"L’article","en":"The article","de":"Der Artikel"}}],"service":"Hôtel","source":"https://www.iloha.fr/actualites/renouvellement-certification-ecolabel-europeen/ ; https://www.iloha.fr/hotel/","topic":{"fr":"Ecolabel Européen et engagements durables","en":"EU Ecolabel and sustainability commitments","de":"EU-Ecolabel und Nachhaltigkeit"},"reponse":{"fr":"Iloha est certifié « Ecolabel Européen – Services d’hébergement touristique » : obtenu début 2015 (une première à La Réunion et dans les DOM), puis renouvelé, récemment pour la 4ᵉ fois consécutive. Le label est délivré après un audit bisannuel mené par AFNOR Certification ; l’hôtel a obtenu 44,5 points sur les 31 requis, soit 3 points de plus qu’en 2021. Les auditeurs ont salué l’amélioration continue : tuteurs environnementaux dans les équipes, formations régulières aux éco-gestes, quiz et challenges, plan d’actions piloté par Justine Ocloo, responsable QSE. Les engagements portent sur le tri et la réduction des déchets, le traitement des eaux usées et l’économie d’eau et d’énergie ; les clients sont invités à réduire les déchets avec des gourdes en canne à sucre. Démarche RSE : circuits courts et production locale, accessibilité, lutte contre les discriminations et sensibilisation au handicap avec « La Réunion pour Tous ».","en":"Iloha holds the “EU Ecolabel – Tourist accommodation” certification: first obtained in early 2015 (a first in La Réunion and the overseas departments), then renewed, most recently for the 4th consecutive time. It is awarded after a two-yearly audit by AFNOR Certification; the hotel scored 44.5 points out of the 31 required, 3 points more than in 2021. Auditors praised continuous improvement: environmental tutors in the teams, regular eco-gesture training, quizzes and challenges, and an action plan led by Justine Ocloo, QSE manager. Commitments cover waste sorting and reduction, wastewater treatment, and saving water and energy; guests are invited to cut waste with sugarcane water bottles. CSR approach: short supply chains and local production, accessibility, fighting discrimination and disability awareness with “La Réunion pour Tous”.","de":"Iloha trägt das „EU-Ecolabel – Beherbergungsbetriebe“: erstmals Anfang 2015 erhalten (eine Premiere auf La Réunion und in den Überseedepartements) und seither erneuert, zuletzt zum 4. Mal in Folge. Das Label wird nach einem zweijährlichen Audit von AFNOR Certification vergeben; das Hotel erreichte 44,5 Punkte bei 31 erforderlichen, 3 Punkte mehr als 2021. Die Auditoren lobten die ständige Verbesserung: Umwelt-Tutoren in den Teams, regelmäßige Schulungen zu Öko-Gesten, Quiz und Challenges sowie ein Aktionsplan unter Leitung von Justine Ocloo, Verantwortliche QSE. Die Verpflichtungen betreffen Mülltrennung und -reduzierung, Abwasserbehandlung sowie Wasser- und Energiesparen; Gäste werden eingeladen, Abfall mit Trinkflaschen aus Zuckerrohr zu verringern. CSR: kurze Lieferketten und lokale Produktion, Barrierefreiheit, Antidiskriminierung und Sensibilisierung für Behinderung mit „La Réunion pour Tous“."},"statut":"valide","bonus":1.2},{"id":"reservation_ligne_etapes","exemples":{"fr":["comment réserver sur le site","comment ça marche la réservation en ligne","étapes de réservation","les étapes pour réserver","est-ce sécurisé de réserver en ligne","site de réservation sécurisé","secure hotel booking","c'est quoi secure-hotel-booking.com","d-edge","qui gère le paiement","mes données bancaires sont protégées ?","certificat ssl","pourquoi une carte bancaire pour réserver","réserver et payer plus tard","je peux payer plus tard","créer un compte pour ma réservation","modifier ma réservation en ligne","annuler en ligne","mail de confirmation","je n'ai pas reçu la confirmation","quelles infos pour réserver","infos obligatoires réservation","laisser un commentaire à la réservation","indiquer l'heure d'arrivée","ajouter un dîner à ma réservation","ajouter un soin à la réservation","accueil personnalisé en chambre","transfert à réserver","avantages de réserver en direct","sans frais de réservation","e-conciergerie","application e-conciergerie","conciergerie en ligne","bulle i tarif","réservation sans intermédiaire","résa en ligne","comment faire une résa","j'arrive pas a réserver","comment ça marche la réservation sur le site","puis-je créer un compte pour gérer ma réservation"],"en":["how do I book on the website","booking steps","is online booking secure","what is secure-hotel-booking","book and pay later","can I create an account","confirmation email","what is the e-concierge","benefits of booking direct"],"de":["wie buche ich auf der Website","Buchungsschritte","ist die Online-Buchung sicher","später zahlen","Konto erstellen","Bestätigungs-E-Mail","was ist die E-Concierge","Vorteile der Direktbuchung","wie läuft die Online-Buchung ab"]},"mots_ancres":["secure hotel booking:9","d edge:8","dedge:8","ssl:6","payer plus tard:8","e conciergerie:8","econciergerie:8","e concierge:7","etapes:5","sans intermediaire:8","confirmation:3","zahlen:2","spater zahlen:6","buchungsschritte:7","booking steps:7","sicher:3","securise*:5"],"suggestions":["reserver","annulation","paiement"],"actions":["reserver","mail:reception"],"service":"Réservation","source":"https://www.iloha.fr/cgv/ ; https://www.iloha.fr/questions-frequentes/","topic":{"fr":"Réserver en ligne : les étapes et la sécurité","en":"Booking online: steps and security","de":"Online buchen: Schritte und Sicherheit"},"reponse":{"fr":"Sur www.iloha.fr, la réservation se fait en 3 étapes :\n1. Recherche : bouton « Réserver », choix des dates, puis page sécurisée du moteur de réservation (adresse commençant par https://www.secure-hotel-booking.com) avec les tarifs de chaque catégorie ; la bulle « i » détaille le tarif, et vous pouvez ajouter des prestations (soins de bien-être, dîner, transfert, accueil personnalisé en chambre), laisser un commentaire et indiquer l’heure d’arrivée ;\n2. Coordonnées : civilité, nom, prénom, pays de résidence, téléphone et e-mail sont obligatoires (le reste est facultatif) ; création de compte possible pour consulter, modifier ou annuler plus tard ; acceptation des conditions générales et de la politique de confidentialité ; inscription à la newsletter facultative ; une carte bancaire (prestataire D-EDGE, certificat SSL) garantit la réservation, avec « Réserver et payer plus tard » ;\n3. Récapitulatif : vérifiez les détails (une anomalie : hotel@iloha.fr) ; un e-mail de confirmation arrive automatiquement.\nRéserver en direct, c’est une réservation sans intermédiaire et sans frais, un traitement immédiat et un accès privilégié à l’e-conciergerie dès la confirmation.","en":"On www.iloha.fr, booking takes 3 steps:\n1. Search: “Book” button, choose dates, then the secure booking-engine page (address starting with https://www.secure-hotel-booking.com) showing rates for each category; the “i” bubble details the rate, and you can add services (wellness treatments, dinner, transfer, personalised welcome in the room), leave a comment and give your arrival time;\n2. Details: title, surname, first name, country of residence, phone and e-mail are required (the rest is optional); you can create an account to view, change or cancel later; acceptance of the terms and the privacy policy; newsletter sign-up is optional; a bank card (provider D-EDGE, SSL certificate) guarantees the booking, with “Book and pay later”;\n3. Summary: check the details (report any error to hotel@iloha.fr); a confirmation e-mail arrives automatically.\nBooking direct means no intermediary and no fees, immediate processing and priority access to the e-concierge once confirmed.","de":"Auf www.iloha.fr läuft die Buchung in 3 Schritten:\n1. Suche: Schaltfläche „Buchen“, Daten wählen, dann die gesicherte Seite der Buchungsmaschine (Adresse beginnt mit https://www.secure-hotel-booking.com) mit den Preisen jeder Kategorie; die „i“-Blase erklärt den Tarif, zusätzlich buchbar sind Leistungen (Wellness, Abendessen, Transfer, persönlicher Empfang im Zimmer), außerdem ein Kommentar und die Ankunftszeit;\n2. Kontaktdaten: Anrede, Name, Vorname, Wohnsitzland, Telefon und E-Mail sind Pflicht (alles andere freiwillig); ein Konto zum späteren Einsehen, Ändern oder Stornieren ist möglich; Zustimmung zu AGB und Datenschutz; Newsletter freiwillig; eine Bankkarte (Anbieter D-EDGE, SSL-Zertifikat) garantiert die Buchung, mit „Buchen und später zahlen“;\n3. Zusammenfassung: Angaben prüfen (Fehler an hotel@iloha.fr melden); eine Bestätigungs-E-Mail kommt automatisch.\nDirekt buchen heißt: ohne Vermittler und ohne Gebühren, sofortige Bearbeitung und bevorzugter Zugang zur E-Concierge nach der Bestätigung."},"statut":"valide","bonus":1},{"id":"reglement_interieur","exemples":{"fr":["règlement de l'hôtel","règlement intérieur","règles de l'hôtel","règles du séjour","conditions générales de vente","cgv","est-ce que je peux faire un barbecue","barbecue dans le jardin","plancha dans la chambre","raclette","pierrade","appareil électrique cuisson","cuisiner dans ma chambre avec un réchaud","chicha","narguilé","cigarette électronique","vapoter dans la chambre","vape","où fumer","espace fumeur","fumer à l'hôtel","amende fumer chambre","que se passe-t-il si je fume dans la chambre","casse dans la chambre","dégradation","objet manquant","facturation de dégâts","vol dans l'hôtel","responsabilité en cas de vol","coffre-fort objets de valeur","fiche de police","pièce d'identité obligatoire","carte d'identité à l'arrivée","mineur seul","un mineur peut réserver","ado seul à l'hôtel","mon fils de 17 ans peut dormir seul","musique dans la chambre","bruit après 22h","fêter un anniversaire dans la chambre","faire la fête à l'hôtel","être expulsé de l'hôtel","comportement","heure de silence","arrivée avant 14h","départ tardif jusqu'à 18h","départ tardif payant","late checkout prix","early check in possible","combien coûte un départ tardif","puis-je faire un barbecue dans le jardin","départ tardif jusqu'à 18h c'est possible","il faut une pièce d'identité à l'arrivée ?"],"en":["house rules","terms and conditions","can I have a barbecue","is shisha allowed","are e-cigarettes allowed","what if I smoke in the room","minors alone","do I need ID at check-in","late checkout until 6pm","noise rules"],"de":["Hausordnung","AGB","darf ich grillen","Shisha erlaubt","E-Zigarette erlaubt","Rauchen im Zimmer Strafe","Minderjährige allein","Ausweis bei Ankunft","später Check-out bis 18 Uhr","Lärm Regeln"]},"mots_ancres":["reglement:6","grillen:6","grill:4","cigarette electronique:8","vape*:6","e zigarette:7","fiche de police:8","meldeschein:7","degradation*:7","refactur*:6","cgv:7","agb:6","conditions generales:6","hausordnung:7","house rules:7","mineur*:4","minderjaehrig*:5","minderjahrig*:5","jusqu a 18h:6","depart tardif:6","late checkout:6","early check in:6","arrivee anticipee:6"],"suggestions":["animaux","fumeur","checkin"],"actions":["tel:reception","mail:reception"],"service":"Hôtel","source":"https://www.iloha.fr/cgv/","topic":{"fr":"Règles de séjour : majeurs, fumeur, barbecue, bruit, coffre","en":"House rules: adults, smoking, barbecue, noise, safe","de":"Hausregeln: Erwachsene, Rauchen, Grill, Lärm, Safe"},"reponse":{"fr":"Les règles publiées dans les conditions de l’hôtel :\n• La réservation est réservée aux personnes majeures et juridiquement capables ; tout mineur doit être accompagné d’une personne majeure responsable pendant tout le séjour ;\n• Chambres et restaurants sont strictement non-fumeurs, cigarettes électroniques et narguilés (chicha) compris ; des espaces fumeurs clairement indiqués existent. Fumer en chambre constitue une dégradation, refacturable ;\n• Les dégradations ou objets manquants peuvent être refacturés dans les 48 heures suivant le départ ;\n• Barbecue dans les jardins et appareils électriques de cuisson (pierrade, raclette, plancha…) sont interdits, pour la sécurité et la quiétude des résidents ;\n• La musique est appréciée à volume raisonnable ;\n• Objets de valeur et argent : à ranger dans le coffre-fort de la chambre ;\n• Une fiche de police et une pièce d’identité en cours de validité peuvent être demandées à l’arrivée ;\n• Les animaux de compagnie, même petits, ne sont pas admis (chambres, restaurants, spa, parties communes) ;\n• Arrivée avant 14h ou départ après 11h (jusqu’à 18h) : possible sur place sous réserve de disponibilité, moyennant un supplément.","en":"Rules published in the hotel’s terms:\n• Bookings are for adults of legal capacity; any minor must be accompanied by a responsible adult throughout the stay;\n• Rooms and restaurants are strictly non-smoking, including e-cigarettes and shisha/hookah; clearly marked smoking areas exist. Smoking in a room counts as damage and may be charged;\n• Damage or missing items may be re-invoiced within 48 hours of departure;\n• Barbecues in the gardens and electric cooking appliances (pierrade, raclette, plancha…) are forbidden, for safety and residents’ peace;\n• Music is welcome at a reasonable volume;\n• Valuables and cash: please use the room safe;\n• A police registration form and valid ID may be requested on arrival;\n• Pets, even small ones, are not allowed (rooms, restaurants, spa, common areas);\n• Arrival before 2pm or departure after 11am (until 6pm): possible on site, subject to availability, for an extra charge.","de":"Die in den Bedingungen des Hotels veröffentlichten Regeln:\n• Buchungen sind volljährigen, geschäftsfähigen Personen vorbehalten; Minderjährige müssen während des gesamten Aufenthalts von einem verantwortlichen Erwachsenen begleitet werden;\n• Zimmer und Restaurants sind streng rauchfrei, einschließlich E-Zigaretten und Shisha; gekennzeichnete Raucherbereiche sind vorhanden. Rauchen im Zimmer gilt als Beschädigung und kann berechnet werden;\n• Schäden oder fehlende Gegenstände können innerhalb von 48 Stunden nach der Abreise nachberechnet werden;\n• Grillen in den Gärten und elektrische Kochgeräte (Pierrade, Raclette, Plancha …) sind verboten, aus Sicherheits- und Ruhegründen;\n• Musik bitte in angemessener Lautstärke;\n• Wertsachen und Bargeld gehören in den Zimmersafe;\n• Bei der Ankunft können ein Meldeschein und ein gültiger Ausweis verlangt werden;\n• Haustiere, auch kleine, sind nicht zugelassen (Zimmer, Restaurants, Spa, Gemeinschaftsbereiche);\n• Ankunft vor 14 Uhr oder Abreise nach 11 Uhr (bis 18 Uhr): vor Ort nach Verfügbarkeit gegen Aufpreis möglich."},"statut":"valide","bonus":0.7},{"id":"mentions_legales_mediation","exemples":{"fr":["mentions légales","numéro siret","siret de l'hôtel","forme juridique","rcs de l'hôtel","société SAS","qui est le propriétaire","raison sociale","médiateur","médiation du tourisme","comment faire une réclamation","réclamation officielle","litige avec l'hôtel","je veux porter plainte","médiateur du tourisme et du voyage","mtv travel","plateforme européenne litiges","bloctel","démarchage téléphonique","politique de confidentialité","protection des données","rgpd","mes données personnelles","qu'est-ce que vous faites de mes données","données bancaires","confidentialité","droit du consommateur","adresse postale de la médiation","contact légal","coordonnées de l'hôtel pour un courrier officiel","cookies","désinscrire mes données","supprimer mes données","comment faire une réclamation officielle"],"en":["legal notice","company number","SIRET","how to file a complaint","mediator","privacy policy","data protection","GDPR","what do you do with my data","consumer rights"],"de":["Impressum","SIRET Nummer","Beschwerde einreichen","Schlichtung","Datenschutzerklärung","Datenschutz","DSGVO","was machen Sie mit meinen Daten","Verbraucherrechte"]},"mots_ancres":["siret:9","rcs:7","mentions legales:8","mediateur:8","mediation:7","bloctel:9","demarchage:7","rgpd:8","dsgvo:8","gdpr:8","confidentialite:7","datenschutz*:7","privacy:6","impressum:7","legal notice:7","donnees personnelles:7","litige:6","mtv:5","raison sociale:7","forme juridique:7","cookies:5"],"suggestions":["reglement_interieur","reservation_ligne_etapes","humain"],"actions":["mail:reception",{"type":"lien","url":"https://www.iloha.fr/politique-de-confidentialite/","label":{"fr":"Confidentialité","en":"Privacy policy","de":"Datenschutz"}}],"service":"Hôtel","source":"https://www.iloha.fr/cgv/ ; https://www.iloha.fr/mentions-legales/","topic":{"fr":"Informations légales, médiation et protection des données","en":"Legal information, mediation and data protection","de":"Rechtliche Angaben, Schlichtung und Datenschutz"},"reponse":{"fr":"Informations légales publiées : ILOHA Seaview Hotel, SAS, SIRET 398 857 383 00010, RCS de Saint-Pierre de La Réunion ; contact : hotel@iloha.fr. Droit du consommateur : l’hôtel garantit un recours gratuit à la médiation de la consommation (art. L.612-1 du Code de la consommation). Après avoir saisi la direction de l’hôtel et à défaut de réponse satisfaisante sous 1 mois, le client peut saisir le Médiateur du Tourisme et du Voyage (Médiation Tourisme et Voyage, BP 80 303, 75823 Paris Cedex 17, www.mtv.travel), et dispose aussi de la plateforme européenne de règlement en ligne des litiges. Les consommateurs peuvent s’inscrire gratuitement sur la liste d’opposition au démarchage téléphonique (Bloctel, www.bloctel.gouv.fr). Données personnelles : l’hôtel s’engage à garantir leur confidentialité ; les données bancaires ne servent qu’au paiement des prestations réservées, de manière sécurisée (politique de confidentialité : https://www.iloha.fr/politique-de-confidentialite/).","en":"Published legal information: ILOHA Seaview Hotel, SAS, SIRET 398 857 383 00010, RCS Saint-Pierre de La Réunion; contact: hotel@iloha.fr. Consumer rights: the hotel guarantees free access to consumer mediation (art. L.612-1 of the French Consumer Code). After contacting the hotel manager and without a satisfactory reply within 1 month, the guest may refer the matter to the Médiateur du Tourisme et du Voyage (Médiation Tourisme et Voyage, BP 80 303, 75823 Paris Cedex 17, www.mtv.travel), and may also use the European online dispute resolution platform. Consumers can register for free on the French do-not-call list (Bloctel, www.bloctel.gouv.fr). Personal data: the hotel commits to keeping it confidential; bank details are used only to pay for booked services, securely (privacy policy: https://www.iloha.fr/politique-de-confidentialite/).","de":"Veröffentlichte rechtliche Angaben: ILOHA Seaview Hotel, SAS, SIRET 398 857 383 00010, RCS Saint-Pierre de La Réunion; Kontakt: hotel@iloha.fr. Verbraucherrecht: Das Hotel garantiert den kostenlosen Zugang zur Verbraucherschlichtung (Art. L.612-1 Code de la consommation). Nach Anrufung der Hotelleitung und ohne zufriedenstellende Antwort innerhalb von 1 Monat kann der Gast den Médiateur du Tourisme et du Voyage anrufen (Médiation Tourisme et Voyage, BP 80 303, 75823 Paris Cedex 17, www.mtv.travel); zudem steht die europäische Online-Streitbeilegungsplattform offen. Verbraucher können sich kostenlos in die Sperrliste gegen Telefonwerbung (Bloctel, www.bloctel.gouv.fr) eintragen. Personenbezogene Daten: Das Hotel sichert deren Vertraulichkeit zu; Bankdaten dienen nur der sicheren Bezahlung gebuchter Leistungen (Datenschutz: https://www.iloha.fr/politique-de-confidentialite/)."},"statut":"valide","bonus":1.2},{"id":"loisirs_hotel","exemples":{"fr":["quelles activités à l'hôtel","animations à l'hôtel","y a-t-il des animations","que faire sur place","activités pour les enfants à l'hôtel","dîner concert","concert le samedi","musique live","concert acoustique","quel style de musique","soirée musicale","ambiance musicale le soir","animation le soir","parcours botanique","jardin botanique","plantes endémiques","visite des jardins","billard","table de billard","ping pong","tennis de table","table de ping-pong","jeux de société","jeux de cartes","jeux pour la famille","jeux de plateau","on peut jouer à quoi","activités quand il pleut","que faire s'il pleut","salle de jeux","jeux pour ados","divertissement à l'hôtel","soirée du samedi","qu'y a-t-il le samedi soir","ya des concerts","artistes à l'hôtel","musique du monde","jazz le samedi","vous avez un billard ?","que faire à l'hôtel quand il pleut"],"en":["what activities at the hotel","entertainment at the hotel","live music","dinner concert","saturday night concert","botanical trail","billiards","table tennis","board games","what to do when it rains","is there live music"],"de":["Aktivitäten im Hotel","Unterhaltung im Hotel","Livemusik","Dinner-Konzert","Konzert am Samstag","botanischer Pfad","Billard","Tischtennis","Gesellschaftsspiele","was tun bei Regen"]},"mots_ancres":["diner concert:9","dinner konzert:8","concert*:5","konzert*:5","musique live:7","live music:7","parcours botanique:9","botanisch*:6","botanical:6","ping pong:7","tennis de table:8","tischtennis:8","table tennis:8","jeux de societe:8","gesellschaftsspiele:8","board games:7","jeux de cartes:6","animation*:4","unterhaltung:4","entertainment:4"],"suggestions":["piscine","activites","bar"],"actions":["tel:reception",{"type":"lien","url":"https://www.iloha.fr/loisirs/","label":{"fr":"Loisirs","en":"Leisure","de":"Freizeit"}}],"service":"Activités","source":"https://www.iloha.fr/loisirs/","topic":{"fr":"Loisirs à l’hôtel : concerts, jardin, billard, jeux","en":"Leisure at the hotel: concerts, garden, billiards, games","de":"Freizeit im Hotel: Konzerte, Garten, Billard, Spiele"},"reponse":{"fr":"Sur place, l’hôtel propose :\n• Dîner-concert : chaque samedi soir, un dîner-concert acoustique avec des artistes talentueux (rock, pop, jazz, soul, folk, musiques du monde, chansons françaises…) ;\n• Soirée créole : chaque vendredi, dîner spectacle aux couleurs de l’océan Indien ;\n• Parcours botanique dans les jardins : nombreuses espèces de plantes et d’arbres de l’île, parfois endémiques ;\n• Observatoire des baleines : de juin à octobre, observation avec des jumelles ;\n• Billard dans le salon cosy du bar ; tennis de table dans le jardin ; jeux de société (cartes, dés, jeux de plateau ou de réflexion) pour jouer entre amis ou en famille ;\n• 2 piscines, dont une chauffée durant l’hiver austral.","en":"On site the hotel offers:\n• Dinner-concert: every Saturday evening, an acoustic dinner-concert with talented artists (rock, pop, jazz, soul, folk, world music, French songs…);\n• Creole evening: every Friday, a dinner show in Indian Ocean colours;\n• Botanical trail in the gardens: many plant and tree species of the island, some endemic;\n• Whale observatory: June to October, watching with binoculars;\n• Billiards in the bar’s cosy lounge; table tennis in the garden; board games (cards, dice, board and puzzle games) for friends or family;\n• 2 swimming pools, one heated during the austral winter.","de":"Vor Ort bietet das Hotel:\n• Dinner-Konzert: jeden Samstagabend ein akustisches Dinner-Konzert mit talentierten Künstlern (Rock, Pop, Jazz, Soul, Folk, Weltmusik, französische Chansons …);\n• Kreolischer Abend: jeden Freitag, Dinner-Show in den Farben des Indischen Ozeans;\n• Botanischer Pfad in den Gärten: zahlreiche Pflanzen- und Baumarten der Insel, teils endemisch;\n• Walbeobachtungsstelle: Juni bis Oktober, mit Fernglas;\n• Billard im gemütlichen Salon der Bar; Tischtennis im Garten; Gesellschaftsspiele (Karten, Würfel, Brett- und Denkspiele) für Freunde oder Familie;\n• 2 Pools, einer davon im Südwinter beheizt."},"statut":"valide","bonus":1},{"id":"loisirs_proximite","exemples":{"fr":["golf à proximité","golf du bassin bleu","terrain de golf","faire du golf","golf 18 trous","balade à cheval","randonnée à cheval","équitation","faire du cheval","hélicoptère","survol en hélico","tour en hélicoptère","vol en hélicoptère","pointe au sel","bassin caverne","musée du sel","musée stella matutina","stella matutina","maison du coco","maison du coco tarif","conservatoire botanique","mascarin","jardin de mascarin","pointe des châteaux","parapente pointe des châteaux","lagon surveillé","maître nageur sauveteur","baignade sécurisée","barrière de corail saint-leu","plage à l'entrée sud de la ville","le marché a quelle heure le samedi","marché de saint leu 8h30","place de la république","flyer avec tampon","tarif préférentiel 10 euros","réduction sur les sorties","billet à 10 euros pour une visite","visite de canne à sucre","histoire de la canne à sucre","que visiter à saint-leu","quoi voir à saint-leu","activités culturelles","musées","visites culturelles","sorties payantes","sports et loisirs à proximité","faire un tour en hélicoptère","c'est quoi la pointe au sel","la maison du coco c'est où"],"en":["golf nearby","Bassin Bleu golf","horse riding","helicopter flight","Pointe au Sel","Stella Matutina museum","Maison du Coco","Mascarin botanical garden","is the lagoon safe for swimming","what to visit in Saint-Leu","discount flyer","is there a golf course nearby"],"de":["Golf in der Nähe","Golf Bassin Bleu","Reiten","Hubschrauberflug","Pointe au Sel","Museum Stella Matutina","Maison du Coco","botanischer Garten Mascarin","ist die Lagune sicher zum Baden","was besichtigen in Saint-Leu","Ermäßigung Flyer","Reiten in der Nähe"]},"mots_ancres":["golf:8","bassin bleu:9","cheval:7","equitation:7","reiten:6","horse:5","helicoptere:8","helico:7","hubschrauber:8","helicopter:8","pointe au sel:9","bassin caverne:9","maison du coco:9","mascarin:9","pointe des chateaux:8","barriere de corail:7","flyer:6","tampon:5","canne a sucre:5","zuckerrohr:5","place de la republique:7","musee*:5","museum:4"],"suggestions":["activites","plage","tortues"],"actions":["tel:reception",{"type":"lien","url":"https://www.iloha.fr/loisirs/","label":{"fr":"Loisirs","en":"Leisure","de":"Freizeit"}}],"service":"Activités","source":"https://www.iloha.fr/loisirs/","topic":{"fr":"Sorties à proximité : lagon, golf, cheval, hélicoptère, musées","en":"Nearby outings: lagoon, golf, horse riding, helicopter, museums","de":"Ausflüge in der Nähe: Lagune, Golf, Reiten, Hubschrauber, Museen"},"reponse":{"fr":"Selon la page Loisirs de l’hôtel, à proximité :\n• Plage et lagon de Saint-Leu : baignade en sécurité, lagon surveillé depuis un poste de maître nageur sauveteur et protégé par une barrière de corail ; une plage existe aussi à l’entrée sud de la ville ;\n• Pointe au Sel : ancien lieu de production de sel, aujourd’hui musée, avec un bassin naturel d’eau de mer et d’eau douce, le « Bassin caverne » ;\n• Marché de Saint-Leu : tous les samedis matin dès 8h30, place de la République, sur le front de mer (fruits et légumes, spécialités culinaires, artisanat) ;\n• Parapente depuis la Pointe des Châteaux ; randonnée à cheval dans les hauts de Saint-Leu, à travers les champs de canne à sucre ;\n• Golf du Bassin Bleu : 18 trous, 9 face à la mer et 9 dans une forêt d’eucalyptus ;\n• Survol de l’île en hélicoptère (sites classés à l’UNESCO) ;\n• Kélonia (tortues marines), Conservatoire Botanique National de Mascarin (espèces endémiques), musée Stella Matutina (histoire de la canne à sucre), La Maison du Coco (cocoteraie, éco-musée, ateliers, à la Pointe des Châteaux).\nEn séjournant à Iloha, un tarif préférentiel à 10 €/ticket est indiqué sur présentation du flyer avec tampon de l’hôtel. La conciergerie vous aide à réserver :","en":"According to the hotel’s Leisure page, nearby:\n• Saint-Leu beach and lagoon: safe swimming, lagoon watched from a lifeguard post and protected by a coral barrier; there is also a beach at the south entrance of the town;\n• Pointe au Sel: former salt-production site, now a museum, with a natural sea- and freshwater pool, the “Bassin caverne”;\n• Saint-Leu market: every Saturday morning from 8:30am, Place de la République, on the seafront (fruit and vegetables, food specialities, local crafts);\n• Paragliding from the Pointe des Châteaux; horse riding in the hills above Saint-Leu, through sugarcane fields;\n• Golf du Bassin Bleu: 18 holes, 9 facing the sea and 9 in a eucalyptus forest;\n• Helicopter flight over the island (UNESCO-listed sites);\n• Kélonia (sea turtles), Mascarin National Botanical Conservatory (endemic species), Stella Matutina museum (sugarcane history), La Maison du Coco (coconut grove, eco-museum, workshops, at Pointe des Châteaux).\nStaying at Iloha, a preferential rate of €10/ticket is indicated on presentation of the flyer stamped by the hotel. The concierge helps you book:","de":"Laut der Seite Freizeit des Hotels, in der Nähe:\n• Strand und Lagune von Saint-Leu: sicheres Baden, Lagune von einem Rettungsschwimmerposten überwacht und durch ein Korallenriff geschützt; am Südeingang der Stadt gibt es außerdem einen Strand;\n• Pointe au Sel: ehemalige Salzgewinnung, heute Museum, mit einem natürlichen Meer- und Süßwasserbecken, dem „Bassin caverne“;\n• Markt von Saint-Leu: jeden Samstagvormittag ab 8:30 Uhr, Place de la République, an der Strandpromenade (Obst, Gemüse, kulinarische Spezialitäten, Kunsthandwerk);\n• Gleitschirmfliegen von der Pointe des Châteaux; Reiten in den Höhen von Saint-Leu durch Zuckerrohrfelder;\n• Golf du Bassin Bleu: 18 Löcher, 9 am Meer und 9 in einem Eukalyptuswald;\n• Hubschrauberflug über die Insel (UNESCO-Stätten);\n• Kélonia (Meeresschildkröten), Nationaler Botanischer Garten Mascarin (endemische Arten), Museum Stella Matutina (Geschichte des Zuckerrohrs), La Maison du Coco (Kokoshain, Öko-Museum, Workshops, an der Pointe des Châteaux).\nBei einem Aufenthalt im Iloha ist ein Vorzugspreis von 10 €/Ticket gegen Vorlage des vom Hotel gestempelten Flyers angegeben. Die Concierge hilft bei der Buchung:"},"statut":"valide","bonus":1},{"id":"services_hotel_liste","exemples":{"fr":["quels services propose l'hôtel","liste des services","services de l'hôtel","réception 24h/24","réception ouverte la nuit","quelqu'un à la réception la nuit","arrivée tard dans la nuit","salle de courtoisie","salle de courtoisie c'est quoi","poste internet","ordinateur à disposition","imprimer un document","imprimante","bagagerie","laisser mes bagages","consigne à bagages","balance pèse personne","pèse-personne","peser mes valises","prêt de serviette","serviette de bain piscine","serviettes de plage","baby-sitting","babysitter","garde d'enfants","location de voiture à l'hôtel","louer une voiture","boutique de l'hôtel","boutique souvenirs","parkings privés","2 parkings","laverie","les langues parlées","on parle anglais ?","parlez-vous allemand","vous parlez espagnol ?","quels sont les atouts de l'hôtel","points forts","services avec participation","services payants","services gratuits","bungalow PMR","accès PMR","la réception est ouverte 24h/24 ?","c'est quoi la salle de courtoisie","vous avez une bagagerie","location de voiture sur place","on peut avoir une baby-sitter pour ce soir"],"en":["what services does the hotel offer","list of services","24 hour reception","luggage storage","bathroom scales","towel loan","baby-sitting","car hire at the hotel","gift shop","which languages are spoken","do you have luggage storage"],"de":["welche Services bietet das Hotel","Liste der Services","Rezeption rund um die Uhr","Gepäckaufbewahrung","Personenwaage","Babysitting","Mietwagen im Hotel","welche Sprachen werden gesprochen"]},"mots_ancres":["salle de courtoisie:9","poste internet:8","pese personne:8","bagagerie:8","baby sitting:8","babysitting:8","babysitter:7","reception 24:7","peser:4","personenwaage:8","gepaeckaufbewahrung:7","gepackaufbewahrung:7","luggage storage:7","luggage room:7","towel loan:6","pret de serviette:7","services:4","servives:3","boutique:3"],"suggestions":["equipements","parking","accessibilite"],"actions":["tel:reception","mail:reception"],"service":"Hôtel","source":"https://www.iloha.fr/hotel/","topic":{"fr":"Services de l’hôtel (liste complète)","en":"Hotel services (full list)","de":"Hotelservices (vollständige Liste)"},"reponse":{"fr":"Services publiés par l’hôtel : réception 24h/24, Wi-Fi gratuit, 2 parkings privés, bornes de recharge pour véhicules électriques, laverie, salle de courtoisie, poste internet (à la réception), bagagerie, pèse-personne (sur réservation), lit bébé (sur réservation), prêt de serviette de bain, accès PMR et bungalows Kitchenette PMR. Avec participation : baby-sitting, soins de bien-être Cas’Akéa, location de voiture, navette aéroport et boutique. Langues parlées à l’hôtel : français et anglais. Atouts : vue sur l’océan, jardin tropical de 3 ha, 5 types d’hébergement, deux piscines (dont une chauffée durant l’hiver austral), deux restaurants, un bar et un glacier, un espace bien-être.","en":"Services published by the hotel: 24-hour reception, free Wi-Fi, 2 private car parks, electric-vehicle charging points, laundry, courtesy room, internet station (at reception), luggage room, bathroom scales (on request), baby cot (on request), loan of bath towels, accessibility for reduced mobility and accessible Kitchenette bungalows. With a fee: baby-sitting, Cas’Akéa wellness treatments, car hire, airport shuttle and boutique. Languages spoken at the hotel: French and English. Highlights: ocean view, 3-hectare tropical garden, 5 accommodation types, two swimming pools (one heated during the austral winter), two restaurants, a bar and an ice-cream parlour, a wellness area.","de":"Vom Hotel veröffentlichte Services: Rezeption rund um die Uhr, kostenloses WLAN, 2 private Parkplätze, Ladestationen für Elektrofahrzeuge, Waschsalon, Aufenthaltsraum, Internet-Terminal (an der Rezeption), Gepäckaufbewahrung, Personenwaage (auf Anfrage), Babybett (auf Anfrage), Leihe von Badetüchern, Zugang für Menschen mit eingeschränkter Mobilität und barrierefreie Kitchenette-Bungalows. Gegen Beteiligung: Babysitting, Cas’Akéa-Wellness, Mietwagen, Flughafenshuttle und Boutique. Im Hotel gesprochene Sprachen: Französisch und Englisch. Highlights: Meerblick, 3 ha tropischer Garten, 5 Unterkunftstypen, zwei Pools (einer im Südwinter beheizt), zwei Restaurants, eine Bar und eine Eisdiele, ein Wellnessbereich."},"statut":"valide","bonus":1},{"id":"situation_acces_transports","exemples":{"fr":["temps de trajet depuis roland garros","65 km","pierrefond saint-pierre","distance saint-denis","route du littoral","rn1","car jaune","kar'ouest","karouest ligne","transports en commun","bus pour saint leu","ligne de bus","ada europcar hertz","louer une voiture électrique","rent a car","jumbo car","écomobilité","transport à faible impact","plage à 3 km","distance de la plage","combien de mètres de l'océan","300 m de l'océan","plage à pied","accès à l'océan à pied","on peut aller à pied à la mer ?","distance entre l'hôtel et le lagon","cirques et pitons","patrimoine mondial unesco","accès aux cirques","où est situé l'hôtel","côte ouest","entrée du village de saint-leu","transfert privé","combien de temps depuis Roland Garros","Car Jaune ou Kar'Ouest ?"],"en":["Car Jaune","electric car rental","how far is the beach","can I walk to the ocean","where is the hotel located","how far is the airport"],"de":["Elektroauto mieten","wie weit ist der Strand","zu Fuß zum Meer","wo liegt das Hotel","wie weit ist der Flughafen"]},"mots_ancres":["roland garros:9","pierrefond*:9","kar ouest:7","karouest:7","65 km:8","route du littoral:7","ecomobilite:8","jumbo car:8","europcar:7","ada:3","patrimoine mondial:6","unesco:6","welterbe:6","300 m:5","3 km:5","600 m:5"],"suggestions":["acces","voiture","borne"],"actions":["tel:reception","mail:reception"],"service":"Hôtel","source":"https://www.iloha.fr/hotel/ ; https://www.iloha.fr/acces/","topic":{"fr":"Situation, distances et transports (aéroports, bus, voiture électrique)","en":"Location, distances and transport (airports, bus, electric car)","de":"Lage, Entfernungen und Verkehr (Flughäfen, Bus, Elektroauto)"},"reponse":{"fr":"Iloha se trouve sur la côte ouest de La Réunion, à l’entrée du village de Saint-Leu, à 300 m de l’océan Indien (600 m à pied) et à 3 km de la plage. Il est à environ 45 min de Saint-Denis et de l’aéroport Roland Garros, et à 30 min de l’aéroport de Pierrefonds (Saint-Pierre). Depuis Roland Garros : environ 1 h de route, soit 65 km par la route du littoral puis la RN1 vers le sud ; navettes et transferts privés sur demande auprès de la réception. En bus : plusieurs lignes desservent Saint-Leu depuis l’aéroport (Car Jaune, réseau régional ; Kar’Ouest, réseau de l’Ouest). En véhicule électrique : bornes de recharge à l’hôtel, et des loueurs proposent de l’électrique à Roland Garros (ADA, Europcar, Rent A Car, Hertz, Jumbo Car). Les cirques, pitons et remparts classés au patrimoine mondial de l’UNESCO sont aussi accessibles que le littoral ouest.","en":"Iloha is on the west coast of La Réunion, at the entrance to the village of Saint-Leu, 300 m from the Indian Ocean (600 m on foot) and 3 km from the beach. It is about 45 min from Saint-Denis and Roland Garros airport, and 30 min from Pierrefonds airport (Saint-Pierre). From Roland Garros: about 1 hour, 65 km via the coast road then the RN1 south; shuttles and private transfers on request from reception. By bus: several lines serve Saint-Leu from the airport (Car Jaune, regional network; Kar’Ouest, western network). By electric vehicle: charging points at the hotel, and rental companies offer electric cars at Roland Garros (ADA, Europcar, Rent A Car, Hertz, Jumbo Car). The UNESCO World Heritage cirques, peaks and ramparts are as accessible as the west coast.","de":"Iloha liegt an der Westküste von La Réunion, am Eingang des Dorfes Saint-Leu, 300 m vom Indischen Ozean (600 m zu Fuß) und 3 km vom Strand. Es sind etwa 45 Min. bis Saint-Denis und zum Flughafen Roland Garros und 30 Min. zum Flughafen Pierrefonds (Saint-Pierre). Von Roland Garros: ca. 1 Std. Fahrt, 65 km über die Küstenstraße und dann die RN1 nach Süden; Shuttles und private Transfers auf Anfrage an der Rezeption. Mit dem Bus: mehrere Linien fahren vom Flughafen nach Saint-Leu (Car Jaune, regionales Netz; Kar’Ouest, Netz des Westens). Mit dem Elektroauto: Ladestationen im Hotel, und Vermieter bieten am Roland Garros Elektrofahrzeuge an (ADA, Europcar, Rent A Car, Hertz, Jumbo Car). Die zum UNESCO-Welterbe zählenden Talkessel, Gipfel und Steilwände sind ebenso gut erreichbar wie die Westküste."},"statut":"valide","bonus":1},{"id":"hebergements_detail","exemples":{"fr":["combien de chambres","nombre de chambres","82 chambres","quelle taille fait la chambre standard","surface des chambres","combien de m2 le bungalow","superficie du bungalow famille","taille du bungalow tropique","17 m2","37 m2","34 m2","32 m2","55 m2","quel lit dans la chambre standard","lit double ou lits jumeaux","lits jumeaux possible","dimension du lit","lit 160","lit 180 x 200","banquette lit","canapé lit","combien de couchages","combien de personnes dans le bungalow tropique","bungalow pour 2 adultes et 2 enfants","chambre pour 4","on est 6 adultes","bungalow famille 4 adultes 2 enfants","combien de chambres Guetali","chambre guétali étage","guetali vue mer","guetali rez-de-chaussée piscine","villa créole","chambre avec accès direct à la piscine","chambre avec transats","terrasse dans la chambre","machine nespresso","douche italienne","sèche-cheveux dans la chambre","télévision HD","mini frigo","plateau de courtoisie","quelle chambre a une kitchenette","kitchenette équipée","parquet boiserie","matériaux naturels","d
