 to all guests); two pools including a heated one; Akéa Spa (open daily 9 am to 8 pm); chef Claude Pothin’s cuisine, blending Réunion produce with refined techniques; Pool Lodges with private pools; and a concierge to personalise your stay (romantic welcome, helicopter flight over the island…). Tell me what interests you (relaxation, gastronomy, family, romance) and I will go into detail.","de":"Was das Hotel hervorhebt: die Lage oberhalb des Strandes von Grande Anse, am Tor zum Wilden Süden; der „schwebende“ Strandbereich (Himmelbetten, beheizter Whirlpool und Hammam frei zugänglich); zwei Pools, einer davon beheizt; das Akéa Spa (täglich 9 bis 20 Uhr); die Küche von Küchenchef Claude Pothin, die Produkte aus La Réunion mit raffinierten Techniken verbindet; Pool Lodges mit privatem Pool; und eine Concierge für Ihre persönliche Gestaltung (romantischer Empfang, Hubschrauberflug über die Insel …). Sagen Sie mir, was Sie interessiert (Entspannung, Gastronomie, Familie, Romantik), dann gehe ich ins Detail."},"statut":"valide"},{"id":"spa_installations","exemples":{"fr":["le spa fait quelle taille","combien de salles de massage","qu est ce qu il y a dans le spa","le spa a un hammam","il y a des cabines duo au spa","cabine double massage couple","surface du spa","quelles installations au spa akea","acces au hammam avec un soin","une heure d acces au spa offerte","combien de cabines de soin","espace duo avec baignoire","ya un jardin au spa","cé grand le spa","le spa fait combien de m2","y a-t-il une cabine pour massage à deux"],"en":["how big is the spa","how many treatment rooms does the spa have","what facilities are in the spa","is there a couples treatment room","is spa access included with a treatment","is the hammam included when I book a treatment"],"de":["wie gross ist das spa","wie viele behandlungsraume hat das spa","was gibt es im spa","gibt es einen duo raum","ist der spa zugang bei einer behandlung inklusive","wie viele massageräume hat das spa","was für einrichtungen hat das spa"]},"mots_ancres":["435:5","salles de massage:5","espaces duo:5","espace duo:5","cabines:3","treatment rooms:5","couples room:5","duo raum:5","duo raume:5","behandlungsraume:5","installations spa:5","spa facilities:5","jardin tropical:5","tropical garden:5","tropischer garten:5","tropischen garten:5"],"suggestions":["spatreat","spa_prix","spa_regles"],"actions":["tel:spa"],"service":"Akea Spa","source":"https://palm.re/se-ressourcer/ (lu le 27/10/2026)","topic":{"fr":"Installations du spa","en":"Spa facilities","de":"Spa-Einrichtungen"},"reponse":{"fr":"AKÉA Spa & Beauty s'étend sur 435 m² : un hammam, un bassin à remous, deux espaces duo avec baignoire, quatre salles de massage individuelles, une salle de soin esthétique, un jardin tropical et une boutique. Pour tout soin réservé, 1 h d'accès aux installations du spa est offerte. Le spa est ouvert tous les jours de 9h à 20h.","en":"AKÉA Spa & Beauty covers 435 m²: a hammam, a whirlpool, two duo spaces with bathtub, four individual massage rooms, a beauty treatment room, a tropical garden and a boutique. Every treatment booked includes 1 hour of access to the spa facilities. The spa is open daily from 9 am to 8 pm.","de":"AKÉA Spa & Beauty erstreckt sich über 435 m²: Hammam, Whirlpool, zwei Duo-Räume mit Badewanne, vier Einzelmassageräume, ein Kosmetikraum, ein tropischer Garten und eine Boutique. Zu jeder gebuchten Behandlung gehört 1 Stunde Zugang zu den Spa-Einrichtungen. Das Spa ist täglich von 9 bis 20 Uhr geöffnet."}},{"id":"spa_regles","exemples":{"fr":["quand arriver avant mon massage","il faut arriver combien de temps avant le soin","si j arrive en retard au spa","retard soin spa","maillot de bain obligatoire au hammam","le spa est ouvert aux mineurs","les ados peuvent aller au spa","age minimum pour le spa","femme enceinte massage spa","je suis enceinte je peux faire un soin","un soin est remboursable","je peux donner mon soin a quelqu un","les massages sont ils medicaux","arriver en avance spa hammam","je peux choisir une masseuse","massage par un homme ou une femme","jpeu veni 10min avant le massage","si j'ai du retard pour mon soin ça se passe comment","puis-je offrir mon soin à une amie à ma place","c'est un massage médical ou de bien-être","on doit arriver combien de temps avant son massage"],"en":["how early should I arrive for my massage","what if I am late for my spa treatment","is a swimsuit required in the hammam","can teenagers use the spa","minimum age for the spa","can I have a massage while pregnant","is the treatment refundable","can I choose a female therapist"],"de":["wie früh soll ich vor der massage kommen","was passiert wenn ich zu spät zum spa komme","ist badebekleidung im hammam pflicht","ab welchem alter darf man ins spa","massage in der schwangerschaft","ist die behandlung erstattungsfähig","kann ich eine masseurin wählen"]},"mots_ancres":["arriver avant soin:5","retard spa:5","maillot spa:5","swimsuit hammam:5","badebekleidung:5","mineurs spa:5","enceinte:4","grossesse:4","pregnant:4","pregnancy:4","schwanger*:5","cessible:5","therapeutique:5","late for spa:5","zu spat spa:5","masseuse:4","therapist:4","therapeutin:4"],"suggestions":["spacancel","spa_installations","spa_prix"],"actions":["tel:spa"],"service":"Akea Spa","source":"https://palm.re/se-ressourcer/ (informations pratiques)","topic":{"fr":"Informations pratiques du spa","en":"Spa practical information","de":"Praktische Spa-Hinweise"},"reponse":{"fr":"Informations pratiques du spa : l'heure de réservation est celle où commence votre soin. Le spa recommande d'arriver au moins 1 h à l'avance pour profiter du hammam et du bain à remous avant le soin, ou 15 min à l'avance pour en profiter après ; tout retard est imputé sur la durée du soin. L'accès au spa et les soins (hors soins enfants) sont réservés aux personnes majeures, et le maillot de bain est obligatoire pour le hammam et le bain à remous. Merci de signaler à la réservation tout problème de santé ou une grossesse. L'achat d'un soin est personnel, non cessible et non remboursable ; les massages sont des modelages de bien-être, non thérapeutiques et non médicalisés. Il est possible de préciser si vous préférez une praticienne ou un praticien.","en":"Spa practical information: your booking time is when your treatment starts. The spa recommends arriving at least 1 hour early to enjoy the hammam and whirlpool before your treatment, or 15 minutes early to enjoy them afterwards; any delay is deducted from the treatment time. Spa access and treatments (except children's treatments) are for adults only, and swimwear is compulsory for the hammam and whirlpool. Please mention any health issue or pregnancy when booking. A treatment is personal, non-transferable and non-refundable; massages are wellness body treatments, non-therapeutic and non-medical. You can say whether you prefer a female or male therapist.","de":"Praktische Hinweise zum Spa: Die Reservierungszeit ist der Beginn Ihrer Behandlung. Das Spa empfiehlt, mindestens 1 Stunde vorher zu kommen, um Hammam und Whirlpool vor der Behandlung zu nutzen, oder 15 Minuten vorher, um sie danach zu nutzen; Verspätungen gehen von der Behandlungsdauer ab. Spa-Zugang und Behandlungen (außer Kinderbehandlungen) sind Erwachsenen vorbehalten, für Hammam und Whirlpool ist Badebekleidung Pflicht. Bitte geben Sie bei der Buchung gesundheitliche Probleme oder eine Schwangerschaft an. Eine Behandlung ist persönlich, nicht übertragbar und nicht erstattungsfähig; Massagen sind Wellness-Anwendungen, nicht therapeutisch und nicht medizinisch. Sie können angeben, ob Sie eine Therapeutin oder einen Therapeuten bevorzugen."}},{"id":"spa_signature","exemples":{"fr":["c quoi le soin akea","massage signature","soins signature du spa","le soin bamboo","massage au bambou","c est quoi aqua sens","soin dans la piscine","watsu shiatsu","massage pour femme enceinte","baby soon c est quoi","rituel des jeunes maries","soin pour jeunes maries au spa","huile secret de spa","rituel akea bain de fleurs","massage dans l eau","massage cocooning future maman","vous faites un massage dans la piscine","que comprend le rituel des jeunes mariés au spa"],"en":["what is the akea signature massage","bamboo massage","what is aqua sens","water treatment in the pool","massage for pregnant women","newlyweds ritual at the spa","what is baby soon","flower bath treatment","what does the newlyweds ritual include","do you offer a massage in the pool"],"de":["was ist die akea signature massage","bambusmassage","was ist aqua sens","wasseranwendung im pool","massage fur schwangere","ritual fur frischvermahlte im spa","blumenbad anwendung","gibt es eine massage im pool"]},"mots_ancres":["bamboo:5","bambou:5","bambus*:5","aqua sens:5","aquasens:5","watsu:5","shiatsu:5","baby soon:5","babysoon:5","jeunes maries:4","newlyweds:4","frischvermahlte*:5","signature:4","secret de spa:5","rituel akea:5","bain de fleurs:5","flower bath:5","blumenbad:5","serviettes chaudes:5","hot towel:5","future maman:4","expectant:4"],"suggestions":["spa_relaxant","spa_prix","spa_regles"],"actions":["tel:spa"],"service":"Akea Spa","source":"https://palm.re/se-ressourcer/ (carte des soins)","topic":{"fr":"Soins signature Akéa","en":"Akéa signature treatments","de":"Akéa Signature-Anwendungen"},"reponse":{"fr":"Les soins « Signature » d'Akéa Spa (50 min, 105 € sur la carte du spa) : Akéa (soin relaxant du corps entier inspiré des modelages d'Asie, avec l'huile « Secret de Spa » ou l'huile de votre choix) ; Aqua Sens (soin aquatique dans la piscine chauffée, entre watsu et shiatsu) ; Bamboo (massage rythmé par le bambou) ; Baby Soon (modelage cocooning à l'huile neutre pour les futures mamans). Aussi : Rituel des Jeunes Mariés (1h20, 250 € pour le couple : bain de vapeur parfumé, soin minéral aux pierres semi-précieuses ou soin Akéa, cocktail de fruits frais ou coupe de champagne dans un bain de fleurs) et Rituel Akéa (1h20, 150 € : massage Akéa suivi d'un bain de fleurs parfumé). Tous s'achèvent par le rituel des serviettes chaudes parfumées. Le formulaire de réservation en ligne affiche 95 € (et 140 € pour le Rituel Akéa) : l'équipe du spa confirme le montant exact.","en":"Akéa Spa “Signature” treatments (50 min, €105 on the spa menu): Akéa (full-body relaxing treatment inspired by Asian massage, with “Secret de Spa” oil or an oil of your choice); Aqua Sens (aquatic treatment in the heated pool, between watsu and shiatsu); Bamboo (massage rhythmed by bamboo); Baby Soon (cocooning massage with neutral oil for expectant mothers). Also: Newlyweds' Ritual (1h20, €250 for the couple: scented steam bath, gemstone mineral treatment or Akéa treatment, fresh fruit cocktail or glass of champagne in a flower bath) and Akéa Ritual (1h20, €150: Akéa massage followed by a scented flower bath). All end with the scented hot towel ritual. The online booking form shows €95 (and €140 for the Akéa Ritual): the spa team confirms the exact amount.","de":"Die „Signature“-Anwendungen von Akéa Spa (50 Min., 105 € laut Spa-Karte): Akéa (entspannende Ganzkörperanwendung nach asiatischen Massagetechniken, mit dem Öl „Secret de Spa“ oder einem Öl Ihrer Wahl); Aqua Sens (Wasseranwendung im beheizten Pool, zwischen Watsu und Shiatsu); Bamboo (Massage mit Bambus); Baby Soon (wohltuende Massage mit neutralem Öl für werdende Mütter). Außerdem: Ritual der Frischvermählten (1 Std. 20, 250 € für das Paar: duftendes Dampfbad, mineralische Anwendung mit Halbedelsteinen oder Akéa-Anwendung, frischer Fruchtcocktail oder Glas Champagner im Blumenbad) und Akéa-Ritual (1 Std. 20, 150 €: Akéa-Massage mit anschließendem Blumenbad). Alle enden mit dem Ritual der warmen, duftenden Tücher. Das Online-Buchungsformular zeigt 95 € (und 140 € für das Akéa-Ritual): Das Spa-Team bestätigt den genauen Betrag."}},{"id":"spa_relaxant","exemples":{"fr":["massage du visage","massage a la bougie","massage chinois","tui na","massage aux pierres chaudes","pierres semi precieuses","reve de siam c  vapeur avec citronnelle, gingembre, vétiver, curcuma, camphre). Le formulaire de réservation en ligne affiche des montants un peu inférieurs : le spa confirme le tarif exact.","en":"Akéa Spa “Relaxing” treatments: Zen Équilibre (30 min, €65, face and scalp massage, residents only); Serenity (30 min, €65, upper body: back, shoulders, arms, hands, face and scalp, residents only); Mineral with Semi-Precious Stones (50 min, €105, stones from Madagascar and polished marble pebbles from Bali); Asia Touch (50 min, €105, traditional Chinese energy treatment inspired by Tui-na, performed clothed and without oil); Terre Ciel (50 min, €105, face, scalp, arms, hands, feet and lower legs, ideal for pregnant women); Candle Touch (50 min, €105, scented candle whose wax becomes massage oil); Rêve de Siam (1h20, €150, steam-heated pouches with lemongrass, ginger, vetiver, turmeric, camphor). The online booking form shows slightly lower amounts: the spa confirms the exact price.","de":"Die „Entspannenden“ Anwendungen von Akéa Spa: Zen Équilibre (30 Min., 65 €, Gesichts- und Kopfmassage, nur für Hausgäste); Serenity (30 Min., 65 €, Oberkörper: Rücken, Schultern, Arme, Hände, Gesicht und Kopfhaut, nur für Hausgäste); Mineral mit Halbedelsteinen (50 Min., 105 €, Steine aus Madagaskar und polierte Marmorkiesel aus Bali); Asia Touch (50 Min., 105 €, traditionelle chinesische Energiebehandlung nach Tui-na, bekleidet und ohne Öl); Terre Ciel (50 Min., 105 €, Gesicht, Kopfhaut, Arme, Hände, Füße und Unterschenkel, ideal für Schwangere); Candle Touch (50 Min., 105 €, Duftkerze, deren Wachs zu Massageöl wird); Rêve de Siam (1 Std. 20, 150 €, mit Dampf erhitzte Beutel mit Zitronengras, Ingwer, Vetiver, Kurkuma, Kampfer). Das Online-Formular zeigt etwas niedrigere Beträge: Das Spa bestätigt den genauen Preis."},"prefere":true},{"id":"spa_sublimant","exemples":{"fr":["vous faites des manucures","pose de vernis au spa","vernis semi permanent","pedicure possible","epilation au spa","epilation jamb and Caress (1h20, manicure with brown sugar “péi” scrub and massage, classic polish €85 or semi-permanent €95); Akéa Foot Beauty (1h20, pedicure with scrub and massage, classic €95 or semi-permanent €110); Akéa Satin Softness (waxing à la carte, 30 min €40, 45 min €55, 1 h €70, 1h30 €90, residents only); Bio Akéa Velvet Face (50 min, €105); Sublissime Bio Akéa Face (1h30, €140); body-polishing treatment (50 min, €105, coconut or local sugar); Spa Philosophy (1h20, €150, steam bath, oil, scrub, scented flower bath). The spa does not remove semi-permanent polish.","de":"Für die Schönheit bietet Akéa Spa: Akéa Caresse des Mains (1 Std. 20, Maniküre mit Peeling aus braunem „péi“-Zucker und Massage, klassischer Lack 85 € oder Semi-Permanent 95 €); Akéa Beauté des Pieds (1 Std. 20, Pediküre mit Peeling und Massage, klassisch 95 € oder Semi-Permanent 110 €); Akéa Douceur Satin (Haarentfernung nach Wunsch, 30 Min. 40 €, 45 Min. 55 €, 1 Std. 70 €, 1 Std. 30 90 €, nur für Hausgäste); Bio Akéa Visage de Velours (50 Min., 105 €); Sublissime Bio Akéa Visage (1 Std. 30, 140 €); Körperpeeling (50 Min., 105 €, Kokos oder „péi“-Zucker); Spa-Philosophie (1 Std. 20, 150 €, Dampfbad, Öl, Peeling, duftendes Blumenbad). Das Spa entfernt keinen Semi-Permanent-Lack."}},{"id":"spa_enfants","exemples":{"fr":["massage enfant","manucure enfant","ma fille peut faire une manucure","soin lolita","aqua sens junior","a partir de quel age soin spa","spa pour les 8 ans","nail art enfant","le spa accepte les enfants de quel âge","à partir de quel âge un enfant peut aller au spa","ma fille de 8 ans peut avoir une manucure au spa","mon enfant de 10 ans peut avoir un soin au spa","soin pour un enfant de 6 ans"],"en":["kids manicure","can my daughter have a manicure","what age for spa treatments","from what age are children allowed in the spa","can my 9 year old daughter have a manicure"],"de":["kindermanikure","kann meine tochter eine manikure bekommen","ab welchem alter spa anwendung","ab welchem alter dürfen kinder ins spa","kann meine 7 jährige tochter eine maniküre bekommen"]},"mots_ancres":["lolita:5","aqua sens junior:5","junior:3","nail art:5","kinderanwendung*:5","kids manicure:5","kindermanikure:5","6 a 12 ans:4"],"suggestions":["family","kidsact","spa_regles"],"actions":["tel:spa"],"service":"Akea Spa","source":"https://palm.re/se-ressourcer/ ; https://palm.re/offres-speciales/offre-famille/","topic":{"fr":"Soins enfants au spa","en":"Children's spa treatments","de":"Kinderanwendungen im Spa"},"reponse":{"fr":"Deux soins sont pensés pour les enfants de 6 à 12 ans, réservés à la clientèle résidente : Lolita (30 min, 55 €, manucure avec « nail art » choisi par l'enfant) et Aqua Sens Junior (30 min, 55 €, expérience aquatique pour les enfants à l'aise dans l'eau). Ils ne sont pas disponibles en coffret cadeau. En dehors de ces soins enfants, le spa est réservé aux personnes majeures. Les résidents bénéficient d'une remise de 10 % sur la collection de soins, hors Lolita et Aqua Sens Junior ; le site mentionne en revanche 10 % de remise sur les deux soins enfants dans l'offre famille : l'équipe du spa confirme le tarif au moment de la réservation.","en":"Two treatments are designed for children aged 6 to 12, reserved for hotel guests: Lolita (30 min, €55, manicure with nail art chosen by the child) and Aqua Sens Junior (30 min, €55, an aquatic experience for children comfortable in water). They are not available as gift boxes. Apart from these children's treatments, the spa is for adults only. The spa menu excludes Lolita and Aqua Sens Junior from the 10% guest discount, while the family offer page mentions 10% off the two children's treatments: the spa team confirms the price when you book.","de":"Zwei Anwendungen sind für Kinder von 6 bis 12 Jahren gedacht und Hausgästen vorbehalten: Lolita (30 Min., 55 €, Maniküre mit vom Kind gewähltem Nail Art) und Aqua Sens Junior (30 Min., 55 €, Wassererlebnis für Kinder, die sich im Wasser wohlfühlen). Als Geschenkbox sind sie nicht erhältlich. Abgesehen von diesen Kinderanwendungen ist das Spa Erwachsenen vorbehalten. Die Spa-Karte schließt Lolita und Aqua Sens Junior vom 10-%-Hausgästerabatt aus, die Seite zum Familienangebot nennt dagegen 10 % auf beide Kinderanwendungen: Das Spa-Team bestätigt den Preis bei der Buchung."},"prefere":true},{"id":"spa_sens","exemples":{"fr":["sens by akea","massage sur ma terrasse","soin en terrasse lodge","massage dans la chambre","soin a domicile dans le lodge","massage en exterieur","soin prive sur la terrasse"],"en":["sens by akea","massage on my terrace","treatment on the lodge terrace","in room massage","outdoor massage"],"de":["sens by akea","massage auf meiner terrasse","anwendung auf der lodge terrasse","massage im zimmer"]},"mots_ancres":["sens by akea:6","sens akea:6","sens by:5","massage terrasse:5","terrace massage:5","terrassenmassage:5","massage dans la chambre:5","in room massage:5","massage im zimmer:5","soin terrasse:5"],"suggestions":["spa_signature","rooms","spa_prix"],"actions":["tel:spa"],"service":"Akea Spa","source":"https://palm.re/se-ressourcer/ (SENS by AKEA)","topic":{"fr":"SENS by Akéa (soin en terrasse)","en":"SENS by Akéa","de":"SENS by Akéa"},"reponse":{"fr":"SENS by Akéa est un soin sur mesure de 60 min (120 €) prodigué sur la terrasse du Lodge ou du Pool Lodge, au gré du souffle du vent, du murmure de l'eau et du chant des oiseaux. Il est réservé à la clientèle séjournant dans ces catégories d'hébergement, selon les conditions météorologiques, et n'est pas disponible en coffret cadeau.","en":"SENS by Akéa is a tailor-made 60-minute treatment (€120) given on the terrace of your Lodge or Pool Lodge, with the breeze, the murmur of water and birdsong. It is reserved for guests staying in these room categories, weather permitting, and is not available as a gift box.","de":"SENS by Akéa ist eine maßgeschneiderte 60-Minuten-Anwendung (120 €) auf der Terrasse des Lodge oder Pool Lodge, begleitet von Wind, Wasserrauschen und Vogelgesang. Sie ist Gästen dieser Zimmerkategorien vorbehalten, wetterabhängig, und nicht als Geschenkbox erhältlich."}},{"id":"spa_prix","exemples":{"fr":["combien coute un massage","prix massage spa","tarif d un massage de 50 minutes","prix du spa","les soins coutent combien","carte des soins avec les prix","tarif soin duo","combien pour un massage couple","prix massage akea","tarifs spa","cest combien le massage","prix soin visage","combien pour le hammam","c combien un massage"],"en":["how much is a massage","spa prices","price of a 50 minute massage","how much do treatments cost","spa menu with prices","couples massage price","can I see the spa price list"],"de":["was kostet eine massage","spa preise","preis fur eine 50 minuten massage","wie viel kosten die anwendungen","spa karte mit preisen","preis paarmassage","wie hoch sind die spa preise"]},"mots_ancres":["prix massage:6","tarif massage:6","massage price:6","massage preis:6","prix spa:6","tarif spa:6","spa prices:6","spa preise:6","prix soin:6","tarif soin:6","combien coute massage:6","cout massage:5","cout soin:5","how much massage:6","was kostet massage:6","prix soins:6","tarifs soins:6","prix du spa:6"],"suggestions":["spa_signature","kahzen","spacancel"],"actions":["tel:spa","mail:spa"],"service":"Akea Spa","source":"https://palm.re/se-ressourcer/ (carte des soins)","topic":{"fr":"Tarifs des soins du spa","en":"Spa treatment prices","de":"Spa-Preise"},"reponse":{"fr":"Tarifs de la carte des soins Akéa Spa : massages et soins de 50 min 105 € ; soins de 30 min (résidents) 65 € ; Rituel Akéa et Rêve de Siam (1h20) 150 € ; Rituel des Jeunes Mariés 250 € pour le couple ; SENS by Akéa (60 min) 120 € ; soins enfants Lolita et Aqua Sens Junior 55 € ; manucure 85 € ou 95 € (semi-permanent) ; pédicure 95 € ou 110 € ; Sublissime Bio Akéa Visage 140 € ; épilations de 40 € à 90 € ; Formule Akéa (massage + déjeuner) 145 € ; Formule Kah Zen 195 € ; carte de 5 soins 470 € et carte de 10 soins 860 €. Attention : le formulaire de réservation en ligne du site affiche des montants légèrement différents (par exemple 95 € pour un soin de 50 min) : l'équipe du spa vous confirme le tarif exact à la réservation. Les résidents bénéficient de 10 % de remise sur une sélection de soins.","en":"Akéa Spa menu prices: 50-minute massages and treatments €105; 30-minute treatments (guests) €65; Akéa Ritual and Dream of Siam (1h20) €150; Newlyweds' Ritual €250 for the couple; SENS by Akéa (60 min) €120; children's treatments Lolita and Aqua Sens Junior €55; manicure €85 or €95 (semi-permanent); pedicure €95 or €110; Sublissime Bio Akéa Face €140; waxing €40 to €90; Akéa Package (massage + lunch) €145; Kah Zen package €195; 5-treatment card €470 and 10-treatment card €860. Note: the website's online booking form shows slightly different amounts (for example €95 for a 50-minute treatment): the spa team confirms the exact price when you book. Hotel guests get 10% off a selection of treatments.","de":"Preise der Akéa-Spa-Karte: Massagen und Anwendungen von 50 Min. 105 €; 30-Minuten-Anwendungen (Hausgäste) 65 €; Akéa-Ritual und Rêve de Siam (1 Std. 20) 150 €; Ritual der Frischvermählten 250 € für das Paar; SENS by Akéa (60 Min.) 120 €; Kinderanwendungen Lolita und Aqua Sens Junior 55 €; Maniküre 85 € oder 95 € (Semi-Permanent); Pediküre 95 € oder 110 €; Sublissime Bio Akéa Visage 140 €; Haarentfernung 40 € bis 90 €; Akéa-Formel (Massage + Mittagessen) 145 €; Formel Kah Zen 195 €; Karte für 5 Anwendungen 470 € und für 10 Anwendungen 860 €. Hinweis: Das Online-Buchungsformular der Website zeigt leicht abweichende Beträge (z. B. 95 € für eine 50-Minuten-Anwendung): Das Spa-Team bestätigt den genauen Preis bei der Buchung. Hausgäste erhalten 10 % Rabatt auf eine Auswahl von Anwendungen."}},{"id":"spa_cartes","exemples":{"fr":["carte d abonnement spa","carte 5 soins","carte 10 soins","forfait massages","formule akea","massage plus dejeuner","combien de temps valable la carte du spa","abonnement spa","combien coute la carte de 10 massages","massage et déjeuner en formule"],"en":["spa subscription card","5 treatment card","10 treatment card","massage package","massage and lunch package","how long is the spa card valid","do you sell spa cards for several treatments"],"de":["spa abokarte","karte fur 5 anwendungen","karte fur 10 anwendungen","massage paket","massage und mittagessen paket","wie lange gilt die spa karte","gibt es eine karte für mehrere anwendungen"]},"mots_ancres":["abonnement*:5","subscription:5","abo karte:5","abokarte:5","carte 5 soins:5","carte 10 soins:5","formule akea:5","akea package:5","akea formel:5","forfait massage*:5","massage package:5","massage paket:5","massage et dejeuner:4","massage and lunch:4"],"suggestions":["kahzen","spa_prix","gift"],"actions":["tel:spa"],"service":"Akea Spa","source":"https://palm.re/se-ressourcer/ (formules et cartes d'abonnement)","topic":{"fr":"Cartes d'abonnement et Formule Akéa","en":"Spa subscription cards and Akéa package","de":"Spa-Karten und Akéa-Formel"},"reponse":{"fr":"Le spa propose des cartes d'abonnement nominatives : 5 soins 470 € ou 10 soins 860 € sur la carte du spa. Elles donnent accès aux installations avant ou après le soin, avec libre choix d'un soin de 50 min, et sont valables 1 an à partir de la date d'achat. La Formule Akéa (145 €) associe un massage Akéa de 50 min à un déjeuner (1 plat + 1 garniture + 1 dessert au choix, cocktail de fruits frais, eau, café ou thé), avant ou après le massage. Le formulaire en ligne affiche des montants légèrement inférieurs (135 €, 420 € et 760 €) : le spa confirme le tarif exact à la réservation.","en":"The spa offers personal subscription cards: 5 treatments €470 or 10 treatments €860 on the spa menu. They give access to the facilities before or after the treatment, with a free choice of a 50-minute treatment, and are valid for 1 year from the purchase date. The Akéa Package (€145) combines a 50-minute Akéa massage with lunch (1 main + 1 side + 1 dessert of your choice, fresh fruit cocktail, water, coffee or tea), before or after the massage. The online form shows slightly lower amounts (€135, €420 and €760): the spa confirms the exact price when you book.","de":"Das Spa bietet persönliche Abo-Karten: 5 Anwendungen 470 € oder 10 Anwendungen 860 € laut Spa-Karte. Sie geben vor oder nach der Behandlung Zugang zu den Einrichtungen, mit freier Wahl einer 50-Minuten-Anwendung, und sind ab Kaufdatum 1 Jahr gültig. Die Akéa-Formel (145 €) verbindet eine 50-Minuten-Akéa-Massage mit einem Mittagessen (1 Gericht + 1 Beilage + 1 Dessert nach Wahl, frischer Fruchtcocktail, Wasser, Kaffee oder Tee), vor oder nach der Massage. Das Online-Formular zeigt etwas niedrigere Beträge (135 €, 420 € und 760 €): Das Spa bestätigt den genauen Preis bei der Buchung."}},{"id":"spa_residents","exemples":{"fr":["soin sans reserver une chambre"],"en":[],"de":[]},"mots_ancres":["hausgaste*:5","hausgast*:5","nur fur hausgaste:5"],"suggestions":["kahzen","spa_enfants","spatreat"],"actions":["tel:spa","mail:spa"],"service":"Akea Spa","source":"https://palm.re/se-ressourcer/ (carte des soins, informations pratiques)","topic":{"fr":"Soins réservés aux résidents et remise spa","en":"Residents-only treatments and spa discount","de":"Anwendungen nur für Hausgäste und Spa-Rabatt"},"reponse":{"fr":"Les soins de 30 minutes, les épilations, SENS by Akéa et les soins enfants sont exclusivement proposés dans le cadre d'un séjour. Pour tout séjour réservé à l'hôtel, 10 % de remise sont offerts sur une sélection de soins (hors SENS by Akéa, Serenity, Zen Équilibre, Lolita, Aqua Sens Junior, cartes d'abonnement et épilations). Les autres soins restent accessibles à la réservation ; le spa recommande de réserver à l'avance, selon ses disponibilités, au +262 (0) 262 56 44 82 ou akea@palm.re.","en":"30-minute treatments, waxing, SENS by Akéa and children's treatments are offered exclusively as part of a stay. For any stay booked at the hotel, 10% off is offered on a selection of treatments (excluding SENS by Akéa, Serenity, Zen Équilibre, Lolita, Aqua Sens Junior, subscription cards and waxing). The other treatments can still be booked; the spa recommends booking in advance, subject to availability, on +262 (0) 262 56 44 82 or akea@palm.re.","de":"Die 30-Minuten-Anwendungen, die Haarentfernung, SENS by Akéa und die Kinderanwendungen gibt es ausschließlich im Rahmen eines Aufenthalts. Für jeden im Hotel gebuchten Aufenthalt gibt es 10 % Rabatt auf eine Auswahl von Anwendungen (ausgenommen SENS by Akéa, Serenity, Zen Équilibre, Lolita, Aqua Sens Junior, Abo-Karten und Haarentfernung). Die übrigen Anwendungen können weiterhin gebucht werden; das Spa empfiehlt, je nach Verfügbarkeit vorab zu reservieren: +262 (0) 262 56 44 82 oder akea@palm.re."}},{"id":"spa_produits","exemples":{"fr":["quelle marque de cosmetiques","produits naturels au spa","on peut acheter l huile de massage","parfum secret de spa","les produits du spa sont bio","gamme de produits akea","cosmetiques reunionnais","acheter des produits de beaute","boutique du spa","d'où viennent les produits du spa"],"en":["which cosmetics brand","natural products at the spa","can I buy the massage oil","secret de spa fragrance","where do the spa products come from","spa boutique"],"de":["welche kosmetikmarke","naturprodukte im spa","kann ich das massageol kaufen","duft secret de spa","woher stammen die spa produkte","spa boutique","woher kommen die produkte des spas"]},"mots_ancres":["produits akea:5","akea products:5","akea produkte:5","cosmetique*:4","cosmetics:4","kosmetik*:4","parfum*:3","fragrance:4","duft:4","huile de massage:4","massage oil:4","massageol:4","acheter produits:4","ingredients:4","boutique:3"],"suggestions":["gift","spa_signature","spatreat"],"actions":["tel:spa"],"service":"Akea Spa","source":"https://palm.re/se-ressourcer/ (Les produits Akéa)","topic":{"fr":"Produits Akéa","en":"Akéa products","de":"Akéa-Produkte"},"reponse":{"fr":"Akéa Spa sélectionne des ingrédients d'origine naturelle provenant en majorité de l'océan Indien pour en extraire de délicates essences utilisées pendant les soins. La signature olfactive « Secret de Spa » est née d'une collaboration avec un artisan parfumeur réunionnais ; on la retrouve dans la gamme « Secret de Spa » et dans le soin Akéa. Le spa dispose d'une boutique, et les soins Akéa existent aussi en coffret cadeau.","en":"Akéa Spa selects ingredients of natural origin, mostly from the Indian Ocean, from which delicate essences are extracted for use during treatments. The “Secret de Spa” olfactory signature was created with a Reunionese master perfumer and is found in the “Secret de Spa” range and in the Akéa treatment. The spa has a boutique, and Akéa treatments are also available as gift boxes.","de":"Akéa Spa wählt Inhaltsstoffe natürlichen Ursprungs, überwiegend aus dem Indischen Ozean, aus denen feine Essenzen für die Anwendungen gewonnen werden. Die Duftsignatur „Secret de Spa“ entstand in Zusammenarbeit mit einem Parfümeur von La Réunion und findet sich in der Linie „Secret de Spa“ und in der Akéa-Anwendung. Das Spa hat eine Boutique, und Akéa-Anwendungen gibt es auch als Geschenkbox."}},{"id":"room_superieure","exemples":{"fr":["la chambre superieure c est quoi","taille chambre superieure","chambre superieure avec terrasse","la chambre standard","c est la chambre de base","superieure lit double","dans les villas creoles","chambres communicantes"],"en":["tell me about the superior room","superior room size","standard room","entry level room","connecting rooms"],"de":["erzahlen sie mir vom superior zimmer","grosse des superior zimmers","standardzimmer","einstiegskategorie","verbindungszimmer"]},"mots_ancres":["superieure:5","chambre de base:4","entry level:4","einstiegs*:4","villas creoles:5","creole villas:5","kreolische villen:5","communicante*:4","connecting:4","verbindungszimmer:4","superieure:4","superior room:5"],"suggestions":["rooms","family","equip"],"actions":[{"lien":"https://palm.re/sejourner/"}],"service":"Réception","source":"https://palm.re/sejourner/ (lu le 27/10/2026)","topic":{"fr":"Chambre Supérieure","en":"Superior room","de":"Superior-Zimmer"},"reponse":{"fr":"La chambre Supérieure (34 m²) est située au premier étage ou au rez-de-chaussée de jolies villas créoles réparties dans les jardins : vue jardin, lit de 180×200 cm, terrasse aménagée, douche. Elle accueille 1 ou 2 adultes + 1 bébé. Certaines chambres sont communicantes, sur demande, pour les séjours en famille.","en":"The Superior room (34 m²) is on the first or ground floor of pretty Creole villas in the gardens: garden view, 180×200 cm bed, furnished terrace, shower. It sleeps 1 or 2 adults + 1 baby. Some rooms are connecting, on request, for family stays.","de":"Das Superior-Zimmer (34 m²) liegt im ersten Stock oder Erdgeschoss hübscher kreolischer Villen in den Gärten: Gartenblick, Bett 180×200 cm, möblierte Terrasse, Dusche. Es bietet Platz für 1 oder 2 Erwachsene + 1 Baby. Einige Zimmer sind auf Anfrage miteinander verbunden, für Familienaufenthalte."}},{"id":"room_deluxe","exemples":{"fr":["la chambre deluxe","difference entre superieure et deluxe","chambre avec dressing","chambre avec coin salon","deluxe c est combien de m2","chambre avec bain de soleil","deluxe pour 2 personnes","chambre 41 m2"],"en":["tell me about the deluxe room","difference between superior and deluxe","room with a dressing room","room with a sitting area","deluxe room size"],"de":["erzahlen sie mir vom deluxe zimmer","unterschied zwischen superior und deluxe","zimmer mit ankleide","zimmer mit sitzecke","grosse deluxe zimmer"]},"mots_ancres":["deluxe:5","dressing:5","coin salon:4","sitting area:4","sitzecke:4","ankleide*:5","bain de soleil:4","sunbed:4","sonnenliege:4"],"suggestions":["rooms","pmr","equip"],"actions":[{"lien":"https://palm.re/sejourner/"}],"service":"Réception","source":"https://palm.re/sejourner/ (lu le 27/10/2026)","topic":{"fr":"Chambre Deluxe","en":"Deluxe room","de":"Deluxe-Zimmer"},"reponse":{"fr":"La chambre Deluxe (41 m²) se trouve dans les villas créoles implantées dans les jardins : décoration raffinée, salon cosy et large dressing, vue jardin, lit de 180×200 cm, terrasse aménagée avec bain de soleil double, douche. Elle accueille 1 ou 2 adultes + 1 bébé. Une chambre Deluxe est accessible aux personnes à mobilité réduite.","en":"The Deluxe room (41 m²) is in the Creole villas of the gardens: refined décor, cosy lounge and large dressing room, garden view, 180×200 cm bed, furnished terrace with a double sunbed, shower. It sleeps 1 or 2 adults + 1 baby. One Deluxe room is accessible to guests with reduced mobility.","de":"Das Deluxe-Zimmer (41 m²) liegt in den kreolischen Villen in den Gärten: raffinierte Einrichtung, gemütliche Sitzecke und großer Ankleidebereich, Gartenblick, Bett 180×200 cm, möblierte Terrasse mit Doppelsonnenliege, Dusche. Es bietet Platz für 1 oder 2 Erwachsene + 1 Baby. Ein Deluxe-Zimmer ist für Gäste mit eingeschränkter Mobilität zugänglich."}},{"id":"room_suite","exemples":{"fr":["la suite c est comment","suite avec cheminee","suite avec cave a vin","taille de la suite","suite pour une famille de 4","suite 55 m2","suite avec jacuzzi","suite avec douche a ciel ouvert","une cheminee dans la chambre"],"en":["tell me about the suite","suite with fireplace","suite with wine cellar","suite size","suite for a family of four"],"de":["erzahlen sie mir von der suite","suite mit kamin","suite mit weinkeller","grosse der suite","suite fur eine familie mit vier personen"]},"mots_ancres":["suite:5","suites:5","cheminee:5","fireplace:5","kamin:5","cave a vin:5","wine cellar:5","weinkeller:5","loveuse:5","loveseat:5","douche a ciel ouvert:5","open air shower:5","freiluftdusche:5"],"suggestions":["family","bath","rooms"],"actions":[{"lien":"https://palm.re/sejourner/"}],"service":"Réception","source":"https://palm.re/sejourner/ (lu le 27/10/2026)","topic":{"fr":"Suite","en":"Suite","de":"Suite"},"reponse":{"fr":"La Suite (55 m²), pensée pour les familles, comprend un coin salon avec cheminée, une terrasse privative avec bain à remous, une salle de bain avec baignoire et douche à ciel ouvert, une loveuse et une cave à vin. Vue jardin, lit de 180×200 cm et lit de 140×190 cm. Elle accueille 2 adultes + 2 enfants + 1 bébé, ou 2 adultes + 1 adolescent + 1 bébé. Une Suite est accessible aux personnes à mobilité réduite.","en":"The Suite (55 m²), designed for families, has a lounge area with fireplace, a private terrace with whirlpool, a bathroom with bathtub and open-air shower, a loveseat and a wine cellar. Garden view, one 180×200 cm bed and one 140×190 cm bed. It sleeps 2 adults + 2 children + 1 baby, or 2 adults + 1 teenager + 1 baby. One Suite is accessible to guests with reduced mobility.","de":"Die Suite (55 m²), für Familien gedacht, hat einen Wohnbereich mit Kamin, eine private Terrasse mit Whirlpool, ein Bad mit Badewanne und Freiluftdusche, ein Loveseat und einen Weinkeller. Gartenblick, ein Bett 180×200 cm und ein Bett 140×190 cm. Sie bietet Platz für 2 Erwachsene + 2 Kinder + 1 Baby oder 2 Erwachsene + 1 Jugendlichen + 1 Baby. Eine Suite ist für Gäste mit eingeschränkter Mobilität zugänglich."},"prefere":true},{"id":"room_lodge","exemples":{"fr":["le lodge c est quoi","lodge vue mer","lodge 100 m2","chambre en bord de falaise","chambre avec jacuzzi et vue sur l ocean","lodge pour un couple","lodge avec salon exterieur","lodge combien de personnes","la chambre avec la plus belle vue","le lodge fait quelle superficie"],"en":["tell me about the lodge","lodge with sea view","room on the cliff edge","room with jacuzzi and ocean view","how many people in a lodge"],"de":["erzahlen sie mir vom lodge","lodge mit meerblick","zimmer am klippenrand","zimmer mit jacuzzi und meerblick","welches zimmer liegt am klippenrand"]},"mots_ancres":["lodge:5","lodges:5","falaise:5","cliff:5","klippe:5","bord de falaise:5","panorama:3"],"suggestions":["vue","couple","rooms"],"actions":[{"lien":"https://palm.re/sejourner/"}],"service":"Réception","source":"https://palm.re/sejourner/ (lu le 27/10/2026)","topic":{"fr":"Lodge","en":"Lodge","de":"Lodge"},"reponse":{"fr":"Le Lodge (100 m²) est niché en bordure de falaise, avec un panorama sur la baie de Grande Anse (vue mer). Il comprend un lit de 200×200 cm, un salon intérieur séparé, un salon extérieur, une grande terrasse avec bain à remous, une loveuse, une cave à vins, et une salle de bains avec baignoire et douche à l'italienne (fenêtre panoramique). Pour 1 ou 2 adultes, mobilier en bois précieux et mur en mosaïque de bois.","en":"The Lodge (100 m²) sits on the cliff edge with a panorama over Grande Anse bay (sea view). It has a 200×200 cm bed, a separate indoor lounge, an outdoor lounge, a large terrace with whirlpool, a loveseat, a wine cellar, and a bathroom with bathtub and walk-in shower (panoramic window). For 1 or 2 adults, with precious-wood furniture and a wood mosaic wall.","de":"Der Lodge (100 m²) liegt am Klippenrand mit Panoramablick auf die Bucht von Grande Anse (Meerblick). Er hat ein Bett 200×200 cm, einen separaten Innenwohnbereich, einen Außenwohnbereich, eine große Terrasse mit Whirlpool, ein Loveseat, einen Weinkeller sowie ein Bad mit Badewanne und ebenerdiger Dusche (Panoramafenster). Für 1 oder 2 Erwachsene, mit Edelholzmöbeln und einer Holzmosaikwand."}},{"id":"room_poollodge","exemples":{"fr":["le pool lodge","chambre avec piscine privee","pool lodge 140 m2","machine a glacons dans la chambre","chambre avec sa propre piscine","piscine privative couple","c est quoi un pool lodge"],"en":["tell me about the pool lodge","room with private pool","room with ice machine","what is a pool lodge"],"de":["erzahlen sie mir vom pool lodge","zimmer mit privatem pool","zimmer mit eismaschine"]},"mots_ancres":["pool lodge:6","poollodge:6","piscine privee:5","piscine privative:5","private pool:5","privater pool:5","privatpool:5","machine a glacons:5","ice machine:5","eismaschine:5"],"suggestions":["couple","honeymoon","rooms"],"actions":[{"lien":"https://palm.re/sejourner/"}],"service":"Réception","source":"https://palm.re/sejourner/ (lu le 27/10/2026)","topic":{"fr":"Pool Lodge","en":"Pool Lodge","de":"Pool Lodge"},"reponse":{"fr":"Le Pool Lodge (140 m², vue jardin) offre une piscine privée chauffée, un lit de 200×200 cm, un salon intérieur séparé, un salon extérieur, un dressing, une grande terrasse, une loveuse, une cave à vins, une machine à glaçons et une salle de bains avec baignoire et douche à l'italienne. Pour 1 ou 2 adultes, dans une ambiance minérale et des teintes naturelles, au cœur d'une nature luxuriante. Un Pool Lodge est accessible aux personnes à mobilité réduite.","en":"The Pool Lodge (140 m², garden view) has a private heated pool, a 200×200 cm bed, a separate indoor lounge, an outdoor lounge, a dressing room, a large terrace, a loveseat, a wine cellar, an ice machine and a bathroom with bathtub and walk-in shower. For 1 or 2 adults, with a mineral atmosphere and natural tones, surrounded by lush nature. One Pool Lodge is accessible to guests with reduced mobility.","de":"Das Pool Lodge (140 m², Gartenblick) hat einen privaten beheizten Pool, ein Bett 200×200 cm, einen separaten Innenwohnbereich, einen Außenwohnbereich, einen Ankleidebereich, eine große Terrasse, ein Loveseat, einen Weinkeller, eine Eismaschine sowie ein Bad mit Badewanne und ebenerdiger Dusche. Für 1 oder 2 Erwachsene, mit mineralischer Atmosphäre und natürlichen Farbtönen, inmitten üppiger Natur. Ein Pool Lodge ist für Gäste mit eingeschränkter Mobilität zugänglich."}},{"id":"room_poolvilla","exemples":{"fr":["la pool villa","villa avec piscine privee","villa pour 8 personnes","combien de chambres dans la pool villa","villa pour la famille","villa 240 m2","pool house","villa entre amis","jardin prive clos","villa avec deux suites parentales","la pool villa a combien de chambres"],"en":["tell me about the pool villa","villa with private pool","villa for 8 people","how many bedrooms in the pool villa","villa for friends","private enclosed garden"],"de":["erzahlen sie mir von der pool villa","villa mit privatem pool","villa fur 8 personen","wie viele schlafzimmer hat die pool villa","villa fur freunde","privater garten"]},"mots_ancres":["pool villa:6","poolvilla:6","villa:4","villas:4","pool house:5","poolhaus:5","suites parentales:5","master suites:5","elternsuite*:5","jardin prive:5","private garden:5","privatgarten:5","entre amis:3"],"suggestions":["family","checkin","rooms"],"actions":[{"lien":"https://palm.re/sejourner/"}],"service":"Réception","source":"https://palm.re/sejourner/ (lu le 27/10/2026)","topic":{"fr":"Pool Villa","en":"Pool Villa","de":"Pool Villa"},"reponse":{"fr":"La Pool Villa (240 m² d'espace privatif) est pensée pour les séjours en famille ou entre amis : 2 suites parentales avec dressings et lits de 200×200 cm, 1 chambre avec 2 lits de 90×200 cm et salle de bain, 2 grandes salles de bain avec douche italienne et baignoire, salon intérieur, salle à manger, pool house avec salon extérieur, piscine privée chauffée et jardin privatif clos. Capacité : 4 adultes, 2 adolescents, 2 bébés. Matériaux nobles (chêne, bois exotique, basalte). Check-in à 16h, check-out à 12h.","en":"The Pool Villa (240 m² of private space) is designed for family stays or groups of friends: 2 master suites with dressing rooms and 200×200 cm beds, 1 bedroom with 2 beds of 90×200 cm and bathroom, 2 large bathrooms with walk-in shower and bathtub, indoor lounge, dining room, pool house with outdoor lounge, private heated pool and enclosed private garden. Capacity: 4 adults, 2 teenagers, 2 babies. Noble materials (oak, exotic wood, basalt). Check-in 4 pm, check-out 12 noon.","de":"Die Pool Villa (240 m² Privatbereich) ist für Familien- oder Freundesaufenthalte gedacht: 2 Elternsuiten mit Ankleidebereichen und Betten 200×200 cm, 1 Zimmer mit 2 Betten 90×200 cm und Bad, 2 große Bäder mit ebenerdiger Dusche und Badewanne, Innensalon, Esszimmer, Poolhaus mit Außenwohnbereich, privater beheizter Pool und geschlossener Privatgarten. Kapazität: 4 Erwachsene, 2 Jugendliche, 2 Babys. Edle Materialien (Eiche, Exotenholz, Basalt). Check-in 16 Uhr, Check-out 12 Uhr."}},{"id":"makassar","exemples":{"fr":["on mange quoi au makassar","cest quoi le makassar","le makassar est ouvert tous les soirs ?","resto gastro de l hotel","carte du makassar","le makassar a un menu enfant","makassar kan dîner a 22h ?","makasar resto","le restau principal cé lequel","nouvelle carte du makassar","le chef du makassar","on peut manger de la legine ?","cuisine gastronomique réunionnaise","ya du poisson local au makassar","y a-t-il un restaurant gastronomique dans l'hôtel"],"en":["what is the makassar","is the makassar open every night","fine dining restaurant at the hotel","does the makassar have a kids menu","what kind of food at the makassar","new menu at the makassar"],"de":["was ist das makassar","hat das makassar ein kindermenü","gibt es ein gourmetrestaurant im hotel","ist das makassar jeden abend geöffnet","was gibt es im makassar zu essen"]},"mots_ancres":["makasar:4","makassar:3","gastronomique:3","legine:4","gourmetrestaurant:3","carte:1"],"suggestions":["restos","chef","table"],"actions":["tel:resto","reserver"],"service":"Restaurants","source":"https://palm.re/se-restaurer/ (lu le 27/10/2026)","topic":{"fr":"Le restaurant Makassar","en":"The Makassar restaurant","de":"Das Restaurant Makassar"},"reponse":{"fr":"Le Makassar est le restaurant du dîner, ouvert tous les jours de 19h à 21h30, sur réservation au 0262 56 30 30. Le chef exécutif Claude Pothin, originaire du Sud de l’île, y célèbre le terroir réunionnais, du rouge-grand-queue de nos côtes au caviar de l’île, jusqu’à la légine des Terres Australes, à la carte ou en menu. Une carte inédite a été dévoilée dans un nouvel écrin d’élégance, et un menu enfant est proposé.","en":"The Makassar is the dinner restaurant, open every day from 7 pm to 9:30 pm, booking on +262 262 56 30 30. Executive chef Claude Pothin, from the south of the island, celebrates Réunion’s terroir there, from the local “Rouge-Grand-Queue” fish and the island’s caviar to Patagonian toothfish from the Southern Lands, à la carte or as a set menu. A new menu has been unveiled in a new elegant setting, and a children’s menu is available.","de":"Das Makassar ist das Abendessen-Restaurant, täglich von 19 bis 21:30 Uhr geöffnet, Reservierung unter +262 262 56 30 30. Küchenchef Claude Pothin, gebürtig aus dem Süden der Insel, feiert dort das Terroir der Réunion, vom Fisch „Rouge-Grand-Queue“ der Küste über den Kaviar der Insel bis zum Schwarzen Seehecht der Südlichen Territorien, à la carte oder als Menü. Eine neue Karte wurde in einem neuen, eleganten Rahmen vorgestellt; ein Kindermenü gibt es auch."},"prefere":true},{"id":"kah_resto","exemples":{"fr":["cest quoi le kah","le kah sert quoi","la carte du kah","nouvelle carte kah beach","on peut dejeuner face a la mer","resto les pieds dans le sable","plats a partager au kah","ya du tomahawk","ya du poulpe ou de la zourite","cocktail sans alcool au kah","cest quoi le spice girl","dessert au kah","du carri au kah","cuisine au feu de bois","le kah a un menu enfant","kha beach","resto avec vue sur grande anse","des plats de poisson crus ?","ya des churros","vous avez des plats à partager face à la mer ?"],"en":["what is the kah","kah beach restaurant menu","new menu at the kah","sharing plates by the sea","do you have a tomahawk steak","non alcoholic cocktails at the kah","what desserts at the kah","is there a beach restaurant at the hotel","ocean view restaurant at palm"],"de":["was ist das kah","neue karte kah","was steht auf der neuen karte","speisekarte kah beach","neue karte im kah","mittagessen am meer","gibt es alkoholfreie cocktails im kah","gerichte zum teilen am strand","was gibt es zum nachtisch im kah","hat das kah ein kindermenü"]},"mots_ancres":["tomahawk:5","ceviche:5","tataki:5","churros:5","zourite:5","carri:3","carris:3","cocktails:2","sans alcool:3","alcoholfreie:3","mocktail:3"],"suggestions":["restos","kahzen","table"],"actions":["tel:resto","reserver"],"service":"Restaurants","source":"https://palm.re/actualites/la-nouvelle-carte-du-kah/ ; https://palm.re/se-restaurer/ (lu le 27/10/2026)","topic":{"fr":"Le KAH Beach & Restaurant et sa nouvelle carte","en":"KAH Beach & Restaurant and its new menu","de":"KAH Beach & Restaurant und die neue Karte"},"reponse":{"fr":"Face à l’océan Indien et à la plage de Grande Anse, le KAH Beach & Restaurant (déjeuner de 12h à 14h30, dîner de 19h à 21h30, tous les jours, réservation au 0262 56 30 30) propose une cuisine de partage où la braise et les saveurs fumées tiennent la vedette, signée du chef exécutif Claude Pothin. Sa nouvelle carte annonce, entre autres : ceviche d’espadon à la papaye verte, tataki de bœuf ou de thon, spicy tuna & crispy rice, zourite sauce chimichurri, côte de cochon, tomahawk de bœuf à partager, des carris (baba figue, pintade au combava, cochon noir en civet, darne de légine) et des desserts comme les churros maison, l’omelette norvégienne ou la banane flambée. Les cocktails signature (Souffle du Jardin, Spice Girl) existent aussi en versions sans alcool. Un menu enfant est proposé.","en":"Facing the Indian Ocean and Grande Anse beach, the KAH Beach & Restaurant (lunch 12 pm to 2:30 pm, dinner 7 pm to 9:30 pm, every day, booking on +262 262 56 30 30) serves sharing-style cuisine where the embers and smoky flavours take centre stage, by executive chef Claude Pothin. Its new menu features, among others: swordfish ceviche with green papaya, beef or tuna tataki, spicy tuna & crispy rice, octopus with chimichurri sauce, pork chop, a beef tomahawk to share, curries (baba fig, guinea fowl with combava, black pork stew, toothfish steak) and desserts such as homemade churros, baked Alaska or flambéed banana. The signature cocktails (Souffle du Jardin, Spice Girl) also come in alcohol-free versions. A children’s menu is available.","de":"Mit Blick auf den Indischen Ozean und den Strand von Grande Anse bietet das KAH Beach & Restaurant (Mittagessen 12 bis 14:30 Uhr, Abendessen 19 bis 21:30 Uhr, täglich, Reservierung unter +262 262 56 30 30) eine Sharing-Küche, in der Glut und Raucharomen im Mittelpunkt stehen, von Küchenchef Claude Pothin. Die neue Karte nennt unter anderem: Schwertfisch-Ceviche mit grüner Papaya, Tataki vom Rind oder Thunfisch, Spicy Tuna & Crispy Rice, Oktopus mit Chimichurri, Schweinekotelett, Tomahawk vom Rind zum Teilen, Currys (Baba-Feige, Perlhuhn mit Combava, Schwarzschwein-Ragout, Seehechtsteak) sowie Desserts wie hausgemachte Churros, Baked Alaska oder flambierte Banane. Die Signature-Cocktails (Souffle du Jardin, Spice Girl) gibt es auch alkoholfrei. Ein Kindermenü ist vorhanden."},"prefere":true},{"id":"kokoa","exemples":{"fr":["cest quoi le kokoa","le kokoa ferme a quelle heure","ya un bar au bord de la piscine","cocktail au coucher du soleil","manger au bord de la piscine","terrasse panoramique de l hotel","ou boire un verre","tapas ou grignoter dans l apres midi","ouvert non stop ?","carte du kokoa","kokoa terrasse baleines","ou voir les baleines en buvant un verre","bar de la piscine","cokoa bar","un apero en fin de journee ou ?"],"en":["what is the kokoa","kokoa bar opening hours","until what time is the kokoa open","is there a poolside bar","cocktail at sunset","where can i have a drink","can i eat by the pool","tapas in the afternoon","panoramic terrace","kokoa menu","can i see whales from the kokoa"],"de":["was ist das kokoa","cocktail am pool","wo gibt es einen cocktail am pool","öffnungszeiten kokoa","bis wann ist das kokoa geöffnet","gibt es eine poolbar","cocktail bei sonnenuntergang","wo kann ich etwas trinken","essen am pool","tapas am nachmittag","kokoa karte","wale vom kokoa aus sehen"]},"mots_ancres":["kokoa:5","cokoa:4","poolbar:4","terrasse:2","terrace:2","tapas:3","sunset:2","coucher:2","sonnenuntergang:2","cocktail:2","verre:1"],"suggestions":["restos","bar","whales"],"actions":["tel:resto","reserver"],"service":"Restaurants","source":"https://palm.re/se-restaurer/ (lu le 27/10/2026)","topic":{"fr":"Le Kokoa (terrasse, piscine, tapas)","en":"The Kokoa (terrace, pool, tapas)","de":"Das Kokoa (Terrasse, Pool, Tapas)"},"reponse":{"fr":"Le Kokoa est un lieu de convivialité avec terrasse panoramique face aux vagues de Grande Anse : pause gourmande ou cocktail au coucher du soleil, repas servis au bord de la piscine, service continu de 10h à 23h et tapas de 12h à 21h30, tous les jours, sur réservation au 0262 56 30 30. En hiver austral, c’est aussi un très bon poste pour admirer le passage des baleines dans la baie. La carte est consultable sur palm.re.","en":"The Kokoa is a convivial spot with a panoramic terrace facing the Grande Anse waves: a gourmet break or a cocktail at sunset, meals served by the pool, continuous service from 10 am to 11 pm and tapas from 12 noon to 9:30 pm, every day, booking on +262 262 56 30 30. In the austral winter it is also a great place to watch whales passing through the bay. The menu is available on palm.re.","de":"Das Kokoa ist ein geselliger Ort mit Panoramaterrasse zu den Wellen von Grande Anse: genussvolle Pause oder Cocktail bei Sonnenuntergang, Mahlzeiten am Pool, durchgehender Service von 10 bis 23 Uhr und Tapas von 12 bis 21:30 Uhr, täglich, Reservierung unter +262 262 56 30 30. Im australen Winter ist es zudem ein schöner Platz, um Wale in der Bucht zu beobachten. Die Karte finden Sie auf palm.re."}},{"id":"salon_makassar","exemples":{"fr":["cest quoi le salon du makassar","ya une cave a vin","degustation de vin a l hotel","carte des vins","combien de references de vin","le sommelier de l hotel","cave du palm","caves du palm","ou prendre un verre de vin tranquille","un coin lecture calme","salon de degustation","soirée vin","evenements autour du vin","ya un bar a vin","grand cru au verre","sebastien chabbert","acheter du vin de l hotel","avez-vous une cave à vin"],"en":["what is the salon du makassar","do you have a wine cellar","wine tasting at the hotel","how many wines on the wine list","who is the sommelier","caves du palm","quiet lounge for a glass of wine","wine events","is there a wine bar","a place to read and relax"],"de":["was ist der salon du makassar","gibt es einen weinkeller","weinprobe im hotel","wie viele weine auf der karte","wer ist der sommelier","cave du palm","ruhiger salon für ein glas wein","weinveranstaltungen","gibt es eine weinbar"]},"mots_ancres":["salon:3","cave:4","caves:4","sommelier:5","vin:3","wine:3","wein:3","weinkarte:4","degustation:3","verkostung:3","cru:2","chabbert:5"],"suggestions":["restos","bar"],"actions":["tel:resto"],"service":"Restaurants","source":"https://palm.re/se-restaurer/ ; https://palm.re/blog/gastronomie/caves-palm-sommelier/ (lu le 27/10/2026)","topic":{"fr":"Le Salon du Makassar et la Cave du Palm","en":"The Salon du Makassar and the Cave du Palm","de":"Der Salon du Makassar und die Cave du Palm"},"reponse":{"fr":"Le Salon du Makassar est un salon de détente et de dégustation où sont régulièrement proposés des événements autour du vin. Dans cet écrin feutré, fauteuils en cuir, bar boisé et Cave du Palm se côtoient : on peut y faire une pause lecture ou se retrouver entre amis autour d’un grand cru. Les Caves du PALM ont ouvert en 2010, et la carte des vins compte aujourd’hui plus de 350 références, sélectionnées avec le sommelier Sébastien Chabbert, arrivé à l’ouverture de l’hôtel en 2007.","en":"The Salon du Makassar is a relaxation and tasting lounge where wine-themed events are regularly held. In this cosy setting, leather armchairs, a wood-panelled bar and the Cave du Palm sit side by side: you can take a reading break or meet friends over a fine wine. The Caves du PALM opened in 2010, and the wine list now counts more than 350 references, selected with sommelier Sébastien Chabbert, who joined when the hotel opened in 2007.","de":"Der Salon du Makassar ist ein Entspannungs- und Verkostungssalon, in dem regelmäßig Weinveranstaltungen stattfinden. In diesem gediegenen Rahmen finden sich Ledersessel, eine Holzbar und die Cave du Palm: Man kann dort eine Lesepause einlegen oder sich mit Freunden bei einem Grand Cru treffen. Die Caves du PALM wurden 2010 eröffnet, und die Weinkarte umfasst heute mehr als 350 Referenzen, ausgewählt mit Sommelier Sébastien Chabbert, der seit der Eröffnung 2007 dabei ist."},"prefere":true},{"id":"petitdej_detail","exemples":{"fr":["quest ce qu il y a au petit dej","le petit dej est fait maison ?","ya des oeufs au petit dejeuner","omelette a la demande","petit dej sucre sale","des pancakes le matin","les croissants sont fait maison","jus presse au petit dej","je peux prendre le petit dej sans dormir a l hotel","petit dejeuner ouvert aux externes","petit dej le week end pour non resident","il faut reserver le petit dejeuner","fromages et charcuterie au petit dej","pain artisanal","le buffet du matin est-il fait maison","petit déjeuner le week-end pour les gens de passage"],"en":["what is in the breakfast buffet","is breakfast homemade","are eggs available at breakfast","omelette on request","pancakes for breakfast","can non-guests have breakfast","is breakfast open to outside guests at the weekend","breakfast during school holidays","do i need to book breakfast","fresh juice at breakfast","cheese and cold cuts at breakfast","can someone who is not staying here have breakfast"],"de":["was gibt es zum frühstück","ist das frühstück hausgemacht","gibt es eier zum frühstück","omelette auf wunsch","können externe gäste frühstücken","frühstück am wochenende für nicht-hausgäste","frühstück in den schulferien","muss man das frühstück reservieren","frisch gepresste säfte zum frühstück","ist das frühstücksbuffet auch für externe gäste"]},"mots_ancres":["buffet:2","omelette:4","pancakes:4","viennoiseries:4","croissants:3","externe:3","externes:3","non resident:4","non-guests:4","nicht-hausgaste:4","fait maison:2","homemade:2","hausgemacht:2"],"suggestions":["breakfast","restos"],"actions":["tel:resto"],"service":"Restaurants","source":"https://palm.re/se-restaurer/ (lu le 27/10/2026)","topic":{"fr":"Petit-déjeuner : composition et conditions","en":"Breakfast: contents and conditions","de":"Frühstück: Angebot und Bedingungen"},"reponse":{"fr":"Chaque matin, la cuisine propose un buffet entièrement fait maison, préparé avec des produits frais, locaux et de qualité. Côté sucré : fruits de saison, viennoiseries, crêpes, pancakes, yaourts, jus de fruits pressés et boissons chaudes. Côté salé : œufs ou omelettes à la demande, charcuteries fines, fromages, pains artisanaux et spécialités internationales. Service de 6h30 à 10h, 35 € par adulte et 22 € par enfant de 3 à 11 ans, sur réservation au 0262 56 30 30, selon disponibilité. Le week-end et pendant les vacances scolaires, le buffet est réservé à la clientèle résidente.","en":"Every morning the kitchen offers a fully homemade buffet prepared with fresh, local, quality produce. Sweet side: seasonal fruit, pastries, crêpes, pancakes, yoghurts, freshly pressed juices and hot drinks. Savoury side: eggs or omelettes on request, fine cold cuts, cheeses, artisan breads and international specialities. Served 6:30 to 10 am, €35 per adult and €22 per child aged 3 to 11, booking on +262 262 56 30 30, subject to availability. At weekends and during school holidays, the buffet is reserved for resident guests.","de":"Jeden Morgen bietet die Küche ein komplett hausgemachtes Buffet aus frischen, regionalen Qualitätsprodukten. Süß: Früchte der Saison, Gebäck, Crêpes, Pancakes, Joghurt, frisch gepresste Säfte und Heißgetränke. Herzhaft: Eier oder Omelettes auf Wunsch, feine Wurstwaren, Käse, Handwerksbrot und internationale Spezialitäten. Von 6:30 bis 10 Uhr, 35 € pro Erwachsenem und 22 € pro Kind von 3 bis 11 Jahren, Reservierung unter +262 262 56 30 30, je nach Verfügbarkeit. Am Wochenende und in den Schulferien ist das Buffet Hausgästen vorbehalten."}},{"id":"seminaire_detail","exemples":{"fr":["equipement des salles de seminaire","les salles ont le wifi ?","ya un ecran interactif","un paper board pour la reunion","combien de m2 pour le seminaire","salle modulable ?","salles climatisees pour reunion","cocktail dinatoire pour entreprise","on peut faire un feu d artifice pour notre soiree","animation magie close up","incentive pour mon equipe","atelier cocktails team building","degustation oenologique entreprise","massage des mains incentive","demander un devis seminaire","devis pour un evenement d entreprise","seminaire residentiel c quoi","groupe de musique live pour soiree","dej de travail en buffet ou assis","cafe et eau dans la salle de reunion","seminere residentiel","on loge les participants sur place ?","numero pour un devis seminaire"],"en":["what equipment is in the seminar rooms","is there wifi in the meeting rooms","interactive screen for meetings","flipchart in the room","how big is the seminar space","can the room be divided","air conditioned meeting rooms","cocktail reception for a company","can we have fireworks at our event","close up magic entertainment","incentive activities for my team","cocktail making workshop for a team","wine tasting for a corporate group","request a quote for a seminar","residential seminar what is it","live band for our evening","buffet or plated lunch for a meeting","can my team stay on site","who do i call for a seminar quote"],"de":["ausstattung der seminarräume","gibt es wlan in den tagungsräumen","interaktiver bildschirm für meetings","flipchart im raum","wie groß ist der seminarbereich","ist der raum teilbar","klimatisierte tagungsräume","cocktailempfang für firmen","feuerwerk für unsere veranstaltung","close-up-zauberei","incentive für mein team","cocktail-workshop für teams","weinprobe für firmengruppen","angebot für ein seminar anfragen","was ist ein residenzseminar","live-band für den abend","können die teilnehmer im hotel übernachten","telefonnummer für seminarangebot","wie groß ist der tagungsbereich"]},"mots_ancres":["seminaire:3","seminar:3","seminarraume:4","salles:2","salons:2","100 m2:4","modulable:4","paper board:5","paperboard:5","flipchart:5","ecran interactif:5","interactive screen:5","dinatoire:4","incentive:5","incentives:5","feu d artifice:4","fireworks:4","feuerwerk:4","close up:5","team building:3","devis:3","quote:3","angebot:2","entreprise:2","residentiel:4","residential:4","residenzseminar:4"],"suggestions":["event","offre_pro"],"actions":["mail:evenements","tel:reception"],"service":"Séminaires","source":"https://palm.re/seminaires-residentiels/ (lu le 27/10/2026)","topic":{"fr":"Séminaires résidentiels : salons et services","en":"Residential seminars: rooms and services","de":"Residenzseminare: Räume und Services"},"reponse":{"fr":"Pour un séminaire résidentiel ou un événement, le PALM propose un espace de 100 m² modulable en 2 salons climatisés, agencés selon vos souhaits. Sont à disposition : Wi-Fi haut débit, machine à expresso, thés, eaux minérales plates et gazeuses, dossiers, papier, stylos, paper-board et feutres ; un écran interactif peut être ajouté sur devis. Services possibles : cocktails apéritifs ou dînatoires ; déjeuner ou dîner servi à l’assiette ou en buffet ; animations (spectacle, groupe de musique live, feu d’artifice, magie close up) ; incentives (création de cocktails, massage des mains, dégustation œnologique). Vos collaborateurs séjournent dans les chambres, suites, lodges et pool lodges, au cœur du jardin tropical. Devis au 0262 56 30 30 ou au +262 692 09 13 73, ou via le formulaire de demande de devis sur palm.re.","en":"For a residential seminar or event, the PALM offers a 100 m² space that can be split into 2 air-conditioned rooms, laid out as you wish. Available: high-speed Wi-Fi, espresso machine, teas, still and sparkling mineral water, folders, paper, pens, flipchart and markers; an interactive screen can be added on quotation. Possible services: aperitif or buffet-style cocktails; lunch or dinner served plated or as a buffet; entertainment (show, live band, fireworks, close-up magic); incentives (cocktail creation, hand massage, wine tasting). Your team stays in the rooms, suites, lodges and pool lodges in the tropical garden. Quotes on +262 262 56 30 30 or +262 692 09 13 73, or via the quote request form on palm.re.","de":"Für ein Residenzseminar oder eine Veranstaltung bietet das PALM einen Bereich von 100 m², teilbar in 2 klimatisierte Salons, nach Ihren Wünschen gestaltet. Verfügbar: schnelles WLAN, Espressomaschine, Tee, stilles und sprudelndes Mineralwasser, Mappen, Papier, Stifte, Flipchart und Marker; ein interaktiver Bildschirm ist auf Angebot möglich. Mögliche Services: Aperitif- oder Fingerfood-Cocktails; Mittag- oder Abendessen am Tisch serviert oder als Buffet; Animationen (Show, Live-Band, Feuerwerk, Close-up-Zauberei); Incentives (Cocktailkreation, Handmassage, Weinprobe). Ihre Mitarbeiter wohnen in den Zimmern, Suiten, Lodges und Pool Lodges im tropischen Garten. Angebote unter +262 262 56 30 30 oder +262 692 09 13 73 bzw. über das Angebotsformular auf palm.re."}},{"id":"financement_ue","exemples":{"fr":["feder c est quoi sur le site","l europe a finance l hotel ?","subvention europeenne pour les pool lodges","qui a paye la renovation des suites","financement europeen","combien de pool lodges ont ete crees","des emplois crees par l extension","fonds europeen hotel","react eu","l'europe a-t-elle financé la rénovation des suites"],"en":["was ist feder on the website","was the hotel funded by europe","european funding for the pool lodges","who paid for the suite renovation","how many pool lodges were created","jobs created by the extension"],"de":["eu förderung hotel","wer hat die renovierung der suiten finanziert","efre finanzierung pool lodges","wie viele pool lodges wurden gebaut","neue arbeitsplätze durch die erweiterung"]},"mots_ancres":["feder:5","erdf:5","efre:5","europe:3","europeen:3","european:3","subvention:4","react:4","financement:3","funding:3","forderung:3"],"suggestions":["points_forts","room_poollodge"],"actions":[],"service":"Direction","source":"https://palm.re/seminaires-residentiels/ (lu le 27/10/2026)","topic":{"fr":"Financement européen (FEDER) : suites et pool lodges","en":"EU funding (ERDF): suites and pool lodges","de":"EU-Förderung (EFRE): Suiten und Pool Lodges"},"reponse":{"fr":"Le PALM a bénéficié du soutien de l’Europe : la rénovation des Suites a été financée par le Fonds Européen de Développement Régional (FEDER), dans le cadre de la réponse de l’Union européenne à la pandémie de COVID-19 (REACT-UE). L’extension de l’hôtel par la création de 5 Pool Lodges, ainsi que la création de huit postes en CDI, est cofinancée par l’Union européenne et la Région Réunion, dans le cadre du programme FEDER-FSE+ Réunion.","en":"The PALM has received European support: the renovation of the Suites was financed by the European Regional Development Fund (ERDF) as part of the European Union’s response to the COVID-19 pandemic (REACT-EU). The extension of the hotel with 5 Pool Lodges, as well as the creation of eight permanent positions, is co-financed by the European Union and the Réunion Region under the ERDF-ESF+ Réunion programme.","de":"Das PALM wurde von Europa unterstützt: Die Renovierung der Suiten wurde aus dem Europäischen Fonds für regionale Entwicklung (EFRE) im Rahmen der Antwort der EU auf die COVID-19-Pandemie (REACT-EU) finanziert. Die Erweiterung des Hotels um 5 Pool Lodges sowie die Schaffung von acht unbefristeten Stellen wird von der Europäischen Union und der Region Réunion im Rahmen des Programms EFRE-ESF+ Réunion mitfinanziert."}},{"id":"musique_makassar","exemples":{"fr":["ya de la musique live au restaurant","concert au makassar","diner en musique samedi","quels groupes jouent le samedi","musique live le samedi soir","soiree jazz a l hotel","swing manouche","programme musical de l hotel","qui joue ce samedi","animation musicale au diner","duo affair affair","hat mosphere","orchestre au restaurant","ambiance musicale pour dîner romantique","diner avec musique live","musique en direct le soir","quels artistes jouent au makassar"],"en":["is there live music at the restaurant","saturday night dinner with music","which bands play on saturdays","jazz evening at the hotel","music programme at the makassar","who is playing this saturday","live music during dinner","gypsy swing dinner"],"de":["gibt es live musik im restaurant","abendessen mit musik am samstag","welche bands spielen samstags","jazzabend im hotel","musikprogramm im makassar","wer spielt diesen samstag","live musik beim abendessen","spielt samstags eine band beim abendessen"]},"mots_ancres":["musique:3","music:3","musik:3","live:3","jazz:4","swing:4","concert:3","samedi soir:3","saturday:2","samstag:2","orchestre:3","band:3","groupe:2","hat mosphere:5","affair:5"],"suggestions":["animations","restos","fetes"],"actions":["tel:resto","reserver"],"service":"Restaurants","source":"https://palm.re/actualites/musiques-du-monde/ (lu le 27/10/2026)","topic":{"fr":"Dîner en musique le samedi soir au Makassar","en":"Dinner with live music on Saturday nights at the Makassar","de":"Abendessen mit Live-Musik samstags im Makassar"},"reponse":{"fr":"Chaque samedi soir à partir de 19h, le restaurant Le Makassar propose un dîner en musique : un vaste répertoire international (swing manouche, valse, jazz…) interprété par des artistes comme Duo Youric, Affair Affair ou Hat’mosphère. Le programme publié pour 2026 court de janvier à juin et cite aussi David Small Pleasure, Bruno Guyon, Yasmine Poudroux et Henry Romignac. Sur réservation au 0262 56 30 30 ; pour les dates de la suite de l’année, l’équipe vous renseigne avec plaisir.","en":"Every Saturday evening from 7 pm, the Makassar restaurant offers dinner with music: a wide international repertoire (gypsy swing, waltz, jazz…) performed by artists such as Duo Youric, Affair Affair or Hat’mosphère. The programme published for 2026 runs from January to June and also lists David Small Pleasure, Bruno Guyon, Yasmine Poudroux and Henry Romignac. Booking on +262 262 56 30 30; for the dates later in the year, the team will gladly help.","de":"Jeden Samstagabend ab 19 Uhr bietet das Restaurant Le Makassar ein Abendessen mit Musik: ein breites internationales Repertoire (Gypsy-Swing, Walzer, Jazz …), gespielt von Künstlern wie Duo Youric, Affair Affair oder Hat’mosphère. Das für 2026 veröffentlichte Programm läuft von Januar bis Juni und nennt außerdem David Small Pleasure, Bruno Guyon, Yasmine Poudroux und Henry Romignac. Reservierung unter +262 262 56 30 30; für die Termine im weiteren Jahresverlauf hilft das Team gern weiter."}},{"id":"rdv_gastro","exemples":{"fr":["vous faites des diners a theme","soiree a theme au restaurant","diner gastronomique special","diner accords mets et vins","soiree rhum","live cooking ca existe chez vous","menu de la fete des meres","combien coute le repas de la fete des meres","diner du nouvel an chinois","ya un evenement gastronomique bientot","prochain diner a theme","menu saveur et rhum","wild island edition","soiree avec la distillerie savanna","le chef fait des animations","rendez vous du makassar","menu enfant du live cooking","diner de gala","diner degustation"],"en":["do you hold themed dinners","gourmet evening at the restaurant","wine pairing dinner","rum dinner","live cooking at the hotel","mother’s day lunch menu","how much is the mother’s day meal","chinese new year dinner","is there a gastronomic event soon","next themed dinner","savanna rum evening","special tasting menu"],"de":["gibt es themenabende","kulinarischer abend im restaurant","menü mit weinbegleitung","rum-dinner","live cooking im hotel","muttertagsmenü","was kostet das muttertagsessen","dinner zum chinesischen neujahr","gibt es bald ein gourmet-event","nächstes themendinner","verkostungsmenü"]},"mots_ancres":["theme:4","themed:4","thema:3","themenabend:4","gastronomique:3","gala:3","rhum:4","rum:4","savanna:5","live cooking:5","fete des meres:5","muttertag:5","mother:3","nouvel an chinois:5","chinese new year:5","chinesischen:4","accords mets:5","pairing:4","weinbegleitung:4","soiree:2"],"suggestions":["restos","fetes","animations"],"actions":["tel:resto","reserver"],"service":"Restaurants","source":"https://palm.re/actualites/menu-saveur-rhum/ ; https://palm.re/actualites/dejeuner-sur-mesure/ ; https://palm.re/actualites/fete-des-meres-2026/ ; https://palm.re/actualites/nouvel-an-chinois-2026/ (lu le 27/10/2026)","topic":{"fr":"Dîners à thème et rendez-vous gastronomiques","en":"Themed dinners and gourmet events","de":"Themenabende und kulinarische Events"},"reponse":{"fr":"Le Makassar accueille régulièrement des rendez-vous gastronomiques. Exemples publiés : un dîner en 5 temps « Saveur & Rhum » avec le master blender de la distillerie Savanna pour le lancement des cuvées Wild Island Edition (les 14 et 15 novembre, 120 € par personne) ; un live cooking sur-mesure du chef Claude Pothin (entrée + live cooking + dessert à 85 € par personne, menu enfant à 26 €, le dimanche 7 septembre) ; le déjeuner de la Fête des Mères 2026 (dimanche 31 mai dès 12h, 95 € par personne) ; et le dîner du Nouvel An chinois 2026 (mardi 17 février dès 19h, 78 € par personne, 39 € pour les enfants, complet). Les dates à venir sont communiquées au 0262 56 30 30.","en":"The Makassar regularly hosts gourmet events. Published examples: a 5-course “Saveur & Rhum” dinner with the master blender of the Savanna distillery for the launch of the Wild Island Edition blends (14 and 15 November, €120 per person); a tailor-made live cooking by chef Claude Pothin (starter + live cooking + dessert at €85 per person, children’s menu at €26, on Sunday 7 September); the 2026 Mother’s Day lunch (Sunday 31 May from 12 noon, €95 per person); and the 2026 Chinese New Year dinner (Tuesday 17 February from 7 pm, €78 per person, €39 for children, fully booked). Upcoming dates are available on +262 262 56 30 30.","de":"Das Makassar veranstaltet regelmäßig kulinarische Events. Veröffentlichte Beispiele: ein 5-Gänge-Dinner „Saveur & Rhum“ mit dem Master Blender der Brennerei Savanna zur Einführung der Cuvées Wild Island Edition (14. und 15. November, 120 € pro Person); ein maßgeschneidertes Live Cooking von Küchenchef Claude Pothin (Vorspeise + Live Cooking + Dessert für 85 € pro Person, Kindermenü 26 €, am Sonntag 7. September); das Muttertagsmittagessen 2026 (Sonntag 31. Mai ab 12 Uhr, 95 € pro Person) und das Dinner zum Chinesischen Neujahr 2026 (Dienstag 17. Februar ab 19 Uhr, 78 € pro Person, 39 € für Kinder, ausgebucht). Kommende Termine erfahren Sie unter +262 262 56 30 30."}},{"id":"kah_detente","exemples":{"fr":["kah detente c est quoi","formule kah detente","dejeuner plus acces piscine pour 85 euros","journee detente dejeuner et piscine","je veux venir juste pour la journee avec le dejeuner","formule journee sans dormir","acces espace detente avec repas","kah detente encore dispo ?","formule dej piscine hammam"],"en":["what is kah detente","kah detente package","lunch with pool access for 85 euros","day pass with lunch","can i come just for the day with lunch","is kah detente still available","lunch and spa area day","can i book lunch plus access to the relaxation area for the day"],"de":["was ist kah détente","kah détente formel","mittagessen mit poolzugang für 85 euro","tagespass mit mittagessen","nur für den tag mit mittagessen kommen","gibt es kah détente noch"]},"mots_ancres":["detente:4","kah detente:5","journee:2","day pass:4","tagespass:4","85 euros:4","formule:2","package:2","formel:2"],"suggestions":["kahzen","restos"],"actions":["tel:resto"],"service":"Restaurants","source":"https://palm.re/actualites/formule-kah-detente-2/ (lu le 27/10/2026)","topic":{"fr":"Formule KAH Détente (offre limitée 2025)","en":"KAH Détente package (limited offer 2025)","de":"Formel KAH Détente (befristetes Angebot 2025)"},"reponse":{"fr":"La Formule KAH Détente associait un déjeuner au KAH (de 12h à 14h : plat, 2 garnitures au choix, dessert au choix, cocktail de fruits frais, eau, café ou thé) à l’accès à l’espace détente du PALM (deux piscines dont une chauffée, bain à remous chauffé, hammam, espace plage et salle de fitness Technogym) pour 85 € par personne. Elle était proposée pour une durée limitée, du 26 mai au 3 juillet 2025, du lundi au vendredi de 10h à 18h, hors jours fériés et pour 4 personnes maximum. Pour une journée détente actuellement, la formule KAH Zen est présentée sur palm.re ; pour les dates et tarifs en cours, l’équipe vous répond.","en":"The KAH Détente package combined a lunch at the KAH (12 to 2 pm: main course, 2 sides of your choice, dessert of your choice, fresh fruit cocktail, water, coffee or tea) with access to the PALM relaxation area (two pools, one of them heated, a heated whirlpool, hammam, beach area and Technogym fitness room) for €85 per person. It was offered for a limited time, from 26 May to 3 July 2025, Monday to Friday from 10 am to 6 pm, excluding public holidays and for a maximum of 4 people. For a relaxing day now, the KAH Zen package is presented on palm.re; for current dates and prices, the team will answer.","de":"Die Formel KAH Détente verband ein Mittagessen im KAH (12 bis 14 Uhr: Hauptgericht, 2 Beilagen nach Wahl, Dessert nach Wahl, frischer Fruchtcocktail, Wasser, Kaffee oder Tee) mit dem Zugang zum Entspannungsbereich des PALM (zwei Pools, einer davon beheizt, beheizter Whirlpool, Hammam, Strandbereich und Technogym-Fitnessraum) für 85 € pro Person. Sie war befristet, vom 26. Mai bis 3. Juli 2025, Montag bis Freitag von 10 bis 18 Uhr, ausgenommen Feiertage und für höchstens 4 Personen. Für einen Entspannungstag heute ist die Formel KAH Zen auf palm.re beschrieben; aktuelle Termine und Preise nennt Ihnen das Team."}},{"id":"eco_ecolabel","exemples":{"fr":["depuis quand l hotel a l ecolabel","c est quoi l ecolabel europeen","premier hotel certifie de la reunion","qui controle l ecolabel","afnor audit hotel","combien de criteres ecolabel","ecolabel obtenu en quelle annee","ecolabel 2014","hotel eco responsable depuis quand","le buffet du samedi a ete remplace par quoi","gaspillage alimentaire a l hotel","compteur d eau jacuzzi","hotel certifie ecolabel dom tom","l ecolabel est toujours valide ?","ecolabel ou autre label"],"en":["since when does the hotel have the ecolabel","what is the eu ecolabel","first certified hotel in reunion","who audits the ecolabel","how many ecolabel criteria","year the ecolabel was obtained","is the ecolabel still valid","food waste at the hotel","afnor audit"],"de":["seit wann hat das hotel das umweltzeichen","was ist das eu umweltzeichen","erstes zertifiziertes hotel der réunion","wer prüft das umweltzeichen","wie viele kriterien hat das umweltzeichen","in welchem jahr wurde das umweltzeichen vergeben","ist das umweltzeichen noch gültig","lebensmittelverschwendung im hotel","seit wann trägt das hotel das eu-umweltzeichen"]},"mots_ancres":["ecolabel:5","umweltzeichen:5","afnor:5","certifie:3","certification:3","zertifiziert:3","label:3","criteres:3","kriterien:3","2014:2","premier hotel:3"],"suggestions":["eco","points_forts"],"actions":[],"service":"Environnement","source":"https://palm.re/actualites/renouvellement-certification-ecolabel-europeen/ ; https://palm.re/blog/environnement/programme-bungalow-eco-responsable/ ; https://palm.re/blog/hotel-blog/15-ans-palm-hotel-spa/ (lu le 27/10/2026)","topic":{"fr":"Écolabel européen : historique et audits","en":"EU Ecolabel: history and audits","de":"EU-Umweltzeichen: Geschichte und Audits"},"reponse":{"fr":"Le PALM a été le premier hôtel de La Réunion à obtenir l’Écolabel européen « Services d’hébergement touristique » (en 2014), et le premier des DOM-TOM. La certification est réévaluée tous les deux ans par l’AFNOR et a été renouvelée à plusieurs reprises. À l’audit de 2019, le cahier des charges comptait 67 critères (22 obligatoi
