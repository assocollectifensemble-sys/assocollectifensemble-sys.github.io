/* Styles communs. Les couleurs / polices viennent des variables de thème (build.js). Spéc UX : ../UX-WIDGET-SPEC.md */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;font-family:var(--font-body);color:var(--ink);background:#111;min-height:100%;line-height:1.55}
a{color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
/* ---- fond = vraie page d'accueil de l'hôtel (capture) ---- */
.site-bg{position:fixed;inset:0;background:var(--fond-ordi) center top/cover no-repeat}
.apercu{position:fixed;left:16px;bottom:16px;z-index:30;display:flex;align-items:center;gap:6px;background:rgba(20,20,20,.78);color:#fff;font:600 12px/1.2 var(--font-body);padding:7px 8px 7px 13px;border-radius:999px;backdrop-filter:blur(6px);box-shadow:0 6px 20px -8px rgba(0,0,0,.6)}
.apercu button{width:24px;height:24px;border:0;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;cursor:pointer;font-size:15px;line-height:1}
.apercu.hide{display:none}
/* ---- bulle (lanceur) : même endroit pour ouvrir ET fermer ---- */
#bubble{--nav:0px;position:fixed;right:max(20px,env(safe-area-inset-right));bottom:calc(max(20px,env(safe-area-inset-bottom)) + var(--nav));z-index:60;width:60px;height:60px;border-radius:50%;border:0;cursor:pointer;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 12px 30px -8px rgba(0,0,0,.55);transition:transform .2s,opacity .2s}

#bubble>span.ic-open,#bubble>span.ic-close{grid-area:1/1;display:grid;place-items:center;transition:transform .25s,opacity .2s}
#bubble svg{width:28px;height:28px}
#bubble .ic-close{opacity:0;transform:rotate(-90deg) scale(.6)}
#bubble.on .ic-open{opacity:0;transform:rotate(90deg) scale(.6)}
#bubble.on .ic-close{opacity:1;transform:none}
#bubble.on .dot{display:none}
#bubble .dot{position:absolute;top:5px;right:5px;width:12px;height:12px;border-radius:50%;background:#2fd36e;border:2px solid var(--accent)}
#bubble:not(.on)::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:ping 3s ease-out 2s 3}
@keyframes ping{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.6);opacity:0}}
#teaser{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:calc(max(20px,env(safe-area-inset-bottom)) + var(--nav,0px) + 74px);z-index:59;max-width:min(290px,calc(100vw - 40px));background:#fff;color:#1b1b1b;border-radius:18px 18px 4px 18px;padding:13px 38px 13px 15px;box-shadow:0 18px 44px -14px rgba(0,0,0,.45);animation:pop .45s cubic-bezier(.2,1.4,.4,1);transition:opacity .25s,transform .25s}
#teaser button.o{all:unset;cursor:pointer;display:block}
#teaser b{display:block;font:700 14.5px var(--font-body)}
#teaser span{font-size:13px;color:#555}
#teaser button.x{position:absolute;top:5px;right:5px;width:30px;height:30px;border:0;background:none;font-size:18px;cursor:pointer;color:#666;border-radius:50%}
#teaser.hide{opacity:0;pointer-events:none;transform:translateY(8px) scale(.95)}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.9)}to{opacity:1;transform:none}}
#veil{display:none}
/* ---- fenêtre ordi : panneau compact, la page reste utilisable ---- */
#chat{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:calc(max(20px,env(safe-area-inset-bottom)) + 74px);z-index:58;width:390px;max-width:calc(100vw - 40px);height:min(640px,calc(100vh - 120px));display:flex;flex-direction:column;background:var(--chat-bg);color:var(--chat-ink);border-radius:var(--r-chat);box-shadow:0 24px 70px -18px rgba(0,0,0,.6),0 0 0 1px var(--chat-line);overflow:hidden;transform-origin:calc(100% - 30px) calc(100% + 40px);animation:open .3s cubic-bezier(.2,1.1,.3,1)}
#chat[hidden]{display:none}
#chat.wide{width:min(600px,calc(100vw - 40px));height:calc(100vh - 120px)}
@keyframes open{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.grip{display:none}
.ch-head{display:flex;align-items:center;gap:10px;padding:12px 10px 12px 14px;background:var(--head-bg);color:var(--head-ink);position:relative;flex:none}
.ch-head .av{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.ch-head .av svg{width:22px;height:22px}
.ch-head .tt{flex:1;min-width:0}
.ch-head .nm{font:var(--h3-font);font-size:16px;line-height:1.15;overflow-wrap:anywhere}
.ch-head .st{font-size:12px;opacity:.9;display:flex;align-items:center;gap:6px;margin-top:2px}
.ch-head .st::before{content:"";width:8px;height:8px;border-radius:50%;background:#2fd36e;flex:none}
.ib{width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:var(--head-ink);cursor:pointer;display:grid;place-items:center;font-size:18px;flex:none;opacity:.85}
.ib:hover{background:color-mix(in srgb,var(--head-ink) 16%,transparent);opacity:1}
.ib svg{width:18px;height:18px}
.ib.close{width:40px;height:40px;background:color-mix(in srgb,var(--head-ink) 14%,transparent);opacity:1}
.ib.close svg{width:20px;height:20px}
.langs{display:flex;gap:2px;background:color-mix(in srgb,var(--head-ink) 12%,transparent);padding:3px;border-radius:999px}
.lg{border:0;background:none;color:var(--head-ink);font:700 11px var(--font-body);padding:6px 8px;border-radius:999px;cursor:pointer}
.lg[aria-pressed=true]{background:var(--head-ink);color:var(--head-bg)}
#log{flex:1;min-height:0;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain;background:var(--log-bg)}
#log>:first-child{margin-top:auto}
#chat.fresh .sugg-wrap{display:none}
.msg{display:flex;gap:8px;max-width:100%;animation:in .28s cubic-bezier(.2,1,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.user{justify-content:flex-end}
.msg.user .b{background:var(--user-bg);color:var(--user-ink);padding:9px 14px;border-radius:18px 18px 4px 18px;max-width:82%;overflow-wrap:anywhere;font-size:15px}
.msg.bot .av{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);flex:none;display:grid;place-items:center;margin-top:2px}
.msg.bot .av svg{width:16px;height:16px}
.msg.bot.cont .av{visibility:hidden}
.col{min-width:0;display:flex;flex-direction:column;gap:7px;align-items:flex-start;max-width:calc(100% - 36px)}
.card{background:var(--bot-bg);color:var(--bot-ink);padding:11px 14px;border-radius:4px 18px 18px 18px;font-size:15px;box-shadow:0 1px 0 var(--chat-line);overflow-wrap:anywhere}
.card p{margin:0 0 .55em}.card p:last-child{margin-bottom:0}
.card-t{font:var(--h3-font);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text);margin-bottom:5px}
.cartel{margin-top:9px;font-size:12.5px;padding:8px 10px;border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:0 8px 8px 0}
.flag{margin-top:9px;font-size:12px;opacity:.85;font-style:italic}
.intro{font-size:13px;opacity:.92;padding-left:2px}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin:2px 0 -2px 2px}
.typing{display:flex;gap:5px;padding:13px 15px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:.4;animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-4px);opacity:1}}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.act{display:inline-flex;align-items:center;gap:9px;padding:9px 13px;border-radius:12px;background:transparent;color:var(--chip-ink);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--chip-ink) 40%,transparent);text-decoration:none;font-size:13.5px;line-height:1.2;transition:transform .15s,background .15s;min-height:44px;max-width:100%}
.act:hover{transform:translateY(-1px);background:color-mix(in srgb,var(--chip-ink) 8%,transparent)}
.act.main{background:var(--act-bg);color:var(--act-ink);box-shadow:none}.act.main:hover{background:var(--act-hover)}
.act span{display:flex;flex-direction:column;min-width:0}.act small{font-size:12px;opacity:.9;overflow-wrap:anywhere}
.act.main.k-whatsapp{background:#0f7a3a;color:#fff}.act.main.k-whatsapp:hover{background:#0c6630}
.act.main.k-book{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid color-mix(in srgb,var(--accent) 65%,transparent);background:var(--chip-bg);color:var(--chip-ink);font:600 13.5px var(--font-body);padding:8px 13px;border-radius:999px;cursor:pointer;transition:background .15s,transform .15s,color .15s;min-height:40px;text-align:left}
.chip:hover{background:var(--accent);color:var(--accent-ink);transform:translateY(-1px)}
.chips.soft{flex-direction:column;gap:0;align-items:flex-start;padding:0 4px}
.chips.soft .chip{border:0;background:none;border-radius:6px;padding:5px 6px;min-height:34px;font-weight:600;font-size:13.5px;color:var(--accent-text);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent-text) 35%,transparent);text-underline-offset:3px}
.chips.soft .chip::before{content:"› ";text-decoration:none;display:inline-block}
.chips.soft .chip:hover{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent-text);transform:none}
.chips.choice .chip{border-radius:14px;padding:10px 14px;font-size:14.5px}
/* les anciennes relances se replient : seule la dernière réponse garde ses boutons (fil lisible) */
.msg.old .chips.soft,.msg.old .chips.ex{display:none}
.sugg-wrap{background:var(--log-bg);border-top:1px solid var(--chat-line);flex:none}
#sugg{display:flex;gap:7px;overflow-x:auto;padding:8px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch;mask-image:linear-gradient(90deg,#000 90%,transparent)}
#sugg::-webkit-scrollbar{display:none}
#sugg .chip{flex:none;white-space:nowrap;font-size:13px;padding:6px 12px;min-height:34px}
form#form{display:flex;align-items:center;gap:7px;padding:9px 10px;background:var(--chat-bg);border-top:1px solid var(--chat-line);flex:none}
form#form input{flex:1;min-width:0;border:1.5px solid var(--chat-line);background:var(--input-bg);color:var(--chat-ink);border-radius:999px;padding:11px 15px;font:16px var(--font-body)}
form#form input::placeholder{color:color-mix(in srgb,var(--chat-ink) 68%,transparent)}
form#form input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.send,.mic{width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;flex:none}
.send{background:var(--accent);color:var(--accent-ink)}.send:hover{filter:brightness(1.08)}
.mic{background:transparent;color:var(--chat-ink);box-shadow:inset 0 0 0 1.5px var(--chat-line)}
.mic.on{background:#d93a3a;color:#fff;animation:rec 1.2s infinite}
@keyframes rec{50%{box-shadow:0 0 0 8px rgba(217,58,58,.2)}}
.mention{padding:4px 12px 8px;text-align:center;font-size:10.5px;color:color-mix(in srgb,var(--chat-ink) 76%,transparent);background:var(--chat-bg);flex:none}
.mention b{font-weight:600}
/* ---- mobile : feuille par le bas (~86 %), le haut du site reste visible ---- */
@media (max-width:640px){
  .site-bg{background-image:var(--fond-mobile)}
  #bubble{--nav:64px;width:56px;height:56px;right:14px}
  #teaser{--nav:64px;right:14px}
  .apercu{left:50%;transform:translateX(-50%);bottom:auto;top:max(10px,env(safe-area-inset-top));white-space:nowrap;font-size:11px}
  #veil{display:block;position:fixed;inset:0;z-index:57;background:rgba(0,0,0,.38);animation:fade .25s}
  #veil[hidden]{display:none}
  @keyframes fade{from{opacity:0}}
  #chat,#chat.wide{left:0;right:0;bottom:0;top:auto;width:100%;max-width:none;height:86vh;height:86dvh;border-radius:20px 20px 0 0;animation:slide .3s cubic-bezier(.2,1,.3,1)}
  @keyframes slide{from{transform:translateY(100%)}to{transform:none}}
  /* à l'ouverture, la feuille ne prend que la place de l'accueil : on voit davantage le site */
  #chat.fresh:not(.kb){height:auto;max-height:86dvh}
  #chat.fresh:not(.kb) #log{flex:none}
  #bubble.on{display:none}
  .grip{display:block;position:absolute;top:6px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:color-mix(in srgb,var(--head-ink) 45%,transparent);z-index:2}
  .ch-head{padding:16px 8px 10px 14px;gap:6px}.ch-head .av{width:34px;height:34px}.ch-head .av svg{width:19px;height:19px}
  .ch-head .nm{font-size:15px}.ch-head .st{font-size:11.5px}
  #expand{display:none}
  .lg{padding:7px 7px;font-size:11px}
  form#form{padding-bottom:max(9px,env(safe-area-inset-bottom))}
  /* clavier ouvert : la fenêtre épouse la zone visible, on libère la place */
  #chat.kb{border-radius:0;transition:none;animation:none}
  #chat.kb .grip,#chat.kb .sugg-wrap,#chat.kb .mention{display:none}
  #chat.kb .ch-head{padding-top:10px}
  #chat.kb form#form{padding-bottom:8px}
}
@media (max-width:370px){#restart{display:none}.ch-head .av{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

nde Anse, mit Blick auf den Ozean. Die Rezeption nennt Ihnen gern den besten Zugang zum Strand. Das Baden im offenen Meer ist dort verboten: Das angelegte Badebecken ist der vorgesehene Ort (siehe „Baden im Meer“). Vor Ort bietet das Hotel seinen „hängenden Strand“ (KAH Beach): einen Entspannungsbereich zum Ozean mit beheiztem Whirlpool, frei zugänglichem Hammam und Himmelbetten."}},{"statut":"partiel","actions":["tel:resto","mail:resto"],"suggestions":["restos","table","breakfast"],"source":"https://palm.re/se-restaurer/ (lu le 27/10/2026)","service":"Restaurants","id":"bar","topic":{"fr":"Bar et glacier","en":"Bar & ice cream","de":"Bar & Eis"},"exemples":{"fr":["il y a un bar","on peut prendre un verre","bar de l'hôtel","cocktails","bar ouvert jusqu'à quelle heure","boire un verre le soir","vous avez des cocktails","y a du rhum","un apéro","happy hour","bar piscine","boissons","glace","glacier","vous vendez des glaces","boire un café","on peut boire quelque chose","snack","tapas","petite restauration","grignoter","un en-cas","y a un bar ?","cocktails ?","bar","on peut boire un verre le soir"],"en":["is there a bar","can we have a drink","hotel bar","cocktails","bar opening hours","do you have ice cream","where can I get a coffee","snacks","pool bar","happy hour"],"de":["gibt es eine bar","etwas trinken","hotelbar","cocktails","barzeiten","gibt es eis","wo bekomme ich einen kaffee","snacks","poolbar","Gibt es eine Bar?"]},"mots_ancres":["bar:5","cocktail","cocktails","apero","rhum","glace","glacier","ice cream","tapas","snack","boisson","boissons","drink"],"reponse":{"fr":"Le Kokoa est le lieu pour un cocktail ou une pause gourmande : terrasse panoramique face aux vagues de Grande Anse, service continu de 10h à 23h et tapas de 12h à 21h30, sur réservation au 0262 56 30 30. Le Salon du Makassar (bar boisé, fauteuils en cuir et Cave du Palm) prolonge la soirée autour d'un grand cru.","en":"The Kokoa is the place for a cocktail or a gourmet break: panoramic terrace f omise a precise noise level, but the setting lends itself to it: the 72 rooms are spread over a 4-hectare tropical garden, and guests describe a calm, natural setting. If calm is essential to you, say so when booking: reception will suggest a suitable room.","de":"Einen genauen Geräuschpegel kann ich nicht versprechen, doch die Umgebung lädt dazu ein: Die 72 Zimmer verteilen sich in einem 4 Hektar großen tropischen Garten, und Gäste beschreiben eine ruhige, natürliche Umgebung. Wenn Ruhe für Sie wichtig ist, sagen Sie es bei der Buchung: Die Rezeption empfiehlt ein passendes Zimmer."}},{"statut":"valide","actions":[{"type":"lien","url":"https://palm.re/offres-speciales/sejour-en-couple/","label":{"fr":"Séjour en couple","en":"Stay as a couple","de":"Aufenthalt zu zweit"}},"tel:reception",{"type":"mail","to":"conciergerie@palm.re","subject":{"fr":"Séjour en couple","en":"Stay as a couple","de":"Aufenthalt zu zweit"}}],"suggestions":["honeymoon","occasion"],"source":"https://palm.re/offres-speciales/sejour-en-couple/ ; /offres-speciales/offre-voyage-de-noces-2/ ; /se-ressourcer/ — lus le 27/10/2026","id":"couple","topic":{"fr":"Séjour en couple","en":"Stay as a couple","de":"Aufenthalt zu zweit"},"exemples":{"fr":["c'est un hôtel pour les couples","hôtel romantique","séjour en couple","c'est adapté pour une lune de miel","ambiance romantique","dîner aux chandelles","séjour entre amoureux","hôtel pour adultes","adults only","réservé aux adultes","c'est pour qui cet hôtel","clientèle de l'hôtel","pour une escapade en amoureux","hôtel pour célibataires","je voyage seul","c'est pour adultes ?","hôtel romantique pour couple ?","on est un couple, c'est adapté ?","ist es gut für Paare?","c'est un hôtel pour les couples ?","c est bien pour un couple","c est bien pour un couple ?","c bien pour un couple","hôtel pour couple","séjour romantique","séjour romantique réunion","week end romantique","on veut un week end en amoureux","week end en amoureux","escapade en amoureux","esca sites ; pour une question précise, la réception vous répond.","en":"Here is what the platforms say (guest ratings noted on 25/10/2026, they change): Google 4.5/5 (3,309 reviews) and TripAdvisor 4.4/5 (about 1,937 reviews, no. 1 in Petite-Île). Guests praise the welcome and attentive staff, the view over the ocean and Grande Anse bay, the Akéa spa and the breakfast. I invite you to read the reviews on the sites; for a specific question, reception will answer.","de":"Das sagen die Plattformen (Gästebewertungen vom 25.10.2026, sie ändern sich): Google 4,5/5 (3.309 Bewertungen) und TripAdvisor 4,4/5 (rund 1.937 Bewertungen, Nr. 1 in Petite-Île). Gäste loben den Empfang und das aufmerksame Personal, den Blick auf Ozean und Bucht von Grande Anse, das Akéa Spa und das Frühstück. Lesen Sie gern die Bewertungen auf den Portalen; bei einer konkreten Frage antwortet die Rezeption."}},{"statut":"valide","actions":[{"type":"lien","label":{"fr":"Prévisions Météo-France Réunion","en":"Météo-France Réunion forecast","de":"Wettervorhersage Météo-France Réunion"},"url":"https://meteofrance.re"},"tel:reception"],"suggestions":["cyclone","whales","baignade"],"source":"https://meteofrance.re/fr/climat/pluviometrie-et-temperatures-la-reunion ; https://www.reunion.fr/organisez/informations-utiles-avant-de-voyager/climat/ (lu le 25/10/2026)","id":"meteo","topic":{"fr":"Météo et meilleure période","en":"Weather and best time to visit","de":"Wetter und beste Reisezeit"},"exemples":{"fr":["il fait beau en ce moment","il pleut beaucoup en janvier","quel temps fait-il","meilleure période pour venir","saison des pluies","quand venir","température de l'eau","il fait chaud","climat à la réunion","quelle saison choisir","pluie en février","soleil toute l'année","météo","faut-il prendre un parapluie","quel climat en août","hiver austral","mois le plus sec","il fait beau en ce moment ?","il pleut chez vous ?","météo demain ?","ya du soleil actuellement","météo pr mon séjour ?","le ciel est dégagé ?", {"fr":"Je n’ai pas la météo en direct : pour la prévision du jour, le plus fiable est Météo-France Réunion. Côté climat, il y a deux saisons. L’été austral (novembre à avril) est chaud et humide (30-32 °C sur la côte, averses parfois fortes mais en général courtes) ; l’hiver austral (mai à octobre) est plus frais et sec (25-27 °C en journée, nuits fraîches). Beaucoup de voyageurs préfèrent mai à octobre (randonnée, baleines de juin à octobre) et les intersaisons (avril-mai, octobre-novembre) ; l’été offre l’eau chaude et une végétation luxuriante, avec le risque cyclonique (voir « Cyclone »). La pluie varie beaucoup selon la côte. Je ne peux pas garantir les cumuls exacts du sud : la réception vous renseigne.","en":"I don’t have live weather: for today’s forecast, Météo-France Réunion is the most reliable source. As for the climate, there are two seasons. The austral summer (November to April) is hot and humid (30-32 °C on the coast, sometimes heavy but usually short showers); the austral winter (May to October) is cooler and drier (25-27 °C by day, cool nights). Many travellers prefer May to October (hiking, whales from June to October) and the shoulder seasons (April-May, October-November); summer brings warm water and lush vegetation, with the cyclone risk (see “Cyclone”). Rainfall varies a lot from coast to coast. I cannot guarantee exact rainfall for the south: reception will advise you.","de":"Ich habe keine Live-Wetterdaten: für die Tagesvorhersage ist Météo-France Réunion am zuverlässigsten. Zum Klima: Es gibt zwei Jahreszeiten. Der australe Sommer (November bis April) ist heiß und feucht (30-32 °C an der Küste, teils kräftige, meist kurze Schauer); der australe Winter (Mai bis Oktober) ist kühler und trockener (25-27 °C tagsüber, kühle Nächte). Viele Reisende bevorzugen Mai bis Oktober (Wandern, Wale von Juni bis Oktober) sowie die Zwischensaisons (April-Mai, Oktober-November); der Sommer bringt warmes Wasser und üppige Vegetation, aber auch das Zyklonrisiko (siehe „Zyklon“). Der Niederschlag unterscheidet sich stark je nach Küste. Die genauen Niederschlagsmengen im Süden kann ich nicht garantieren: Die Rezeption berät Sie."}},{"statut":"non_publie","actions":["tel:reception","mail:reception"],"suggestions":["parking","human","beach"],"source":"non publié par l’hôtel dans les sources lues","id":"securite","topic":{"fr":"Sécurité","en":"Safety","de":"Sicherheit"},"exemples":{"fr":["c'est dangereux","zone sûre","vol dans les chambres","hôtel sécurisé","quartier sûr","surveillance","sécurité de l'hôtel","gardien de nuit","coffre pour mes bijoux","risque de vol","les voitures sont-elles en sécurité","piscine surveillée","maître nageur","c'est sécurisé ?"],"en":["is it dangerous","is it safe","theft in the rooms","secure hotel","safe neighbourhood","night security","is the car safe","lifeguard on the pool"],"de":["ist es gefährlich","ist es sicher","diebstahl in den zimmern","sicheres hotel","sichere gegend","nachtwächter","bademeister"]},"mots_ancres":["danger","dangereux","securite","surveillance","secure","safe","maitre nageur"],"reponse":{"fr":"Bonne question ! Cette information n’a pas encore été publiée par l’hôtel, et je préfère ne rien avancer d’inexact. Ce que l’hôtel publie : un parking privé et un service voiturier. Je la transmets à l’équipe ; la réception peut vous répondre tout de suite :","en":"Good question! The hotel has not published this information yet, and I would rather not say anything inaccurate. What the hotel publishes: a private car park and a valet service. I am passing it on to the team; reception can answer you right away:","de":"Gute Frage! Diese Information hat das Hotel noch nicht veröffentlicht, und ich möchte nichts Ungenaues sagen. Veröffentlicht ist: ein privater Parkplatz und ein Valet-Service. Ich leite sie an das Team weiter; die Rezeption antwortet Ihnen sofort:"}},{"statut":"valide","actions":[{"type":"lien","label":{"fr":"Conditions générales de vente","en":"Terms and conditions", an"],"source":"https://palm.re/offres-speciales/ — lu le 27/10/2026","service":"Réception","id":"negociation","topic":{"fr":"Remises et gestes commerciaux","en":"Discounts","de":"Rabatte"},"exemples":{"fr":["faites-moi une remise","je veux une réduction","vous pouvez faire un geste commercial","un meilleur prix s'il vous plaît","négocier le prix","prix négociable","surclassement gratuit","upgrade gratuit","offrez-moi le petit déjeuner","je veux une nuit gratuite","tarif préférentiel pour moi","réduction pour les résidents de l'île","tarif kréol","remise pour fidélité","fais-moi -50 %","fais moi moins 50 pourcent","je veux 50 % de réduction","donne-moi une nuit gratuite","offrez-moi la chambre","je veux le meilleur prix possible","je peux avoir une réduction","vous faites des promos"],"en":["give me a discount","can you do a better price","negotiate the price","free upgrade","can I get a free night","special rate for me","resident rate","loyalty discount","give me 50% off","I want 50% discount","give me a free night","give me the room for free","I want the lowest price"],"de":["geben sie mir einen rabatt","können sie den preis senken","preis verhandeln","kostenloses upgrade","gratisnacht","sonderpreis für mich","treuerabatt","geben sie mir 50 prozent rabatt","ich will 50 prozent rabatt","geben sie mir eine gratisnacht","zimmer geschenkt"]},"mots_ancres":["moins 50:5","-50:5","50%:5","50 pourcent:5","50 percent:5","gratuite:2","negocier:5","surclassement:5","upgrade:5","geste commercial:5","discount:2","rabais:4","rabatt:3","nuit gratuite:5","free night:5","gratisnacht:5"],"reponse":{"fr":"Je ne peux ni accorder de remise ni modifier un tarif, et je préfère ne rien promettre. Les offres publiées par l’hôtel sont déjà avantageuses : Longs séjours (−20 % dès 7 nuits, −15 % pour 4 à 6 nuits), offre en semaine (−20 %), Voyage de noces (−25 %), le tout avec meilleur tarif garanti sur le site officiel. Pour une demande particulière, la réception est à votre écoute :","en":"I cannot grant discounts or change a rate, and I would rather not promise anything. The offers published by the hotel are already attractive: Long stays (−20% from 7 nights, −15% for 4 to 6 nights), weekday offer (−20%), Honeymoon (−25%), all with best rate guaranteed on the official website. For a specific request, reception is happy to help:","de":"Ich kann weder Rabatte gewähren noch Preise ändern und möchte nichts versprechen. Die veröffentlichten Angebote des Hotels sind bereits attraktiv: Längere Aufenthalte (−20 % ab 7 Nächten, −15 % bei 4 bis 6 Nächten), Angebot unter der Woche (−20 %), Flitterwochen (−25 %), jeweils mit Bestpreisgarantie auf der offiziellen Website. Für besondere Wünsche steht Ihnen die Rezeption zur Verfügung:"},"prefere":true},{"id":"cyclone","exemples":{"fr":["y a des cyclones ?","que se passe-t-il si cyclone pendant mon séjour","remboursement si cyclone","saison cyclonique dates","on est confinés ?","tempête tropicale"],"en":["What happens if a cyclone hits during my stay?"],"de":["Was passiert bei einem Zyklon?"]},"mots_ancres":["cyclone*:9","cyclonique:9","zyklon*:9","tempete tropicale:8","alerte rouge:8","alerte orange:8","alerte violette:8","tropical storm:8","hurricane:8","taifun:7","vigilance:6","saison cyclonique:9","cyclone season:9","zyklonsaison:9","consignes:3","alerte:5","ferme en cas:5"],"suggestions":["meteo","annulation","human"],"actions":[{"type":"lien","label":{"fr":"Vigilance Météo-France Réunion","en":"Météo-France weather alerts","de":"Météo-France Wetterwarnungen"},"url":"https://vigilance.meteofrance.fr/fr/la-reunion"},"tel:reception"],"statut":"valide","topic":{"fr":"Cyclone et alertes","en":"Cyclones and alerts","de":"Zyklon und Warnstufen"},"reponse":{"fr":"La saison cyclonique court environ de novembre à avril ; un cyclone touche l’île en moyenne une à deux fois par an et dure en général une journée. Les alertes sont graduées : pré-alerte jaune, alerte orange (danger sous 24 h : on annule les sorties en mer et en montagne), alerte rouge (confinement, circulation interdite, annoncée environ 3 h avant), alerte violette (la plus forte). On suit les consignes de la préfecture et de l’équipe de l’hôtel ; le suivi officiel en temps réel se trouve sur Météo-France Vigilance. Pour une annulation ou un remboursement lié à un cyclone, je n’ai pas d’information : cela dépend des conditions de votre réservation, la réception vous répond.","en":"The cyclone season runs roughly from November to April; on average a cyclone hits the island once or twice a year and usually lasts about a day. Alerts are graded: yellow pre-alert, orange alert (danger within 24 h: cancel sea and mountain outings), red alert (lockdown, traffic banned, announced about 3 h ahead), purple (the strongest). Follow the prefecture’s and the hotel team’s instructions; official real-time tracking is on Météo-France Vigilance. For a cancellation or refund linked to a cyclone I have no information: it depends on your booking conditions, reception will answer.","de":"Die Zyklonsaison dauert etwa von November bis April; durchschnittlich zieht ein bis zwei Mal pro Jahr ein Zyklon über die Insel und dauert meist etwa einen Tag. Die Warnstufen: gelbe Vorwarnung, orange Alarm (Gefahr innerhalb von 24 h: Ausflüge aufs Meer und in die Berge absagen), roter Alarm (Ausgangssperre, Verkehr verboten, rund 3 h vorher angekündigt), violett (am stärksten). Man folgt den Anweisungen der Präfektur und des Hotelteams; die offizielle Echtzeit-Warnlage finden Sie bei Météo-France Vigilance. Zu Stornierung oder Erstattung wegen eines Zyklons habe ich keine Informationen: Das hängt von Ihren Buchungsbedingungen ab, die Rezeption antwortet Ihnen."},"source":"https://www.reunion.fr/organisez/conseils-de-voyage/questions-reponses/quelle-est-la-periode-des-cyclones-a-la-reunion/ ; https://www.reunion.gouv.fr/Actions-de-l-Etat/Crise/La-saison-cyclonique-a-La-Reunion ; https://vigilance.meteofrance.fr/fr/ (lu le 25/10/2026)","bonus":1},{"id":"baignade","exemples":{"fr":["peut-on se baigner à Grande Anse ?","on peut nager dans la mer ?","où se baigner à la Réunion","snorkeling autorisé ?","y a des maîtres nageurs ?","le bassin de Grande Anse est ouvert ?","c'est quand l'inauguration du bassin","baignade au sud ok ?","on peut nager dans la mer"],"en":["Can you swim at Grande Anse?","Is it safe to swim here?","Is the new basin open?"],"de":["Wo darf man baden?"]},"mots_ancres":["baigner:6","baignade:6","nager:6","nage:4","swim:6","baden:6","bassin:5","snorkeling:4","drapeau","drapeaux","maitre nageur:4","lagon:3","dangereuse:5","mer dangereuse:8","badebecken:7","inauguration:4","manapany:5","becken:4"],"suggestions":["requins","beach","pools"],"actions":[{"type":"lien","label":{"fr":"Préfecture : risque requin","en":"Prefecture: shark risk","de":"Präfektur: Haigefahr"},"url":"https://www.reunion.gouv.fr/Actualites/Communiques-de-presse/Activites-nautiques-en-mer-vigilance-face-au-risque-requins"},"tel:reception"],"statut":"valide","topic":{"fr":"Baignade en mer","en":"Swimming in the sea","de":"Baden im Meer"},"source":"https://www.civis.re/infrastructures/212-le-site-de-grande-anse ; https://www.lequotidien.re/article/societe/2026/10/21/grande-anse-le-nouveau-bassin-ouvre-officiellement-le-27-octobre ; https://palm.re/evader/ (lu le 25/10/2026)","bonus":0.92,"reponse":{"fr":"À La Réunion, la baignade est réglementée : elle est possible dans les lagons et dans les espaces aménagés ou surveillés définis par la commune ; ailleurs, dans la bande des 300 m du littoral, elle est restreinte (palmes-masque-tuba compris). Drapeaux : vert = surveillée, jaune ou orange = dangereuse mais surveillée, rouge = interdite.\nÀ Grande Anse, la baignade en pleine mer sur la plage est interdite (arrêté ; site géré par la CIVIS). Le bassin de baignade aménagé est le lieu prévu : son extension (6 400 m² contre 3 500 m² avant) est annoncée par la presse (Le Quotidien, 21/10/2026) pour une ouverture le mardi 27 octobre 2026 ; je ne connais pas les horaires de surveillance, à confirmer auprès de la réception. Sur place, les deux piscines de l’hôtel restent le plus simple.","en":"In La Réunion swimming is regulated: it is possible in lagoons and in developed or supervised areas set by the municipality; elsewhere, within 300 m of the shore, it is restricted (including snorkelling). Flags: green = supervised, yellow or orange = dangerous but supervised, red = forbidden.\nAt Grande Anse, swimming in the open sea off the beach is forbidden (order; site managed by the CIVIS). The developed swimming basin is the intended place: its extension (6,400 m² instead of 3,500 m²) is announced by the press (Le Quotidien, 21/10/2026) to open on Tuesday 27 October 2026; I don’t know the lifeguard hours, please confirm with reception. On site, the hotel’s two pools remain the simplest option.","de":"Auf La Réunion ist das Baden geregelt: Es ist in Lagunen und in ausgewiesenen oder überwachten Bereichen der Gemeinde möglich; anderswo ist es im 300-m-Küstenstreifen eingeschränkt (auch Schnorcheln). Flaggen: grün = überwacht, gelb oder orange = gefährlich, aber überwacht, rot = verboten.\nIn Grande Anse ist das Baden im offenen Meer am Strand verboten (Verfügung; Gelände der CIVIS). Das angelegte Badebecken ist der vorgesehene Ort: Seine Erweiterung (6.400 m² statt 3.500 m²) soll laut Presse (Le Quotidien, 21.10.2026) am Dienstag, den 27. Oktober 2026 eröffnen; die Aufsichtszeiten kenne ich nicht, bitte an der Rezeption bestätigen. Vor Ort sind die zwei Pools des Hotels am einfachsten."},"prefere":false},{"id":"requins","exemples":{"fr":["y a des requins ?","risque requin quand je nage","requins dans le lagon ?","pourquoi la baignade est interdite","c'est vrai que la mer est interdite ?","y a des requins"],"en":[],"de":["Gibt es Haie?"]},"mots_ancres":["requin:9","requins:9","shark:9","sharks:9","hai:9","haie:9","haifisch:9","squale:8","surf:5","surfer:6","dorsal:6","pr2p:6","risque requin:9","attaque:4"],"suggestions":["baignade","beach","human"],"actions":[{"type":"lien","label":{"fr":"Préfecture : risque requin","en":"Prefecture: shark risk","de":"Präfektur: Haigefahr"},"url":"https://www.reunion.gouv.fr/Actualites/Communiques-de-presse/Activites-nautiques-en-mer-vigilance-face-au-risque-requins"},"tel:reception"],"statut":"valide","topic":{"fr":"Requins","en":"Sharks","de":"Haie"},"reponse":{"fr":"Le risque requin existe et il est pris très au sérieux : la préfecture parle d’un risque « réel et permanent » hors des lagons, bassins et zones sécurisées, d’où une baignade encadrée. On se baigne dans les lagons, bassins ou zones surveillées, pas seul, pas à l’aube ni au crépuscule, pas en eau trouble, et on respecte les drapeaux. Informations en temps réel : application DORSAL et carte pr2p.re. Je ne peux pas vous dire que c’est sans danger : fiez-vous à la préfecture et au poste de secours. À Grande Anse, la baignade en pleine mer est interdite ; le bassin aménagé est le lieu prévu (voir « Baignade en mer »).","en":"The shark risk exists and is taken very seriously: the prefecture calls it a “real and permanent” risk outside lagoons, pools and secured areas, which is why swimming is regulated. Swim in lagoons, basins or supervised zones, not alone, not at dawn or dusk, not in murky water, and respect the flags. Real-time information: the DORSAL app and the pr2p.re map. I can’t tell you it is risk-free: rely on the prefecture and the lifeguard post. At Grande Anse, swimming in the open sea is forbidden; the developed basin is the intended place (see “Swimming in the sea”).","de":"Das Hairisiko besteht und wird sehr ernst genommen: Die Präfektur spricht von einem „realen und dauerhaften“ Risiko außerhalb von Lagunen, Becken und gesicherten Zonen; deshalb ist das Baden geregelt. Man badet in Lagunen, Becken oder überwachten Zonen, nicht allein, nicht in der Dämmerung, nicht in trübem Wasser, und beachtet die Flaggen. Echtzeit-Infos: App DORSAL und Karte pr2p.re. Ich kann nicht sagen, dass es ungefährlich ist: Verlassen Sie sich auf die Präfektur und den Rettungsposten. In Grande Anse ist das Baden im offenen Meer verboten; das angelegte Becken ist der vorgesehene Ort (siehe „Baden im Meer“)."},"source":"https://www.reunion.gouv.fr/Actualites/Communiques-de-presse/Activites-nautiques-en-mer-vigilance-face-au-risque-requins (préfecture, maj 06/08/2025) ; réglementation baignade (préfecture, maj 15/03/2023) (lu le 25/10/2026)","bonus":1.25},{"id":"tortues","exemples":{"fr":["on peut voir des tortues ?","horaires Kélonia","nager avec les tortues","jour de fermeture Kélonia"],"en":["Can we see turtles?"],"de":["Kann man Schildkröten sehen?"]},"mots_ancres":["tortue:8","tortues:8","kelonia:9","turtle:8","turtles:8","schildkroete:8","schildkroeten:8","schildkrote:8","schildkroten:8","tortue marine:9"],"suggestions":["autour","distances","concierge"],"actions":[{"type":"lien","label":{"fr":"Kélonia : horaires et tarifs","en":"Kélonia: hours and prices","de":"Kélonia: Öffnungszeiten"},"url":"https://museesreunion.fr/kelonia/"},{"type":"mail","to":"conciergerie@palm.re","subject":{"fr":"Excursions","en":"Excursions","de":"Ausflüge"}}],"statut":"valide","topic":{"fr":"Tortues et Kélonia","en":"Turtles and Kélonia","de":"Schildkröten und Kélonia"},"reponse":{"fr":"Kélonia, à Saint-Leu, est l’observatoire des tortues marines et centre de soins : visite libre de 9 h à 18 h (billetterie fermée à 17 h), visites guidées à 10 h, 11 h 30, 14 h et 16 h sans réservation, dans la limite des places (horaires susceptibles de changer). Depuis le PALM, comptez environ 1 h de route (ordre de grandeur) ; la conciergerie propose Kélonia parmi ses sorties.","en":"Kélonia, in Saint-Leu, is the marine-turtle observatory and care centre: free visit from 9 am to 6 pm (ticket office closes at 5 pm), guided tours at 10 am, 11:30 am, 2 pm and 4 pm without booking, subject to availability (hours may change). From PALM allow about 1 hour by road (rough figure); the concierge lists Kélonia among its outings.","de":"Kélonia in Saint-Leu ist das Beobachtungszentrum für Meeresschildkröten und Pflegestation: freier Besuch von 9 bis 18 Uhr (Kasse schließt um 17 Uhr), Führungen um 10, 11:30, 14 und 16 Uhr ohne Reservierung, solange Plätze frei sind (Zeiten können sich ändern). Vom PALM sind es etwa 1 Std. Fahrt (grober Richtwert); die Concierge führt Kélonia unter ihren Ausflügen."},"source":"https://museesreunion.fr/kelonia/ (lu le 25/10/2026) ; https://palm.re/evader/"},{"id":"moustiques","exemples":{"fr":["y a des moustiques ?","chikungunya en ce moment ?","vaccin obligatoire ?","moustiquaire dans la chambre","dois-je me faire vacciner"],"en":["Is there dengue?"],"de":["Gibt es Dengue?"]},"mots_ancres":["moustique:9","moustiques:9","moustiquaire:7","dengue:9","chikungunya:9","chik:5","mosquito:9","mosquitoes:9","muecke:9","muecken:9","mucken:9","mucke:9","repulsif:6","repellent:6","epidemie:6","vaccin:3","paludisme:5","malaria:5","demoustication:6"],"suggestions":["urgence","eau","human"],"actions":[{"type":"lien","label":{"fr":"ARS : recommandations voyageurs","en":"ARS: traveller advice","de":"ARS: Reisehinweise"},"url":"https://www.lareunion.ars.sante.fr/recommandations-la-population-et-aux-voyageurs"},"tel:reception"],"statut":"valide","topic":{"fr":"Moustiques et dengue","en":"Mosquitoes and dengue","de":"Mücken und Dengue"},"reponse":{"fr":"Il y a des moustiques (Aedes albopictus) qui peuvent transmettre la dengue et le chikungunya ; des cas sont recensés dans l’année. Protégez-vous : répulsif cutané (efficace 4 à 8 h ; produits spécifiques pour enfants et femmes enceintes), vêtements clairs et couvrants, moustiquaire ou diffuseur. Au 22/06/2026, l’ARS a ramené l’île au niveau 2 du plan ORSEC (circulation modérée) et déclaré la fin de l’épidémie de chikungunya ; pour la situation actuelle et les recommandations aux voyageurs, voir le site de l’ARS. Pour un avis médical (vaccin, grossesse, enfants), consultez un médecin.","en":"There are mosquitoes (Aedes albopictus) that can transmit dengue and chikungunya; cases are recorded during the year. Protect yourself: skin repellent (effective 4 to 8 h; specific products for children and pregnant women), light-coloured covering clothes, bed net or diffuser. On 22/06/2026 the ARS brought the island back to ORSEC level 2 (moderate circulation) and declared the end of the chikungunya epidemic; for the current situation and traveller advice, see the ARS website. For medical advice (vaccine, pregnancy, children), consult a doctor.","de":"Es gibt Mücken (Aedes albopictus), die Dengue und Chikungunya übertragen können; im Laufe des Jahres werden Fälle gemeldet. Schützen Sie sich: Hautrepellent (wirkt 4 bis 8 h; spezielle Produkte für Kinder und Schwangere), helle, bedeckende Kleidung, Moskitonetz oder Diffusor. Am 22.06.2026 stufte die ARS die Insel auf Stufe 2 des ORSEC-Plans zurück (moderate Zirkulation) und erklärte die Chikungunya-Epidemie für beendet; die aktuelle Lage und Reisehinweise finden Sie auf der Website der ARS. Für medizinischen Rat (Impfung, Schwangerschaft, Kinder) wenden Sie sich an einen Arzt."},"source":"https://www.lareunion.ars.sante.fr/recommandations-la-population-et-aux-voyageurs ; https://www.lareunion.ars.sante.fr/dengue-chiffres-et-zones-concernees (lu le 25/10/2026)","bonus":1.15},{"id":"eau","exemples":{"fr":["l'eau du robinet est potable ?","eau en bouteille nécessaire ?","qualité de l'eau"],"en":[],"de":["Ist das Leitungswasser trinkbar?"]},"mots_ancres":["robinet:8","potable:8","tap water:8","drinking water:7","leitungswasser:8","trinkwasser:8","eau en bouteille:7","boire l eau:7","biberon:3"],"suggestions":["meteo","human"],"actions":[{"type":"lien","label":{"fr":"eaudurobinet.re (ARS)","en":"eaudurobinet.re (ARS)","de":"eaudurobinet.re (ARS)"},"url":"https://www.eaudurobinet.re"},"tel:reception"],"statut":"valide","topic":{"fr":"Eau du robinet","en":"Tap water","de":"Leitungswasser"},"reponse":{"fr":"La qualité de l’eau du robinet est suivie par l’ARS, qui publie un site dédié (eaudurobinet.re) pour consulter votre commune. Je n’ai pas le détail pour le secteur de l’hôtel : la réception vous le confirme.","en":"Tap-water quality is monitored by the ARS, which publishes a dedicated site (eaudurobinet.re) where you can check each municipality. I don’t have the detail for the hotel’s area: reception will confirm.","de":"Die Qualität des Leitungswassers wird von der ARS überwacht, die eine eigene Seite (eaudurobinet.re) zur Abfrage Ihrer Gemeinde betreibt. Zu den Details für die Umgebung des Hotels habe ich keine Angaben: Die Rezeption bestätigt es Ihnen."},"source":"https://www.lareunion.ars.sante.fr/qualite-de-leau-du-robinet-la-reunion ; https://www.eaudurobinet.re (lu le 25/10/2026)"},{"id":"decalage","exemples":{"fr":["quel décalage horaire ?","on paie en euros ?","quelles prises électriques","carte d'identité suffit ?","enfants papiers"],"en":["Which currency and plugs?"],"de":["Welche Steckdosen?"]},"mots_ancres":["decalage:9","decalage horaire:9","time difference:9","zeitverschiebung:9","fuseau:8","time zone:8","zeitzone:8","euros:6","euro:5","monnaie:6","currency:6","waehrung:6","prise:5","prises:6","adaptateur:7","adapter:6","plugs:7","steckdose:7","steckdosen:7","passeport:7","passport:7","reisepass:7","visa:5","papiers:6","carte d identite:7","formalites:6"],"suggestions":["airport","meteo","human"],"actions":[{"type":"lien","label":{"fr":"Formalités d’entrée (reunion.fr)","en":"Entry formalities (reunion.fr)","de":"Einreiseformalitäten (reunion.fr)"},"url":"https://www.reunion.fr/organisez/conseils-de-voyage/questions-reponses/les-formalites-d-entree-a-la-reunion/"},"tel:reception"],"statut":"valide","topic":{"fr":"Décalage horaire, monnaie, papiers","en":"Time difference, currency, papers","de":"Zeitverschiebung, Währung, Papiere"},"reponse":{"fr":"Heure : UTC+4, sans changement d’heure ; soit 3 h de plus qu’à Paris pendant l’heure d’hiver et 2 h de plus pendant l’heure d’été. Monnaie : l’euro (La Réunion est un département français). Pour les papiers d’entrée, cela dépend de votre nationalité : voir les formalités sur reunion.fr. Prises électriques : je n’ai pas de source officielle, la réception vous le confirme.","en":"Time: UTC+4, with no daylight-saving change; that is 3 hours ahead of Paris during winter time and 2 hours ahead during summer time. Currency: the euro (La Réunion is a French département). Entry papers depend on your nationality: see the formalities on reunion.fr. Power sockets: I have no official source, reception will confirm.","de":"Uhrzeit: UTC+4, ohne Zeitumstellung; das sind 3 Stunden mehr als in Paris während der Winterzeit und 2 Stunden mehr während der Sommerzeit. Währung: der Euro (La Réunion ist ein französisches Département). Die Einreisepapiere hängen von Ihrer Staatsangehörigkeit ab: siehe Einreiseformalitäten auf reunion.fr. Steckdosen: Ich habe keine offizielle Quelle, die Rezeption bestätigt es Ihnen."},"source":"https://www.reunion.fr/organisez/informations-utiles-avant-de-voyager/decalage-horaire/ ; https://www.reunion.fr/organisez/conseils-de-voyage/questions-reponses/les-formalites-d-entree-a-la-reunion/ (lu le 25/10/2026)"},{"id":"distances","exemples":{"fr":["c'est loin de Saint-Denis ?","temps pour aller au volcan","combien de km","route des Tamarins ?"],"en":[],"de":["Wie weit ist es vom Flughafen?"]},"mots_ancres":["combien de km:8","combien de kilometres:8","how many km:8","wie viele km:8","temps de trajet:8","bouchons:6","tamarins:6","trafic:4","saint denis:4","volcan:3","maido:4"],"suggestions":["airport","voiture","autour"],"actions":["tel:reception"],"statut":"valide","topic":{"fr":"Distances et temps de trajet","en":"Distances and travel times","de":"Entfernungen und Fahrzeiten"},"reponse":{"fr":"Ordres de grandeur (calcul d’itinéraire, sans trafic) : aéroport Roland-Garros → Saint-Leu centre ≈ 58 km, 1 h ; → Grande Anse (Petite-Île) ≈ 98 km, 1 h 20. Pierrefonds (Saint-Pierre) → Saint-Leu ≈ 28 km, 30 min ; → Grande Anse ≈ 20 km, 25 min. Saint-Leu ↔ Saint-Pierre ≈ 32 km, 25 min ; Grande Anse ↔ Saint-Pierre ≈ 11 km, 15 min. Saint-Leu → Maïdo ≈ 38 km, 1 h ; Grande Anse → Pas de Bellecombe (volcan) ≈ 59 km, 1 h 30. Selon la circulation. Distances officielles de l’hôtel : environ 1 h 30 de Roland-Garros et 25 min de Pierrefonds.","en":"Rough orders of magnitude (route calculation, no traffic): Roland-Garros airport → Saint-Leu centre ≈ 58 km, 1 h; → Grande Anse (Petite-Île) ≈ 98 km, 1 h 20. Pierrefonds (Saint-Pierre) → Saint-Leu ≈ 28 km, 30 min; → Grande Anse ≈ 20 km, 25 min. Saint-Leu ↔ Saint-Pierre ≈ 32 km, 25 min; Grande Anse ↔ Saint-Pierre ≈ 11 km, 15 min. Saint-Leu → Maïdo ≈ 38 km, 1 h; Grande Anse → Pas de Bellecombe (volcano) ≈ 59 km, 1 h 30. Depending on traffic. Official distances from the hotel: about 1 h 30 from Roland-Garros and 25 min from Pierrefonds.","de":"Grobe Richtwerte (Routenberechnung, ohne Verkehr): Flughafen Roland-Garros → Saint-Leu Zentrum ≈ 58 km, 1 Std.; → Grande Anse (Petite-Île) ≈ 98 km, 1 Std. 20. Pierrefonds (Saint-Pierre) → Saint-Leu ≈ 28 km, 30 Min.; → Grande Anse ≈ 20 km, 25 Min. Saint-Leu ↔ Saint-Pierre ≈ 32 km, 25 Min.; Grande Anse ↔ Saint-Pierre ≈ 11 km, 15 Min. Saint-Leu → Maïdo ≈ 38 km, 1 Std.; Grande Anse → Pas de Bellecombe (Vulkan) ≈ 59 km, 1 Std. 30. Je nach Verkehr. Offizielle Entfernungen des Hotels: etwa 1 Std. 30 vom Flughafen Roland-Garros und 25 Min. von Pierrefonds."},"source":"calcul d’itinéraire OSRM / OpenStreetMap du 25/10/2026 (ordre de grandeur, sans trafic) ; distances officielles de l’hôtel : https://palm.re/hotel/ , https://www.iloha.fr/contact/"},{"id":"voiture","exemples":{"fr":["faut-il louer une voiture ?","permis étranger accepté ?","routes difficiles ?"],"en":["Do I need a rental car?"],"de":[]},"mots_ancres":["louer:7","location:6","louer une voiture:9","location scooter:9","scooter:7","rental car:8","mietwagen:8","conduit:6","conduire:6","permis:6","car jaune:7","bus:3","routes:4","carburant:5","drive:4","fahren:3","rent a car:8"],"suggestions":["parking","airport","distances"],"actions":[{"type":"lien","label":{"fr":"Transports en commun depuis l’aéroport","en":"Public transport from the airport","de":"Öffentlicher Verkehr ab Flughafen"},"url":"https://www.reunion.aeroport.fr/passagers/transports/transports-en-commun"},"tel:reception"],"statut":"valide","topic":{"fr":"Voiture et transports","en":"Car and transport","de":"Auto und Verkehr"},"reponse":{"fr":"Plusieurs options pour venir et explorer l’île : la voiture de location pour une totale liberté, le réseau de bus (Car Jaune, et Alterneo dans le Sud ; la ligne T relie l’aéroport à Saint-Pierre par la côte ouest), ou des navettes et transferts privés sur demande auprès de la réception. Au PALM : parking privé et service voiturier ; la conciergerie organise aussi vos excursions. On roule à droite avec le code de la route français ; les routes des Cirques et du Volcan sont sinueuses.","en":"Several options to get here and explore the island: a rental car for total freedom, the bus network (Car Jaune, and Alterneo in the South; line T links the airport to Saint-Pierre along the west coast), or shuttles and private transfers on request via reception. At PALM: private car park and valet service; the concierge also arranges your excursions. Traffic drives on the right under French road rules; the roads in the Cirques and to the volcano are winding.","de":"Mehrere Möglichkeiten für Anreise und Ausflüge: ein Mietwagen für maximale Freiheit, das Busnetz (Car Jaune und Alterneo im Süden; die Linie T verbindet den Flughafen mit Saint-Pierre über die Westküste) oder Shuttles und private Transfers auf Anfrage über die Rezeption. Im PALM: Privatparkplatz und Valet-Service; die Concierge organisiert auch Ihre Ausflüge. Es herrscht Rechtsverkehr nach französischen Verkehrsregeln; die Straßen in den Talkesseln und zum Vulkan sind kurvig."},"source":"https://www.reunion.aeroport.fr/passagers/transports/transports-en-commun ; https://palm.re/nous-contacter/ ; https://palm.re/hotel/"},{"id":"autour","exemples":{"fr":["que faire dans le coin ?","idées pour une journée","jours de pluie quoi faire","que visiter dans le sud","Grand Brûlé","marché de Saint-Pierre"],"en":["What is there to do nearby?"],"de":[]},"mots_ancres":["autour:6","alentour:6","a faire:4","visiter:6","visite:3","excursion:5","excursions:5","sortie:3","activites:3","things to do:7","nearby:5","sightseeing:6","unternehmen:6","umgebung:6","ausflug:6","ausfluege:6","volcan:5","langevin:4","grand brule:5","manapany:6","volcan comment y aller:7","avec enfants quoi faire:7","randonnees:3","jour de pluie:4","idees:3","dans le coin:6","pres de l hotel:4"],"suggestions":["tortues","rando","whales"],"actions":[{"type":"lien","label":{"fr":"Escapades autour du PALM","en":"Things to do around PALM","de":"Ausflüge rund um das PALM"},"url":"https://palm.re/evader/"},{"type":"mail","to":"conciergerie@palm.re","subject":{"fr":"Excursions","en":"Excursions","de":"Ausflüge"}}],"statut":"valide","topic":{"fr":"Que faire autour du PALM","en":"Things to do around PALM","de":"Ausflüge rund um das PALM"},"reponse":{"fr":"Via la conciergerie : Saga du Rhum, Domaine du Café Grillé, Kélonia, Jardin des Parfums, hélicoptère, volcan, tunnels de lave… avec des trajets de 20 min à 1 h. Dans le sud sauvage : le parc et la plage de Grande Anse, le bassin de Manapany, la route vers le Piton de la Fournaise (l’enclos a rouvert partiellement après l’éruption de février 2026 : vérifiez l’accès auprès de l’OVPF ou de la préfecture le jour même) et le marché forain de Saint-Pierre. Les activités sont réservables via la conciergerie.","en":"Via the concierge: Saga du Rhum, Domaine du Café Grillé, Kélonia, Jardin des Parfums, helicopter, volcano, lava tubes… with travel times from 20 min to 1 h. In the wild south: the Grande Anse park and beach, the Manapany basin, the road to the Piton de la Fournaise (the enclosure reopened partially after the February 2026 eruption: check access with the OVPF or the prefecture on the day), and the Saint-Pierre street market. Activities can be arranged through the concierge.","de":"Über die Concierge: Saga du Rhum, Domaine du Café Grillé, Kélonia, Jardin des Parfums, Hubschrauber, Vulkan, Lavatunnel … mit Fahrzeiten von 20 Min. bis 1 Std. Im wilden Süden: Park und Strand von Grande Anse, das Becken von Manapany, die Straße zum Piton de la Fournaise (die Zone wurde nach dem Ausbruch vom Februar 2026 teilweise wieder geöffnet: Zugang am selben Tag beim OVPF oder der Präfektur prüfen) und der Wochenmarkt von Saint-Pierre. Aktivitäten lassen sich über die Concierge organisieren."},"source":"https://palm.re/evader/ ; https://www.reunion.gouv.fr/Actualites/Communiques-de-presse/Piton-de-la-Fournaise-reouverture-partielle-de-l-enclos (lu le 25/10/2026)","prefere":true},{"id":"rando","exemples":{"fr":["on peut faire de la plongée ?","rando facile ?","randonnée volcan","sécurité en rando"],"en":["Can I go diving?"],"de":["Kann man tauchen?"]},"mots_ancres":["plongee:7","plonger:7","diving:7","dive:5","tauchen:7","randonnee:7","rando:7","randonner:7","hiking:7","hike:6","wandern:7","wanderung:7","wanderwege:7","sentier:5","sentiers:5","trail:5","trails:5","niveau:3","snorkeling accompagne:8","accompagne:3"],"suggestions":["autour","meteo","urgence"],"actions":[{"type":"lien","label":{"fr":"Vigilance Météo-France Réunion","en":"Météo-France weather alerts","de":"Météo-France Wetterwarnungen"},"url":"https://vigilance.meteofrance.fr/fr/la-reunion"},{"type":"mail","to":"conciergerie@palm.re","subject":{"fr":"Excursions","en":"Excursions","de":"Ausflüge"}}],"statut":"valide","topic":{"fr":"Plongée et randonnée","en":"Diving and hiking","de":"Tauchen und Wandern"},"reponse":{"fr":"La plongée est possible (la préfecture précise que plongée et pêche sous-marine restent autorisées, aux risques et périls de chacun) ; des clubs proposent baptêmes et plongées à Saint-Leu et Saint-Gilles. Pour la randonnée, partez tôt (ciel plus dégagé le matin), renseignez-vous sur la météo et ne marchez pas en pré-alerte ou alerte cyclonique. Je n’annonce ni tarif ni recommandation de prestataire : la réception ou la conciergerie vous oriente.","en":"Diving is possible (the prefecture states that diving and spearfishing remain authorised, at each person’s own risk); clubs offer introductory and regular dives in Saint-Leu and Saint-Gilles. For hiking, start early (clearer skies in the morning), check the weather and do not hike during a cyclone pre-alert or alert. I quote no prices and recommend no operator: reception or the concierge will guide you.","de":"Tauchen ist möglich (die Präfektur stellt klar, dass Tauchen und Speerfischen erlaubt bleiben, auf eigene Gefahr); Clubs bieten Schnupper- und reguläre Tauchgänge in Saint-Leu und Saint-Gilles an. Beim Wandern früh starten (morgens klarerer Himmel), das Wetter prüfen und bei Zyklon-Vorwarnung oder -Alarm nicht wandern. Ich nenne keine Preise und empfehle keinen Anbieter: Rezeption oder Concierge beraten Sie."},"source":"https://www.reunion.gouv.fr/Actualites/Communiques-de-presse/Activites-nautiques-en-mer-vigilance-face-au-risque-requins ; https://www.reunion.fr/organisez/informations-utiles-avant-de-voyager/climat/ (lu le 25/10/2026)"},{"id":"urgence","exemples":{"fr":["numéro d'urgence ?","pharmacie","secours en montagne","urgences enfant"],"en":[],"de":[]},"mots_ancres":["urgence:8","urgences:8","emergency:8","notfall:8","samu:9","pompiers:8","medecin:7","doctor:7","arzt:7","pharmacie:8","pharmacy:8","apotheke:8","hospital:8","krankenhaus:8","secours:7","112:6","15:2","police:4","malade:5","blesse:5"],"suggestions":["human","moustiques"],"actions":["tel:reception"],"statut":"valide","topic":{"fr":"Urgences et santé","en":"Emergencies and health","de":"Notfälle und Gesundheit"},"reponse":{"fr":"Urgences : SAMU 15, pompiers 18, police/gendarmerie 17 (numéros rappelés par reunion.fr). En cas d’urgence en montagne, appelez le 112. Pour un médecin ou une pharmacie de garde, la réception vous aide, 24h/24.","en":"Emergencies: SAMU (medical) 15, fire brigade 18, police/gendarmerie 17 (numbers listed by reunion.fr). For an emergency in the mountains, call 112. For a doctor or an on-duty pharmacy, reception will help, around the clock.","de":"Notfälle: SAMU (Rettungsdienst) 15, Feuerwehr 18, Polizei/Gendarmerie 17 (von reunion.fr genannte Nummern). Bei einem Notfall in den Bergen wählen Sie 112. Für Arzt oder Notdienstapotheke hilft Ihnen die Rezeption rund um die Uhr."},"source":"https://www.reunion.fr/organisez/conseils-de-voyage/questions-reponses/quelle-est-la-periode-des-cyclones-a-la-reunion/ ; https://fournaise.info/infos-pratiques/ (non officiel, à valider) (lu le 25/10/2026)","bonus":1.1},{"id":"taxe_sejour","exemples":{"fr":["la taxe de séjour est incluse ?","combien la taxe de séjour ?","tourist tax how much?"],"en":[],"de":[]},"mots_ancres":["taxe:8","taxe de sejour:10","sejour:2","kurtaxe:9","tourist tax:9","city tax:8","tax:5","steuer:5"],"suggestions":["annulation","paiement","price"],"actions":[{"type":"lien","label":{"fr":"Conditions générales de vente","en":"Terms and conditions","de":"Allgemeine Geschäftsbedingungen"},"url":"https://palm.re/conditions-generales-de-vente/"},"tel:reception"],"statut":"valide","topic":{"fr":"Taxe de séjour","en":"Tourist tax","de":"Kurtaxe"},"reponse":{"fr":"La taxe de séjour n’est pas incluse dans le prix de la chambre : elle est de 2,00 € par adulte et par jour (hôtel 5 étoiles), à régler au départ. Les mineurs en sont exonérés.","en":"The tourist tax is not included in the room rate: it is €2.00 per adult per day (5-star hotel), payable at departure. Minors are exempt.","de":"Die Kurtaxe ist im Zimmerpreis nicht enthalten: Sie beträgt 2,00 € pro Erwachsenem und Tag (5-Sterne-Hotel) und ist bei der Abreise zu zahlen. Minderjährige sind befreit."},"source":"https://palm.re/conditions-generales-de-vente/ (lu le 25/10/2026)","bonus":1.15 e/actualites/ ; https://palm.re/ (« En ce moment ») ; /actualites/saint-valentin-2026/ ; /actualites/fete-des-meres-2026/ ; /actualites/les-saveurs-des-iles-soeurs/ — lus le 27/10/2026","reponse":{"fr":"L’hôtel anime régulièrement ses restaurants. Dernières actualités publiées sur palm.re : la nouvelle carte du KAH Beach (une cuisine généreuse inspirée par La Réunion, imaginée par le chef Claude Pothin) ; « Les Saveurs des Îles Sœurs » au Makassar (5 juin 2026, rencontre des terroirs de La Réunion et de l’île Maurice) ; la fête des mères 2026 (31 mai, complet) ; le Nouvel An chinois (17 février 2026, année du Cheval de Feu) ; la Saint-Valentin 2026 (séjour romantique en semaine, accueil romantique, champagne en chambre). Je n’ai pas vu d’événement à venir publié à ce jour ; pour les fêtes de fin d’année, voir « Noël » ou « Nouvel An ».","en":"The hotel regularly hosts events in its restaurants. Latest news published on palm.re: the new KAH Beach menu (generous cuisine inspired by La Réunion, created by chef Claude Pothin); “Les Saveurs des Îles Sœurs” at Le Makassar (5 June 2026, bringing together the flavours of Réunion and Mauritius); Mother’s Day 2026 (31 May, fully booked); Chinese New Year (17 February 2026); Valentine’s Day 2026 (romantic midweek stay, romantic welcome, champagne in the room). I have not seen any upcoming event published to date; for the festive season, see “Christmas” or “New Year”.","de":"Das Hotel gestaltet seine Restaurants regelmäßig mit Events. Aktuellste Neuigkeiten auf palm.re: die neue Karte des KAH Beach (großzügige, von La Réunion inspirierte Küche von Küchenchef Claude Pothin); „Les Saveurs des Îles Sœurs“ im Makassar (5. Juni 2026, Begegnung der Küchen von La Réunion und Mauritius); Muttertag 2026 (31. Mai, ausgebucht); Chinesisches Neujahr (17. Februar 2026); Valentinstag 2026 (romantischer Aufenthalt unter der Woche, romantischer Empfang, Champagner im Zimmer). Bislang habe ich keine kommende Veranstaltung gesehen; für die Festtage siehe „Weihnachten“ oder „Silvester“."},"statut":"valide"},{"id":"occasion","exemples":{"fr":["je veux faire ma demande en mariage à l hôtel","demande en mariage","comment faire ma demande en mariage","surprise pour l anniversaire de ma compagne","surprise pour mon mari","faire une surprise à ma femme","surprise romantique","dîner romantique possible","dîner romantique possible ?","dîner romantique","dîner aux chandelles","bouteille de champagne en chambre","champagne en chambre","accueil romantique","décoration romantique de la chambre","fêter un anniversaire","fêter mon anniversaire à l hôtel","anniversaire à l hôtel","c est mon anniversaire","on fête un anniversaire","fêter nos 20 ans de couple","occasion spéciale","une occasion particulière","célébrer un événement à deux","survol en hélicoptère depuis l hôtel","hélicoptère romantique","gâteau d anniversaire","fleurs dans la chambre","personnaliser mon séjour","demande spéciale pour mon séjour","requête particulière","faire plaisir à ma femme","on fête nos 10 ans de mariage","anniversaire à l'hôtel","c'est mon anniversaire pendant le séjour","on célèbre nos noces d'argent","fêter un anniversaire de mariage"],"en":["can you arrange a surprise for my wife's birthday","surprise for my wife","marriage proposal at the hotel","how to propose at the hotel","romantic dinner","romantic dinner possible","champagne in the room","romantic welcome","birthday at the hotel","celebrate a birthday","special occasion","personalise my stay","special request for my stay","helicopter flight from the hotel","our wedding anniversary falls during the stay","it is my birthday during the stay"],"de":["überraschung zum geburtstag meiner frau","überraschung für meine frau","heiratsantrag im hotel","romantisches dinner","romantisches dinner möglich","champagner im zimmer","romantischer empfang","geburtstag im hotel feiern","besonderer anlass","meinen aufenthalt persönlich gestalten","sonderwunsch für meinen aufenthalt","hubschrauberflug ab dem hotel","wir feiern unseren hochzeitstag","ich habe während des aufenthalts geburtstag"]},"mots_ancres":["demande en mariage:3","heiratsantrag:6","marriage proposal:6","diner romantique:6","romantic dinner:6","romantisches dinner:6","accueil romantique:6","romantic welcome:6","champagne en chambre:6","champagne in the room:6","champagner im zimmer:6","anniversaire:3","birthday:5","geburtstag:5","occasion speciale:6","special occasion:6","besonderer anlass:6","chandelles:5","sonderwunsch:5","requete particuliere:5","ans de mariage:6","anniversaire de mariage:6","noces d argent:6","wedding anniversary:6","hochzeitstag:6","fete nos:4","anniversaire a l hotel:6","mon anniversaire:5","my birthday:5","-hochzeit:0"],"suggestions":["couple","honeymoon","gift"],"actions":[{"type":"mail","to":"conciergerie@palm.re","subject":{"fr":"Occasion spéciale","en":"Special occasion","de":"Besonderer Anlass"}},{"type":"lien","url":"https://offrir.palm.re","label":{"fr":"offrir.palm.re","en":"offrir.palm.re","de":"offrir.palm.re"}},"tel:reception"],"service":"Conciergerie","topic":{"fr":"Occasion spéciale, anniversaire, surprise","en":"Special occasion, birthday, surprise","de":"Besonderer Anlass, Geburtstag, Überraschung"},"source":"https://palm.re/offres-speciales/sejour-en-couple/ ; /actualites/saint-valentin-2026/ ; /se-ressourcer/ — lus le 27/10/2026","reponse":{"fr":"Pour une occasion spéciale, la conciergerie est là pour personnaliser votre séjour sur mesure. Pour les couples, l’hôtel cite notamment : accueil romantique, bouteille de champagne, dîner romantique, demande en mariage, survol de l’île en hélicoptère depuis l’hôtel. À Akéa Spa, le « Rituel des Jeunes Mariés » ou des soins en salle duo. Et pour surprendre, un coffret cadeau sur offrir.palm.re. Écrivez à la conciergerie avec la date et votre idée.","en":"For a special occasion, the concierge is there to tailor your stay. For couples, the hotel mentions in particular: romantic welcome, bottle of champagne, romantic dinner, marriage proposal, helicopter flight over the island from the hotel. At Akéa Spa, the “Newlyweds’ Ritual” or treatments in the duo room. And to surprise someone, a gift box at offrir.palm.re. Write to the concierge with the date and your idea.","de":"Für einen besonderen Anlass gestaltet die Concierge Ihren Aufenthalt nach Wunsch. Für Paare nennt das Hotel unter anderem: romantischer Empfang, Flasche Champagner, romantisches Dinner, Heiratsantrag, Hubschrauberrundflug über die Insel ab dem Hotel. Im Akéa Spa das „Ritual der Frischvermählten“ oder Behandlungen im Duo-Raum. Und zum Überraschen: eine Geschenkbox auf offrir.palm.re. Schreiben Sie der Concierge mit Datum und Ihrer Idee."},"statut":"valide","prefere":true},{"id":"conseil_sejour","exemples":{"fr":["vous me conseillez quelle chambre","quelle chambre me conseillez vous","quelle chambre choisir","quelle chambre choisir pour 2 adultes","quelle chambre pour deux","chambre à conseiller","conseil chambre","conseillez moi une chambre","je ne sais pas quelle chambre prendre","quelle chambre pour une famille avec 2 enfants","quelle chambre pour une famille","quelle chambre avec des ados","la chambre la plus luxueuse","chambre vue mer","meilleure vue de l hôtel","quelle catégorie de chambre prendre","que me conseillez vous pour un premier séjour","conseils pour mon séjour","conseillez moi","un conseil svp","vous me conseillez quoi","que me conseillez vous","je ne sais pas quoi choisir","aidez moi à choisir mon séjour","aide au choix","quel type de séjour me conseillez vous","quelle formule me conseillez vous"],"en":["which room would you recommend","which room should i choose","which room for two adults","which room for a family","which room with teenagers","room with private pool","what do you recommend","any advice for my stay","help me choose my stay","which room type do you advise","most luxurious room"],"de":["welches zimmer empfehlen sie","welches zimmer soll ich wählen","welches zimmer für zwei erwachsene","welches zimmer für eine familie","zimmer mit privatem pool","was empfehlen sie mir","beraten sie mich","helfen sie mir bei der auswahl","luxuriösestes zimmer"]},"mots_ancres":["conseillez:5","conseil chambre:6","empfehlung:5","aide au choix:6","help me choose:6"],"suggestions":["couple","rooms"],"actions":[{"type":"lien","url":"https://palm.re/sejourner/","label":{"fr":"Séjourner","en":"Stay","de":"Aufenthalt"}},"tel:reception","reserver"],"service":"Réception","topic":{"fr":"Quelle chambre choisir ?","en":"Which room to choose?","de":"Welches Zimmer wählen?"},"source":"https://palm.re/offres-speciales/sejour-en-couple/ ; /offres-speciales/offre-famille/ ; /offres-speciales/sejours-evenements-professionnels/ ; /sejourner/ — lus le 27/10/2026","reponse":{"fr":"Cela dépend de votre voyage ! En couple : une Suite ou un Lodge avec bain à remous sur la terrasse, ou un Pool Lodge avec piscine privative chauffée pour une expérience plus exclusive. En famille : la Suite (2 adultes + 2 enfants de moins de 12 ans + 1 bébé, ou 3 adultes + 1 bébé), ou pour des ados, 8 chambres Supérieures communicantes (34 m², terrasse), sur demande selon disponibilités. Séjour professionnel : tarifs préférentiels via le service commercial. Dites-moi qui voyage et je vous oriente ; la réception affine selon vos dates et le détail des chambres est sur la page Séjourner :","en":"It depends on your trip! As a couple: a Suite or a Lodge with a whirlpool on the terrace, or a Pool Lodge with a private heated pool for a more exclusive experience. As a family: the Suite (2 adults + 2 children under 12 + 1 baby, or 3 adults + 1 baby), or for teenagers, 8 connecting Superior rooms (34 m², terrace), on request subject to availability. Business stay: preferential rates via the sales team. Tell me who is travelling and I will guide you; reception can refine according to your dates, and room details are on the Stay page:","de":"Das hängt von Ihrer Reise ab! Als Paar: eine Suite oder eine Lodge mit Whirlpool auf der Terrasse oder eine Pool Lodge mit privatem beheiztem Pool für ein exklusiveres Erlebnis. Als Familie: die Suite (2 Erwachsene + 2 Kinder unter 12 + 1 Baby oder 3 Erwachsene + 1 Baby) oder für Jugendliche 8 verbundene Superior-Zimmer (34 m², Terrasse), auf Anfrage je nach Verfügbarkeit. Geschäftsaufenthalt: Vorzugspreise über das Verkaufsteam. Sagen Sie mir, wer reist, dann berate ich Sie; die Rezeption präzisiert nach Ihren Daten, und Details zu den Zimmern stehen auf der Seite Aufenthalt:"},"statut":"valide"},{"id":"points_forts","exemples":{"fr":["c est quoi le mieux chez vous","c quoi le mieux chez vous","le mieux chez vous","le plus de votre hôtel","qu est ce qui est bien chez vous","pourquoi choisir votre hôtel","pourquoi venir chez vous","pourquoi venir chez vous plutôt qu ailleurs","pourquoi vous plutôt qu un autre hôtel","qu est ce qui vous différencie","qu est ce qui vous différencie des autres hôtels","ce qui vous rend unique","vos points forts","vos points forts ?","vos atouts","les atouts de l hôtel","ce que vous avez de mieux","ce que vous avez de spécial","que faire sur place à l hôtel","dites m en plus sur l hôtel","dites moi en plus","parlez moi de l hôtel","présentez moi l hôtel","présentation de l hôtel","présentez vous","décrivez l hôtel","racontez moi l hôtel","c est comment chez vous","c est comment l hôtel","qu est ce qu on y trouve","qu est ce qu il y a dans l hôtel","quels sont les atouts du palm","ça vaut le coup ?","que me conseillez vous de faire sur place"],"en":["what makes your hotel unique","what is the best thing about your hotel","why choose your hotel","why should i choose you","why come to your hotel rather than another","what sets you apart","your strengths","tell me more about the hotel","tell me about the hotel","describe the hotel","what is it like","highlights of the hotel","what makes your hotel special"],"de":["was zeichnet ihr hotel aus","was ist das beste an ihrem hotel","warum sollte ich ihr hotel wählen","
