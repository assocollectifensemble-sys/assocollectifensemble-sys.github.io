res et 45 optionnels) : l’hôtel a obtenu 6 points optionnels de plus qu’à l’audit précédent, sans aucune non-conformité. L’auditrice a salué notamment la lutte contre le gaspillage alimentaire (le buffet du samedi soir remplacé par un espace live cooking) et un compteur d’eau installé sur le jacuzzi extérieur. Pour la validité à ce jour, l’équipe vous confirme avec plaisir.","en":"The PALM was the first hotel in Réunion to obtain the EU Ecolabel “Tourist accommodation services” (in 2014), and the first in the French overseas territories. The certification is reassessed every two years by AFNOR and has been renewed several times. At the 2019 audit, the specification had 67 criteria (22 mandatory and 45 optional): the hotel earned 6 more optional points than at the previous audit, with no non-conformity at all. The auditor particularly praised the fight against food waste (the Saturday evening buffet replaced by a live cooking area) and a water meter installed on the outdoor jacuzzi. For its current validity, the team will gladly confirm.","de":"Das PALM war das erste Hotel der Réunion mit dem EU-Umweltzeichen „Touristische Beherbergungsdienstleistungen“ (2014) und das erste der französischen Überseegebiete. Die Zertifizierung wird alle zwei Jahre von der AFNOR neu bewertet und wurde mehrfach erneuert. Beim Audit 2019 umfasste der Kriterienkatalog 67 Kriterien (22 verpflichtende und 45 optionale): Das Hotel erzielte 6 optionale Punkte mehr als beim vorigen Audit, ganz ohne Abweichung. Die Auditorin lobte unter anderem den Kampf gegen Lebensmittelverschwendung (das Samstagabend-Buffet wurde durch einen Live-Cooking-Bereich ersetzt) und einen Wasserzähler am Außen-Jacuzzi. Zur aktuellen Gültigkeit bestätigt Ihnen das Team gern."}},{"id":"eco_actions","exemples":{"fr":["qu est ce que vous faites pour l environnement","actions ecologiques de l hotel","gourmet bag c est quoi","doggy bag au restaurant","on peut emporter ce qu on n a pas fini","emballages biodegradables","energie solaire a l hotel","tri des dechets","eau en bouteille en verre","produits chimiques pour le menage","programme bungalow","economies d energie","prix entreprises et environnement","produits locaux au restaurant","circuit court","vous etes ecolo ?","hotel durable","on peut emporter les restes du repas ?","que faites-vous contre le gaspillage alimentaire"],"en":["what do you do for the environment","eco actions of the hotel","what is the gourmet bag","doggy bag at the restaurant","can i take leftovers home","biodegradable packaging","solar energy at the hotel","waste sorting","glass water bottles","bungalow programme","energy saving","local products in the restaurants","is the hotel sustainable"],"de":["was tut das hotel für die umwelt","umweltmaßnahmen des hotels","was ist die gourmet bag","reste mit nach hause nehmen","biologisch abbaubare verpackung","solarenergie im hotel","mülltrennung","wasser in glasflaschen","bungalow programm","energiesparen","regionale produkte im restaurant","ist das hotel nachhaltig"]},"mots_ancres":["gourmet bag:5","doggy bag:5","emporter:2","leftovers:3","biodegradable:4","biologisch:3","compostable:4","canne a sucre:3","solaire:3","solar:3","solarenergie:3","tri:2","dechets:3","waste:2","bungalow:4","energie:2","energy:2","environnement:2","environment:2","umwelt:2","durable:2","sustainable:2","nachhaltig:2","ecolo:3","circuit court:3","bouteille en verre:4","gaspillage:5","food waste:5","verschwendung:5","lebensmittelverschwendung:5"],"suggestions":["eco","points_forts"],"actions":[],"service":"Environnement","source":"https://palm.re/actualites/renouvellement-certification-ecolabel-europeen/ ; https://palm.re/blog/environnement/gourmet-bag-gaspillage-alimentaire/ ; https://palm.re/blog/environnement/programme-bungalow-eco-responsable/ ; https://palm.re/blog/hotel-blog/15-ans-palm-hotel-spa/ (lu le 27/10/2026)","topic":{"fr":"Actions éco-responsables concrètes","en":"Concrete eco-responsible actions","de":"Konkrete Umweltmaßnahmen"},"reponse":{"fr":"Parmi les actions publiées : réduction des consommations d’eau et d’énergie, tri et réduction des déchets, produits alimentaires locaux en circuits courts, énergie solaire, nettoyage à la vapeur sans produits chimiques et eau microfiltrée servie en bouteille en verre. Depuis 2017, les restaurants proposent le Gourmet bag (sac à emporter pour finir son repas), dans des contenants 100 % biodégradables et compostables à base de canne à sucre. L’hôtel participe aussi au programme d’économies d’énergie BUNGALOW (audit énergétique, préconisations, puis formations pour les équipes et les clients) avec 30 hôtels de La Réunion et de Mayotte, et a reçu en 2015 le « Prix Entreprises et Environnement ».","en":"Published actions include: reduced water and energy consumption, waste sorting and reduction, local food products via short supply chains, solar energy, steam cleaning without chemicals and microfiltered water served in glass bottles. Since 2017 the restaurants have offered the Gourmet bag (a take-away bag to finish your meal at home), in 100% biodegradable and compostable containers made from sugar cane. The hotel also takes part in the BUNGALOW energy-saving programme (energy audit, recommendations, then training for teams and guests) with 30 hotels in Réunion and Mayotte, and received the “Prix Entreprises et Environnement” in 2015.","de":"Zu den veröffentlichten Maßnahmen gehören: geringerer Wasser- und Energieverbrauch, Mülltrennung und -reduzierung, regionale Lebensmittel aus kurzen Lieferketten, Solarenergie, Dampfreinigung ohne Chemie und mikrogefiltertes Wasser in Glasflaschen. Seit 2017 bieten die Restaurants die Gourmet Bag an (Take-away-Beutel, um das Essen zu Hause zu beenden), in 100 % biologisch abbaubaren und kompostierbaren Behältern aus Zuckerrohr. Das Hotel nimmt außerdem am Energiesparprogramm BUNGALOW teil (Energieaudit, Empfehlungen, dann Schulungen für Teams und Gäste) mit 30 Hotels der Réunion und Mayottes und erhielt 2015 den „Prix Entreprises et Environnement“."}},{"id":"eco_partenaires","exemples":{"fr":["c est quoi badula","l hotel soutient quelle association","partenariat avec le parc national","ti tang recup","mit welchen vereinen","globice et l hotel","association de protection de la biodiversite","flore locale a l hotel","plantes endemiques dans le jardin","recyclage des textiles","engagement social de l hotel","colloque des hotels certifies","associations locales soutenues par le palm","l hotel protege la nature ?"],"en":["what is badula","which associations does the hotel support","partnership with the national park","ti tang recup","globice and the hotel","biodiversity protection","local flora at the hotel","textile recycling","social commitment of the hotel","local associations supported by the palm"],"de":["was ist badula","welche vereine unterstützt das hotel","partnerschaft mit dem nationalpark","ti tang récup","globice und das hotel","schutz der biodiversität","einheimische flora im hotel","textilrecycling","soziales engagement des hotels","mit welchen vereinen arbeitet das hotel zusammen"]},"mots_ancres":["badula:5","globice:5","ti tang:5","tang recup:5","parc national:4","national park:4","nationalpark:4","biodiversite:4","biodiversity:4","biodiversitat:4","flore:3","flora:3","association:3","associations:3","verein:3","vereine:4","vereinen:4","textiles:3","colloque:3"],"suggestions":["eco","points_forts"],"actions":[],"service":"Environnement","source":"https://palm.re/blog/hotel-blog/palm-hotel-spa-engagement-renforce-avec-badula/ ; https://palm.re/actualites/renouvellement-certification-ecolabel-europeen/ ; https://palm.re/blog/environnement/programme-bungalow-eco-responsable/ (lu le 27/10/2026)","topic":{"fr":"Partenaires environnement et sociaux (Badula, Ti Tang Récup, Globice)","en":"Environmental and social partners (Badula, Ti Tang Récup, Globice)","de":"Umwelt- und Sozialpartner (Badula, Ti Tang Récup, Globice)"},"reponse":{"fr":"Le PALM a rejoint l’association Badula, qui œuvre pour la préservation de la biodiversité réunionnaise et de la flore locale, en réunissant paysagistes, pépiniéristes, botanistes et passionnés ; cette adhésion s’inscrit dans une démarche environnementale menée depuis près de vingt ans. L’hôtel collabore aussi avec Ti Tang Récup, un atelier chantier d’insertion qui donne une seconde vie aux textiles usagés, avec le Parc national pour la valorisation du patrimoine et avec Globice, via un site d’observation des cétacés. Il a de plus organisé le premier colloque des hôtels certifiés de La Réunion, réunissant sept établissements autour des bonnes pratiques.","en":"The PALM has joined the Badula association, which works to preserve Réunion’s biodiversity and local flora by bringing together landscapers, nurserymen, botanists and nature enthusiasts; this membership is part of an environmental approach pursued for almost twenty years. The hotel also works with Ti Tang Récup, a work-integration workshop that gives used textiles a second life, with the national park to promote the heritage, and with Globice through a cetacean observation site. It also organised the first conference of certified hotels in Réunion, bringing together seven establishments to share good practice.","de":"Das PALM ist der Vereinigung Badula beigetreten, die sich für den Erhalt der Biodiversität und der lokalen Flora der Réunion einsetzt und Landschaftsgärtner, Baumschulen, Botaniker und Naturfreunde zusammenbringt; der Beitritt gehört zu einem Umweltengagement, das seit fast zwanzig Jahren besteht. Das Hotel arbeitet außerdem mit Ti Tang Récup (einer Integrationswerkstatt, die gebrauchten Textilien ein zweites Leben gibt), mit dem Nationalpark zur Aufwertung des Erbes und mit Globice über einen Beobachtungsort für Wale und Delfine zusammen. Zudem organisierte es die erste Konferenz der zertifizierten Hotels der Réunion mit sieben Häusern."}},{"id":"evader_culture","exemples":{"fr":["ou gouter du rhum pres de l hotel","visite de distillerie","saga du rhum duree","visiter une plantation de cafe","vanille bleue visite","escale bleue c est loin","kelonia combien de temps de trajet","musee de villele","jardin des parfums et des epices","jardin botanique des mascarins","visite culturelle a faire","que visiter quand il pleut","sorties culture et patrimoine","combien de temps pour aller au conservatoire botanique","cafe bourbon pointu","degustation de rhum isautier","histoire de l esclavage musee","visite avec les tortues"],"en":["where to taste rum near the hotel","distillery visit","how long is the saga du rhum","visit a coffee plantation","blue vanilla visit","how far is the escale bleue","travel time to kelonia","villèle museum","spice and perfume garden","mascarin botanical garden","cultural visits to do","what to visit when it rains","bourbon pointu coffee","isautier rum tasting"],"de":["wo kann ich in der nähe rum probieren","besuch einer brennerei","wie lange dauert die saga du rhum","kaffeeplantage besichtigen","besuch der blauen vanille","wie weit ist die escale bleue","fahrzeit nach kélonia","musée de villèle","gewürz- und duftgarten","botanischer garten mascarin","kulturelle ausflüge","was besichtigen bei regen"]},"mots_ancres":["saga du rhum:5","distillerie:4","distillery:4","brennerei:4","isautier:5","cafe grille:5","bourbon pointu:5","escale bleue:5","vanille:4","vanilla:4","vanille bleue:5","kelonia:5","villele:5","jardin des parfums:5","epices:3","mascarins:5","mascarin:5","conservatoire:4","botanique:3","botanical:3","botanischer:3","musee:3","museum:3","culture:2","visite:2"],"suggestions":["concierge","autour","rando"],"actions":["tel:reception"],"service":"Conciergerie","source":"https://palm.re/evader/ (lu le 27/10/2026)","topic":{"fr":"Visites culturelles et dégustations autour de l’hôtel","en":"Cultural visits and tastings around the hotel","de":"Kulturelle Ausflüge und Verkostungen in der Umgebung"},"reponse":{"fr":"La page « S’évader » propose, avec les conseils de la conciergerie : la Saga du Rhum (parcours sensoriel dans l’ancienne distillerie, dégustation Isautier, environ 1h15) ; le Domaine du Café Grillé (histoire des grandes cultures et du café Bourbon Pointu, environ 1h30, 25 min depuis l’hôtel) ; l’Escale Bleue (visite de l’exploitation de vanille bleue, environ 45 min, 1h depuis l’hôtel) ; Kélonia, l’observatoire des tortues marines (environ 1h, 40 min depuis l’hôtel) ; le Musée de Villèle (environ 1h, 50 min) ; le Jardin des Parfums et des Épices (1 500 espèces végétales, environ 1h30, 40 min) ; et le Conservatoire botanique des Mascarins (plus de 4 hectares, environ 1h, 45 min). La conciergerie vous aide à organiser chaque visite.","en":"The “Escape” page suggests, with the concierge’s advice: the Saga du Rhum (sensory tour of the former distillery, Isautier tasting, about 1h15); the Domaine du Café Grillé (history of the island’s great crops and Bourbon Pointu coffee, about 1h30, 25 min from the hotel); the Escale Bleue (visit of the blue vanilla farm, about 45 min, 1h from the hotel); Kélonia, the sea turtle observatory (about 1h, 40 min from the hotel); the Villèle Museum (about 1h, 50 min); the Jardin des Parfums et des Épices (1,500 plant species, about 1h30, 40 min); and the Mascarin Botanical Conservatory (over 4 hectares, about 1h, 45 min). The concierge helps you organise each visit.","de":"Die Seite „Entdecken“ schlägt mit Rat der Concierge vor: die Saga du Rhum (Sinnesparcours in der ehemaligen Brennerei, Isautier-Verkostung, ca. 1:15 Std.); den Domaine du Café Grillé (Geschichte der großen Kulturen und des Kaffees Bourbon Pointu, ca. 1:30 Std., 25 Min. vom Hotel); die Escale Bleue (Besuch der Blauen-Vanille-Plantage, ca. 45 Min., 1 Std. vom Hotel); Kélonia, das Meeresschildkröten-Observatorium (ca. 1 Std., 40 Min. vom Hotel); das Musée de Villèle (ca. 1 Std., 50 Min.); den Jardin des Parfums et des Épices (1.500 Pflanzenarten, ca. 1:30 Std., 40 Min.); und das Botanische Konservatorium Mascarin (über 4 Hektar, ca. 1 Std., 45 Min.). Die Concierge hilft bei der Organisation."}},{"id":"evader_aventure","exemples":{"fr":["faire du canyoning","canyoning pour debutants","tour en land rover","visite guidee en 4x4 a la journee","excursion avec un guide","olivier le guide","activite aventure","descente en rappel et tyrolienne","activite sportive a la reunion","toboggans naturels dans les rivieres","canyonning","journee decouverte de l ile avec guide"],"en":["canyoning for beginners","land rover tour","full day guided 4x4 tour","excursion with a guide","adventure activities","abseiling and zip line","sporty activities in reunion","natural slides in the rivers","guided day to discover the island"],"de":["canyoning für anfänger","land rover tour","ganztägige geführte 4x4 tour","ausflug mit guide","abenteueraktivitäten","abseilen und seilrutsche","sportliche aktivitäten auf der réunion","natürliche rutschen in den flüssen","geführter tag zur entdeckung der insel","kann die concierge ein canyoning organisieren"]},"mots_ancres":["canyoning:5","canyonning:5","land rover:5","4x4:4","guide:3","rappel:4","abseilen:4","tyrolienne:4","zip line:4","seilrutsche:4","aventure:3","adventure:3","abenteuer:3","sportive:2","excursion:3","ausflug:3"],"suggestions":["concierge","autour","rando"],"actions":["tel:reception"],"service":"Conciergerie","source":"https://palm.re/evader/ (lu le 27/10/2026)","topic":{"fr":"Aventure : visites guidées en Land Rover et canyoning","en":"Adventure: guided Land Rover tours and canyoning","de":"Abenteuer: geführte Land-Rover-Touren und Canyoning"},"reponse":{"fr":"Côté aventure, la conciergerie vous met en relation avec des prestataires : une journée de visite guidée à bord d’un Land Rover Discovery, au départ de l’hôtel, avec Olivier, guide natif et passionné, pour découvrir les paysages, l’histoire et les spécialités culinaires de l’île ; et le canyoning, dans les rivières et cascades de La Réunion (descentes en rappel, tyroliennes, toboggans naturels), adapté aux débutants comme aux sportifs expérimentés. Pour réserver, contactez la conciergerie ou la réception.","en":"For adventure, the concierge puts you in touch with providers: a full-day guided tour aboard a Land Rover Discovery, departing from the hotel, with Olivier, a native and passionate guide, to discover the landscapes, history and culinary specialities of the island; and canyoning in Réunion’s rivers and waterfalls (abseiling, zip lines, natural slides), suitable for beginners and experienced sportspeople alike. To book, contact the concierge or reception.","de":"Für Abenteuerlustige vermittelt die Concierge Anbieter: eine ganztägige geführte Tour im Land Rover Discovery ab dem Hotel mit Olivier, einem gebürtigen und leidenschaftlichen Guide, zu Landschaften, Geschichte und kulinarischen Spezialitäten der Insel; und Canyoning in den Flüssen und Wasserfällen der Réunion (Abseilen, Seilrutschen, natürliche Rutschen), für Anfänger wie erfahrene Sportler geeignet. Zur Buchung wenden Sie sich an die Concierge oder die Rezeption."}},{"id":"famille_sorties","exemples":{"fr":["que faire avec des enfants a la reunion","sortie en famille","parc aquatique pres de l hotel","accrobranche pour enfants","acroroc","balade a cheval enfant","a partir de quel age le cheval","akoatys","croc parc","cite du volcan avec enfants","observer les etoiles","labyrinthe en champ the","tunnels de lave en famille","activites pour ados","ou amener les enfants quand il pleut","randonnee facile avec des enfants","parc d aventure a quelle distance","où emmener les enfants en dehors de l'hôtel"],"en":["what to do with children in reunion","family outing","water park near the hotel","adventure park for kids","acroroc","horse riding for children","from what age can children ride","akoatys","croc parc","cite du volcan with kids","stargazing","tea field maze","lava tubes for families","activities for teenagers","easy hike with children","family outings near the hotel"],"de":["was kann man mit kindern auf  required); the Acroroc adventure park, 15 minutes by car (5 courses, 40 games and zip lines, children from 1.30 m); the Cité du Volcan; lava tubes with a guide; the Labyrinthe en champ thé; the Akoatys water park in Étang-Salé; stargazing at Les Makes; and Croc Parc (playground, mini-golf, slides). The concierge helps you choose and book.","de":"Die Concierge hat 10 Ideen für Familienausflüge zusammengestellt, zum Beispiel: die leichte Runde von etwa 1 Stunde zum Piton de Grande Anse ab Petite-Île; Reiten bei den Eldorado-Ställen in Étang-Salé (ab 8 Jahren, Reservierung erforderlich); der Hochseilgarten Acroroc, 15 Autominuten entfernt (5 Parcours, 40 Spiele und Seilrutschen, Kinder ab 1,30 m); die Cité du Volcan; Lavatunnel mit Guide; das Labyrinthe en champ thé; der Wasserpark Akoatys in Étang-Salé; Sternbeobachtung in Les Makes; und Croc Parc (Spielplatz, Minigolf, Rutschen). Die Concierge hilft bei Auswahl und Buchung."}},{"id":"petite_ile","exemples":{"fr":["que faire a petite ile","activites autour de grande anse","verger d antan","comment visiter le verger d antan","fete de l ail","quand a lieu la fete de l ail","pique nique a grand anse","randonnee piton de grande anse","cueillette d agrumes","saison des agrumes","sortie dans les hauts de petite ile","barbecue sur la plage de grand anse","ya des snacks pres de la plage","ou voir le coucher de soleil"],"en":["what to do in petite ile","activities around grand anse","verger d antan","how to visit the verger d antan","garlic festival","when is the garlic festival","picnic at grand anse","piton de grande anse hike","citrus picking","where to watch the sunset"],"de":["was kann man in petite-île machen","aktivitäten rund um grand anse","verger d antan","wie besucht man den verger d antan","knoblauchfest","wann findet das knoblauchfest statt","picknick in grand anse","wanderung piton de grande anse","zitrusernte","wo sieht man den sonnenuntergang"]},"mots_ancres":["petite ile:4","petite-ile:4","verger:5","antan:5","fete de l ail:5","ail:3","garlic:4","knoblauch:4","piton:3","agrumes:4","citrus:4","zitrus:4","pique nique:3","picnic:3","picknick:3","barbecue:3"],"suggestions":["autour","baignade","rando"],"actions":["tel:reception"],"service":"Conciergerie","source":"https://palm.re/blog/hotel-blog/que-faire-a-petite-ile/ ; https://palm.re/blog/incontournables/10-activites-famille-vacances-ile-reunion/ (lu le 27/10/2026)","topic":{"fr":"Autour de l’hôtel : Petite-Île, Grand’Anse, Verger d’Antan, Fête de l’Ail","en":"Around the hotel: Petite-Île, Grand’Anse, Verger d’Antan, Garlic Festival","de":"In der Umgebung: Petite-Île, Grand’Anse, Verger d’Antan, Knoblauchfest"},"reponse":{"fr":"À Petite-Île, la plage de Grand’Anse offre promenade sur le littoral, aires de pique-nique avec barbecues, snacks et coucher de soleil ; on se baigne dans le bassin naturel délimité par des rochers (la baignade hors du bassin est déconseillée). La randonnée du Piton de Grande Anse est une boucle d’environ 1h. Le Verger d’Antan, jardin du patrimoine végétal réunionnais, se visite le mercredi et le samedi sur réservation (environ 1h30, 3 €, 0262 41 54 24 ou 0692 82 04 90). La Fête de l’Ail a lieu chaque année fin octobre au Domaine du Relais (la 34e édition s’est tenue du 24 au 26 octobre 2025, entrée libre). Entre juillet et octobre, les hauts de Petite-Île sont aussi la saison des agrumes.","en":"In Petite-Île, Grand’Anse beach offers a coastal walk, picnic areas with barbecues, snacks and sunsets; you can swim in the natural pool bounded by rocks (swimming outside the pool is not recommended). The Piton de Grande Anse hike is a loop of about 1 hour. The Verger d’Antan, a garden of Réunion’s plant heritage, can be visited on Wednesdays and Saturdays by reservation (about 1h30, €3, +262 262 41 54 24 or +262 692 82 04 90). The Garlic Festival takes place every year at the end of October at the Domaine du Relais (the 34th edition was held from 24 to 26 October 2025, free admission). Between July and October the heights of Petite-Île are also citrus season.","de":"In Petite-Île bietet der Strand von Grand’Anse Spaziergänge an der Küste, Picknickplätze mit Grills, Snacks und Sonnenuntergänge; man badet im natürlichen, von Felsen begrenzten Becken (Baden außerhalb des Beckens wird nicht empfohlen). Die Wanderung zum Piton de Grande Anse ist eine Runde von etwa 1 Stunde. Der Verger d’Antan, ein Garten des pflanzlichen Erbes der Réunion, kann mittwochs und samstags nach Reservierung besucht werden (ca. 1:30 Std., 3 €, +262 262 41 54 24 oder +262 692 82 04 90). Das Knoblauchfest (Fête de l’Ail) findet jedes Jahr Ende Oktober im Domaine du Relais statt (die 34. Ausgabe lief vom 24. bis 26. Oktober 2025, freier Eintritt). Zwischen Juli und Oktober ist in den Höhen von Petite-Île außerdem Zitrusfrüchte-Saison."}},{"id":"sud_sauvage","exemples":{"fr":["cap mechant","cap jaune randonnee","foret de mare longue","cascade langevin","manapany les bains piscine naturelle","lezard vert de manapany","plantation de the de grand coude","maison du curcuma","meme riviere","vanille bleue ou en acheter","ou voir des pailles en queue","combien de temps pour le cap jaune","baignade cascade langevin"],"en":["cap mechant","cap jaune hike","mare longue forest","langevin waterfall","manapany natural pool","green gecko of manapany","tea plantation grand coude","maison du curcuma","where to buy blue vanilla","where to see tropicbirds","how long is the cap jaune walk","coastal walk ideas in the south","is the langevin waterfall worth visiting"],"de":["cap méchant","wanderung zum cap jaune","wald von mare longue","langevin wasserfall","naturbecken von manapany","grüner gecko von manapany","teeplantage grand coude","maison du curcuma","wo kauft man blaue vanille","wo sieht man tropikvögel","wie lange dauert der weg zum cap jaune"]},"mots_ancres":["wild south:5","cap mechant:5","cap jaune:5","mare longue:5","langevin:5","curcuma:5","meme riviere:5","grand coude:4","paille en queue:4","pailles en queue:4","tropicbird:4","lezard vert:4","gecko:4","saint philippe:3","vincendo:4"],"suggestions":["autour","concierge","rando"],"actions":["tel:reception"],"service":"Conciergerie","source":"https://palm.re/blog/incontournables/10-idees-sorties-sud-sauvage-reunion/ (lu le 27/10/2026)","topic":{"fr":"Sorties dans le Sud sauvage","en":"Outings in the Wild South","de":"Ausflüge im wilden Süden"},"reponse":{"fr":"Le blog propose 10 idées de sorties dans le Sud sauvage : pique-nique ou coucher de soleil à Grande Anse (forte houle, baignade déconseillée hors zone), forêt primaire de Mare Longue à Saint-Philippe, falaises du Cap Jaune (sentier plat de 1h à 1h30 aller-retour depuis la marine de Vincendo) et du Cap Méchant, cascade Langevin (baignade ou canyoning avec un prestataire recommandé), piscine naturelle de Manapany-les-Bains et son lézard vert endémique, Jardin des Parfums et des Épices (visite guidée d’1h30), plantation de thé du Labyrinthe en champ thé (à 1 100 m d’altitude), tunnels de lave, vanille bleue et Maison du Curcuma de Mémé Rivière. La conciergerie vous conseille sur chaque sortie.","en":"The blog suggests 10 outings in the Wild South: picnic or sunset at Grande Anse (strong swell, swimming discouraged outside the designated area), the Mare Longue primary forest in Saint-Philippe, the cliffs of Cap Jaune (flat trail of 1h to 1h30 round trip from the Vincendo marina) and Cap Méchant, the Langevin waterfall (swimming or canyoning with a recommended provider), the natural pool of Manapany-les-Bains and its endemic green gecko, the Jardin des Parfums et des Épices (1h30 guided tour), the tea plantation of the Labyrinthe en champ thé (at 1,100 m altitude), lava tubes, blue vanilla and Mémé Rivière’s Maison du Curcuma. The concierge advises you on each outing.","de":"Der Blog schlägt 10 Ausflüge im wilden Süden vor: Picknick oder Sonnenuntergang in Grande Anse (starke Dünung, Baden außerhalb der Zone nicht empfohlen), der Primärwald Mare Longue in Saint-Philippe, die Klippen von Cap Jaune (flacher Pfad, 1 bis 1:30 Std. hin und zurück ab dem Hafen Vincendo) und Cap Méchant, der Langevin-Wasserfall (Baden oder Canyoning mit empfohlenem Anbieter), das natürliche Becken von Manapany-les-Bains mit seinem endemischen grünen Gecko, der Jardin des Parfums et des Épices (1:30 Std. Führung), die Teeplantage des Labyrinthe en champ thé (auf 1.100 m Höhe), Lavatunnel, blaue Vanille und das Maison du Curcuma von Mémé Rivière. Die Concierge berät Sie zu jedem Ausflug."}},{"id":"actu_sakifo","exemples":{"fr":["c est quand le sakifo","sakifo musik festival","festival de musique a la reunion","sakifo 2026","ou se passe le sakifo","combien de spectateurs au sakifo","sejour pendant le sakifo","festival pres de l hotel","sakifo c est loin de l hotel","concert maloya"],"en":["when is the sakifo","sakifo music festival","music festival in reunion","sakifo 2026","where is the sakifo held","stay during the sakifo","festival near the hotel","maloya concert"],"de":["wann ist das sakifo","sakifo musik festival","musikfestival auf der réunion","sakifo 2026","wo findet das sakifo statt","aufenthalt während des sakifo","festival in der nähe des hotels"]},"mots_ancres":["sakifo:5","festival:4","maloya:4","sega:3","ravine blanche:5"],"suggestions":["animations","autour"],"actions":["tel:reception"],"service":"Conciergerie","source":"https://palm.re/blog/hotel-blog/sakifo/ (lu le 27/10/2026)","topic":{"fr":"Sakifo Musik Festival","en":"Sakifo Musik Festival","de":"Sakifo Musik Festival"},"reponse":{"fr":"Le Sakifo Musik Festival fait vibrer La Réunion au rythme des musiques du monde (séga, maloya, rock, reggae, chanson française, électro…). Créé en 2004 à Saint-Leu, il se tient aujourd’hui à Saint-Pierre, sur le site de La Ravine Blanche, qui peut accueillir jusqu’à 40 000 spectateurs. L’édition 2026 était annoncée du jeudi 4 au dimanche 7 juin 2026. Le blog de l’hôtel le recommande pour allier festival et séjour tout confort ; pour l’édition suivante, l’équipe vous renseigne.","en":"The Sakifo Musik Festival makes Réunion vibrate to world music (séga, maloya, rock, reggae, French song, electro…). Created in 2004 in Saint-Leu, it is now held in Saint-Pierre at La Ravine Blanche, which can host up to 40,000 spectators. The 2026 edition was announced from Thursday 4 to Sunday 7 June 2026. The hotel’s blog recommends combining the festival with a comfortable stay; for the next edition, the team can inform you.","de":"Das Sakifo Musik Festival bringt die Réunion mit Weltmusik zum Beben (Séga, Maloya, Rock, Reggae, Chanson, Elektro …). 2004 in Saint-Leu gegründet, findet es heute in Saint-Pierre auf dem Gelände La Ravine Blanche statt, das bis zu 40.000 Zuschauer fasst. Die Ausgabe 2026 war von Donnerstag, 4., bis Sonntag, 7. Juni 2026 angekündigt. Der Blog des Hotels empfiehlt, Festival und komfortablen Aufenthalt zu verbinden; zur nächsten Ausgabe informiert Sie das Team."}},{"id":"histoire_hotel","exemples":{"fr":["depuis quand l hotel existe","quand le palm a ouvert","le palm a quel age","qui possede l hotel","c est quoi hotels and co","qui a cree le palm","nanou et michel jam","histoire de l hotel","premier 5 etoiles du sud","les pool lodges existent depuis quand","lien entre le palm et l iloha","le palm et l iloha c est le meme groupe","ouvert en quelle annee","les 15 ans de l hotel","depuis quand le palm existe"],"en":["since when has the hotel existed","when did the palm open","how old is the palm","who owns the hotel","what is hotels and co","who created the palm","history of the hotel","first 5 star hotel in the south","since when do the pool lodges exist","link between the palm and the iloha","which year did it open"],"de":["seit wann gibt es das hotel","wann wurde das palm eröffnet","wie alt ist das palm","wem gehört das hotel","was ist hotels and co","wer hat das palm gegründet","geschichte des hotels","erstes 5-sterne-hotel im süden","seit wann gibt es die pool lodges","zusammenhang zwischen palm und iloha","in welchem jahr wurde es eröffnet"]},"mots_ancres":["histoire:4","history:4","geschichte:4","ouvert en:3","opened:3","eroffnet:3","hotels and co:5","hotels & co:5","proprietaire:4","owner:4","gehort:3","jam:3","fonde:3","created:2","15 ans:4","age:2","iloha:2"],"suggestions":["points_forts","stars"],"actions":[],"service":"Direction","source":"https://palm.re/blog/hotel-blog/15-ans-palm-hotel-spa/ (lu le 27/10/2026)","topic":{"fr":"Histoire du PALM et de Hotels & Co","en":"History of the PALM and Hotels & Co","de":"Geschichte des PALM und von Hotels & Co"},"reponse":{"fr":"Le PALM Hotel & Spa a ouvert en 2007 et a fêté ses 15 ans le 12 avril 2022 : c’est le premier hôtel 5 étoiles du Sud de l’île. Il appartient à Hotels & Co, créé par Nanou et Michel Jam, qui réunit le PALM Hotel & Spa 5*, l’ILOHA Seaview Hotel 3* (né en 1996), la marque de spa et de bien-être AKEA et la cave à vin en ligne Les Caves du PALM. Les cinq Pool Lodges ont été créés en 2021. La valeur commune : l’hospitalité, avec le souci du détail et de la personnalisation.","en":"The PALM Hotel & Spa opened in 2007 and celebrated its 15th anniversary on 12 April 2022: it is the first 5-star hotel in the south of the island. It belongs to Hotels & Co, created by Nanou and Michel Jam, which brings together the 5* PALM Hotel & Spa, the 3* ILOHA Seaview Hotel (born in 1996), the AKEA spa and wellness brand and the online wine cellar Les Caves du PALM. The five Pool Lodges were created in 2021. The shared value: hospitality, with attention to detail and personalisation.","de":"Das PALM Hotel & Spa wurde 2007 eröffnet und feierte am 12. April 2022 sein 15-jähriges Bestehen: Es ist das erste 5-Sterne-Hotel im Süden der Insel. Es gehört zu Hotels & Co, gegründet von Nanou und Michel Jam, zu dem das 5*-Hotel PALM Hotel & Spa, das 3*-Hotel ILOHA Seaview Hotel (1996 entstanden), die Spa- und Wellnessmarke AKEA und der Online-Weinkeller Les Caves du PALM gehören. Die fünf Pool Lodges entstanden 2021. Der gemeinsame Wert: Gastfreundschaft mit Liebe zum Detail und Personalisierung."},"prefere":true},{"id":"allergies","exemples":{"fr":["vous gérez les allergies alimentaires au restaurant","menu sans gluten possible","des options végétariennes ou vegan","je suis allergique aux arachides","plats sans lactose","vous avez de quoi manger si je suis végétarien","régime halal ou casher","intolérance au gluten au petit déjeuner"],"en":["do you handle food allergies at the restaurant","is there a gluten free menu","vegetarian or vegan options","i am allergic to nuts","lactose free dishes"],"de":["gehen sie auf lebensmittelallergien ein","gibt es glutenfreie gerichte","vegetarische oder vegane optionen","ich bin allergisch gegen nüsse"]},"mots_ancres":["allergie*:6","allergique:6","allergen*:6","allergies:6","gluten:6","sans gluten:6","gluten free:6","glutenfrei:6","vegan:6","vegane:6","vegetarien*:5","vegetarian*:5","vegetarisch*:5","lactose:6","halal:6","casher:6","kosher:6","intolerance*:5","regime alimentaire:6"],"suggestions":["restos","makassar","kah_resto"],"actions":["appeler","mail"],"topic":{"fr":"Allergies et régimes","en":"Allergies and diets","de":"Allergien und Ernährung"},"reponse":{"fr":"Merci de me poser la question : c’est important. Ce que l’hôtel publie : la nouvelle carte du Makassar donne une place importante à une approche végétarienne raffinée, et la liste des allergènes est tenue à disposition à l’accueil du restaurant. Pour une allergie, un régime sans gluten ou vegan, le détail des adaptations n’est pas publié : signalez-le à votre réservation ou à la réception, qui prévient la cuisine du chef Claude Pothin.","en":"Thank you for asking: it matters. What the hotel publishes: the Makassar’s new menu gives an important place to a refined vegetarian approach, and the list of allergens is available at the restaurant reception. For an allergy, a gluten-free or vegan diet, the details of what can be adapted are not published: please let us know when booking or a     refreshSugg();
  }
  function refreshSugg() { sugg.innerHTML = ENG.popular(lang).map(function (c) { return '<button type="button" class="chip pop" data-id="' + esc(c.id) + '">' + esc(c.label) + '</button>'; }).join(''); }
  function welcome() {
    log.innerHTML = ''; root.classList.add('fresh');
    var w = ENG.welcome(lang), ex = UI.exemples_accueil[lang] || [];
    addBot('<div class="card">' + rich(w.text) + '</div>' + (ex.length ? '<div class="chips ex">' + ex.slice(0, 4).map(function (x) { return '<button type="button" class="chip ghost" data-q="' + esc(x) + '">' + esc(x) + '</button>'; }).join('') + '</div>' : ''));
  }
  var AVATAR = window.__AVATAR || '';
  log.addEventListener('click', function (e) {
    var b = e.target.closest('button.chip'); if (!b) return;
    if (b.dataset.q) ask(b.dataset.q); else if (b.dataset.id) showById(b.dataset.id, b.textContent);
  });
  sugg.addEventListener('click', function (e) { var b = e.target.closest('button.chip'); if (b) showById(b.dataset.id, b.textContent); });
  form.addEventListener('submit', function (e) { e.preventDefault(); ask(input.value); });
  Array.prototype.forEach.call(document.querySelectorAll('.lg'), function (b) { b.addEventListener('click', function () { setLang(b.dataset.l); welcome(); }); });
  $('restart').addEventListener('click', function () { try { sessionStorage.removeItem(KEY); } catch (e) {} welcome(); });

  /* ouvrir / fermer : bulle = bascule, × visible, voile (mobile), Échap, retour Android */
  var veil = $('veil'), touch = window.matchMedia ? window.matchMedia('(pointer:coarse)').matches : false, pushed = false;
  function isOpen() { return !root.hidden; }
  function openChat() {
    if (isOpen()) return;
    root.hidden = false; root.classList.add('open'); bubble.classList.add('on'); bubble.setAttribute('aria-expanded', 'true'); bubble.setAttribute('aria-label', t('close'));
    teaser.classList.add('hide'); if (mq.matches) veil.hidden = false;
    if (!log.children.length) welcome(); scroll();
    try { history.pushState({ tk: 1 }, ''); pushed = true; } catch (e) {}
    // sur mobile, pas de clavier à l'ouverture : le visiteur lit d'abord l'accueil
    if (!touch) setTimeout(function () { input.focus({ preventScroll: true }); }, 80);
  }
  function closeChat(fromPop) {
    if (!isOpen()) return;
    input.blur(); root.classList.remove('open', 'kb'); root.style.height = root.style.top = root.style.bottom = ''; root.hidden = true; veil.hidden = true;
    bubble.classList.remove('on'); bubble.setAttribute('aria-expanded', 'false'); bubble.setAttribute('aria-label', t('open'));
    if (pushed && !fromPop) { pushed = false; try { history.back(); } catch (e) {} } else pushed = false;
    bubble.focus({ preventScroll: true });
  }
  bubble.addEventListener('click', function () { isOpen() ? closeChat() : openChat(); });
  $('closeBtn').addEventListener('click', function () { closeChat(); }); veil.addEventListener('click', function () { closeChat(); });
  window.addEventListener('popstate', function () { if (isOpen()) closeChat(true); });
  $('teaser-open').addEventListener('click', openChat); $('teaser-x').addEventListener('click', function (e) { e.stopPropagation(); teaser.classList.add('hide'); try { sessionStorage.setItem('tk-teaser', '1'); } catch (x) {} });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && isOpen()) closeChat(); });
  $('expand').addEventListener('click', function () { root.classList.toggle('wide'); $('expand').setAttribute('aria-pressed', root.classList.contains('wide') ? 'true' : 'false'); });
  var ap = $('apercu-x'); if (ap) ap.addEventListener('click', function () { $('apercu').classList.add('hide'); });
  // accroche : une fois par visite, après 4 s, seulement si la fenêtre est fermée
  var seen = false; try { seen = sessionStorage.getItem('tk-teaser') === '1'; } catch (e) {}
  if (!seen) setTimeout(function () { if (!isOpen() && window.innerHeight > 480) { teaser.classList.remove('hide'); try { sessionStorage.setItem('tk-teaser', '1'); } catch (e) {} } }, 4000);

  /* clavier mobile : la fenêtre épouse la zone réellement visible (iOS ne réduit pas 100dvh) */
  var vv = window.visualViewport, baseH = window.innerHeight;
  window.addEventListener('orientationchange', function () { setTimeout(function () { if (document.activeElement !== input) baseH = window.innerHeight; fit(); }, 400); });
  function fit() {
    if (!vv || !mq.matches || !isOpen()) return;
    // clavier = zone visible nettement plus petite que l'écran au chargement, saisie active (iOS : innerHeight fixe ; Android : innerHeight réduit)
    var kb = document.activeElement === input && (baseH - vv.height > 120 || window.innerHeight - vv.height > 120);
    if (kb) { root.classList.add('kb'); root.style.height = vv.height + 'px'; root.style.top = vv.offsetTop + 'px'; root.style.bottom = 'auto'; }
    else { root.classList.remove('kb'); root.style.height = root.style.top = root.style.bottom = ''; }
    scroll();
  }
  if (vv) { vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); } window.addEventListener('resize', fit);
  input.addEventListener('focus', function () { setTimeout(fit, 60); setTimeout(fit, 350); });
  input.addEventListener('blur', function () { setTimeout(function () { fit(); if (!root.classList.contains('kb')) baseH = Math.max(baseH, window.innerHeight); }, 150); });
  window.__chatFit = fit;

  /* saisie vocale facultative (Web Speech API) */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition, mic = $('mic');
  if (!SR) mic.hidden = true; else {
    var rec = null, on = false;
    mic.addEventListener('click', function () {
      if (on && rec) { rec.stop(); return; }
      try { rec = new SR(); rec.lang = { fr: 'fr-FR', en: 'en-GB', de: 'de-DE' }[lang]; rec.interimResults = true; rec.maxAlternatives = 1;
        rec.onstart = function () { on = true; mic.classList.add('on'); input.placeholder = t('micOn'); };
        rec.onresult = function (ev) { var s = ''; for (var i = 0; i < ev.results.length; i++) s += ev.results[i][0].transcript; input.value = s; if (ev.results[ev.results.length - 1].isFinal) { rec.stop(); ask(s); } };
        rec.onend = function () { on = false; mic.classList.remove('on'); input.placeholder = t('placeholder'); };
        rec.onerror = function () { on = false; mic.classList.remove('on'); input.placeholder = t('placeholder'); };
        rec.start(); } catch (e) { mic.hidden = true; }
    });
  }
  window.__chatTest = { ask: ask, open: openChat, close: closeChat, setLang: setLang, engine: ENG };
  var rl = restore(); if (rl) { lang = rl; } setLang(lang, true);
  if (/[?&]open=1/.test(location.search)) openChat();
})();
</script>
</body>
</html>
