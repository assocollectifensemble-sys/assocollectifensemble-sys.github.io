<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Merci — Aurélie & Jonathan</title>
<meta name="description" content="Un duo pour les solopreneurs et les entrepreneurs : création de site, maintenance, administratif et réseaux sociaux. Prix clairs, sans engagement.">
<meta property="og:title" content="Aurélie &amp; Jonathan — on s'occupe du digital, vous de votre métier">
<meta property="og:description" content="Création de site, maintenance, administratif et réseaux sociaux pour solopreneurs et entrepreneurs.">
<meta property="og:image" content="https://une2cvmillehistoires.re/aurelie-jonathan/img/nous.jpg">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="img/logo.svg">
<style>
@font-face{font-family:Fraunces;font-weight:600;font-display:swap;src:url(fonts/fraunces-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Fraunces;font-weight:700;font-display:swap;src:url(fonts/fraunces-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Fraunces;font-weight:500;font-style:italic;font-display:swap;src:url(fonts/fraunces-latin-500-italic.woff2) format('woff2')}
@font-face{font-family:'DM Sans';font-weight:400;font-display:swap;src:url(fonts/dm-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'DM Sans';font-weight:500;font-display:swap;src:url(fonts/dm-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'DM Sans';font-weight:700;font-display:swap;src:url(fonts/dm-sans-latin-700-normal.woff2) format('woff2')}
:root{
  --cream:#FBF6EE; --cream-2:#F3EADC; --white:#fff;
  --ink:#1F2A30; --muted:#5B666B; --line:rgba(31,42,48,.12);
  --coral:#E8613C; --coral-d:#C44A28; --coral-l:#FCE3D9;
  --teal:#145C5A; --teal-d:#0E4341; --teal-l:#DCEDEA;
  --sun:#F4B740;
  --serif:Fraunces,Georgia,serif; --sans:'DM Sans',system-ui,-apple-system,sans-serif;
  --pad:clamp(20px,5vw,64px); --r:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{font-family:var(--sans);color:var(--ink);background:var(--cream);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.12;letter-spacing:-.01em}
h1{font-size:clamp(2.3rem,5.6vw,4.2rem)}
h2{font-size:clamp(1.8rem,3.8vw,2.8rem)}
h3{font-size:1.3rem}
em.accent{font-style:italic;font-weight:500;color:var(--coral)}
.wrap{max-width:1160px;margin:0 auto;padding:0 var(--pad)}
section{padding:clamp(64px,9vw,120px) 0}
.kicker{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin-bottom:14px}
.lead{font-size:clamp(1.05rem,1.6vw,1.22rem);color:var(--muted);max-width:640px}
.center{text-align:center}.center .lead{margin:0 auto}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 26px;border-radius:999px;font-weight:700;text-decoration:none;border:2px solid transparent;cursor:pointer;font:inherit;font-weight:700;transition:transform .15s,background .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px)}
.btn-primary{background:var(--coral);color:#fff;box-shadow:0 8px 22px rgba(232,97,60,.32)}
.btn-primary:hover{background:var(--coral-d)}
.btn-ghost{border-color:var(--ink);color:var(--ink);background:transparent}
.btn-ghost:hover{background:var(--ink);color:#fff}
.btn-teal{background:var(--teal);color:#fff}
.btn-teal:hover{background:var(--teal-d)}
.btn-block{width:100%;justify-content:center}

/* header */
header{position:sticky;top:0;z-index:50;background:rgba(251,246,238,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:70px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--serif);font-weight:700;font-size:1.15rem}
.brand img{width:40px;height:40px}
.menu{display:flex;gap:28px;list-style:none;align-items:center}
.menu a{text-decoration:none;font-weight:500;font-size:.96rem}
.menu a:not(.btn):hover{color:var(--coral)}
.menu .btn{padding:10px 20px}
.burger{display:none;background:none;border:0;width:44px;height:44px;cursor:pointer}
.burger span{display:block;width:24px;height:2px;background:var(--ink);margin:5px auto;transition:.2s}
@media(max-width:880px){
  .burger{display:block}
  .menu{position:fixed;inset:70px 0 auto 0;flex-direction:column;gap:0;background:var(--cream);border-bottom:1px solid var(--line);padding:8px var(--pad) 22px;display:none}
  .menu.open{display:flex}
  .menu li{width:100%}
  .menu a:not(.btn){display:block;padding:14px 0;border-bottom:1px solid var(--line)}
  .menu .btn{margin-top:16px;width:100%;justify-content:center}
}

/* hero */
.hero{padding:clamp(48px,7vw,96px) 0 clamp(64px,8vw,110px);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,var(--coral-l),transparent 70%);top:-220px;right:-160px;z-index:-1}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(32px,5vw,72px);align-items:center}
.hero p.lead{margin:22px 0 32px}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap}
.reassure{display:flex;gap:22px;flex-wrap:wrap;margin-top:30px;font-size:.93rem;color:var(--muted)}
.reassure span::before{content:"✓";color:var(--teal);font-weight:700;margin-right:7px}
.hero-photo{position:relative}
.hero-photo img{border-radius:var(--r);aspect-ratio:4/5;object-fit:cover;object-position:45% 35%;width:100%;box-shadow:0 30px 60px -20px rgba(31,42,48,.35)}
.hero-photo .badge{position:absolute;left:-22px;bottom:28px;background:var(--white);border-radius:16px;padding:14px 18px;box-shadow:0 14px 30px rgba(31,42,48,.16);font-size:.92rem;max-width:230px}
.hero-photo .badge b{display:block;font-family:var(--serif);font-size:1.05rem}
.hero-photo .dot{position:absolute;right:-14px;top:-14px;width:78px;height:78px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-size:2rem;transform:rotate(-8deg)}
@media(max-width:880px){.hero-grid{grid-template-columns:1fr}.hero-photo{max-width:440px;margin:0 auto}.hero-photo .badge{left:12px}}

/* pain */
.pain{background:var(--white)}
.pain-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:44px}
.pain-card{background:var(--cream);border-radius:var(--r);padding:28px}
.pain-card .q{font-family:var(--serif);font-style:italic;font-weight:500;font-size:1.18rem;margin-bottom:10px}
.pain-card p{color:var(--muted)}
@media(max-width:880px){.pain-grid{grid-template-columns:1fr}}

/* services */
.services-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:48px}
.svc{background:var(--white);border-radius:var(--r);padding:32px 28px;border:1px solid var(--line);display:flex;flex-direction:column}
.svc .ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:1.6rem;margin-bottom:18px}
.svc:nth-child(1) .ico{background:var(--coral-l)}
.svc:nth-child(2) .ico{background:var(--teal-l)}
.svc:nth-child(3) .ico{background:#FDEFC8}
.svc p{color:var(--muted);margin:10px 0 16px}
.svc ul{list-style:none;margin-bottom:22px}
.svc li{padding:6px 0 6px 26px;position:relative;font-size:.97rem}
.svc li::before{content:"";position:absolute;left:0;top:13px;width:14px;height:8px;border-left:2px solid var(--teal);border-bottom:2px solid var(--teal);transform:rotate(-45deg)}
.svc .who{margin-top:auto;font-size:.9rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:14px}
.svc .who b{color:var(--ink)}
@media(max-width:960px){.services-grid{grid-template-columns:1fr}}

/* pricing */
.pricing{background:var(--teal);color:#fff}
.pricing .kicker{color:var(--sun)}
.pricing .lead{color:rgba(255,255,255,.8)}
.tabs{display:inline-flex;background:rgba(255,255,255,.1);border-radius:999px;padding:5px;margin:36px auto 40px;flex-wrap:wrap;justify-content:center}
.tab{background:none;border:0;color:#fff;font:inherit;font-weight:700;padding:11px 22px;border-radius:999px;cursor:pointer}
.tab[aria-selected=true]{background:#fff;color:var(--teal)}
.panel{display:none}.panel.active{display:block}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;text-align:left}
.plan{background:#fff;color:var(--ink);border-radius:var(--r);padding:32px 28px;display:flex;flex-direction:column;position:relative}
.plan.star{outline:3px solid var(--sun);transform:translateY(-8px)}
.plan .flag{position:absolute;top:-14px;left:28px;background:var(--sun);color:var(--ink);font-size:.78rem;font-weight:700;padding:5px 12px;border-radius:999px;letter-spacing:.04em}
.plan h3{font-size:1.4rem}
.plan .for{color:var(--muted);font-size:.95rem;margin:6px 0 18px;min-height:3em}
.price{font-family:var(--serif);font-size:2.8rem;font-weight:700;line-height:1}
.price small{font-family:var(--sans);font-size:1rem;font-weight:500;color:var(--muted)}
.price-note{font-size:.88rem;color:var(--muted);margin:6px 0 20px;min-height:1.4em}
.plan ul{list-style:none;margin-bottom:26px;flex:1}
.plan li{padding:7px 0 7px 26px;position:relative;font-size:.96rem;border-bottom:1px solid var(--line)}
.plan li:last-child{border-bottom:0}
.plan li::before{content:"";position:absolute;left:0;top:14px;width:14px;height:8px;border-left:2px solid var(--coral);border-bottom:2px solid var(--coral);transform:rotate(-45deg)}
.pricing-foot{margin-top:34px;font-size:.92rem;color:rgba(255,255,255,.78)}
.pricing-foot a{color:#fff}
.extra{margin-top:26px;background:rgba(255,255,255,.08);border:1px dashed rgba(255,255,255,.35);border-radius:var(--r);padding:22px 26px;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;text-align:left}
.extra b{font-family:var(--serif);font-size:1.2rem}
@media(max-width:960px){.plans{grid-template-columns:1fr}.plan.star{transform:none}}

/* how */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:48px;counter-reset:s}
.step{position:relative;padding-top:58px}
.step::before{counter-increment:s;content:counter(s);position:absolute;top:0;left:0;width:44px;height:44px;border-radius:50%;background:var(--coral);color:#fff;font-family:var(--serif);font-weight:700;font-size:1.3rem;display:grid;place-items:center}
.step h3{font-size:1.15rem;margin-bottom:6px}
.step p{color:var(--muted);font-size:.97rem}
@media(max-width:880px){.steps{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.steps{grid-template-columns:1fr}}

/* about */
.about{background:var(--white)}
.about-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(32px,5vw,72px);align-items:center}
.about-photo img{border-radius:var(--r);aspect-ratio:1;object-fit:cover;object-position:45% 35%}
.about p{color:var(--muted);margin-top:16px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}
.duo div{background:var(--cream);border-radius:16px;padding:18px 20px}
.duo b{font-family:var(--serif);font-size:1.15rem;display:block;margin-bottom:4px}
.duo span{font-size:.94rem;color:var(--muted)}
@media(max-width:880px){.about-grid{grid-template-columns:1fr}.about-photo{max-width:440px}}
@media(max-width:480px){.duo{grid-template-columns:1fr}}

/* proof */
.proof-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:44px}
.proof{background:var(--white);border-radius:var(--r);padding:26px;border:1px solid var(--line)}
.proof .tag{display:inline-block;font-size:.78rem;font-weight:700;background:var(--teal-l);color:var(--teal);padding:4px 10px;border-radius:999px;margin-bottom:12px}
.proof p{color:var(--muted);font-size:.96rem;margin-top:8px}
@media(max-width:880px){.proof-grid{grid-template-columns:1fr}}

/* faq */
.faq{background:var(--cream-2)}
.faq-list{max-width:820px;margin:40px auto 0}
details{background:var(--white);border-radius:16px;margin-bottom:12px;padding:0 24px}
summary{cursor:pointer;list-style:none;padding:20px 30px 20px 0;font-weight:700;position:relative}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";position:absolute;right:0;top:14px;font-size:1.6rem;color:var(--coral);font-weight:400;transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
details p{padding:0 0 20px;color:var(--muted)}

/* contact */
.contact-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(32px,5vw,72px)}
.contact-info p{color:var(--muted);margin:16px 0 26px}
.contact-info a.line{display:flex;gap:12px;align-items:center;text-decoration:none;font-weight:500;margin-bottom:12px}
.contact-info a.line span{width:42px;height:42px;border-radius:12px;background:var(--coral-l);display:grid;place-items:center}
form{background:var(--white);border-radius:var(--r);padding:clamp(24px,4vw,40px);box-shadow:0 20px 50px -24px rgba(31,42,48,.25)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:block;font-weight:700;font-size:.9rem;margin:14px 0 6px}
input,select,textarea{width:100%;font:inherit;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;background:var(--cream);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);background:#fff}
textarea{min-height:120px;resize:vertical}
form .btn{margin-top:22px}
.form-note{font-size:.84rem;color:var(--muted);margin-top:12px}
@media(max-width:880px){.contact-grid{grid-template-columns:1fr}}
@media(max-width:520px){.row{grid-template-columns:1fr}}

/* final cta + footer */
.final{background:var(--coral);color:#fff;text-align:center;padding:clamp(56px,7vw,90px) 0}
.final p{opacity:.9;margin:14px auto 28px;max-width:560px}
.final .btn{background:#fff;color:var(--coral-d)}
footer{background:var(--ink);color:rgba(255,255,255,.75);padding:44px 0;font-size:.9rem}
.foot{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:center}
footer a{color:#fff}
footer .brand{color:#fff}

.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}.btn{transition:none}}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
</style>
</head>
<body>

<header><div class="wrap nav"><a class="brand" href="./"><img src="img/logo.svg" alt="" width="40" height="40">Aurélie &amp; Jonathan</a></div></header>
<main><section><div class="wrap" style="max-width:780px"><span class="kicker">Message bien reçu</span><h1>Merci, on revient vers vous <em class="accent">très vite</em>.</h1><p class="lead" style="margin:22px 0 30px">Nous lisons votre demande et nous vous proposons un créneau pour l'échange de 20 minutes.</p><a class="btn btn-primary" href="./">Retour au site</a></div></section></main></body></html>
