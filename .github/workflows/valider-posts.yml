name: Valider les posts

# Attrape les erreurs de rédaction (date illisible, image manquante, légende
# trop longue) avant qu'elles ne fassent échouer une publication à 18 h 30.
on:
  push:
    paths:
      - "posts/**"
      - "scripts/publier_meta.py"
  pull_request:
    paths:
      - "posts/**"
      - "scripts/publier_meta.py"

jobs:
  valider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests pyyaml
      - run: python scripts/publier_meta.py --valider
